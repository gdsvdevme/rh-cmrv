<script>
/* =====================================================================
   PocketBase: armazenamento no servidor (substitui o localStorage)
   Expõe PB.connect(), que devolve um objeto "dbh" com a mesma forma
   usada pelo restante do sistema: dbh.doc('a/b').get/set/delete e
   dbh.collection('versoes').orderBy('at','desc').limit(n).get()
   ===================================================================== */
const PB=(function(){
  const URL_BASE='https://pb.devgabriel.app.br'.replace(/\/+$/,'');
  const CENTI_BASE=''.replace(/\/+$/,'');   // vazio = mesmo endereço do site (funções em /api)
  const AUTH_KEY='rhcrv-pb-auth';
  let token='',email='',col='rhcmrv_users',loginP=null;
  let cs=null;   // sessão do Centi: {user,nome,token,refreshToken}

  /* só vale a sessão que tem o acesso do Centi junto e a marca de admin; sessões antigas (login simples ou sem a marca) pedem novo login */
  function readAuth(){try{const a=JSON.parse(localStorage.getItem(AUTH_KEY)||'null');if(a&&a.token&&a.centi&&a.centi.token&&typeof a.centi.admin==='boolean'){token=a.token;email=a.email||'';col=a.col||'rhcmrv_users';cs=a.centi;}}catch(e){}}
  function saveAuth(){try{localStorage.setItem(AUTH_KEY,JSON.stringify({token,email,col,centi:cs}));}catch(e){}}
  function clearAuth(){token='';email='';col='rhcmrv_users';cs=null;try{localStorage.removeItem(AUTH_KEY);}catch(e){}}

  async function raw(method,path,body){
    const h={};
    if(body!==undefined) h['Content-Type']='application/json';
    if(token) h.Authorization=token;
    const r=await fetch(URL_BASE+path,{method,headers:h,body:body===undefined?undefined:JSON.stringify(body)});
    if(r.status===204) return null;
    let j=null; try{j=await r.json();}catch(e){}
    if(!r.ok){const err=new Error((j&&j.message)||('HTTP '+r.status));err.status=r.status;throw err;}
    return j;
  }
  async function api(method,path,body){
    try{return await raw(method,path,body);}
    catch(e){
      if(e.status===401||e.status===403){
        clearAuth();
        if(await login('Sua sessão expirou. Entre novamente para continuar.')) return raw(method,path,body);
      }
      throw e;
    }

    '@media (max-width:440px){.pbl{padding:14px;align-items:flex-start}.pbl-card{padding:32px 22px 22px;margin-top:6vh}.pbl-card::before{left:22px}}';
  function loginCss(){

  function login(msg){
    if(loginP) return loginP;

      const wrap=document.createElement('div');wrap.className='pbl';

        '<form class="pbl-card" autocomplete="on" novalidate>'+

        '<label class="pbl-f"><span>Senha</span><div class="pbl-in">'+ico('lock')+'<input name="p" type="password" required autocomplete="current-password" placeholder="Sua senha do Centi"><button type="button" class="pbl-eye" data-eye aria-label="Mostrar a senha" aria-pressed="false">'+ico('eye')+'</button></div></label>'+

  /* ---------- sair ---------- */
  /* botão "Sair" ao lado do botão de tema (ou no rodapé do menu dos Fluxogramas); só existe com sessão do Centi aberta */
  function logout(){clearAuth();location.reload();}
  function mountLogout(){
    if(!cs||!document.body||document.getElementById('pb-logout')) return;
    const nome=(cs.nome||cs.user||'').split(' ')[0];
    const mk=(cls,html)=>{const b=document.createElement('button');b.type='button';b.id='pb-logout';b.className=cls;b.title='Sair ('+cs.user+')';b.setAttribute('aria-label','Sair do sistema ('+cs.user+')');b.innerHTML=html;b.addEventListener('click',logout);return b;};
    const t=document.getElementById('themeBtn'),h=document.querySelector('.side-foot .homelink');
    if(t&&t.parentNode){const b=mk(t.className,ico('out',16)+'Sair');b.style.marginLeft='0';t.insertAdjacentElement('afterend',b);t.style.marginLeft='auto';}
    else if(h&&h.parentNode){const b=mk(h.className,ico('out',14)+'Sair'+(nome?' ('+nome.charAt(0).toUpperCase()+nome.slice(1).toLowerCase()+')':''));b.style.cssText='border:0;cursor:pointer;font:inherit;font-weight:600;font-size:13px;width:calc(100% + 20px);text-align:left;color:inherit';h.insertAdjacentElement('afterend',b);}
  }
  /* as páginas montam o cabeçalho em momentos diferentes: tenta de novo quando o DOM muda */
  function vigiarLogout(){
    mountLogout();
    try{const ob=new MutationObserver(()=>{if(!cs){ob.disconnect();return;}if(!document.getElementById('pb-logout')) mountLogout();});ob.observe(document.body,{childList:true,subtree:true});}catch(e){}
  }

  /* ---------- documentos ---------- */
  const ids={};   // cache de id de registro por caminho
  const esc=s=>String(s).replace(/\\/g,'\\\\').replace(/"/g,'\\"');
  const spec=path=>{
    const i=path.indexOf('/'),col=path.slice(0,i),id=path.slice(i+1);
    return col==='versoes'?{c:'rhcmrv_versoes',f:'vid',k:id}:{c:'rhcmrv_docs',f:'key',k:path};
  };
  async function find(path){
    const s=spec(path);
    const q='?perPage=1&filter='+encodeURIComponent(s.f+'="'+esc(s.k)+'"');
    const r=await api('GET','/api/collections/'+s.c+'/records'+q);
    const rec=r.items&&r.items[0];
    if(rec) ids[path]=rec.id; else delete ids[path];
    return rec||null;
  }
  const payload=(s,data)=>s.c==='rhcmrv_versoes'?Object.assign({vid:s.k},data):{key:s.k,data};
  const unwrap=(s,rec)=>s.c==='rhcmrv_versoes'?{at:rec.at,label:rec.label,json:rec.json}:rec.data;

  function doc(path){
    const s=spec(path);
    return {
      async get(){const rec=await find(path);return {exists:!!rec,id:s.k,data:()=>rec?unwrap(s,rec):undefined};},
      async set(data){
        if(!ids[path]) await find(path);
        if(ids[path]) await api('PATCH','/api/collections/'+s.c+'/records/'+ids[path],payload(s,data));
        else{const r=await api('POST','/api/collections/'+s.c+'/records',payload(s,data));ids[path]=r.id;}
      },
      async delete(){
        if(!ids[path]) await find(path);
        if(ids[path]){await api('DELETE','/api/collections/'+s.c+'/records/'+ids[path]);delete ids[path];}
      }
    };
  }
  function collection(name){
    const q={sort:'',n:30};
    const api_={
      orderBy(f,dir){q.sort=(dir==='desc'?'-':'')+f;return api_;},
      limit(n){q.n=n;return api_;},
      async get(){
        const r=await api('GET','/api/collections/rhcmrv_'+name+'/records?perPage='+q.n+(q.sort?'&sort='+encodeURIComponent(q.sort):''));
        return {docs:r.items.map(rec=>({id:rec.vid,data:()=>({at:rec.at,label:rec.label,json:rec.json})}))};
      }
    };
    return api_;
  }

  /* ---------- tarefas (coleção rhcmrv_tarefas; as regras do servidor mostram só as compartilhadas e as do próprio dono) ---------- */
  const TAREFAS='/api/collections/rhcmrv_tarefas/records';
  const userId=()=>{try{const b=token.split('.')[1].replace(/-/g,'+').replace(/_/g,'/');return JSON.parse(decodeURIComponent(escape(atob(b+'='.repeat((4-b.length%4)%4))))).id||'';}catch(e){return '';}};
  async function todas(filtro){
    let page=1,out=[];
    for(;;){
      const r=await api('GET',TAREFAS+'?perPage=200&page='+page+'&sort=-criada_em'+(filtro?'&filter='+encodeURIComponent(filtro):''));
      out=out.concat(r.items||[]);
      if(!r.totalPages||page>=r.totalPages) return out;
      page++;
    }
  }
  /* tempo real do PocketBase (SSE): cada evento só chega se as regras do servidor deixam esta conta ver a tarefa (privadas de outros não chegam) */
  function ouvirTarefas(cb){
    let es=null,parado=false;
    const abrir=()=>{
      if(parado||typeof EventSource==='undefined') return;
      es=new EventSource(URL_BASE+'/api/realtime');
      es.addEventListener('PB_CONNECT',async ev=>{
        try{
          const id=(JSON.parse(ev.data||'{}').clientId)||ev.lastEventId;
          await fetch(URL_BASE+'/api/realtime',{method:'POST',headers:{'Content-Type':'application/json',Authorization:token},body:JSON.stringify({clientId:id,subscriptions:['rhcmrv_tarefas']})});
        }catch(e){}
      });
      es.addEventListener('rhcmrv_tarefas',ev=>{try{cb(JSON.parse(ev.data));}catch(e){}});
      es.onerror=()=>{};   // o navegador reconecta sozinho e o PB_CONNECT assina de novo
    };
    abrir();
    return ()=>{parado=true;if(es) es.close();};
  }
  const tarefas={
    listen:ouvirTarefas,
    list:todas,
    create:d=>api('POST',TAREFAS,Object.assign({dono:userId()},d)),
    update:(id,d)=>api('PATCH',TAREFAS+'/'+id,d),
    remove:id=>api('DELETE',TAREFAS+'/'+id)
  };

  /* ---------- API do Centi (pelo servidor do sistema, com o acesso da própria pessoa) ---------- */
  /* Sessão do Centi inválida (token vencido sem renovação, sessão apagada ou outro login): pede o login de novo, com aviso, e repete
     a consulta uma vez. O erro só chega à tela se o login for refeito e a consulta ainda assim falhar. */
  function erroSessao(){const e=new Error('Sem sessão do Centi. Entre novamente.');e.status=401;return e;}
  async function comSessao(fn){
    try{if(!cs) throw erroSessao();return await fn();}
    catch(e){
      if(e.status!==401) throw e;
      clearAuth();
      if(!(await login('Sua sessão do Centi expirou. Entre novamente para continuar.'))) throw e;
      const b=document.getElementById('pb-logout');if(b) b.remove();vigiarLogout();   // o botão Sair passa a mostrar o usuário novo
      return fn();
    }
  }
  const centiCall=(path,body)=>comSessao(()=>centiCallUma(path,body));
  const centiPdf=(path,mes,ano,funcionario)=>comSessao(()=>centiPdfUma(path,mes,ano,funcionario));
  async function centiCallUma(path,body){
    if(!cs) throw erroSessao();
    const r=await fetch(CENTI_BASE+'/api/centi',{method:'POST',
      headers:{'Content-Type':'application/json','x-centi-user':cs.user,'x-centi-token':cs.token,'x-centi-refresh':cs.refreshToken||''},
      body:JSON.stringify({path,body})});
    const nt=r.headers.get('x-centi-token'),nr=r.headers.get('x-centi-refresh');
    if(nt){cs.token=nt;if(nr)cs.refreshToken=nr;saveAuth();}   // o Centi renova o token sozinho
    let j=null; try{j=await r.json();}catch(e){}
    if(!r.ok){
      if(r.status===401){clearAuth();}
      const err=new Error((j&&j.message)||('Centi: HTTP '+r.status));err.status=r.status;throw err;
    }
    return j;
  }
  /* consulta que o Centi entrega em PDF: a função devolve o gzip dele e o navegador abre */
  async function centiPdfUma(path,mes,ano,funcionario){
    if(!cs) throw erroSessao();
    const r=await fetch(CENTI_BASE+'/api/centi',{method:'POST',
      headers:{'Content-Type':'application/json','x-centi-user':cs.user,'x-centi-token':cs.token,'x-centi-refresh':cs.refreshToken||''},
      body:JSON.stringify({path,body:{mes,ano,funcionario:funcionario||''}})});
    const nt=r.headers.get('x-centi-token'),nr=r.headers.get('x-centi-refresh');
    if(nt){cs.token=nt;if(nr)cs.refreshToken=nr;saveAuth();}
    if(!r.ok){
      let j=null; try{j=await r.json();}catch(e){}
      if(r.status===401){clearAuth();}
      const err=new Error((j&&j.message)||('Centi: HTTP '+r.status));err.status=r.status;throw err;
    }
    if(typeof DecompressionStream==='undefined') throw new Error('Este navegador não consegue abrir o arquivo do Centi. Use um navegador mais recente.');
    return new Uint8Array(await new Response(r.body.pipeThrough(new DecompressionStream('gzip'))).arrayBuffer());
  }
  /* PB.centi.search('SFuncionario',[{FieldName:'Nome',Operation:6,Value:'%ana%'}]) -> {Data:[...],Count}
     (Operation 6 = contém; a tela de consulta do Centi exige ao menos um filtro com valor) */
  const centi={
    get user(){return cs?cs.user:'';},
    get nome(){return cs?(cs.nome||cs.user):'';},
    get admin(){return !!(cs&&cs.admin);},   // administrador do sistema (edita o painel dos mini sistemas)
    /* Cubo funcionário (FP051) do Centi na referência mes/ano -> {Data:[{MATRICULA,NOMEFUNC,CARGO,HIERARQUIA,...}],Total}; só ativos */
    /* Ficha financeira (FP024) da matrícula no mês/ano -> {Fichas:[{Folha,Mes,Ano,TotalProventos,TotalDescontos,LiquidoReceber,Eventos:[...]}]}; não é guardada */
    ficha(matricula,mes,ano){return centiCall('ficha-financeira',{matricula,mes,ano});},
    /* Férias: ativos (FP051) + gozos de férias (FP273) -> {Pessoas:[...],Gozos:[{MATRICULA,DTAQUIINI,DTAQUIFIN,SALDO,GOZOINICIAL,GOZOFINAL,...}]} */
    ferias(mes,ano){return centiCall('ferias',{mes,ano});},
    cubo(mes,ano){return centiCall('cubo-funcionario',{mes,ano});},
    /* Licença-prêmio: quadro de ativos (Cubo funcionário reduzido, FP245) -> {Pessoas:[{MATRICULA,NOME,SITUACAO,TIPOADMISSAO,DATAADMISSAO,LOTACAO,CARGO,TIPOAFASTAMENTO,DATAAFASTAMENTO}]} */
    licencaQuadro(mes,ano){return centiCall('licenca-quadro',{mes,ano});},
    /* Espelho de ponto (FP170) do órgão inteiro na referência mes/ano -> Uint8Array com o PDF (o Centi leva de 25 s a 1 min) */
    espelho(mes,ano,funcionario){return centiPdf('espelho-ponto',mes,ano,funcionario);},
    /* Relação de afastamentos (FP071), de 1990 até o fim da referência -> Uint8Array com o PDF; com o Id do servidor traz só ele */
    afastamentosPdf(mes,ano,funcionario){return centiPdf('afastamentos-pdf',mes,ano,funcionario);},
    /* Busca de servidor por nome (3+ letras) ou matrícula -> {Data:[{Id,Matricula,Nome,DataAdmissao,Situacao,TipoAdm,Cargo,Lotacao}]} (até 50) */
    /* CPF, nascimento, identidade e endereço de UM servidor (FP001 + DM017), pelo Id da busca -> {Nome,Cpf,DataNascimento,Identidade,Endereco}; nada é guardado */
    servidorDados(id){return centiCall('servidor-dados',{id});},
    licencaBusca(termo){return centiCall('licenca-busca',{termo});},
    /* Converte um .docx (Blob) em PDF/A-2u no serviço pdfa -> Blob application/pdf */
    async pdfa(blob){
      if(!cs) throw erroSessao();
      const b=new Uint8Array(await blob.arrayBuffer());let bin='';
      for(let i=0;i<b.length;i+=8192) bin+=String.fromCharCode.apply(null,b.subarray(i,i+8192));
      const r=await fetch(CENTI_BASE+'/api/pdfa',{method:'POST',headers:{'Content-Type':'application/json','x-centi-user':cs.user,'x-centi-token':cs.token,'x-centi-refresh':cs.refreshToken||''},body:JSON.stringify({docx:btoa(bin)})});
      const nt=r.headers.get('x-centi-token'),nr=r.headers.get('x-centi-refresh');
      if(nt){cs.token=nt;if(nr)cs.refreshToken=nr;saveAuth();}
      if(!r.ok){let j=null;try{j=await r.json();}catch(e){}if(r.status===401) clearAuth();const err=new Error((j&&j.message)||('PDF/A: HTTP '+r.status));err.status=r.status;throw err;}
      return r.blob();
    },
    search(entity,filters,start,depth){
      return centiCall('restauth/searchentity',{Depth:depth||50,Entity:entity,Start:start==null?1:start,
        Filters:(filters||[]).map(f=>Object.assign({List:false,TypeFilter:0,between:''},f))});
    }
  };

  /* ---------- conexão ---------- */
  const sleep=ms=>new Promise(r=>setTimeout(r,ms));
  async function alive(){
    for(let i=0;i<3;i++){
      const ac=new AbortController(),t=setTimeout(()=>ac.abort(),6000);
      try{const r=await fetch(URL_BASE+'/api/health',{cache:'no-store',signal:ac.signal});clearTimeout(t);if(r.ok) return true;}catch(e){clearTimeout(t);}
      if(i<2) await sleep(1500);
    }
    return false;
  }
  const box='position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(0,0,0,.5)';
  const card='width:100%;max-width:380px;background:var(--surface,#fff);color:var(--fg,#12281d);border:1px solid var(--line,#d1ddd6);border-radius:12px;padding:22px;box-shadow:0 10px 40px rgba(0,0,0,.3);font:15px/1.45 system-ui,sans-serif';
  const bt='padding:9px 14px;border-radius:8px;font:inherit;font-weight:600;cursor:pointer;';
  /* servidor fora do ar: pergunta antes de seguir, para não trabalhar sem querer só neste navegador */
  function offlineDialog(){
    return new Promise(resolve=>{
      const w=document.createElement('div');w.style.cssText=box;
      w.innerHTML='<div role="alertdialog" aria-modal="true" style="'+card+'"><h3 style="margin:0 0 6px;font-size:18px">Sem conexão com o servidor</h3>'+
        '<p style="margin:0 0 14px;color:var(--muted,#4f665a);font-size:13.5px">Não foi possível falar com o servidor dos dados. Verifique a internet e tente de novo. Se continuar só neste navegador, o que você fizer <b>não será salvo no servidor</b> e não aparecerá em outros computadores.</p>'+
        '<div style="display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap"><button type="button" data-loc style="'+bt+'border:1px solid var(--line,#d1ddd6);background:transparent;color:inherit">Usar só neste navegador</button>'+
        '<button type="button" data-retry style="'+bt+'border:0;background:var(--accent,#0a6b3d);color:var(--accent-fg,#fff)">Tentar novamente</button></div></div>';
      document.body.appendChild(w);
      const done=v=>{w.remove();resolve(v);};
      w.querySelector('[data-retry]').addEventListener('click',()=>done(true));
      w.querySelector('[data-loc]').addEventListener('click',()=>done(false));
      w.querySelector('[data-retry]').focus();
    });
  }
  function markLocal(){
    if(document.getElementById('pb-local')) return;
    const b=document.createElement('div');b.id='pb-local';
    b.style.cssText='position:fixed;left:0;right:0;bottom:0;z-index:99998;background:#8a5a00;color:#fff;padding:8px 14px;font:13.5px/1.35 system-ui,sans-serif;display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;text-align:center';
    b.innerHTML='<span>Modo local: os dados ficam só neste navegador e <b>não são salvos no servidor</b>.</span><button type="button" style="border:1px solid #fff;background:transparent;color:#fff;border-radius:7px;padding:3px 10px;font:inherit;font-weight:600;cursor:pointer">Reconectar</button>';
    b.querySelector('button').addEventListener('click',()=>location.reload());
    document.body.appendChild(b);
  }
  async function connect(){
    if(!URL_BASE) return null;
    readAuth();
    for(;;){
      if(!(await alive())){if(await offlineDialog()) continue;markLocal();return null;}
      try{
        let ok=false;
        if(token){
          try{const r=await raw('POST','/api/collections/'+col+'/auth-refresh');token=r.token;email=(r.record&&(r.record.email||r.record.username))||email;saveAuth();ok=true;}
          catch(e){if(e.status!==401&&e.status!==403&&e.status!==404) throw e; clearAuth();}
        }
        if(!ok&&!(await login())){markLocal();return null;}
        vigiarLogout();return {doc,collection,centi,tarefas};
      }catch(e){
        if(await offlineDialog()) continue;
        markLocal();return null;
      }
    }
  }
  /* ---------- recibos em PDF da entrega dos espelhos (coleção rhcmrv_recibos; o arquivo é protegido: abre com token de arquivo) ---------- */
  const RECIBOS='/api/collections/rhcmrv_recibos/records';
  const recibos={
    get ok(){return !!token;},
    /* envia o PDF; vence em `dias` dias. por = {nome,mat,user}. -> {id,arquivo,criado_em,expira_em} */
    async enviar(ref,setor,file,por,dias){
      if(!token) throw new Error('Entre no sistema para anexar o recibo.');
      const agora=new Date(),exp=new Date(agora.getTime()+dias*864e5),fd=new FormData();
      fd.append('ref',ref);fd.append('setor',setor);fd.append('por_nome',por.nome);fd.append('por_matricula',por.mat||'');fd.append('por_user',por.user||'');
      fd.append('criado_em',agora.toISOString());fd.append('expira_em',exp.toISOString());fd.append('arquivo',file);
      const r=await fetch(URL_BASE+RECIBOS,{method:'POST',headers:{Authorization:token},body:fd});
      let j=null;try{j=await r.json();}catch(e){}
      if(!r.ok){
        const err=new Error(r.status===404?'O servidor ainda não tem a área de recibos. Saia do sistema e entre de novo.':((j&&j.message)||('HTTP '+r.status)));err.status=r.status;
        if(r.status===401||r.status===403) clearAuth();
        throw err;
      }
      return {id:j.id,arquivo:j.arquivo,criado_em:j.criado_em,expira_em:j.expira_em};
    },
    async url(rec){
      const t=await api('POST','/api/files/token',{});
      return URL_BASE+'/api/files/rhcmrv_recibos/'+rec.id+'/'+encodeURIComponent(rec.arquivo)+'?token='+encodeURIComponent(t.token);
    },
    async apagar(id){try{await api('DELETE',RECIBOS+'/'+id);}catch(e){if(e.status!==404) throw e;}},
    /* apaga do servidor os recibos com mais de 90 dias; -> quantos */
    async limparVencidos(){
      if(!token) return 0;
      let n=0;
      try{
        const r=await api('GET',RECIBOS+'?perPage=100&filter='+encodeURIComponent('expira_em < "'+new Date().toISOString()+'"'));
        for(const it of (r.items||[])){await api('DELETE',RECIBOS+'/'+it.id);n++;}
      }catch(e){/* coleção ainda inexistente ou sem acesso: nada a limpar */}
      return n;
    }
  };
  return {connect,centi,recibos,logout,get email(){return email;},get nome(){return centi.nome;},get admin(){return centi.admin;},get userId(){return userId();},url:URL_BASE};
})();

/* Motor de cálculo da licença-prêmio – Câmara Municipal de Rio Verde/GO.
   Base: Estatuto dos Funcionários (Lei nº 3.968/2000, consolidada), arts. 194 a 197, seção "Da licença prêmio".
   Não depende de tela nem de rede: é inserido na página de licença-prêmio pelo build.py e também é carregado pelos testes
   (tests/licenca.test.js). Datas são sempre dias inteiros em UTC (milissegundos). */
(function(root){
'use strict';

const DAY=864e5;
const REGRA={
  AQUIS_ANOS:5,          // art. 194: a cada 5 anos de efetivo exercício
  DIAS:90,               // art. 194: licença de 90 dias
  JANELA_ANOS:5,         // art. 194, §4º: gozo nos 5 anos seguintes ao período aquisitivo
  REQUERER_DIAS:90,      // art. 194, §7º: depois da janela, 90 dias para requerer, sob pena de perda
  CONCEDER_DIAS:30,      // art. 194, §8º: a Administração tem 30 dias para conceder (ou propor indenização)
  PARCELA_MIN:15,        // art. 194, §5º: parcelas de no mínimo 15 dias…
  PARCELA_INTERVALO:30,  // …com 30 dias entre uma e outra
  LIM_FAMILIA:30,        // arts. 196, I e 197, I: doença em pessoa da família, até 30 dias suspende; acima disso interrompe
  LIM_FALTAS:10,         // arts. 196, IV e 197, III: faltas injustificadas, até 10 dias suspende; acima disso interrompe
  LC181:Date.UTC(2020,4,6) // LC 181/2020 criou o prazo de gozo e a perda do direito
};

/* ---------- datas ---------- */
const D=s=>{const m=/^(\d{1,2})\/(\d{1,2})\/(\d{4})/.exec(String(s==null?'':s).trim());return m?Date.UTC(+m[3],+m[2]-1,+m[1]):null;};
const isoMs=s=>{const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(String(s==null?'':s));return m?Date.UTC(+m[1],+m[2]-1,+m[3]):null;};
const toIso=ms=>ms==null?'':new Date(ms).toISOString().slice(0,10);
const fmt=ms=>{if(ms==null) return '';const d=new Date(ms);return String(d.getUTCDate()).padStart(2,'0')+'/'+String(d.getUTCMonth()+1).padStart(2,'0')+'/'+d.getUTCFullYear();};
const dias=(a,b)=>Math.round((b-a)/DAY)+1;   // dias corridos, contando os dois extremos
const addAnos=(ms,n)=>{const d=new Date(ms),y=d.getUTCFullYear()+n,m=d.getUTCMonth(),r=Date.UTC(y,m,d.getUTCDate());return new Date(r).getUTCMonth()!==m?Date.UTC(y,m+1,0):r;};   // 29/02 + 1 ano = 28/02
const norm=s=>String(s==null?'':s).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/\s+/g,' ').trim();

/* ---------- o que cada tipo de afastamento do Centi faz com a contagem ---------- */
const EFEITOS={
  'licenca-premio':'Licença-prêmio (gozo)',
  suspende:'Suspende a contagem',
  interrompe:'Interrompe (recomeça do zero)',
  familia:'Doença na família (suspende até 30 dias; acima disso interrompe)',
  falta:'Falta injustificada (suspende até 10 dias; acima disso interrompe)',
  neutro:'Conta como exercício (não altera)',
  revisar:'A revisar (tratado como exercício até o RH classificar)'
};
/* ordem importa: vale a primeira regra que casar (texto sem acento e em minúsculas) */
const REGRAS_TIPO=[
  [/premio/,'licenca-premio'],
  [/familia/,'familia'],
  [/interesse particular/,'interrompe'],
  [/mandato eletivo/,'interrompe'],
  [/(suspens|suspenc).*(pad|disciplin|processo)|disciplinar/,'interrompe'],
  [/atividade politica|mandato classista|servico militar|curso|doutorado|mestrado|especializacao|capacitacao|treinamento|aperfeicoamento|formacao/,'suspende'],
  [/maternidade|paternidade|gestante|adocao|amamentacao/,'neutro'],
  [/disposicao|cessao|cedid/,'neutro'],
  [/exercicio.*cargo|cargo comissionado|funcao gratificada/,'neutro'],
  [/gala|casamento|nojo|luto|sangue|sessao|juri|ferias/,'neutro'],
  [/suspens|suspenc|judicial/,'revisar'],
  [/medica|inss|rpps|saude|doenca|acidente/,'suspende']
];
function classificarTipo(tipo,mapa){
  const n=norm(tipo);
  if(mapa&&mapa[n]&&EFEITOS[mapa[n]]) return {efeito:mapa[n],origem:'RH'};
  for(const r of REGRAS_TIPO) if(r[0].test(n)) return {efeito:r[1],origem:'padrão'};
  return {efeito:'revisar',origem:'padrão'};
}

/* ---------- cálculo ----------
   s: { adm:ms, eventos:[{tipo,efeito,ini,fim}] (afastamentos do Centi já classificados), registro:{...} }
   registro (guardado pelo RH): { inicio:'AAAA-MM-DD', conferido:bool, obs,
                                  eventos:[{id,tipo:'falta'|'suspende'|'interrompe'|'familia',ini,fim,obs}],
                                  gozos:[{id,tipo:'gozo'|'indenizacao',ini,fim,dias,obs}],
                                  periodos:{n:{acao:'quitada'|'indenizada'|'requerida',data,obs}} }
   cfg: { avisoDias } */
function calcular(s,hoje,cfg){
  cfg=cfg||{};
  const aviso=cfg.avisoDias==null?180:cfg.avisoDias;
  const reg=s.registro||{};
  const alertas=[];
  const inicio=reg.inicio?isoMs(reg.inicio):s.adm;
  if(inicio==null) return {erro:'Sem data de admissão.',per:[],ciclos:[],alertas,tags:{},situacao:{codigo:'erro',rotulo:'Sem data de admissão'}};

  /* eventos que mexem na contagem (os do Centi e os lançados à mão) */
  const evs=[];
  (s.eventos||[]).forEach(e=>{if(e.ini!=null&&e.fim!=null) evs.push(Object.assign({origem:'centi'},e));});
  (reg.eventos||[]).forEach(m=>{
    const ini=isoMs(m.ini),fim=isoMs(m.fim||m.ini);if(ini==null||fim==null||fim<ini) return;
    evs.push({origem:'manual',id:m.id,tipo:m.tipo==='falta'?'Falta injustificada':m.tipo,efeito:m.tipo,ini,fim,obs:m.obs});
  });
  evs.sort((a,b)=>a.ini-b.ini||a.fim-b.fim);

  /* períodos aquisitivos: cada ciclo é fechado ao completar 5 anos (+ dias suspensos) ou interrompido */
  const novo=ini=>({ini,susp:0,susAte:-Infinity,fam:0,faltas:0,sus:[]});
  const fimDe=c=>addAnos(c.ini,REGRA.AQUIS_ANOS)-DAY+c.susp*DAY;
  const ciclos=[];
  let c=novo(inicio);
  const fechar=(fim,interrompido,motivo,ev)=>{ciclos.push({ini:c.ini,fim,interrompido,motivo:motivo||'',ev:ev||null,susp:c.susp,sus:c.sus,completo:!interrompido});};
  const suspender=(cc,ini,fim,ev)=>{
    const de=Math.max(ini,cc.susAte+DAY);
    if(fim>=de){const d=dias(de,fim);cc.susp+=d;cc.sus.push({ini:de,fim,dias:d,tipo:ev.tipo,origem:ev.origem});}
    cc.susAte=Math.max(cc.susAte,fim);
  };
  const interromper=(fim,motivo,ev)=>{fechar(fim,true,motivo,ev);c=novo(fim+DAY);};
  for(const e of evs){
    if(e.ini>hoje) continue;   // afastamento futuro ainda não aconteceu
    if(!['suspende','interrompe','familia','falta'].includes(e.efeito)) continue;
    const fimE=Math.min(e.fim,hoje);   // afastamento sem data de fim (ex.: 09/09/9999) vale até hoje e segue valendo a cada dia
    if(e.fim>hoje) alertas.push({nivel:'info',msg:'Afastamento "'+e.tipo+'" iniciado em '+fmt(e.ini)+' ainda está em andamento'+(e.fim>=Date.UTC(2090,0,1)?' (sem data de fim no Centi)':' (termina em '+fmt(e.fim)+')')+'. A contagem '+(e.efeito==='suspende'?'fica parada':'é interrompida')+' enquanto durar.'});
    while(fimDe(c)<e.ini){const f=fimDe(c);fechar(f,false);c=novo(f+DAY);}
    if(fimE<c.ini) continue;   // aconteceu antes do ciclo atual começar
    const ini=Math.max(e.ini,c.ini);
    if(e.efeito==='suspende') suspender(c,ini,fimE,e);
    else if(e.efeito==='interrompe') interromper(fimE,'Interrompido por: '+e.tipo,e);
    else if(e.efeito==='familia'){
      const d=dias(ini,fimE);
      if(c.fam+d<=REGRA.LIM_FAMILIA){c.fam+=d;suspender(c,ini,fimE,e);}
      else interromper(fimE,'Doença em pessoa da família acima de '+REGRA.LIM_FAMILIA+' dias no período',e);
    }else{   // falta injustificada
      const d=dias(ini,fimE);
      if(c.faltas+d<=REGRA.LIM_FALTAS){c.faltas+=d;suspender(c,ini,fimE,e);}
      else interromper(fimE,'Faltas injustificadas acima de '+REGRA.LIM_FALTAS+' dias no período',e);
    }
  }
  while(fimDe(c)<hoje){const f=fimDe(c);fechar(f,false);c=novo(f+DAY);}
  const atual={ini:c.ini,fim:fimDe(c),susp:c.susp,sus:c.sus,interrompido:false,completo:false,formacao:true,motivo:'',ev:null};
  ciclos.push(atual);

  /* numeração e datas de cada período que vale (os interrompidos não recebem número) */
  let n=0;
  ciclos.forEach(p=>{
    if(p.interrompido) return;
    p.n=++n;
    p.direitoEm=p.fim+DAY;
    p.janelaFim=addAnos(p.direitoEm,REGRA.JANELA_ANOS)-DAY;
    p.requererAte=p.janelaFim+REGRA.REQUERER_DIAS*DAY;
    p.cred=0;p.gozos=[];
  });
  const validos=ciclos.filter(p=>!p.interrompido),completos=validos.filter(p=>p.completo);

  /* gozos: os afastamentos "licença prêmio" do Centi e os lançados pelo RH, na ordem, abatendo do período mais antigo em aberto */
  const gozos=[];
  evs.filter(e=>e.efeito==='licenca-premio').forEach(e=>gozos.push({origem:'centi',tipo:'gozo',ini:e.ini,fim:e.fim,dias:dias(e.ini,e.fim),rotulo:e.tipo}));
  (reg.gozos||[]).forEach(g=>{
    const ini=isoMs(g.ini),fim=isoMs(g.fim||g.ini);if(ini==null||fim==null||fim<ini) return;
    const dup=gozos.find(x=>x.origem==='centi'&&x.ini===ini&&x.fim===fim);
    if(dup){if(g.obs&&!dup.obs) dup.obs=g.obs;return;}   // já veio do Centi: não conta de novo, só acrescenta a observação (ex.: nº da portaria)
    gozos.push({origem:'manual',id:g.id,tipo:g.tipo==='indenizacao'?'indenizacao':'gozo',ini,fim,dias:g.dias>0?+g.dias:dias(ini,fim),obs:g.obs,rotulo:g.tipo==='indenizacao'?'Indenização':'Gozo'});
  });
  /* marcas do RH por período (chave = número do período): quitada, indenizada ou requerida, com portaria, valor e data */
  const conf=!!reg.conferido,marcas=reg.periodos||{};
  completos.forEach(p=>{
    const m=marcas[p.n]||{};
    p.acao=m.acao||'';p.acaoData=m.data?isoMs(m.data):null;p.acaoObs=m.obs||'';p.acaoPortaria=m.portaria||'';
    const v=m.valor==null||m.valor===''?null:Number(m.valor);p.acaoValor=isFinite(v)?v:null;
  });
  gozos.sort((a,b)=>a.ini-b.ini);
  gozos.forEach(g=>{
    let resto=g.dias>=REGRA.DIAS?REGRA.DIAS:g.dias;   // 90 a 93 dias (meses de 31 dias) contam como a licença inteira
    let usou=false;
    for(const p of completos){
      if(resto<=0) break;
      if(p.acao==='quitada'||p.acao==='indenizada') continue;   // já resolvido pelo RH: o gozo do Centi vai para o próximo período em aberto
      const falta=REGRA.DIAS-p.cred;if(falta<=0) continue;
      const uso=Math.min(falta,resto);
      p.cred+=uso;resto-=uso;usou=true;
      p.gozos.push(Object.assign({},g,{usados:uso}));
      if(g.ini<p.direitoEm) alertas.push({nivel:'aviso',msg:(g.tipo==='indenizacao'?'Indenização':'Gozo')+' de '+fmt(g.ini)+' a '+fmt(g.fim)+' é anterior ao fim do período aquisitivo '+p.n+' ('+fmt(p.fim)+'). Confira as datas.'});
    }
    if(resto>0) alertas.push({nivel:'aviso',msg:(usou?'Parte d':'')+'o gozo de '+fmt(g.ini)+' a '+fmt(g.fim)+' não tem período aquisitivo completo para abater'+(usou?' ('+resto+' dias sobram)':'')+'. Confira o início da contagem.'});
  });

  /* situação de cada período completo */
  Object.keys(marcas).forEach(k=>{const p=validos.find(x=>String(x.n)===String(k));if(!p||!p.completo) alertas.push({nivel:'aviso',msg:'Existe uma marca do RH no período '+k+', que não existe (ou ainda não foi concluído) pelo cálculo atual. Revise os lançamentos.'});});
  completos.forEach(p=>{
    p.saldo=Math.max(0,REGRA.DIAS-p.cred);
    const quitado=p.saldo===0||p.acao==='quitada'||p.acao==='indenizada';
    if(quitado){p.status=p.acao==='indenizada'||(p.gozos.length&&p.gozos.every(g=>g.tipo==='indenizacao'))?'indenizada':'gozada';p.saldo=0;return;}
    if(p.acao==='requerida'){p.status='requerida';return;}
    if(hoje>p.janelaFim){
      if(!conf){p.status='conferir';return;}
      if(p.direitoEm<REGRA.LC181){p.status='anterior';return;}
      p.status=hoje>p.requererAte?'perdida':'vencida';return;
    }
    p.status=p.cred>0?'parcial':'disponivel';
    p.vencendo=(p.janelaFim-hoje)/DAY<=aviso;
  });
  validos.filter(p=>!p.completo).forEach(p=>{p.status='formacao';p.saldo=0;});

  /* resumo da pessoa */
  const abertos=completos.filter(p=>['disponivel','parcial','vencida','requerida','anterior'].includes(p.status));
  if(abertos.length>1) alertas.push({nivel:'aviso',msg:abertos.length+' períodos em aberto ao mesmo tempo. O art. 194, §6º não permite acumular mais de um período.',acum:true});
  completos.filter(p=>p.status==='requerida'&&p.acaoData!=null&&hoje-p.acaoData>REGRA.CONCEDER_DIAS*DAY).forEach(p=>alertas.push({nivel:'erro',msg:'Requerida em '+fmt(p.acaoData)+': passaram mais de '+REGRA.CONCEDER_DIAS+' dias sem concessão (art. 194, §8º).'}));
  evs.filter(e=>e.efeito==='revisar').forEach(e=>alertas.push({nivel:'info',msg:'Afastamento "'+e.tipo+'" ('+fmt(e.ini)+' a '+fmt(e.fim)+') ainda não foi classificado. Em Regras, escolha se ele suspende, interrompe ou não altera a contagem.'}));
  const emGozo=gozos.find(g=>g.tipo==='gozo'&&g.ini<=hoje&&hoje<=g.fim)||null;
  const st=k=>completos.some(p=>p.status===k);
  const tags={
    req:st('requerida'),
    venc:st('vencida')||st('perdida'),
    vencendo:completos.some(p=>(p.status==='disponivel'||p.status==='parcial')&&p.vencendo),
    disp:completos.some(p=>p.status==='disponivel'||p.status==='parcial'||p.status==='anterior'),
    conf:st('conferir'),
    gozo:!!emGozo,
    acum:abertos.length>1,
    form:!completos.length,
    naoconf:!conf
  };
  let situacao;
  if(tags.req) situacao={codigo:'req',rotulo:'Requerida'};
  else if(tags.venc) situacao={codigo:'venc',rotulo:st('perdida')&&!st('vencida')?'Direito perdido':'Vencida'};
  else if(tags.conf) situacao={codigo:'conf',rotulo:'A conferir'};
  else if(tags.vencendo) situacao={codigo:'vencendo',rotulo:'Vencendo'};
  else if(tags.disp) situacao={codigo:'disp',rotulo:'A gozar'};
  else if(tags.form) situacao={codigo:'form',rotulo:'Sem direito ainda'};
  else situacao={codigo:'dia',rotulo:'Em dia'};
  if(emGozo) situacao={codigo:'gozo',rotulo:'Em gozo'};
  return {inicio,per:validos.slice().reverse(),ciclos,interrompidos:ciclos.filter(p=>p.interrompido),gozos,emGozo,alertas,tags,situacao,
    saldo:completos.filter(p=>['disponivel','parcial','vencida','requerida','anterior'].includes(p.status)).reduce((t,p)=>t+p.saldo,0),
    proximo:validos.find(p=>!p.completo)||null};
}

/* ---------- leitura do relatório "Relação de afastamentos" (FP071) do Centi ----------
   O Centi só entrega esse relatório em PDF. O navegador abre o PDF com pdf.js e passa para cá, por página, os itens de texto
   ({s:texto,x,y}). Cada afastamento é uma linha com matrícula, funcionário, cargo, tipo, início, fim e dias; cargo e tipo podem
   quebrar em mais de uma linha, então os textos são separados pela posição horizontal das colunas (lida do cabeçalho). */
function parseAfastamentos(paginas){
  const rows=[],ruins=[];
  const DATA=/^\d{2}\/\d{2}\/\d{4}$/;
  for(const pag of paginas||[]){
    const its=(pag||[]).map(i=>({s:String(i.s==null?'':i.s).trim(),x:+i.x,y:+i.y})).filter(i=>i.s!==''&&isFinite(i.x)&&isFinite(i.y));
    its.sort((a,b)=>b.y-a.y||a.x-b.x);
    const linhas=[];
    for(const i of its){const l=linhas[linhas.length-1];if(l&&Math.abs(l.y-i.y)<=2) l.itens.push(i);else linhas.push({y:i.y,itens:[i]});}
    linhas.forEach(l=>l.itens.sort((a,b)=>a.x-b.x));
    let cab=null,rec=null;
    const fecha=()=>{if(!rec) return;const r=montar(rec,cab);if(r) rows.push(r);else ruins.push(rec.mat);rec=null;};
    for(const l of linhas){
      const t=l.itens.map(i=>i.s);
      if(t.includes('Matrícula')&&t.some(x=>/^Tipo afastamento/.test(x))){
        fecha();
        const x=nome=>{const i=l.itens.find(z=>z.s.startsWith(nome));return i?i.x:null;};
        const nome=x('Funcionário'),cargo=x('Cargo'),tipo=x('Tipo afastamento'),qtd=x('Qtd');
        cab=(nome!=null&&cargo!=null&&tipo!=null)?{nome:nome-3,cargo:cargo-3,tipo:tipo-3,dias:qtd==null?Infinity:qtd-10}:null;
        continue;
      }
      if(!cab) continue;
      if(t.some(x=>/^Qtde\.?$/.test(x))){fecha();continue;}   // total do grupo
      const p=l.itens[0];
      if(/^\d{6,10}$/.test(p.s)&&p.x<cab.nome){fecha();rec={mat:p.s,itens:l.itens.slice(1)};continue;}
      if(p.x<cab.nome){fecha();continue;}   // título de grupo
      if(rec) rec.itens.push(...l.itens);   // linha de continuação (cargo ou tipo quebrado)
    }
    fecha();
  }
  return {rows,ruins};
  function montar(rec,cb){
    const col={nome:[],cargo:[],tipo:[]},datas=[];let qtd=null;
    for(const i of rec.itens){
      if(DATA.test(i.s)){datas.push(D(i.s));continue;}
      if(/^\d{1,9}$/.test(i.s)&&i.x>=cb.dias){qtd=+i.s;continue;}   // afastamento sem data de fim (ex.: 09/09/9999) traz milhões de dias
      if(i.x>=cb.tipo) col.tipo.push(i.s);else if(i.x>=cb.cargo) col.cargo.push(i.s);else col.nome.push(i.s);
    }
    const j=a=>a.join(' ').replace(/\s+/g,' ').trim();
    if(datas.length<2||datas[0]==null||datas[1]==null||!j(col.tipo)) return null;
    return {mat:rec.mat,nome:j(col.nome),cargo:j(col.cargo),tipo:j(col.tipo),ini:datas[0],fim:datas[1],dias:qtd==null?dias(datas[0],datas[1]):qtd};
  }
}

/* ---------- carga do Centi ---------- */
async function lerPdf(bytes){
  if(!lerPdf.ok){
    try{const r=await fetch(WORKER_URL);if(!r.ok) throw 0;pdfjsLib.GlobalWorkerOptions.workerSrc=URL.createObjectURL(new Blob([await r.text()],{type:'text/javascript'}));}
    catch(e){pdfjsLib.GlobalWorkerOptions.workerSrc=WORKER_URL;}
    lerPdf.ok=true;
  }
  const doc=await pdfjsLib.getDocument({data:bytes}).promise,pags=[];
  for(let i=1;i<=doc.numPages;i++){
    const tc=await (await doc.getPage(i)).getTextContent();
    pags.push(tc.items.map(t=>({s:t.str,x:t.transform[4],y:t.transform[5]})));
  }
  return parseAfastamentos(pags);
}

/* f: cadastro do Centi {Id,Matricula,Nome,DataAdmissao,Situacao,TipoAdm,Cargo,Lotacao,afast}; rows: afastamentos desse servidor lidos do PDF */
function construir(f,rows){

}
function recalcular(p){
  p.eventos=p.rows.map(r=>({tipo:r.tipo,efeito:classificarTipo(r.tipo,cfg.mapa).efeito,ini:r.ini,fim:r.fim}));
  p.r=p.adm==null?{erro:'Sem data de admissão no Centi.',per:[],ciclos:[],interrompidos:[],alertas:[],tags:{},situacao:{codigo:'erro',rotulo:'Sem data de admissão'},saldo:0}
    :calcular({adm:p.adm,eventos:p.eventos,registro:registros[p.mat]||{}},hojeMs(),cfg);
  if(p.adm!=null){
    if(String(p.situacao).trim().toLowerCase()!=='ativo') p.r.alertas.unshift({nivel:'info',msg:'Situação no Centi: '+p.situacao+'.'});

const regDe=p=>{const r=registros[p.mat]||(registros[p.mat]={});r.nome=p.nome;r.cid=p.cid;return r;};   // nome e Id ficam junto para a lista "acompanhados"
function aposEdicao(p){
  recalcular(p);salvarReg(p.mat);
  render();
  if($('#dlg').open) dlgPessoa(p);
}
function acaoDlg(e){
  const p=pAberta;if(!p) return;
  const t=e.target;
  if(t.matches('[data-acao]')){
    const n=t.dataset.acao,reg=regDe(p);reg.periodos=reg.periodos||{};
    if(!t.value) delete reg.periodos[n];else reg.periodos[n]=Object.assign({},reg.periodos[n],{acao:t.value,data:t.value==='requerida'?(reg.periodos[n]&&reg.periodos[n].data)||toIso(hojeMs()):((reg.periodos[n]&&reg.periodos[n].data)||'')});
    aposEdicao(p);return;
  }
  const marcaDe=n=>{const reg=regDe(p);return reg.periodos&&reg.periodos[n];};
  if(t.matches('[data-acaodata]')){const m=marcaDe(t.dataset.acaodata);if(m){if(t.value) m.data=t.value;else if(m.acao!=='requerida') m.data='';aposEdicao(p);}return;}
  if(t.matches('[data-acaoport]')){const m=marcaDe(t.dataset.acaoport);if(m){const v=t.value.trim();if(v) m.portaria=v;else delete m.portaria;aposEdicao(p);}return;}
  if(t.matches('[data-acaoobs]')){const m=marcaDe(t.dataset.acaoobs);if(m){const v=t.value.trim();if(v) m.obs=v;else delete m.obs;aposEdicao(p);}return;}
  if(t.matches('[data-acaovalor]')){
    const m=marcaDe(t.dataset.acaovalor);if(!m) return;
    const bruto=t.value.trim().replace(/^R\$\s*/i,'').replace(/\./g,'').replace(',','.'),v=bruto===''?NaN:Number(bruto);
    if(isFinite(v)&&v>=0) m.valor=Math.round(v*100)/100;
    else if(bruto==='') delete m.valor;
    else{toast('Valor inválido. Digite assim: 20.512,37');}
    aposEdicao(p);return;
  }
}
function cliqueDlg(e){
  const p=pAberta;if(!p) return;
  const t=e.target.closest('button');if(!t) return;
  const v=id=>($('#'+id)||{}).value||'';
  if(t.dataset.addg!==undefined){
    const ini=v('g-ini'),fim=v('g-fim')||ini;
    if(!ini||isoMs(fim)<isoMs(ini)){toast('Informe o início e o fim da licença (o fim não pode ser antes do início).');return;}
    const reg=regDe(p);(reg.gozos=reg.gozos||[]).push({id:uid(),tipo:v('g-tipo'),ini,fim,dias:+v('g-dias')||0,obs:v('g-obs')});
    aposEdicao(p);return;
  }
  if(t.dataset.adde!==undefined){
    const ini=v('e-ini'),fim=v('e-fim')||ini;
    if(!ini||isoMs(fim)<isoMs(ini)){toast('Informe a data (ou o início e o fim).');return;}
    const reg=regDe(p);(reg.eventos=reg.eventos||[]).push({id:uid(),tipo:v('e-tipo'),ini,fim,obs:v('e-obs')});
    aposEdicao(p);return;
  }
  if(t.dataset.delg){const reg=regDe(p);reg.gozos=(reg.gozos||[]).filter(g=>g.id!==t.dataset.delg);aposEdicao(p);return;}
  if(t.dataset.dele){const reg=regDe(p);reg.eventos=(reg.eventos||[]).filter(g=>g.id!==t.dataset.dele);aposEdicao(p);return;}
  if(t.dataset.salvc!==undefined){
    const reg=regDe(p);reg.conferido=$('#c-conf').checked;reg.inicio=v('c-ini');reg.obs=v('c-obs').trim();
    if(!reg.inicio) delete reg.inicio;if(!reg.obs) delete reg.obs;if(!reg.conferido) delete reg.conferido;

}

/* ---------- regras ---------- */
function dlgRegras(){
  const vk=new Map(vincVistos);Object.keys(cfg.vinculos).forEach(k=>{if(!vk.has(k)) vk.set(k,{k,nome:titulo(k),n:0});});
  if(!vk.has('servidor publico efetivo')) vk.set('servidor publico efetivo',{k:'servidor publico efetivo',nome:'Servidor Público Efetivo',n:0});
  const tk=new Map(tiposVistos);Object.keys(cfg.mapa).forEach(k=>{if(!tk.has(k)) tk.set(k,{k,tipo:k,n:0});});
  const vi=[...vk.values()].sort((a,b)=>b.n-a.n).map(v=>`<label class="ck"><input type="checkbox" data-vk="${esc(v.k)}"${ehEfetivoK(v.k)?' checked':''}>${esc(v.nome)}${v.n?` <small>(${v.n} vistos)</small>`:''}</label>`).join('');
  const mp=[...tk.values()].sort((a,b)=>b.n-a.n).map(t=>{
    const pad=classificarTipo(t.tipo,{}).efeito,cur=cfg.mapa[t.k]||'';
    return `<tr><td>${esc(titulo(t.tipo))}</td><td class="num">${t.n||'—'}</td><td><select data-mk="${esc(t.k)}"><option value="">Padrão: ${esc(EFEITOS[pad])}</option>${Object.keys(EFEITOS).map(k=>`<option value="${k}"${cur===k?' selected':''}>${esc(EFEITOS[k])}</option>`).join('')}</select></td></tr>`;
  }).join('');
  const d=abrirDlg(`<h3>Regras da licença-prêmio</h3>
    <p>Valem o Estatuto (Lei 3.968/2000, arts. 194 a 197) e as escolhas abaixo. Os prazos do Estatuto (5 anos, 90 dias, janela de 5 anos, 90 dias para requerer) estão fixos no sistema.</p>
    <h4 class="sec">Quais vínculos têm direito</h4>
    <p class="sub">O art. 194 vale para titular de cargo efetivo. Outro vínculo só deve ser marcado se o jurídico entender que também tem direito. Quem não está marcado ainda pode ser consultado, mas com aviso. A lista mostra os vínculos que já apareceram nas buscas.</p>
    <div class="alertas">${vi}</div>
    <h4 class="sec">Alerta de prazo</h4>
    <label>Avisar quando faltar até (dias) para acabar o prazo de gozo<input name="aviso" type="number" min="30" max="1000" value="${cfg.avisoDias}"></label>
    <h4 class="sec">O que cada afastamento do Centi faz com a contagem</h4>
    <p class="sub">Já vem classificado pelo Estatuto (arts. 196 e 197). Mude só se o RH ou o jurídico entender diferente. O que ficar "A revisar" é tratado como exercício e aparece como aviso na ficha. A lista mostra os tipos que já apareceram nas fichas abertas.</p>
    ${mp?`<div class="scr"><table class="mapa"><thead><tr><th>Tipo de afastamento</th><th style="text-align:right">Registros</th><th>Efeito</th></tr></thead><tbody>${mp}</tbody></table></div>`:'<p class="sub">Nenhum tipo ainda: abra a ficha de um servidor para eles aparecerem aqui.</p>'}
    <div class="row"><button type="button" class="btn" data-x>Cancelar</button><button class="btn primary" type="submit">Salvar</button></div>`);
  d.querySelector('form').addEventListener('submit',()=>{
    const nv=Object.assign({},cfg.vinculos);d.querySelectorAll('[data-vk]').forEach(c=>{nv[c.dataset.vk]=c.checked;});
    const nm=Object.assign({},cfg.mapa);d.querySelectorAll('[data-mk]').forEach(s=>{if(s.value) nm[s.dataset.mk]=s.value;else delete nm[s.dataset.mk];});
    const av=Math.round(+d.querySelector('[name=aviso]').value);
    cfg={avisoDias:av>=30&&av<=1000?av:180,vinculos:nv,mapa:nm};
    salvarCfg();fechar();
    if(modo==='panorama') toast('Regras salvas. Clique em Panorama dos efetivos para recalcular com a lista atualizada.');else toast('Regras salvas.');
    pessoas.forEach(recalcular);render();
  });
}

/* ---------- exportar (panorama) ---------- */
function csv(){
  const q=norm(($('#q2')||{}).value||''),lista=pessoas.filter(p=>casa(p,q,filtro));
  if(!lista.length){toast('Nada para exportar.');return;}
  const c=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
  const cab=['Nome','Matrícula','Cargo','Lotação','Admissão','Início da contagem','Situação','Períodos em aberto','Dias a gozar','Próximo prazo','Próximo direito','Histórico conferido'];
  const lin=lista.map(p=>{
    const ab=abertosDe(p.r).sort((a,b)=>a.janelaFim-b.janelaFim)[0];
    return [p.nome,p.mat,p.cargo,p.lot,fmt(p.adm),fmt(p.r.inicio),p.r.situacao.rotulo,abertosDe(p.r).length,p.r.saldo,ab?fmt(ab.janelaFim):'',p.r.proximo?fmt(p.r.proximo.direitoEm):'',p.r.tags.naoconf?'Não':'Sim'].map(c).join(';');
  });
  const blob=new Blob(['﻿'+[cab.map(c).join(';')].concat(lin).join('\r\n')],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='licenca-premio-'+new Date().toISOString().slice(0,10)+'.csv';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}

/* ---------- eventos ---------- */
$('#buscaF').addEventListener('submit',e=>{e.preventDefault();buscar($('#q').value);});
$('#cfgBtn').addEventListener('click',dlgRegras);
$('#panBtn').addEventListener('click',carregarPanorama);
$('#dlg').addEventListener('change',acaoDlg);
$('#dlg').addEventListener('click',cliqueDlg);
document.addEventListener('input',e=>{if(e.target.id==='q2') render();});
document.addEventListener('change',e=>{if(e.target.id==='ft'){filtro=e.target.value;render();}});
document.addEventListener('click',e=>{
  if(e.target.closest('[data-voltar]')){modo='busca';filtro='';render();return;}
  if(e.target.closest('[data-csv]')){csv();return;}
  const st=e.target.closest('.stat');if(st){filtro=filtro===st.dataset.f?'':st.dataset.f;render();return;}
  const r=e.target.closest('#view [data-i]');if(r){dlgPessoa(pessoas[+r.dataset.i]);return;}
  const q=e.target.closest('#view [data-r]');if(q&&resultados){abrirServidor(resultados.lista[+q.dataset.r]);return;}
  const m=e.target.closest('#view [data-m]');if(m) abrirPorMatricula(m.dataset.m);
});
observarTema();

(function init(){
  const c=lerLS(CFG_LS);if(c&&typeof c==='object') cfg=Object.assign(cfg,c);
  const r=lerLS(REG_LS);if(r&&r.por) registros=r.por;
  themeBtn();render();carga(true,'Conectando ao servidor…');
  (async()=>{
    try{
      if(window.claude&&window.claude.use) dbh=await window.claude.use('db');
      if(!dbh) dbh=await PB.connect();
      if(dbh){
        const c2=await lerDoc('licenca/config');if(c2&&typeof c2==='object') cfg=Object.assign(cfg,c2);
        const r2=await lerDoc('licenca/registro');if(r2&&r2.por) registros=r2.por;
        render();
      }
    }catch(e){dbh=null;}
    finally{carga(false);}
  })();
})();
</script>
<script>
/* "Olá, Primeiro nome" — lê o nome do Centi guardado na sessão deste navegador */
(function(){
  function nome(){
    try{const a=JSON.parse(localStorage.getItem('rhcrv-pb-auth')||'null');const n=a&&a.centi&&(a.centi.nome||a.centi.user);
      if(!n) return '';const p=String(n).trim().split(/\s+/)[0];
      if(!p||/\d/.test(p)||/^[a-z]+\.[a-z]/i.test(p)) return '';
      return p.charAt(0).toLocaleUpperCase('pt-BR')+p.slice(1).toLocaleLowerCase('pt-BR');}catch(e){return '';}
  }
  function aplicar(){
    const n=nome();let el=document.getElementById('helloMod');
    if(!n){if(el) el.remove();return;}
    if(!el){
      const hero=document.querySelector('.hero h1'),top=document.querySelector('.side .brand');
      el=document.createElement(hero?'p':'div');el.id='helloMod';el.className='hello';
      el.innerHTML='<span class="wave" aria-hidden="true">👋</span><span></span>';
      if(hero) hero.parentNode.insertBefore(el,hero);
      else if(top) top.insertAdjacentElement('afterend',el);
      else return;
    }
    el.lastChild.textContent='Olá, '+n;
  }
  let i=0;aplicar();const t=setInterval(()=>{aplicar();if(++i>40)clearInterval(t);},500);
  window.addEventListener('storage',aplicar);
})();

</script>
