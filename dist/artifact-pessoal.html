<title>Hierarquia de Pessoal</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@500;600;700&family=Public+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#eef4f0;--surface:#fff;--fg:#12281d;--muted:#4f665a;--line:#d1ddd6;--accent:#0a6b3d;--accent-fg:#fff;--soft:#e3efe8;
  --hero-a:#063d27;--hero-b:#0b7a49;--gold:#d4aa4a;--shadow:0 1px 2px rgba(6,61,39,.09),0 6px 20px rgba(6,61,39,.07);
  --warn:#8a5a00;--warn-bg:#fdf0d5;--danger:#b3261e;
  --f-display:"Libre Franklin",system-ui,sans-serif;--f-body:"Public Sans",system-ui,sans-serif;
  --c1:#0a6b3d;--c2:#2f6fb5;--c3:#8a5a00;--c4:#6f4aa8;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#08130e;--surface:#0f1e17;--fg:#e3f1ea;--muted:#90b0a0;--line:#234034;--accent:#52c98a;--accent-fg:#04210f;--soft:#15291f;
  --hero-a:#04150d;--hero-b:#0b4d31;--gold:#d8b45e;--shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.3);
  --warn:#f0c26a;--warn-bg:#3a2d10;--danger:#ff8a80;--c1:#52c98a;--c2:#7fb2ee;--c3:#e6b663;--c4:#b99be8;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#08130e;--surface:#0f1e17;--fg:#e3f1ea;--muted:#90b0a0;--line:#234034;--accent:#52c98a;--accent-fg:#04210f;--soft:#15291f;
  --hero-a:#04150d;--hero-b:#0b4d31;--gold:#d8b45e;--shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.3);
  --warn:#f0c26a;--warn-bg:#3a2d10;--danger:#ff8a80;--c1:#52c98a;--c2:#7fb2ee;--c3:#e6b663;--c4:#b99be8;color-scheme:dark}
[hidden]{display:none!important}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance}
button,input,select{font:inherit;color:inherit}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.inner{max-width:1120px;margin:0 auto}
.hero{background:linear-gradient(135deg,var(--hero-a),var(--hero-b));color:#fff;padding-block:22px 54px}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:22px}
.home{color:#fff;text-decoration:none;font-weight:600;font-size:13.5px;display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border-radius:10px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.28)}
.home:hover,.themebtn:hover{background:rgba(255,255,255,.22)}
.themebtn{margin-left:auto;display:inline-flex;align-items:center;gap:8px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.12);color:#fff;border-radius:10px;padding:8px 12px;font-weight:600;font-size:13.5px;cursor:pointer}
.goldrule{width:56px;height:4px;background:var(--gold);border-radius:2px;margin:0 0 14px}
.hero h1{font-size:clamp(1.6rem,4.4vw,2.4rem);line-height:1.12}
.hero p{margin:8px 0 0;opacity:.85}
main{padding-block:0 40px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:12px;margin-top:-30px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow)}
.stat b{font-family:var(--f-display);font-size:1.7rem;display:block;line-height:1.1}
.stat span{color:var(--muted);font-size:13px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:18px}
.search{flex:1 1 260px;display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 14px;box-shadow:var(--shadow);min-width:0}
.search input{border:0;background:transparent;outline:0;padding:12px 0;flex:1;min-width:0}
.search:focus-within{border-color:var(--accent)}
select{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;box-shadow:var(--shadow)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;cursor:pointer;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:8px;box-shadow:var(--shadow)}
.btn:hover{border-color:var(--accent)}.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}.btn.danger{color:var(--danger)}
.banner{margin-top:14px;border-radius:12px;padding:12px 16px;font-size:13.5px;background:var(--warn-bg);color:var(--warn)}
.root{margin:26px 0 8px;display:flex;justify-content:center}
.rootbox{background:linear-gradient(135deg,var(--hero-a),var(--hero-b));color:#fff;border-radius:14px;padding:14px 22px;text-align:center;box-shadow:var(--shadow)}
.rootbox small{display:block;letter-spacing:.14em;text-transform:uppercase;font-size:11px;opacity:.85}
.rootbox b{font-family:var(--f-display);font-size:1.1rem}
.branches{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:16px;align-items:start;margin-top:14px;position:relative}
.branch>h2{font-size:1.05rem;display:flex;align-items:center;gap:10px;margin:0 0 10px}
.branch>h2 i{width:10px;height:10px;border-radius:50%;background:var(--bc,var(--accent));display:inline-block}
.branch>h2 span{color:var(--muted);font-weight:500;font-size:13px;font-family:var(--f-body)}
details.grp{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--bc,var(--accent));border-radius:12px;box-shadow:var(--shadow);margin-bottom:10px}
details.grp>summary{list-style:none;cursor:pointer;padding:12px 14px;display:flex;align-items:center;gap:10px;font-weight:600}
details.grp>summary::-webkit-details-marker{display:none}
details.grp>summary::before{content:"›";font-size:20px;line-height:1;transition:transform .15s;color:var(--muted)}
details.grp[open]>summary::before{transform:rotate(90deg)}
.gname{flex:1;min-width:0}
.gname small{display:block;font-weight:400;color:var(--muted);font-size:12.5px}
.cnt{background:var(--soft);color:var(--accent);border-radius:99px;padding:2px 10px;font-size:12.5px;font-weight:700}
.lvl{padding:6px 14px 4px;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;border-top:1px solid var(--line)}
.people{list-style:none;margin:0;padding:0 8px 8px}
.person{display:flex;align-items:center;gap:12px;padding:8px 6px;border-radius:9px}
.person:hover{background:var(--soft)}
.av{width:36px;height:36px;border-radius:50%;background:var(--soft);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:12.5px;flex:none}
.pn{flex:1;min-width:0}.pn b{display:block;font-weight:600;line-height:1.25}.pn span{color:var(--muted);font-size:13px}
.tag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--soft);color:var(--muted);white-space:nowrap}
.tag.com{background:color-mix(in srgb,var(--c2) 18%,transparent);color:var(--c2)}
.tag.efe{background:color-mix(in srgb,var(--c1) 18%,transparent);color:var(--c1)}
.tag.ced{background:color-mix(in srgb,var(--c3) 20%,transparent);color:var(--c3)}
.tag.ant,.tag.pen{background:color-mix(in srgb,var(--c4) 18%,transparent);color:var(--c4)}
.empty{margin-top:30px;text-align:center;padding:38px 20px;background:var(--surface);border:2px dashed var(--line);border-radius:16px;color:var(--muted)}
.empty h2{color:var(--fg);margin-bottom:6px}
.note{margin-top:20px;font-size:12.8px;color:var(--muted)}
/* edição */
.person{flex-wrap:wrap}
.pact{display:flex;gap:4px;margin-left:auto}
.pact .btn,.gact .btn{padding:4px 9px;font-size:12.5px;box-shadow:none}
.gact{display:flex;gap:4px;margin-left:auto}
details.grp>summary .gact{margin-left:8px}
body.editando .person{cursor:grab}
body.editando .person[draggable=true]:active{cursor:grabbing}
.person.dragging{opacity:.35}
details.grp.over{outline:2px dashed var(--accent);outline-offset:2px;background:var(--soft)}
.banner.edit{background:var(--soft);color:var(--fg);border:1px solid var(--accent)}
.undo{margin-left:12px;border:1px solid currentColor;background:transparent;color:inherit;border-radius:8px;padding:3px 10px;cursor:pointer;font-weight:600}
dialog{border:1px solid var(--line);border-radius:16px;padding:0;background:var(--surface);color:var(--fg);width:min(460px,94vw);box-shadow:0 20px 60px rgba(0,0,0,.4)}
dialog::backdrop{background:rgba(0,0,0,.5)}
dialog form{padding:20px;display:flex;flex-direction:column;gap:12px;max-height:88vh;overflow:auto}
dialog h3{font-size:1.1rem}
dialog label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:600}
dialog input,dialog select{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--fg);font-weight:400}
dialog .row{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
dialog p{margin:0;font-size:14px}
dl.ficha{margin:0;display:grid;grid-template-columns:max-content 1fr;gap:6px 14px;font-size:14px}
dl.ficha dt{color:var(--muted);font-weight:600}dl.ficha dd{margin:0;overflow-wrap:anywhere}
.fin-box{margin-top:6px;padding-top:14px;border-top:1px solid var(--line)}
.fin-box h4{margin:0 0 8px;font-size:1rem;font-family:var(--f-display)}
.fin-sel{display:flex;gap:8px;align-items:end;flex-wrap:wrap}
.fin-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:14px 0 8px}
.fin-head b{font-family:var(--f-display);font-size:.98rem}
.fin-head .pill{background:var(--soft);color:var(--accent);border-radius:99px;padding:2px 10px;font-size:12px;font-weight:700}
.fin-head small{color:var(--muted);margin-left:auto}
.fin-sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.fin-sum div{border-radius:12px;padding:10px 12px;background:var(--soft);border:1px solid var(--line)}
.fin-sum small{display:block;font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.fin-sum b{display:block;font-family:var(--f-display);font-size:1.12rem;margin-top:2px;font-variant-numeric:tabular-nums}
.fin-sum .pv{background:color-mix(in srgb,var(--c1) 12%,var(--surface));border-color:color-mix(in srgb,var(--c1) 35%,var(--line))}.fin-sum .pv b{color:var(--c1)}
.fin-sum .ds{background:color-mix(in srgb,var(--danger) 10%,var(--surface));border-color:color-mix(in srgb,var(--danger) 35%,var(--line))}.fin-sum .ds b{color:var(--danger)}
.fin-sum .lq{background:var(--accent);border-color:var(--accent)}.fin-sum .lq small,.fin-sum .lq b{color:var(--accent-fg)}
.fin-wrap{overflow-x:auto;margin-top:10px;border:1px solid var(--line);border-radius:12px}
.fin{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
.fin th{background:var(--soft);color:var(--muted);font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;font-weight:700;padding:8px 10px;text-align:right;white-space:nowrap}
.fin td{padding:8px 10px;text-align:right;border-top:1px solid var(--line)}
.fin th:first-child,.fin td:first-child{text-align:left}
.fin tbody tr:nth-child(even) td{background:color-mix(in srgb,var(--soft) 45%,transparent)}
.fin td.r{color:var(--muted)}
.fin td.pv{color:var(--c1);font-weight:600}
.fin td.ds{color:var(--danger);font-weight:600}
.fin tfoot td{font-weight:700;background:var(--soft);border-top:2px solid var(--line)}
@media (max-width:520px){.fin-sum{grid-template-columns:1fr}.fin-head small{margin-left:0;width:100%}}
.pm{display:block;color:var(--muted);font-size:12px}
.pn[data-fi]{cursor:pointer}.pn[data-fi]:hover b{text-decoration:underline}
@media (max-width:560px){.pact{width:100%;justify-content:flex-end}}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:max(18px,env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:60;max-width:90vw}
@media (pointer:coarse){input,select,textarea{font-size:16px}.btn{min-height:42px}.btn.sm{min-height:38px}}
</style>

<script>
/* =====================================================================
   PocketBase: armazenamento no servidor (substitui o localStorage)
   Expõe PB.connect(), que devolve um objeto "dbh" com a mesma forma
   usada pelo restante do sistema: dbh.doc('a/b').get/set/delete e
   dbh.collection('versoes').orderBy('at','desc').limit(n).get()
   ===================================================================== */
const PB=(function(){
  const URL_BASE='https://pb.devgabriel.app.br'.replace(/\/+$/,'');
  const CENTI_BASE=''.replace(/\/+$/,'');   // vazio = mesmo endereço do site (funções em /api)
  const AUTH_KEY='rhcrv-pb-auth';
  let token='',email='',col='rhcmrv_users',loginP=null;
  let cs=null;   // sessão do Centi: {user,nome,token,refreshToken}

  /* só vale a sessão que tem o acesso do Centi junto; sessões antigas (login simples) pedem novo login */
  function readAuth(){try{const a=JSON.parse(localStorage.getItem(AUTH_KEY)||'null');if(a&&a.token&&a.centi&&a.centi.token){token=a.token;email=a.email||'';col=a.col||'rhcmrv_users';cs=a.centi;}}catch(e){}}
  function saveAuth(){try{localStorage.setItem(AUTH_KEY,JSON.stringify({token,email,col,centi:cs}));}catch(e){}}
  function clearAuth(){token='';email='';col='rhcmrv_users';cs=null;try{localStorage.removeItem(AUTH_KEY);}catch(e){}}

  async function raw(method,path,body){
    const h={};
    if(body!==undefined) h['Content-Type']='application/json';
    if(token) h.Authorization=token;
    const r=await fetch(URL_BASE+path,{method,headers:h,body:body===undefined?undefined:JSON.stringify(body)});
    if(r.status===204) return null;
    let j=null; try{j=await r.json();}catch(e){}
    if(!r.ok){const err=new Error((j&&j.message)||('HTTP '+r.status));err.status=r.status;throw err;}
    return j;
  }
  async function api(method,path,body){
    try{return await raw(method,path,body);}
    catch(e){
      if(e.status===401||e.status===403){
        clearAuth();
        if(await login()) return raw(method,path,body);
      }
      throw e;
    }
  }

  /* ---------- login ---------- */
  function login(msg){
    if(loginP) return loginP;
    loginP=new Promise(resolve=>{
      const wrap=document.createElement('div');
      wrap.style.cssText='position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(0,0,0,.45)';
      wrap.innerHTML=
        '<form style="width:100%;max-width:360px;background:var(--surface,#fff);color:var(--fg,#12281d);border:1px solid var(--line,#d1ddd6);border-radius:12px;padding:22px;box-shadow:0 10px 40px rgba(0,0,0,.3);font:15px/1.4 system-ui,sans-serif">'+
        '<h3 style="margin:0 0 4px;font-size:18px">Entrar com o acesso do Centi</h3>'+
        '<p style="margin:0 0 14px;color:var(--muted,#4f665a);font-size:13px">Use o mesmo usuário e senha do Centi. A senha é conferida no Centi e não fica guardada neste sistema.</p>'+
        '<label style="display:block;font-size:13px;margin-bottom:10px">Usuário do Centi<input name="e" type="text" required autocapitalize="none" spellcheck="false" autocomplete="username" style="display:block;width:100%;box-sizing:border-box;margin-top:4px;padding:9px;border:1px solid var(--line,#d1ddd6);border-radius:8px;background:transparent;color:inherit;font:inherit"></label>'+
        '<label style="display:block;font-size:13px;margin-bottom:10px">Senha<input name="p" type="password" required autocomplete="current-password" style="display:block;width:100%;box-sizing:border-box;margin-top:4px;padding:9px;border:1px solid var(--line,#d1ddd6);border-radius:8px;background:transparent;color:inherit;font:inherit"></label>'+
        '<div data-err style="min-height:18px;margin-bottom:8px;color:#c0392b;font-size:13px"></div>'+
        '<div style="display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap">'+
        '<button type="submit" style="padding:9px 16px;border:0;border-radius:8px;background:var(--accent,#0a6b3d);color:var(--accent-fg,#fff);font:inherit;font-weight:600;cursor:pointer">Entrar</button></div></form>';
      document.body.appendChild(wrap);
      const f=wrap.querySelector('form'),err=wrap.querySelector('[data-err]');
      if(msg) err.textContent=msg;
      const done=ok=>{wrap.remove();loginP=null;resolve(ok);};
      f.e.focus();
      f.addEventListener('submit',async ev=>{
        ev.preventDefault(); err.textContent='Entrando…';
        try{
          const r=await fetch(CENTI_BASE+'/api/centi-login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user:f.e.value.trim(),pass:f.p.value})});
          let j=null; try{j=await r.json();}catch(e){}
          if(!r.ok){err.textContent=(j&&j.message)||('Não foi possível entrar (HTTP '+r.status+').');return;}
          token=j.pb.token; col='rhcmrv_users'; email=j.centi.user; cs=j.centi; saveAuth(); done(true);
        }catch(e){err.textContent='Não foi possível entrar: '+e.message;}
      });
    });
    return loginP;
  }

  /* ---------- documentos ---------- */
  const ids={};   // cache de id de registro por caminho
  const esc=s=>String(s).replace(/\\/g,'\\\\').replace(/"/g,'\\"');
  const spec=path=>{
    const i=path.indexOf('/'),col=path.slice(0,i),id=path.slice(i+1);
    return col==='versoes'?{c:'rhcmrv_versoes',f:'vid',k:id}:{c:'rhcmrv_docs',f:'key',k:path};
  };
  async function find(path){
    const s=spec(path);
    const q='?perPage=1&filter='+encodeURIComponent(s.f+'="'+esc(s.k)+'"');
    const r=await api('GET','/api/collections/'+s.c+'/records'+q);
    const rec=r.items&&r.items[0];
    if(rec) ids[path]=rec.id; else delete ids[path];
    return rec||null;
  }
  const payload=(s,data)=>s.c==='rhcmrv_versoes'?Object.assign({vid:s.k},data):{key:s.k,data};
  const unwrap=(s,rec)=>s.c==='rhcmrv_versoes'?{at:rec.at,label:rec.label,json:rec.json}:rec.data;

  function doc(path){
    const s=spec(path);
    return {
      async get(){const rec=await find(path);return {exists:!!rec,id:s.k,data:()=>rec?unwrap(s,rec):undefined};},
      async set(data){
        if(!ids[path]) await find(path);
        if(ids[path]) await api('PATCH','/api/collections/'+s.c+'/records/'+ids[path],payload(s,data));
        else{const r=await api('POST','/api/collections/'+s.c+'/records',payload(s,data));ids[path]=r.id;}
      },
      async delete(){
        if(!ids[path]) await find(path);
        if(ids[path]){await api('DELETE','/api/collections/'+s.c+'/records/'+ids[path]);delete ids[path];}
      }
    };
  }
  function collection(name){
    const q={sort:'',n:30};
    const api_={
      orderBy(f,dir){q.sort=(dir==='desc'?'-':'')+f;return api_;},
      limit(n){q.n=n;return api_;},
      async get(){
        const r=await api('GET','/api/collections/rhcmrv_'+name+'/records?perPage='+q.n+(q.sort?'&sort='+encodeURIComponent(q.sort):''));
        return {docs:r.items.map(rec=>({id:rec.vid,data:()=>({at:rec.at,label:rec.label,json:rec.json})}))};
      }
    };
    return api_;
  }

  /* ---------- tarefas (coleção rhcmrv_tarefas; as regras do servidor mostram só as compartilhadas e as do próprio dono) ---------- */
  const TAREFAS='/api/collections/rhcmrv_tarefas/records';
  const userId=()=>{try{const b=token.split('.')[1].replace(/-/g,'+').replace(/_/g,'/');return JSON.parse(decodeURIComponent(escape(atob(b+'='.repeat((4-b.length%4)%4))))).id||'';}catch(e){return '';}};
  async function todas(filtro){
    let page=1,out=[];
    for(;;){
      const r=await api('GET',TAREFAS+'?perPage=200&page='+page+'&sort=-criada_em'+(filtro?'&filter='+encodeURIComponent(filtro):''));
      out=out.concat(r.items||[]);
      if(!r.totalPages||page>=r.totalPages) return out;
      page++;
    }
  }
  const tarefas={
    list:todas,
    create:d=>api('POST',TAREFAS,Object.assign({dono:userId()},d)),
    update:(id,d)=>api('PATCH',TAREFAS+'/'+id,d),
    remove:id=>api('DELETE',TAREFAS+'/'+id)
  };

  /* ---------- API do Centi (pelo servidor do sistema, com o acesso da própria pessoa) ---------- */
  async function centiCall(path,body){
    if(!cs) throw new Error('Sem sessão do Centi. Entre novamente.');
    const r=await fetch(CENTI_BASE+'/api/centi',{method:'POST',
      headers:{'Content-Type':'application/json','x-centi-user':cs.user,'x-centi-token':cs.token,'x-centi-refresh':cs.refreshToken||''},
      body:JSON.stringify({path,body})});
    const nt=r.headers.get('x-centi-token'),nr=r.headers.get('x-centi-refresh');
    if(nt){cs.token=nt;if(nr)cs.refreshToken=nr;saveAuth();}   // o Centi renova o token sozinho
    let j=null; try{j=await r.json();}catch(e){}
    if(!r.ok){
      if(r.status===401){clearAuth();}
      const err=new Error((j&&j.message)||('Centi: HTTP '+r.status));err.status=r.status;throw err;
    }
    return j;
  }
  /* PB.centi.search('SFuncionario',[{FieldName:'Nome',Operation:6,Value:'%ana%'}]) -> {Data:[...],Count}
     (Operation 6 = contém; a tela de consulta do Centi exige ao menos um filtro com valor) */
  const centi={
    get user(){return cs?cs.user:'';},
    get nome(){return cs?(cs.nome||cs.user):'';},
    /* Cubo funcionário (FP051) do Centi na referência mes/ano -> {Data:[{MATRICULA,NOMEFUNC,CARGO,HIERARQUIA,...}],Total}; só ativos */
    /* Ficha financeira (FP024) da matrícula no mês/ano -> {Fichas:[{Folha,Mes,Ano,TotalProventos,TotalDescontos,LiquidoReceber,Eventos:[...]}]}; não é guardada */
    ficha(matricula,mes,ano){return centiCall('ficha-financeira',{matricula,mes,ano});},
    /* Férias: ativos (FP051) + gozos de férias (FP273) -> {Pessoas:[...],Gozos:[{MATRICULA,DTAQUIINI,DTAQUIFIN,SALDO,GOZOINICIAL,GOZOFINAL,...}]} */
    ferias(mes,ano){return centiCall('ferias',{mes,ano});},
    cubo(mes,ano){return centiCall('cubo-funcionario',{mes,ano});},
    search(entity,filters,start,depth){
      return centiCall('restauth/searchentity',{Depth:depth||50,Entity:entity,Start:start==null?1:start,
        Filters:(filters||[]).map(f=>Object.assign({List:false,TypeFilter:0,between:''},f))});
    }
  };

  /* ---------- conexão ---------- */
  const sleep=ms=>new Promise(r=>setTimeout(r,ms));
  async function alive(){
    for(let i=0;i<3;i++){
      const ac=new AbortController(),t=setTimeout(()=>ac.abort(),6000);
      try{const r=await fetch(URL_BASE+'/api/health',{cache:'no-store',signal:ac.signal});clearTimeout(t);if(r.ok) return true;}catch(e){clearTimeout(t);}
      if(i<2) await sleep(1500);
    }
    return false;
  }
  const box='position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(0,0,0,.5)';
  const card='width:100%;max-width:380px;background:var(--surface,#fff);color:var(--fg,#12281d);border:1px solid var(--line,#d1ddd6);border-radius:12px;padding:22px;box-shadow:0 10px 40px rgba(0,0,0,.3);font:15px/1.45 system-ui,sans-serif';
  const bt='padding:9px 14px;border-radius:8px;font:inherit;font-weight:600;cursor:pointer;';
  /* servidor fora do ar: pergunta antes de seguir, para não trabalhar sem querer só neste navegador */
  function offlineDialog(){
    return new Promise(resolve=>{
      const w=document.createElement('div');w.style.cssText=box;
      w.innerHTML='<div role="alertdialog" aria-modal="true" style="'+card+'"><h3 style="margin:0 0 6px;font-size:18px">Sem conexão com o servidor</h3>'+
        '<p style="margin:0 0 14px;color:var(--muted,#4f665a);font-size:13.5px">Não foi possível falar com o servidor dos dados. Verifique a internet e tente de novo. Se continuar só neste navegador, o que você fizer <b>não será salvo no servidor</b> e não aparecerá em outros computadores.</p>'+
        '<div style="display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap"><button type="button" data-loc style="'+bt+'border:1px solid var(--line,#d1ddd6);background:transparent;color:inherit">Usar só neste navegador</button>'+
        '<button type="button" data-retry style="'+bt+'border:0;background:var(--accent,#0a6b3d);color:var(--accent-fg,#fff)">Tentar novamente</button></div></div>';
      document.body.appendChild(w);
      const done=v=>{w.remove();resolve(v);};
      w.querySelector('[data-retry]').addEventListener('click',()=>done(true));
      w.querySelector('[data-loc]').addEventListener('click',()=>done(false));
      w.querySelector('[data-retry]').focus();
    });
  }
  function markLocal(){
    if(document.getElementById('pb-local')) return;
    const b=document.createElement('div');b.id='pb-local';
    b.style.cssText='position:fixed;left:0;right:0;bottom:0;z-index:99998;background:#8a5a00;color:#fff;padding:8px 14px;font:13.5px/1.35 system-ui,sans-serif;display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;text-align:center';
    b.innerHTML='<span>Modo local: os dados ficam só neste navegador e <b>não são salvos no servidor</b>.</span><button type="button" style="border:1px solid #fff;background:transparent;color:#fff;border-radius:7px;padding:3px 10px;font:inherit;font-weight:600;cursor:pointer">Reconectar</button>';
    b.querySelector('button').addEventListener('click',()=>location.reload());
    document.body.appendChild(b);
  }
  async function connect(){
    if(!URL_BASE) return null;
    readAuth();
    for(;;){
      if(!(await alive())){if(await offlineDialog()) continue;markLocal();return null;}
      try{
        let ok=false;
        if(token){
          try{const r=await raw('POST','/api/collections/'+col+'/auth-refresh');token=r.token;email=(r.record&&(r.record.email||r.record.username))||email;saveAuth();ok=true;}
          catch(e){if(e.status!==401&&e.status!==403&&e.status!==404) throw e; clearAuth();}
        }
        if(!ok&&!(await login())){markLocal();return null;}
        return {doc,collection,centi,tarefas};
      }catch(e){
        if(await offlineDialog()) continue;
        markLocal();return null;
      }
    }
  }
  return {connect,centi,logout(){clearAuth();location.reload();},get email(){return email;},get nome(){return centi.nome;},get userId(){return userId();},url:URL_BASE};
})();

/* ---------- tratamento dos dados ---------- */
const MIN=new Set(['de','da','do','das','dos','e','a','o']);
const ROMAN=/^(i|ii|iii|iv|v|vi|vii|viii|ix|x)$/i;
function titulo(s){
  return String(s||'').toLowerCase().replace(/\s+/g,' ').trim().split(' ').map((w,i)=>{
    if(ROMAN.test(w)&&i>0) return w.toUpperCase();
    if(MIN.has(w)&&i>0) return w;
    return w.replace(/(^|[-\/(])(\p{L})/gu,(m,a,b)=>a+b.toUpperCase());
  }).join(' ');
}
function vinculo(t){
  const n=norm(t);
  if(/nao comission/.test(n)||n.includes('admissao anterior')||n.includes('admissao entre')) return 'ant';   // "(NÃO COMISSIONADO)" não é comissionado
  if(n.includes('comission')) return 'com';
  if(n.includes('efetivo')) return 'efe';
  if(n.includes('disposi')) return 'ced';
  if(n.includes('pension')) return 'pen';
  if(n.includes('admissao')) return 'ant';
  return 'com';
}
const VINC={com:'Comissionado',efe:'Efetivo',ced:'Cedido',ant:'Adm. anterior a 1988',pen:'Pensionista'};
function nivel(cargo){
  const c=norm(cargo);
  if(/procurador|diretor|gerente|chefe do|ouvidor|supervisor|assessor- ?chefe|assessor-chefe/.test(c)) return 0;
  if(/assessor/.test(c)) return 1;
  if(/analista/.test(c)) return 2;
  return 3;
}
const NIVEIS=['Direção e chefia','Assessoria','Análise e técnica','Apoio e operacional'];
function grupoInfo(h){
  const n=norm(h);
  if(n==='setor administrativo') return {k:'setor',nome:'Setor Administrativo',ramo:0,sort:'0'};
  const m=/^vereador(a)?\s+(.+)$/.exec(n);
  if(m){const nm=titulo(String(h).replace(/^vereador(a)?\s+/i,''));return {k:'g:'+n,nome:'Gabinete '+(m[1]?'da Vereadora ':'do Vereador ')+nm,curto:nm,ramo:1,sort:norm(nm)};}
  return {k:'o:'+n,nome:titulo(h),ramo:0,sort:'1'+norm(h)};
}
function decodificar(buf){
  try{return new TextDecoder('utf-8',{fatal:true}).decode(buf);}catch(e){return new TextDecoder('windows-1252').decode(buf);}
}
function lerCsv(texto){
  texto=texto.replace(/^﻿/,'');
  const linhas=texto.split(/\r?\n/).filter(l=>l.trim());
  if(linhas.length<2) throw new Error('A planilha está vazia.');
  const sep=(linhas[0].match(/;/g)||[]).length>=(linhas[0].match(/,/g)||[]).length?';':',';
  const cab=linhas[0].split(sep).map(norm);
  const ix=nome=>cab.findIndex(c=>c===nome||c.startsWith(nome));
  const iN=ix('nome'),iC=ix('cargo'),iT=ix('tipo'),iH=ix('hierarquia'),iS=ix('salario');
  if(iN<0||iC<0||iH<0) throw new Error('Não encontrei as colunas Nome, Cargo e Hierarquia.');
  const rows=[];
  linhas.slice(1).forEach(l=>{
    const c=l.split(sep).map(x=>x.trim());
    if(!c[iN]) return;
    const sal=iS>=0?parseFloat(String(c[iS]||'').replace(/\./g,'').replace(',','.')):NaN;
    rows.push({n:c[iN],c:c[iC]||'',t:iT>=0?c[iT]||'':'',g:c[iH]||'',s:isNaN(sal)?0:sal});
  });
  // a posição de cada pessoa na ordem hierárquica (do maior para o menor cargo) é guardada; os valores de salário e a matrícula não são guardados
  rows.sort((a,b)=>b.s-a.s||a.n.localeCompare(b.n,'pt-BR'));
  return rows.map((r,i)=>({n:titulo(r.n),c:titulo(r.c),t:vinculo(r.t),g:r.g,o:i}));
}

function agrupar(){
  const grupos=new Map();
  dados.pessoas.forEach(p=>{
    const g=grupoInfo(p.g);
    if(!grupos.has(g.k)) grupos.set(g.k,Object.assign({pessoas:[],raw:g.k==='setor'?'Setor Administrativo':String(p.g).trim()},g));
    grupos.get(g.k).pessoas.push(p);
  });
  const lista=[...grupos.values()];
  lista.forEach(g=>g.pessoas.sort((a,b)=>a.o-b.o));
  lista.sort((a,b)=>a.ramo-b.ramo||a.sort.localeCompare(b.sort));
  return lista;
}

const CAMPOS={
  n:['Nome',['nome','nomefunc','nomefuncionario','nomeservidor','nomecompleto','funcionario','servidor']],
  c:['Cargo',['cargo','nomecargo','descricaocargo','funcao']],
  t:['Vínculo (comissionado, efetivo…)',['tipoadm','tipoadmissao','vinculo','tipovinculo','regime','categoria','tipofuncionario','tipo']],
  g:['Lotação / gabinete',['hierarquia','lotacao','departamento','setor','unidade','localtrabalho','secretaria','centrocusto']],
  m:['Matrícula',['matricula','registro','codigo']],
  a:['Data de admissão',['dataadmissao','admissao','datainicio']],
  s:['Situação (ativo, demitido…)',['situacao','situacaofuncional','status','ativo']],
  d:['Data de demissão',['datademissao','datarescisao','datadesligamento','datasaida']],
  e:['E-mail',['email','emailcorporativo','emailpessoal']],
  f:['Telefone',['telefones','celular','telefone','fone']],
  x:['Referência (mês/ano da folha)',['referencia','competencia','mesreferencia','mesano','anomes','anomesreferencia','ref']],
  r:['Salário (só para ordenar a hierarquia; não é guardado)',['salario','salariobase','vencimento','remuneracao']]
};
let bruto=null;
function achatar(o,pre,out,d){
  Object.keys(o||{}).forEach(k=>{const v=o[k],p=pre?pre+'.'+k:k;
    if(v&&typeof v==='object'){if(!Array.isArray(v)&&d<3) achatar(v,p,out,d+1);}else out[p]=v;});
  return out;
}
const nk=k=>norm(k).replace(/[^a-z0-9.]/g,'');
function autoMapa(f){
  const ks=Object.keys(f),campos={};
  Object.keys(CAMPOS).forEach(c=>{
    for(const cand of CAMPOS[c][1]){
      const hit=ks.find(k=>nk(k)===cand||nk(k).split('.').pop()===cand)||ks.find(k=>nk(k).startsWith(cand+'.')&&/(^|\.)(nome|descricao|name)$/.test(nk(k)));
      if(hit){campos[c]=hit;break;}
    }
  });
  return {campos};
}
function dataIso(v){
  if(v==null||v==='') return '';
  const s=String(v).trim();let m;
  if((m=/\/Date\((-?\d+)/.exec(s))) return new Date(+m[1]).toISOString().slice(0,10);
  if((m=/^(\d{4})-(\d{2})-(\d{2})/.exec(s))) return m[0];
  if((m=/^(\d{2})\/(\d{2})\/(\d{4})/.exec(s))) return m[3]+'-'+m[2]+'-'+m[1];
  return '';
}
function refNum(v){   /* "10/2026", "2026-10", "10-2026", "202610", "/Date()/"... -> 202610 */
  if(v==null||v==='') return 0;const s=String(v).trim();let m;
  if((m=/^(\d{1,2})[\/-](\d{4})/.exec(s))) return +m[2]*100+ +m[1];
  if((m=/^(\d{4})[\/-](\d{1,2})/.exec(s))) return +m[1]*100+ +m[2];
  if((m=/^(\d{4})(\d{2})$/.exec(s))) return +m[1]*100+ +m[2];
  const d=dataIso(s);return d?+d.slice(0,4)*100+ +d.slice(5,7):0;
}
const refAtual=()=>{const d=new Date();return String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear();};
const INATIVO=/demit|deslig|rescis|exonera|inativ|aposent|falec|encerr/;
function converter(lista,mapa){
  const hoje=new Date().toISOString().slice(0,10),P=[];let ign=0,semHier=0;
  /* o Centi guarda uma linha por servidor em cada referência: fica só a da referência pedida e, se ainda sobrar mais de uma
     por pessoa, a mais recente (maior referência, depois maior Id) */
  const alvo=refNum(mapa.ref||refAtual()),melhor=new Map();let semRef=0;
  lista.forEach(rec=>{
    const f=achatar(rec,'',{},0),c=mapa.campos,x=c.x?refNum(f[c.x]):0;
    if(c.x&&alvo&&x&&x!==alvo){semRef++;return;}
    const k=String((c.m&&f[c.m])||f[c.n]||'').trim().toLowerCase()+'|'+String(f[c.n]||'').trim().toLowerCase();
    const id=+(f.Id||f.id||0),ant=melhor.get(k);
    if(!ant||x>ant.x||(x===ant.x&&id>ant.id)) melhor.set(k,{rec,x,id});
  });
  const unicos=[...melhor.values()].map(e=>e.rec);ign+=semRef;
  unicos.forEach(rec=>{
    const f=achatar(rec,'',{},0),v=k=>{const c=mapa.campos[k];const x=c?f[c]:'';return x==null?'':String(x).trim();};
    const nome=v('n');
    const sit=mapa.campos.s?f[mapa.campos.s]:null,dem=dataIso(v('d'));
    const inativo=(sit===false||(typeof sit==='string'&&sit.trim()&&!/^ativ/.test(norm(sit)))||/^(0|false|nao|n)$/i.test(String(sit==null?'':sit).trim())||INATIVO.test(norm(sit)))||(dem&&dem<=hoje);
    if(!nome||inativo){ign++;return;}
    if(mapa.campos.g&&!v('g')){semHier++;return;}
    const sal=parseFloat(String(v('r')).replace(/\./g,'').replace(',','.'));
    const lot=v('g').replace(/^gabinete\s+(d[oa]s?\s+)?/i,'')||'Sem lotação';
    const p={n:titulo(nome),c:titulo(v('c')),t:vinculo(v('t')),g:lot,_s:isNaN(sal)?0:sal};
    const m=v('m'),a=dataIso(v('a')),e=v('e'),tel=v('f');
    if(m) p.m=m;if(a) p.a=a;if(e) p.e=e.toLowerCase();if(tel) p.f=tel;
    if(mapa.campos.s&&typeof sit!=='boolean'&&v('s')) p.s=titulo(v('s'));
    P.push(p);
  });
  P.sort((a,b)=>b._s-a._s||a.n.localeCompare(b.n,'pt-BR'));
  P.forEach((p,i)=>{p.o=i;delete p._s;});
  return {pessoas:P,ign,semHier,total:lista.length};
}
async function garantirSessao(){
  if(PB.centi.user) return true;
  const h=await PB.connect();if(h&&!dbh) dbh=h;
  return !!PB.centi.user;
}
async function sincronizar(ref){
  try{
    if(!(await garantirSessao())){toast('Entre com o acesso do Centi para buscar os dados.');return;}
    const salvo=dados&&dados.mapa&&dados.mapa.v===3?dados.mapa:null;   // mapeamentos de versões antigas são refeitos
    ref=ref||(salvo&&salvo.ref)||refAtual();
    const m=/^(\d{2})\/(\d{4})$/.exec(ref);if(!m){toast('Informe a referência no formato MM/AAAA.');return;}
    toast('Buscando no Centi (referência '+ref+')…');
    const r=await PB.centi.cubo(+m[1],+m[2]);
    bruto=r.Data||[];bruto.total=r.Total;
    if(!bruto.length){toast('O Centi não devolveu servidores ativos na referência '+ref+'.');return;}
    const mapa=Object.assign({},salvo||autoMapa(achatar(bruto[0],'',{},0)),{ref,v:3});
    if(!mapa.campos.n){toast('Não identifiquei o campo do nome. Escolha os campos abaixo.');return dlgCampos(mapa);}
    aplicarCenti(mapa);
  }catch(e){toast(e.status===401?'A sessão do Centi expirou. Clique em Atualizar do Centi para entrar de novo.':'Não foi possível buscar no Centi: '+(e.message||e));}
}
function aplicarCenti(mapa){
  const r=converter(bruto,mapa);
  if(!r.pessoas.length){toast('Nenhum servidor ativo encontrado com estes campos.');return dlgCampos(mapa);}
  dados={v:2,importado:new Date().toISOString(),fonte:'Centi',mapa:Object.assign({v:3},mapa),ignorados:r.ign,semHierarquia:r.semHier,pessoas:r.pessoas};hist=[];
  salvar();render();
  toast(r.pessoas.length+' servidores ativos na referência '+mapa.ref+'.'+(r.semHier?' '+r.semHier+' sem hierarquia (agentes políticos) ficaram de fora.':''));

async function dlgCampos(mapa){

  abrirDlg(`<h3>Campos do Centi</h3><p>Fonte: Cubo funcionário (FP051) do Centi. Escolha qual campo alimenta cada informação. Os exemplos vêm do primeiro registro. ${dados&&dados.editado?'<b>Aplicar recria a hierarquia e descarta as edições manuais.</b>':''}</p>
    <label>Referência (mês/ano)<input name="ref" required pattern="\\d{2}/\\d{4}" value="${esc(m.ref||refAtual())}"></label>
    ${Object.keys(CAMPOS).map(sel).join('')}
    <div class="row"><button type="button" class="btn" data-x>Cancelar</button><button class="btn primary" type="submit">Aplicar</button></div>`,
  fm=>{

async function sincronizarSemAplicar(){

function montar(filtroTexto,filtroVinc){
  const q=norm(filtroTexto);
  return agrupar().map(g=>{
    const ok=p=>(!filtroVinc||p.t===filtroVinc)&&(!q||norm(p.n+' '+p.c+' '+g.nome+' '+(p.m||'')).includes(q));
    return Object.assign({},g,{visiveis:g.pessoas.filter(ok)});
  }).filter(g=>g.visiveis.length);
}
function iniciais(n){const p=n.split(' ').filter(w=>!MIN.has(w.toLowerCase()));return ((p[0]||'')[0]||'')+((p.length>1?p[p.length-1][0]:'')||'');}
function dataBr(iso){const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(iso||'');return m?m[3]+'/'+m[2]+'/'+m[1]:'';}
function metaPessoa(p){const a=[p.m?'Mat. '+p.m:'',p.a?'Admissão '+dataBr(p.a):''].filter(Boolean);return a.length?`<small class="pm">${esc(a.join(' · '))}</small>`:'';}

dv.addEventListener('dragend',()=>{dv.querySelectorAll('.dragging,.over').forEach(x=>x.classList.remove('dragging','over'));clearTimeout(abrirT);});
dv.addEventListener('dragover',e=>{
  const g=e.target.closest('details.grp');if(!g) return;
  e.preventDefault();e.dataTransfer.dropEffect='move';
  if(!g.classList.contains('over')){dv.querySelectorAll('.over').forEach(x=>x.classList.remove('over'));g.classList.add('over');clearTimeout(abrirT);if(!g.open) abrirT=setTimeout(()=>{g.open=true;},600);}
});
dv.addEventListener('drop',e=>{
  const g=e.target.closest('details.grp');if(!g) return;
  e.preventDefault();const i=e.dataTransfer.getData('text/plain');
  dv.querySelectorAll('.over,.dragging').forEach(x=>x.classList.remove('over','dragging'));clearTimeout(abrirT);
  if(i!=='') moverPara(+i,g.dataset.raw);
});
$('#expBtn').addEventListener('click',()=>{allOpen=!allOpen;$('#expBtn').textContent=allOpen?'Recolher tudo':'Expandir tudo';render();});
$('#q').addEventListener('input',render);$('#ft').addEventListener('change',render);
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',themeBtn);new MutationObserver(themeBtn).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});}catch(e){}

(function init(){
  try{const d=JSON.parse(localStorage.getItem(LS)||'null');if(d&&Array.isArray(d.pessoas)) dados=d;}catch(e){}
  themeBtn();render();
  (async()=>{
    try{
      if(window.claude&&window.claude.use) dbh=await window.claude.use('db');
      if(!dbh) dbh=await PB.connect();
      if(dbh){
        const s=await dbh.doc('pessoal/dados').get();
        if(s.exists){try{const d=JSON.parse(s.data().json);if(d&&Array.isArray(d.pessoas)){dados=d;render();}}catch(e){}}
        else if(dados){
          await dbh.doc('pessoal/dados').set({json:JSON.stringify(dados)});
          const v=await dbh.doc('pessoal/dados').get();
          if(v.exists){try{localStorage.removeItem(LS);}catch(e){}toast('Dados deste navegador enviados ao servidor.');}
        }
      }
    }catch(e){dbh=null;}
  })();
})();
</script>
