/* ---------- indicadores: cálculo ---------- */
const mkey=(y,m)=>y+'-'+String(m).padStart(2,'0');
function kpiPeriods(k,year,view){
  if(view==='mensal') return MESES.map((_,i)=>{const v=k.vals[mkey(year,i+1)];return v===''||v==null?null:Number(v);});
  return [0,1,2,3].map(q=>{
    const vs=[1,2,3].map(j=>k.vals[mkey(year,q*3+j)]).filter(v=>v!==''&&v!=null).map(Number);
    if(!vs.length) return null;
    const s=vs.reduce((a,b)=>a+b,0);
    return k.tipo==='pct'?Math.round(s/vs.length*10)/10:s;
  });
}
function kpiLatest(k,year){
  for(let m=12;m>=1;m--){const v=k.vals[mkey(year,m)];if(v!==''&&v!=null) return {m,v:Number(v)};}
  return null;
}
function kpiOk(k,v){
  if(v==null||k.meta===''||k.meta==null) return null;
  return k.dir==='maior'?v>=Number(k.meta):v<=Number(k.meta);
}
const fmtKpi=(k,v)=>v==null?'—':fnum(v)+(k.tipo==='pct'?'%':'');
function kpiTag(k,v){
  const ok=kpiOk(k,v);
  return ok==null?'<span class="tag">Sem meta</span>':ok?'<span class="tag ok">Meta atingida</span>':'<span class="tag bad">Fora da meta</span>';
}
function niceMax(v){
  const p=Math.pow(10,Math.floor(Math.log10(v))),n=v/p;
  return (n<=1?1:n<=2?2:n<=5?5:10)*p;
}
function chartSvg(k,year,view){
  const vals=kpiPeriods(k,year,view),labels=view==='mensal'?MESES:['T1','T2','T3','T4'];
  const W=720,H=290,L=48,R=16,T=20,B=34,pw=W-L-R,ph=H-T-B,n=vals.length;
  const meta=k.meta===''||k.meta==null?null:Number(k.meta);
  let max=Math.max(k.tipo==='pct'?100:0,...vals.filter(v=>v!=null),meta||0);
  if(max<=0) max=1; max=niceMax(max);
  const y=v=>T+ph*(1-v/max);
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(k.nome)}, ${year}">`;
  for(let i=0;i<=4;i++){
    const v=max/4*i,yy=y(v);
    s+=`<line class="ax" x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}"/><text x="${L-7}" y="${yy+4}" text-anchor="end">${fnum(v)}</text>`;
  }
  const bw=Math.min(40,pw/n*0.58);
  vals.forEach((v,i)=>{
    const cx=L+(i+0.5)*pw/n;
    s+=`<text x="${cx}" y="${H-12}" text-anchor="middle">${labels[i]}</text>`;
    if(v==null) return;
    const bad=kpiOk(k,v)===false,yy=y(v);
    s+=`<rect class="bar${bad?' bad':''}" x="${cx-bw/2}" y="${yy}" width="${bw}" height="${Math.max(1,T+ph-yy)}" rx="2"/><text class="val" x="${cx}" y="${yy-5}" text-anchor="middle">${fnum(v)}</text>`;
  });
  if(meta!=null) s+=`<line class="meta" x1="${L}" x2="${W-R}" y1="${y(meta)}" y2="${y(meta)}"/><text x="${W-R}" y="${y(meta)-5}" text-anchor="end" style="fill:var(--danger);font-weight:600">Meta ${fnum(meta)}</text>`;
  return s+'</svg>';
}

function deleteUnit(id){
  const u=U(id); if(!u) return;

    state.units=state.units.filter(x=>x.id!==id);
    const gone=state.org.nodes.filter(n=>n.unitId===id).map(n=>n.id);
    state.org.nodes=state.org.nodes.filter(n=>n.unitId!==id);
    state.org.edges=state.org.edges.filter(e=>!gone.includes(e.from)&&!gone.includes(e.to));

/* ---------- Manual ---------- */
function richHtml(text){
  const out=[];let list=null;
  const close=()=>{if(list){out.push(`</${list}>`);list=null;}};
  String(text||'').split(/\r?\n/).forEach(line=>{
    let m;
    if(!line.trim()){close();return;}
    if((m=/^#\s+(.*)/.exec(line))){close();out.push(`<h4>${esc(m[1])}</h4>`);}
    else if((m=/^\s*[-*]\s+(.*)/.exec(line))){if(list!=='ul'){close();out.push('<ul>');list='ul';}out.push(`<li>${esc(m[1])}</li>`);}
    else if((m=/^(\d+)\.\s+(.*)/.exec(line))){if(list!=='ol'){close();out.push('<ol>');list='ol';}out.push(`<li>${esc(m[2])}</li>`);}
    else{close();out.push(`<p>${esc(line)}</p>`);}
  });
  close(); return out.join('');
}

$('#fileIn').addEventListener('change',ev=>{
  const file=ev.target.files&&ev.target.files[0]; if(!file) return;
  const r=new FileReader();
  r.onload=()=>{
    const d=parseState(String(r.result));
    if(!d){toast('Arquivo inválido. Use um JSON exportado por este sistema.');return;}
    destructive('Dados importados.',()=>{state=d;});afterRestore();
  };
  r.onerror=()=>toast('Não foi possível ler o arquivo.');
  r.readAsText(file); ev.target.value='';
});

function onTheme(){
  themeBtn();
  if(curEd) curEd.api.theme();
  if(ui.page==='home') rr();
}
try{
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change',onTheme);
  new MutationObserver(onTheme).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
}catch(e){}

function init(){
  try{const s=localStorage.getItem(TEMA_KEY);document.documentElement.setAttribute('data-theme',s==='dark'?'dark':'light');}catch(e){document.documentElement.setAttribute('data-theme','light');}
  state=buildDefault(); layoutAll(state);
  buildShell(); renderPage(); setStatus('load'); themeBtn();
  const h=(location.hash||'').replace('#','');
  if(NAV.some(n=>n.k===h)) go(h);
  (async()=>{
    try{if(window.claude&&window.claude.use) window.__dl=await window.claude.use('downloads');}catch(e){}
    try{if(window.claude&&window.claude.use) dbh=await window.claude.use('db');}catch(e){dbh=null;}
    if(!dbh) dbh=await PB.connect();
    let loaded=null,readOk=false,remote=false;
    try{if(dbh){const s=await dbh.doc('rh/estado').get();readOk=true;if(s.exists){const d=s.data();loaded=parseState(d&&d.json);remote=!!loaded;}}}catch(e){}
    if(!loaded){try{loaded=parseState(localStorage.getItem(LS_STATE));}catch(e){}}
    if(loaded&&!touched){state=loaded;afterRestore();}
    setStatus(dbh?'ok':'local');
    if(dbh&&readOk&&!remote&&loaded) migrateLocal();
  })();
}
init();

const VOL_MOTIF='<svg class="motif" viewBox="0 0 400 400" fill="none" stroke="#fff" stroke-width="2.2"><rect x="150" y="20" width="100" height="46" rx="6"/><path d="M200 66v40M70 106h260M70 106v40M200 106v40M330 106v40"/><rect x="20" y="146" width="100" height="46" rx="6"/><rect x="150" y="146" width="100" height="46" rx="6"/><rect x="280" y="146" width="100" height="46" rx="6"/><path d="M70 192v40M200 192v40M330 192v40M30 232h80M160 232h80M290 232h80"/><rect x="20" y="232" width="100" height="46" rx="6"/><rect x="150" y="232" width="100" height="46" rx="6"/><rect x="280" y="232" width="100" height="46" rx="6"/></svg>';
const VOL_PW=172,VOL_PH=208,VOL_LW=259,VOL_LH=138;

/* Posições livres de corte: o meio de cada vão entre os blocos e rótulos do desenho. */
function volGaps(ranges){
  const rs=ranges.slice().sort((a,b)=>a[0]-b[0]),m=[];
  rs.forEach(r=>{if(m.length&&r[0]<=m[m.length-1][1]) m[m.length-1][1]=Math.max(m[m.length-1][1],r[1]); else m.push([r[0],r[1]]);});
  const gaps=[];for(let i=0;i<m.length-1;i++) gaps.push((m[i][1]+m[i+1][0])/2);
  return gaps;
}
/* Escolhe os S-1 cortes: cada faixa precisa caber na altura da página (maxH) e o corte vai para o vão livre mais próximo da divisão igual. */
function volCuts(d,S,maxH){
  const gaps=volGaps(d.ranges),cuts=[0];let ok=true;
  for(let i=1;i<S;i++){
    const prev=cuts[i-1],lo=Math.max(prev+1,d.h-(S-i)*maxH),hi=prev+maxH,target=d.h*i/S;
    let best=null;
    gaps.forEach(c=>{if(c>=lo&&c<=hi&&(best===null||Math.abs(c-target)<Math.abs(best-target))) best=c;});
    if(best===null){ok=false;best=Math.min(hi,Math.max(lo,target));}
    cuts.push(best);
  }
  cuts.push(d.h);
  if(d.h-cuts[S-1]>maxH+0.01) ok=false;
  return {cuts,ok};
}
function volPlan(d){
  let best=null;
  [[false,VOL_PW,VOL_PH],[true,VOL_LW,VOL_LH]].forEach(([rot,aw,ah])=>{
    for(let P=1;P<=3;P++) for(let K=1;K<=3;K++){
      const S=P*K; if(S>4) continue;
      const colw=(aw-6*(K-1))/K, s=Math.min(colw/d.w,ah/(d.h/S));
      const score=Math.min(s,0.30)-0.02*(P-1)-0.01*(K-1);
      if(!best||score>best.score) best={score,s,rot,P,K,ah};
    }
  });
  const S=best.P*best.K;let s=best.s,r=volCuts(d,S,best.ah/s);
  // sem vão livre que respeite a página: reduz um pouco a escala até os cortes caírem em espaços vazios
  for(let n=0;n<12&&!r.ok;n++){s*=0.96;r=volCuts(d,S,best.ah/s);}
  return {scale:s,rot:best.rot,P:best.P,K:best.K,cuts:r.cuts};
}
function volStrip(d,y0,y1,wmm,hmm){
  const h=y1-y0;
  let s=d.svg.replace(/<svg ([^>]*?)width="\d+" height="\d+" viewBox="[^"]*"/,(m,a)=>`<svg ${a}width="${wmm.toFixed(2)}mm" height="${hmm.toFixed(2)}mm" viewBox="0 ${y0.toFixed(1)} ${d.w} ${h.toFixed(1)}"`);
  return s.replace('<rect width="100%" height="100%"',`<rect x="0" y="${y0.toFixed(1)}" width="${d.w}" height="${h.toFixed(1)}"`);
}
function volFigPages(i,d){
  const pl=d.plan,S=pl.P*pl.K,out=[];
  for(let pi=0;pi<pl.P;pi++){
    let cols='';
    for(let ki=0;ki<pl.K;ki++){
      const si=pi*pl.K+ki,y0=pl.cuts[si],y1=pl.cuts[si+1];
      cols+=`<div class="col">${volStrip(d,y0,y1,d.w*pl.scale,(y1-y0)*pl.scale)}${si<S-1?'<div class="cont">continua na página seguinte ›</div>':''}</div>`;
    }
    const head=pi===0?`<div class="fh"><div class="kick" id="f${i}">Fluxograma ${i+1}</div><h2>${esc(d.t)}</h2><div class="sub">${esc(d.page)}${d.desc?' · '+esc(d.desc):''}</div></div>`:'';
    out.push(`<section class="fpg${pl.rot?' land':''}">${head}<div class="figs" style="gap:6mm">${cols}</div></section>`);
  }
  return out;
}
function volData(st){
  const pal=SP.light,out=[];
  const add=(t,page,desc,doc,kind,mid)=>{
    const sc=sceneStandalone(doc,kind,pal,{units:st.units,title:'',mid});
    const bb=sceneBBox(doc,kind,st.units);
    const ranges=doc.nodes.map(n=>{const s=nodeSize(n,kind,st.units),y=(n.y||0)-bb.y+36;return [y,y+s.h];});
    // os rótulos das setas (Sim/Não) também são áreas livres de corte, para não saírem partidos entre as páginas
    if(kind==='flow'){
      const byId=new Map(doc.nodes.map(n=>[n.id,n]));
      doc.edges.forEach(e=>{
        const A=byId.get(e.from),B=byId.get(e.to); if(!(A&&B&&e.l)) return;
        const g=edgeGeom(A,B,nodeSize(A,kind,st.units),nodeSize(B,kind,st.units),kind),y=g.ly-bb.y+36;
        ranges.push([y-14,y+14]);
      });
    }
    const d={t,page,desc,svg:sc.svg,w:sc.w,h:sc.h,ranges};d.plan=volPlan(d);out.push(d);
  };
  add('Organograma do RH','Organograma','Estrutura do Departamento de Recursos Humanos.',st.org,'org','vo');
  Object.keys(PAGES_FLOW).forEach(k=>st.flows.filter(f=>f.page===k).forEach(f=>add(f.nome,PAGES_FLOW[k],f.desc||'',f,'flow','vf'+out.length)));
  const ld={nodes:Object.keys(TIPOS_FLUXO).map((k,i)=>nd('l'+i,k,TIPOS_FLUXO[k],'',{x:(i%4)*275,y:Math.floor(i/4)*115})),edges:[]};
  const ru=st.units.filter(u=>!u.externa);
  const ud={nodes:ru.map((u,i)=>nd('u'+i,'proc',u.nome,u.id,{x:(i%3)*290,y:Math.floor(i/3)*95})),edges:[]};
  return {figs:out,leg1:sceneStandalone(ld,'flow',pal,{units:st.units,title:'',mid:'vl1'}).svg,leg2:sceneStandalone(ud,'flow',pal,{units:st.units,title:'',mid:'vl2'}).svg};
}

  const script=`

  if(document.fonts&&document.fonts.ready) document.fonts.ready.then(run); else run();
  window.addEventListener('beforeprint',run);

  return `<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<section class="cover">${VOL_MOTIF}<div class="in"><div class="org">${esc(inst.orgao)}</div><div class="rule"></div><h1>Fluxogramas e Manual de Procedimentos</h1><p>Departamento de Recursos Humanos</p><p style="margin-top:3mm;font-size:11pt;opacity:.75">${esc(inst.sub)}</p></div><div class="foot"><span>${esc(inst.nome)}</span><span>Edição de ${data}</span></div></section>

async function gerarVolume(){
  toast('Preparando o volume…');
  await new Promise(r=>setTimeout(r,30));
  let html;
  try{html=volumeHtml(state);}catch(e){toast('Não foi possível montar o volume.');return;}
  const nome='volume-fluxogramas-e-manual-rh.html';
  if(window.claude){
    // visualização restrita: entrega o arquivo para abrir no navegador e salvar como PDF
    const ok=await saveFile(nome,html,'text/html');
    if(ok) toast('Arquivo salvo. Abra-o no Chrome e use "Imprimir / Salvar como PDF".');
    return;
  }
  const url=URL.createObjectURL(new Blob([html],{type:'text/html'}));
  const w=window.open(url,'_blank');
  if(!w){await saveFile(nome,html,'text/html');toast('Arquivo salvo. Abra-o no navegador e use "Imprimir / Salvar como PDF".');}
  else setTimeout(()=>URL.revokeObjectURL(url),120000);
}
