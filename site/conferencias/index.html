<script>
/* =====================================================================
   PocketBase: armazenamento no servidor (substitui o localStorage)
   Expõe PB.connect(), que devolve um objeto "dbh" com a mesma forma
   usada pelo restante do sistema: dbh.doc('a/b').get/set/delete e
   dbh.collection('versoes').orderBy('at','desc').limit(n).get()
   ===================================================================== */
const PB=(function(){
  const URL_BASE='https://pb.devgabriel.app.br'.replace(/\/+$/,'');
  const CENTI_BASE=''.replace(/\/+$/,'');   // vazio = mesmo endereço do site (funções em /api)
  const AUTH_KEY='rhcrv-pb-auth';
  let token='',email='',col='rhcmrv_users',loginP=null;
  let cs=null;   // sessão do Centi: {user,nome,token,refreshToken}

  /* só vale a sessão que tem o acesso do Centi junto e a marca de admin; sessões antigas (login simples ou sem a marca) pedem novo login */
  function readAuth(){try{const a=JSON.parse(localStorage.getItem(AUTH_KEY)||'null');if(a&&a.token&&a.centi&&a.centi.token&&typeof a.centi.admin==='boolean'){token=a.token;email=a.email||'';col=a.col||'rhcmrv_users';cs=a.centi;}}catch(e){}}
  function saveAuth(){try{localStorage.setItem(AUTH_KEY,JSON.stringify({token,email,col,centi:cs}));}catch(e){}}
  function clearAuth(){token='';email='';col='rhcmrv_users';cs=null;try{localStorage.removeItem(AUTH_KEY);}catch(e){}}

  async function raw(method,path,body){
    const h={};
    if(body!==undefined) h['Content-Type']='application/json';
    if(token) h.Authorization=token;
    const r=await fetch(URL_BASE+path,{method,headers:h,body:body===undefined?undefined:JSON.stringify(body)});
    if(r.status===204) return null;
    let j=null; try{j=await r.json();}catch(e){}
    if(!r.ok){const err=new Error((j&&j.message)||('HTTP '+r.status));err.status=r.status;throw err;}
    return j;
  }
  async function api(method,path,body){

  }

  function loginCss(){

  function login(msg){
    if(loginP) return loginP;
    loginP=new Promise(resolve=>{
      loginCss();
      const wrap=document.createElement('div');wrap.className='pbl';
      wrap.innerHTML=
        '<form class="pbl-card" autocomplete="on" novalidate>'+
        '<div class="pbl-logo">'+ico('bank',28)+'</div>'+
        '<p class="pbl-org">Câmara Municipal de Rio Verde/GO</p>'+

        '<label class="pbl-f"><span>Usuário</span><div class="pbl-in">'+ico('user')+'<input name="e" type="text" required autocapitalize="none" autocorrect="off" spellcheck="false" autocomplete="username" placeholder="ex.: nome.sobrenome"></div></label>'+
        '<label class="pbl-f"><span>Senha</span><div class="pbl-in">'+ico('lock')+'<input name="p" type="password" required autocomplete="current-password" placeholder="Sua senha do Centi"><button type="button" class="pbl-eye" data-eye aria-label="Mostrar a senha" aria-pressed="false">'+ico('eye')+'</button></div></label>'+
        '<div class="pbl-err" data-err role="alert" aria-live="polite"></div>'+

        '<p class="pbl-foot">'+ico('lock',14)+'<span>A senha é conferida no Centi e não fica guardada neste sistema.</span></p></form>';
      document.body.appendChild(wrap);
      const f=wrap.querySelector('form'),err=wrap.querySelector('[data-err]'),go=wrap.querySelector('.pbl-go'),eye=wrap.querySelector('[data-eye]');
      const erro=(t,info)=>{err.className='pbl-err'+(info?' info':'');err.innerHTML=t?ico('alert',16)+'<span></span>':'';if(t) err.lastChild.textContent=t;};
      const ocupado=on=>{go.disabled=on;go.innerHTML=on?'<i class="pbl-sp"></i><span>Entrando…</span>':'<span>Entrar</span>';};
      if(msg) erro(msg,true);
      const done=ok=>{wrap.remove();loginP=null;resolve(ok);};
      f.e.focus();
      eye.addEventListener('click',()=>{const ver=f.p.type==='password';f.p.type=ver?'text':'password';eye.setAttribute('aria-pressed',ver);eye.setAttribute('aria-label',ver?'Ocultar a senha':'Mostrar a senha');eye.innerHTML=ico(ver?'eyeoff':'eye');f.p.focus();});
      f.addEventListener('submit',async ev=>{
        ev.preventDefault();
        if(!f.e.value.trim()||!f.p.value){erro('Informe o usuário e a senha do Centi.');(f.e.value.trim()?f.p:f.e).focus();return;}

        try{
          const r=await fetch(CENTI_BASE+'/api/centi-login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user:f.e.value.trim(),pass:f.p.value})});

  /* ---------- sair ---------- */
  /* botão "Sair" ao lado do botão de tema (ou no rodapé do menu dos Fluxogramas); só existe com sessão do Centi aberta */
  function logout(){clearAuth();location.reload();}
  function mountLogout(){
    if(!cs||!document.body||document.getElementById('pb-logout')) return;
    const nome=(cs.nome||cs.user||'').split(' ')[0];
    const mk=(cls,html)=>{const b=document.createElement('button');b.type='button';b.id='pb-logout';b.className=cls;b.title='Sair ('+cs.user+')';b.setAttribute('aria-label','Sair do sistema ('+cs.user+')');b.innerHTML=html;b.addEventListener('click',logout);return b;};
    const t=document.getElementById('themeBtn'),h=document.querySelector('.side-foot .homelink');
    if(t&&t.parentNode){const b=mk(t.className,ico('out',16)+'Sair');b.style.marginLeft='0';t.insertAdjacentElement('afterend',b);t.style.marginLeft='auto';}
    else if(h&&h.parentNode){const b=mk(h.className,ico('out',14)+'Sair'+(nome?' ('+nome.charAt(0).toUpperCase()+nome.slice(1).toLowerCase()+')':''));b.style.cssText='border:0;cursor:pointer;font:inherit;font-weight:600;font-size:13px;width:calc(100% + 20px);text-align:left;color:inherit';h.insertAdjacentElement('afterend',b);}
  }
  /* as páginas montam o cabeçalho em momentos diferentes: tenta de novo quando o DOM muda */
  function vigiarLogout(){
    mountLogout();
    try{const ob=new MutationObserver(()=>{if(!cs){ob.disconnect();return;}if(!document.getElementById('pb-logout')) mountLogout();});ob.observe(document.body,{childList:true,subtree:true});}catch(e){}
  }

  /* ---------- documentos ---------- */
  const ids={};   // cache de id de registro por caminho
  const esc=s=>String(s).replace(/\\/g,'\\\\').replace(/"/g,'\\"');
  const spec=path=>{
    const i=path.indexOf('/'),col=path.slice(0,i),id=path.slice(i+1);
    return col==='versoes'?{c:'rhcmrv_versoes',f:'vid',k:id}:{c:'rhcmrv_docs',f:'key',k:path};
  };
  async function find(path){
    const s=spec(path);
    const q='?perPage=1&filter='+encodeURIComponent(s.f+'="'+esc(s.k)+'"');
    const r=await api('GET','/api/collections/'+s.c+'/records'+q);
    const rec=r.items&&r.items[0];
    if(rec) ids[path]=rec.id; else delete ids[path];
    return rec||null;
  }
  const payload=(s,data)=>s.c==='rhcmrv_versoes'?Object.assign({vid:s.k},data):{key:s.k,data};
  const unwrap=(s,rec)=>s.c==='rhcmrv_versoes'?{at:rec.at,label:rec.label,json:rec.json}:rec.data;

  function doc(path){
    const s=spec(path);
    return {
      async get(){const rec=await find(path);return {exists:!!rec,id:s.k,data:()=>rec?unwrap(s,rec):undefined};},
      async set(data){
        if(!ids[path]) await find(path);
        if(ids[path]) await api('PATCH','/api/collections/'+s.c+'/records/'+ids[path],payload(s,data));
        else{const r=await api('POST','/api/collections/'+s.c+'/records',payload(s,data));ids[path]=r.id;}
      },
      async delete(){
        if(!ids[path]) await find(path);
        if(ids[path]){await api('DELETE','/api/collections/'+s.c+'/records/'+ids[path]);delete ids[path];}
      }
    };
  }
  function collection(name){
    const q={sort:'',n:30};
    const api_={
      orderBy(f,dir){q.sort=(dir==='desc'?'-':'')+f;return api_;},
      limit(n){q.n=n;return api_;},
      async get(){
        const r=await api('GET','/api/collections/rhcmrv_'+name+'/records?perPage='+q.n+(q.sort?'&sort='+encodeURIComponent(q.sort):''));
        return {docs:r.items.map(rec=>({id:rec.vid,data:()=>({at:rec.at,label:rec.label,json:rec.json})}))};
      }
    };
    return api_;
  }

  /* ---------- tarefas (coleção rhcmrv_tarefas; as regras do servidor mostram só as compartilhadas e as do próprio dono) ---------- */
  const TAREFAS='/api/collections/rhcmrv_tarefas/records';
  const userId=()=>{try{const b=token.split('.')[1].replace(/-/g,'+').replace(/_/g,'/');return JSON.parse(decodeURIComponent(escape(atob(b+'='.repeat((4-b.length%4)%4))))).id||'';}catch(e){return '';}};
  async function todas(filtro){
    let page=1,out=[];
    for(;;){
      const r=await api('GET',TAREFAS+'?perPage=200&page='+page+'&sort=-criada_em'+(filtro?'&filter='+encodeURIComponent(filtro):''));
      out=out.concat(r.items||[]);
      if(!r.totalPages||page>=r.totalPages) return out;
      page++;
    }
  }
  /* tempo real do PocketBase (SSE): cada evento só chega se as regras do servidor deixam esta conta ver a tarefa (privadas de outros não chegam) */
  function ouvirTarefas(cb){
    let es=null,parado=false;
    const abrir=()=>{
      if(parado||typeof EventSource==='undefined') return;
      es=new EventSource(URL_BASE+'/api/realtime');
      es.addEventListener('PB_CONNECT',async ev=>{
        try{
          const id=(JSON.parse(ev.data||'{}').clientId)||ev.lastEventId;
          await fetch(URL_BASE+'/api/realtime',{method:'POST',headers:{'Content-Type':'application/json',Authorization:token},body:JSON.stringify({clientId:id,subscriptions:['rhcmrv_tarefas']})});
        }catch(e){}
      });
      es.addEventListener('rhcmrv_tarefas',ev=>{try{cb(JSON.parse(ev.data));}catch(e){}});
      es.onerror=()=>{};   // o navegador reconecta sozinho e o PB_CONNECT assina de novo
    };
    abrir();
    return ()=>{parado=true;if(es) es.close();};
  }
  const tarefas={
    listen:ouvirTarefas,
    list:todas,
    create:d=>api('POST',TAREFAS,Object.assign({dono:userId()},d)),
    update:(id,d)=>api('PATCH',TAREFAS+'/'+id,d),
    remove:id=>api('DELETE',TAREFAS+'/'+id)
  };

  /* ---------- API do Centi (pelo servidor do sistema, com o acesso da própria pessoa) ---------- */
  /* Sessão do Centi inválida (token vencido sem renovação, sessão apagada ou outro login): pede o login de novo, com aviso, e repete
     a consulta uma vez. O erro só chega à tela se o login for refeito e a consulta ainda assim falhar. */
  function erroSessao(){const e=new Error('Sem sessão do Centi. Entre novamente.');e.status=401;return e;}
  async function comSessao(fn){
    try{if(!cs) throw erroSessao();return await fn();}
    catch(e){
      if(e.status!==401) throw e;
      clearAuth();
      if(!(await login('Sua sessão do Centi expirou. Entre novamente para continuar.'))) throw e;
      const b=document.getElementById('pb-logout');if(b) b.remove();vigiarLogout();   // o botão Sair passa a mostrar o usuário novo
      return fn();
    }
  }
  const centiCall=(path,body)=>comSessao(()=>centiCallUma(path,body));
  const centiPdf=(path,mes,ano,funcionario)=>comSessao(()=>centiPdfUma(path,mes,ano,funcionario));
  async function centiCallUma(path,body){
    if(!cs) throw erroSessao();
    const r=await fetch(CENTI_BASE+'/api/centi',{method:'POST',
      headers:{'Content-Type':'application/json','x-centi-user':cs.user,'x-centi-token':cs.token,'x-centi-refresh':cs.refreshToken||''},
      body:JSON.stringify({path,body})});
    const nt=r.headers.get('x-centi-token'),nr=r.headers.get('x-centi-refresh');
    if(nt){cs.token=nt;if(nr)cs.refreshToken=nr;saveAuth();}   // o Centi renova o token sozinho
    let j=null; try{j=await r.json();}catch(e){}
    if(!r.ok){
      if(r.status===401){clearAuth();}
      const err=new Error((j&&j.message)||('Centi: HTTP '+r.status));err.status=r.status;throw err;
    }
    return j;
  }
  /* consulta que o Centi entrega em PDF: a função devolve o gzip dele e o navegador abre */
  async function centiPdfUma(path,mes,ano,funcionario){
    if(!cs) throw erroSessao();
    const r=await fetch(CENTI_BASE+'/api/centi',{method:'POST',
      headers:{'Content-Type':'application/json','x-centi-user':cs.user,'x-centi-token':cs.token,'x-centi-refresh':cs.refreshToken||''},
      body:JSON.stringify({path,body:{mes,ano,funcionario:funcionario||''}})});
    const nt=r.headers.get('x-centi-token'),nr=r.headers.get('x-centi-refresh');
    if(nt){cs.token=nt;if(nr)cs.refreshToken=nr;saveAuth();}
    if(!r.ok){
      let j=null; try{j=await r.json();}catch(e){}
      if(r.status===401){clearAuth();}
      const err=new Error((j&&j.message)||('Centi: HTTP '+r.status));err.status=r.status;throw err;
    }
    if(typeof DecompressionStream==='undefined') throw new Error('Este navegador não consegue abrir o arquivo do Centi. Use um navegador mais recente.');
    return new Uint8Array(await new Response(r.body.pipeThrough(new DecompressionStream('gzip'))).arrayBuffer());
  }
  /* PB.centi.search('SFuncionario',[{FieldName:'Nome',Operation:6,Value:'%ana%'}]) -> {Data:[...],Count}
     (Operation 6 = contém; a tela de consulta do Centi exige ao menos um filtro com valor) */
  const centi={
    get user(){return cs?cs.user:'';},
    get nome(){return cs?(cs.nome||cs.user):'';},
    get admin(){return !!(cs&&cs.admin);},   // administrador do sistema (edita o painel dos mini sistemas)
    /* Cubo funcionário (FP051) do Centi na referência mes/ano -> {Data:[{MATRICULA,NOMEFUNC,CARGO,HIERARQUIA,...}],Total}; só ativos */
    /* Ficha financeira (FP024) da matrícula no mês/ano -> {Fichas:[{Folha,Mes,Ano,TotalProventos,TotalDescontos,LiquidoReceber,Eventos:[...]}]}; não é guardada */
    ficha(matricula,mes,ano){return centiCall('ficha-financeira',{matricula,mes,ano});},
    /* Férias: ativos (FP051) + gozos de férias (FP273) -> {Pessoas:[...],Gozos:[{MATRICULA,DTAQUIINI,DTAQUIFIN,SALDO,GOZOINICIAL,GOZOFINAL,...}]} */
    ferias(mes,ano){return centiCall('ferias',{mes,ano});},
    /* dia='ultimo': quem estava ativo no último dia da referência (admitidos no meio do mês); padrão: dia 1º */
    cubo(mes,ano,dia){return centiCall('cubo-funcionario',{mes,ano,dia});},
    /* Conferência de eventos: lançamentos (FP001 > Eventos) dos servidores do lote (até 60 Ids) que valem para o mês -> {Linhas:[{Servidor,Id,Evento,Codigo,Recorrencia,Inicio,Fim,Valor,Lancamento}],Truncados:[Id]} */
    /* Conferência de remuneração: fichas (FP024) das matrículas (até 40) no mês e no anterior -> {Servidores:{mat:{Atual:[ficha],Anterior:[ficha]}},Anterior:{mes,ano}}; ficha={Folha,Prov,Desc,Liq,Eventos:[{Id,Nome,P,D}]} */
    conferenciaRemuneracao(matriculas,mes,ano){return centiCall('conferencia-remuneracao',{matriculas,mes,ano});},
    conferenciaEventos(ids,mes,ano){return centiCall('conferencia-eventos',{ids,mes,ano});},
    /* Licença-prêmio: quadro de ativos (Cubo funcionário reduzido, FP245) -> {Pessoas:[{MATRICULA,NOME,SITUACAO,TIPOADMISSAO,DATAADMISSAO,LOTACAO,CARGO,TIPOAFASTAMENTO,DATAAFASTAMENTO}]} */
    licencaQuadro(mes,ano){return centiCall('licenca-quadro',{mes,ano});},
    /* Espelho de ponto (FP170) do órgão inteiro na referência mes/ano -> Uint8Array com o PDF (o Centi leva de 25 s a 1 min) */
    espelho(mes,ano,funcionario){return centiPdf('espelho-ponto',mes,ano,funcionario);},
    /* Relação de afastamentos (FP071), de 1990 até o fim da referência -> Uint8Array com o PDF; com o Id do servidor traz só ele */

/* Motor das Conferências (hoje: Determinação de eventos). Classifica cada lançamento de evento de um servidor
   (FP001 > Eventos: recorrência, data inicial e data final) em relação ao mês de referência. Não depende de tela nem de rede:
   é inserido na página pelo build.py e carregado pelos testes (tests/conferencias.test.js). Datas "DD/MM/AAAA" viram dias em UTC. */
(function(root){
const D=s=>{const m=/^(\d{2})\/(\d{2})\/(\d{4})$/.exec(String(s||'').trim());return m?Date.UTC(+m[3],+m[2]-1,+m[1]):null;};
const fmt=ms=>{if(ms==null) return '';const d=new Date(ms);return String(d.getUTCDate()).padStart(2,'0')+'/'+String(d.getUTCMonth()+1).padStart(2,'0')+'/'+d.getUTCFullYear();};
const ANO_SEM_FIM=2090;   // data final em 2099 etc. é "sem fim" na prática

const CATEGORIAS={
  indeterminada:'Indeterminada',
  determinada:'Determinada (até a data final)',
  so_mes:'Determinada só no mês',
  vence_mes:'Vence no mês',
  ate_2099:'Determinada até 2099 (sem fim na prática)',
  futura:'Começa depois do mês',
  sem_data:'Determinada sem data final'
};
const ORDEM=['sem_data','so_mes','vence_mes','determinada','futura','ate_2099','indeterminada'];

/* l: {Recorrencia:'Determinada'|'Indeterminada', Inicio, Fim}; mes/ano: referência. -> {cat, ini, fim} */
function classificar(l,mes,ano){
  const ini=D(l.Inicio),fim=D(l.Fim);
  const m0=Date.UTC(ano,mes-1,1),m1=Date.UTC(ano,mes,0);
  const o={ini,fim,cat:'determinada'};
  if(ini!=null&&ini>m1){o.cat='futura';return o;}
  if(l.Recorrencia==='Indeterminada'){o.cat='indeterminada';return o;}
  if(fim==null){o.cat='sem_data';return o;}
  if(new Date(fim).getUTCFullYear()>=ANO_SEM_FIM){o.cat='ate_2099';return o;}
  if(fim<m0){o.cat='determinada';o.vencida=true;return o;}   // não deveria vir do Centi; fica marcado
  if(ini!=null&&ini>=m0&&fim<=m1){o.cat='so_mes';return o;}
  if(fim<=m1){o.cat='vence_mes';return o;}
  return o;
}

/* resumo por evento: {chave (código ou nome), codigo, nome, total, porCat:{cat:n}} ordenado por nome */
function porEvento(itens){
  const m=new Map();
  itens.forEach(x=>{
    const k=x.l.Codigo||x.l.Evento;
    if(!m.has(k)) m.set(k,{chave:k,codigo:x.l.Codigo||'',nome:x.l.Evento,total:0,porCat:{}});
    const e=m.get(k);e.total++;e.porCat[x.c.cat]=(e.porCat[x.c.cat]||0)+1;
  });
  return [...m.values()].sort((a,b)=>a.nome.localeCompare(b.nome,'pt-BR'));
}

/* ---------- Conferência de remuneração: ficha do mês x ficha do mês anterior ---------- */
const r2=n=>Math.round((Number(n)||0)*100)/100;
const soma=(fs,k)=>r2((fs||[]).reduce((t,f)=>t+(Number(f[k])||0),0));
/* atual / anterior: listas de fichas {Folha,Prov,Desc,Liq,Eventos:[{Id,Nome,P,D}]} (uma por folha: mensal, 13º...), ou vazias.
   tol: diferenças até esse valor (R$) não contam como divergência. 
   -> {status:'sem'|'novo'|'saiu'|'igual'|'bruto'|'desconto', a:{prov,desc,liq}, b:{...}, d:{prov,desc,liq}, mudancas:[{id,nome,tipo,pa,da,pb,db,efeito}]}
   'bruto' = os proventos mudaram; 'desconto' = só os descontos mudaram (o bruto é igual); 'novo'/'saiu' = há ficha em só um dos meses. */
function compararFichas(atual,anterior,tol){
  tol=Number(tol)||0;const t=tol+0.004;
  const a={prov:soma(atual,'Prov'),desc:soma(atual,'Desc'),liq:soma(atual,'Liq')},b={prov:soma(anterior,'Prov'),desc:soma(anterior,'Desc'),liq:soma(anterior,'Liq')};
  const d={prov:r2(a.prov-b.prov),desc:r2(a.desc-b.desc),liq:r2(a.liq-b.liq)};
  const mapa=new Map();
  const poe=(fs,lado)=>(fs||[]).forEach(f=>(f.Eventos||[]).forEach(e=>{
    const k=String(e.Id)+(/^mensal$/i.test(f.Folha||'')?'':'@'+(f.Folha||''));
    if(!mapa.has(k)) mapa.set(k,{id:String(e.Id),nome:e.Nome+(/^mensal$/i.test(f.Folha||'')?'':' ('+(f.Folha||'outra folha')+')'),pa:0,da:0,pb:0,db:0,ta:false,tb:false});
    const m=mapa.get(k);m['p'+lado]=r2(m['p'+lado]+(Number(e.P)||0));m['d'+lado]=r2(m['d'+lado]+(Number(e.D)||0));m['t'+lado]=true;
  }));
  poe(atual,'a');poe(anterior,'b');
  const mudancas=[...mapa.values()].filter(m=>Math.abs(m.pa-m.pb)>0.004||Math.abs(m.da-m.db)>0.004)
    .map(m=>Object.assign(m,{efeito:r2((m.pa-m.da)-(m.pb-m.db)),tipo:!m.tb?'novo':!m.ta?'saiu':'mudou'}))
    .sort((x,y)=>Math.abs(y.efeito)-Math.abs(x.efeito)||x.nome.localeCompare(y.nome,'pt-BR'));
  const temA=(atual||[]).length>0,temB=(anterior||[]).length>0;
  let status;
  if(!temA&&!temB) status='sem';else if(temA&&!temB) status='novo';else if(!temA&&temB) status='saiu';
  else if(Math.abs(d.prov)>t) status='bruto';
  else if(Math.abs(d.liq)>t||Math.abs(d.desc)>t) status='desconto';
  else status='igual';
  return {status,a,b,d,mudancas};
}

/* Lê em lotes (concorrência limitada). Um servidor que o Centi não respondeu não derruba a carga: os que falharam são lidos de novo,
   em lotes menores, no fim; o que ainda falhar volta em `falhas`, com o motivo. Só sessão vencida (401) interrompe tudo. */
async function lerEmLotes(ids,tam,conc,chamar,juntar,andamento){
  const falhas=new Set();let motivo='',feitos=0;
  const tenta=async lote=>{
    try{
      const r=await chamar(lote);juntar(r);
      (r.Falhas||[]).forEach(f=>falhas.add(String(f)));if(r.Detalhe) motivo=r.Detalhe;
    }catch(e){if(e.status===401) throw e;lote.forEach(f=>falhas.add(String(f)));motivo=e.message||String(e);}
  };
  const fila=[];for(let i=0;i<ids.length;i+=tam) fila.push(ids.slice(i,i+tam));
  await Promise.all(Array.from({length:Math.min(conc,fila.length)},async()=>{
    while(fila.length){const lote=fila.shift();await tenta(lote);feitos+=lote.length;andamento(Math.min(feitos,ids.length),ids.length);}
  }));
  if(falhas.size){
    const de_novo=[...falhas];falhas.clear();
    andamento(ids.length,ids.length,'Tentando de novo '+de_novo.length+' servidor(es) que o Centi não respondeu…');
    for(let i=0;i<de_novo.length;i+=8) await tenta(de_novo.slice(i,i+8));
  }
  return {falhas:[...falhas],motivo};
}

async function listarAtivos(mes,ano){
  const [a,b]=await Promise.allSettled([PB.centi.cubo(mes,ano,'1'),PB.centi.cubo(mes,ano,'ultimo')]);
  for(const x of [a,b]) if(x.status==='rejected'&&x.reason&&x.reason.status===401) throw x.reason;
  if(a.status==='rejected'&&b.status==='rejected') throw a.reason;
  const m=new Map();
  [a,b].forEach(x=>{if(x.status==='fulfilled') (x.value.Data||[]).forEach(r=>{const k=String(r.ID);if(!m.has(k)) m.set(k,r);});});
  if(a.status==='rejected'||b.status==='rejected') toast('Aviso: não consegui ler uma das listas de servidores; quem foi admitido ou desligado no meio do mês pode faltar.');
  return m.size?[...m.values()]:[];
}
async function carregar(){
  if(lendo) return;
  const mes=+$('#selMes').value,ano=+$('#selAno').value;
  lendo=true;$('#btnCarregar').disabled=true;ref={mes,ano};
  try{
    if(!(await garantirSessao())){toast('Entre com o acesso do Centi para carregar.');return;}
    progresso('Listando os servidores no Centi (leva cerca de 15 segundos)…',3);
    const ativos=await listarAtivos(mes,ano);
    const servs=new Map();
    ativos.forEach(r=>servs.set(String(r.ID),{id:String(r.ID),mat:String(r.MATRICULA||''),nome:r.NOMEFUNC||'',cargo:r.CARGO||'',lot:r.HIERARQUIA||r.LOTACAO||''}));
    const ids=[...servs.keys()],lotes=[];
    for(let i=0;i<ids.length;i+=40) lotes.push(ids.slice(i,i+40));
    const linhas=[],trunc=new Set();
    progresso('Lendo os eventos dos servidores: 0 de '+ids.length+'…',10);
    const res=await lerEmLotes(ids,40,3,lote=>PB.centi.conferenciaEventos(lote,mes,ano),r=>{(r.Linhas||[]).forEach(l=>linhas.push(l));(r.Truncados||[]).forEach(t=>trunc.add(String(t)));},
      (f,t,msg)=>progresso(msg||'Lendo os eventos dos servidores: '+f+' de '+t+'…',10+f/t*90));
    if(res.falhas.length>=ids.length) throw new Error('O Centi não respondeu'+(res.motivo?' ('+res.motivo+')':'')+'. Tente de novo em instantes.');
    const itens=linhas.map(l=>({l,s:servs.get(l.Servidor)||{id:l.Servidor,mat:'',nome:'Servidor '+l.Servidor,cargo:'',lot:''},c:classificar(l,mes,ano)}));
    dados={ref:{mes,ano},itens,servidores:ids.length,falhas:res.falhas.map(i=>(servs.get(i)||{nome:'Servidor '+i}).nome),motivo:res.motivo,truncados:[...trunc].map(i=>(servs.get(i)||{nome:'Servidor '+i}).nome)};
    filtro={cat:'',q:'',ev:''};limite=200;
  }catch(e){toast('Não foi possível carregar do Centi: '+msgErro(e));}
  finally{lendo=false;$('#btnCarregar').disabled=false;$('#prog').hidden=true;}
  renderEventos();
}

/* ---------- Determinação de eventos ---------- */
const rotEvento=l=>(l.Codigo?l.Codigo+' · ':'')+titulo(l.Evento);
function filtrados(){
  const q=norm(filtro.q);
  return dados.itens.filter(x=>(!filtro.cat||x.c.cat===filtro.cat)&&(!filtro.ev||(x.l.Codigo||x.l.Evento)===filtro.ev)&&
    (!q||norm(x.s.nome+' '+x.s.mat+' '+x.l.Evento+' '+x.l.Codigo).includes(q)))
    .sort((a,b)=>(ORDEM.indexOf(a.c.cat)-ORDEM.indexOf(b.c.cat))||((a.c.fim||9e15)-(b.c.fim||9e15))||a.s.nome.localeCompare(b.s.nome,'pt-BR'));
}
function renderEventos(){
  const anoAtual=new Date().getFullYear();
  let h='<div class="bar"><label>Mês <select id="selMes">'+MESES.map((m,i)=>'<option value="'+(i+1)+'"'+(i+1===ref.mes?' selected':'')+'>'+m+'</option>').join('')+'</select></label>'+
    '<label>Ano <select id="selAno">'+[anoAtual-1,anoAtual,anoAtual+1].map(a=>'<option'+(a===ref.ano?' selected':'')+'>'+a+'</option>').join('')+'</select></label>'+
    '<button class="btn primary" id="btnCarregar" type="button">'+(dados?'Carregar de novo':'Carregar do Centi')+'</button>'+
    (dados?'<button class="btn" id="btnCsv" type="button">Exportar CSV</button>':'')+'</div>'+
    '<div class="prog" id="prog" hidden><b id="progTxt"></b><div class="barra"><i id="progBar" style="width:2%"></i></div></div>';
  if(!dados){
    h+='<div class="empty"><h2>Determinação de eventos</h2><p>Escolha o mês de referência e carregue. O sistema lê, no Centi, os lançamentos de evento de cada servidor ativo (FP001 &gt; Eventos) e mostra quais são <b>indeterminados</b>, quais são <b>determinados e até quando</b> e quais valem <b>só naquele mês</b> (ex.: 01/10/2026 a 30/10/2026).</p></div>';
    $('#secao').innerHTML=h;ligarBarra();return;
  }
  const cont={};dados.itens.forEach(x=>{cont[x.c.cat]=(cont[x.c.cat]||0)+1;});
  h+='<div class="stats">'+ORDEM.filter(c=>cont[c]||c==='indeterminada'||c==='determinada'||c==='so_mes').map(c=>'<button type="button" class="stat '+c+(filtro.cat===c?' on':'')+'" data-cat="'+c+'"><b>'+(cont[c]||0)+'</b><span>'+ROTULO_CURTO[c]+'</span></button>').join('')+'</div>';
  if(dados.falhas&&dados.falhas.length) h+='<div class="banner">O Centi não respondeu para '+dados.falhas.length+' servidor(es), mesmo depois de tentar de novo; a lista abaixo está incompleta para: '+esc(dados.falhas.slice(0,6).map(titulo).join(', '))+(dados.falhas.length>6?' e outros':'')+(dados.motivo?' ('+esc(dados.motivo)+')':'')+'. Clique em <b>Carregar de novo</b>.</div>';
  if(dados.truncados.length) h+='<div class="banner">Atenção: '+dados.truncados.length+' servidor(es) têm 50 ou mais lançamentos que atendem ao filtro e o Centi entrega no máximo 50 por consulta; a conferência pode estar incompleta para: '+esc(dados.truncados.slice(0,6).map(titulo).join(', '))+(dados.truncados.length>6?' e outros':'')+'.</div>';
  const evs=porEvento(dados.itens);
  h+='<div class="bar"><label class="search"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="q" type="search" placeholder="Filtrar por servidor, matrícula ou evento" value="'+esc(filtro.q)+'" autocomplete="off"></label>'+
    '<select id="selEv" aria-label="Evento"><option value="">Todos os eventos</option>'+evs.map(e=>'<option value="'+esc(e.chave)+'"'+(filtro.ev===e.chave?' selected':'')+'>'+esc((e.codigo?e.codigo+' · ':'')+titulo(e.nome))+' ('+e.total+')</option>').join('')+'</select></div>';
  h+='<div class="subabas" role="tablist"><button type="button" role="tab" data-vista="lancamentos" aria-selected="'+(vista==='lancamentos')+'">Lançamentos</button><button type="button" role="tab" data-vista="evento" aria-selected="'+(vista==='evento')+'">Por evento</button></div>';
  if(vista==='evento'){
    h+='<div class="tblwrap"><table class="lst"><thead><tr><th>Evento</th><th class="num">Lançamentos</th>'+ORDEM.map(c=>'<th class="num">'+ROTULO_TAG[c]+'</th>').join('')+'</tr></thead><tbody>'+
      evs.map(e=>'<tr data-ev="'+esc(e.chave)+'"><td class="n"><b>'+esc((e.codigo?e.codigo+' · ':'')+titulo(e.nome))+'</b></td><td class="num">'+e.total+'</td>'+ORDEM.map(c=>'<td class="num">'+(e.porCat[c]||'')+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>';
  }else{
    const l=filtrados(),vis=l.slice(0,limite);
    h+='<div class="tblwrap"><table class="lst"><thead><tr><th>Servidor</th><th>Evento</th><th>Recorrência</th><th>Início</th><th>Fim</th><th class="num">Valor</th><th>Situação</th></tr></thead><tbody>'+
      (vis.length?vis.map(x=>{
        const fim=x.l.Recorrencia==='Indeterminada'?'—':(x.l.Fim||'—');
        return '<tr><td class="n"><b>'+esc(titulo(x.s.nome))+'</b><span>Mat. '+esc(x.s.mat)+(x.s.lot?' · '+esc(titulo(x.s.lot)):'')+'</span></td><td class="n"><b>'+esc(rotEvento(x.l))+'</b></td><td>'+esc(x.l.Recorrencia)+'</td><td class="dt">'+esc(x.l.Inicio||'—')+'</td><td class="dt">'+esc(fim)+'</td><td class="num">'+esc(x.l.Valor)+'</td><td><span class="tag '+x.c.cat+'">'+ROTULO_TAG[x.c.cat]+'</span></td></tr>';
      }).join(''):'<tr><td colspan="7" class="none" style="padding:16px;color:var(--muted)">Nenhum lançamento neste filtro.</td></tr>')+'</tbody></table>'+
      (l.length>vis.length?'<div class="more"><button class="btn" id="btnMais" type="button">Mostrar mais ('+(l.length-vis.length)+' restantes)</button></div>':'')+'</div>'+
      '<p class="note">'+l.length+' lançamento(s) de '+dados.servidores+' servidores ativos em '+MESES[dados.ref.mes-1]+'/'+dados.ref.ano+'. Valem os lançamentos indeterminados e os determinados cuja data final não acabou antes do mês.</p>';
  }
  $('#secao').innerHTML=h;ligarBarra();
}
function ligarBarra(){
  const b=$('#btnCarregar');if(b) b.addEventListener('click',carregar);
  const c=$('#btnCsv');if(c) c.addEventListener('click',csv);
}
function csv(){
  const cel=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
  const cab=['Servidor','Matrícula','Lotação','Código do evento','Evento','Recorrência','Início','Fim','Valor','Situação'];
  const lin=filtrados().map(x=>[x.s.nome,x.s.mat,x.s.lot,x.l.Codigo,x.l.Evento,x.l.Recorrencia,x.l.Inicio,x.l.Recorrencia==='Indeterminada'?'':x.l.Fim,x.l.Valor,CATEGORIAS[x.c.cat]].map(cel).join(';'));
  const blob=new Blob(['﻿'+[cab.map(cel).join(';')].concat(lin).join('\r\n')],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='determinacao-de-eventos-'+String(dados.ref.mes).padStart(2,'0')+'-'+dados.ref.ano+'.csv';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}


/* ---------- Conferência de remuneração: ficha financeira (FP024) do mês x mês anterior ---------- */
const {compararFichas,STATUS_REM,conferenciaValida,r2}=window.CF;
const brl=n=>'R$ '+Number(n||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const sgn=n=>Math.abs(n)<0.005?'—':(n>0?'+':'−')+brl(Math.abs(n));
const numBR=t=>{t=String(t==null?'':t).replace(/[^\d,.\-]/g,'');if(!t) return 0;if(t.includes(',')) t=t.replace(/\./g,'').replace(',','.');const n=Number(t);return isFinite(n)?n:0;};
let rem=null;                                   // {ref,ant,itens:[{s,f:{Atual,Anterior},c}],conf:{matrícula:{por,em,nota,prov,liq}}}
let rf={st:'',q:'',ocultar:false,tol:0},rLimite=200,rLendo=false;
const mesAntRef=(m,a)=>m===1?{mes:12,ano:a-1}:{mes:m-1,ano:a};
const docRem=r=>'conferencias/remuneracao-'+r.ano+'-'+String(r.mes).padStart(2,'0');
async function lerConf(r){
  if(!dbh) return {};
  try{const d=await dbh.doc(docRem(r)).get();if(d.exists){const j=JSON.parse(d.data().json);return (j&&j.itens)||{};}}catch(e){}
  return {};
}
/* a marcação relê o que está no servidor e troca só aquela matrícula: duas pessoas conferindo servidores diferentes não se sobrescrevem */
let filaConf=Promise.resolve();
function gravarConf(r,mat,rec){
  const f=filaConf.then(async()=>{
    if(!dbh) throw new Error('Sem conexão com o servidor: a conferência não pôde ser salva.');
    let itens=await lerConf(r);
    if(rec) itens[mat]=rec;else delete itens[mat];
    await dbh.doc(docRem(r)).set({json:JSON.stringify({v:1,itens})});
    return itens;
  });
  filaConf=f.catch(()=>{});
  return f;
}
function recalcRem(){rem.itens.forEach(x=>{x.c=compararFichas(x.f.Atual,x.f.Anterior,rf.tol);});}
async function carregarRem(){
  if(rLendo) return;
  const mes=+$('#rMes').value,ano=+$('#rAno').value;rf.tol=Math.max(0,numBR($('#rTol').value));
  rLendo=true;$('#rCarregar').disabled=true;
  const prog=(t,p)=>{$('#rProg').hidden=false;$('#rProgTxt').textContent=t;$('#rProgBar').style.width=Math.max(2,Math.min(100,p||0))+'%';};
  try{
    if(!(await garantirSessao())){toast('Entre com o acesso do Centi para carregar.');return;}
    prog('Listando os servidores no Centi (leva cerca de 10 segundos)…',3);
    const ativos=await listarAtivos(mes,ano);
    const servs=new Map();
    ativos.forEach(r=>{const m=String(r.MATRICULA||'');if(m) servs.set(m,{mat:m,nome:r.NOMEFUNC||'',cargo:r.CARGO||'',lot:r.HIERARQUIA||r.LOTACAO||''});});
    const mats=[...servs.keys()],fichas={};
    prog('Lendo as fichas financeiras: 0 de '+mats.length+'…',10);
    const res=await lerEmLotes(mats,30,3,lote=>PB.centi.conferenciaRemuneracao(lote,mes,ano),r=>Object.assign(fichas,r.Servidores||{}),
      (f,t,msg)=>prog(msg||'Lendo as fichas financeiras ('+MESES[mes-1]+' e '+MESES[mesAntRef(mes,ano).mes-1]+'): '+f+' de '+t+'…',10+f/t*88));
    if(res.falhas.length>=mats.length) throw new Error('O Centi não respondeu'+(res.motivo?' ('+res.motivo+')':'')+'. Tente de novo em instantes.');
    const ref_={mes,ano};
    const conf=await lerConf(ref_);
    rem={ref:ref_,ant:mesAntRef(mes,ano),conf,falhas:res.falhas.map(m=>titulo(servs.get(m).nome)),motivo:res.motivo,itens:mats.filter(m=>!res.falhas.includes(m)).map(m=>({s:servs.get(m),f:fichas[m]||{Atual:[],Anterior:[]}}))};
    recalcRem();rf.st='';rf.q='';rLimite=200;
  }catch(e){toast('Não foi possível carregar do Centi: '+msgErro(e));}
  finally{rLendo=false;const b=$('#rCarregar');if(b) b.disabled=false;const p=$('#rProg');if(p) p.hidden=true;}
  renderRemun();
}
const confDe=x=>{const rec=rem.conf[x.s.mat];return {rec,ok:conferenciaValida(rec,x.c),velha:!!rec&&!conferenciaValida(rec,x.c)};};
const ehDiverg=c=>c.status==='bruto'||c.status==='desconto'||c.status==='novo'||c.status==='saiu';
function filtradosRem(){
  const q=norm(rf.q);
  return rem.itens.filter(x=>{
    if(x.c.status==='sem') return false;
    const k=confDe(x);
    if(rf.st==='pend'){if(!ehDiverg(x.c)||k.ok) return false;}
    else if(rf.st&&x.c.status!==rf.st) return false;
    if(rf.ocultar&&k.ok) return false;
    return !q||norm(x.s.nome+' '+x.s.mat).includes(q);
  }).sort((a,b)=>{
    const pa=ehDiverg(a.c)&&!confDe(a).ok?0:ehDiverg(a.c)?1:2,pb=ehDiverg(b.c)&&!confDe(b).ok?0:ehDiverg(b.c)?1:2;
    return (pa-pb)||((Math.abs(b.c.d.prov)+Math.abs(b.c.d.liq))-(Math.abs(a.c.d.prov)+Math.abs(a.c.d.liq)))||a.s.nome.localeCompare(b.s.nome,'pt-BR');
  });
}
const clsDif=n=>Math.abs(n)<0.005?'':(n>0?'pos':'neg');
const chipsMud=c=>c.mudancas.slice(0,3).map(m=>'<span class="chip">'+esc(m.id+' '+titulo(m.nome).slice(0,22))+' '+sgn(m.efeito)+'</span>').join('')+(c.mudancas.length>3?'<span class="chip">+'+(c.mudancas.length-3)+'</span>':'');
function renderRemun(){
  const anoAtual=new Date().getFullYear(),a=rem?rem.ant:mesAntRef(ref.mes,ref.ano);
  let h='<div class="bar"><label>Mês <select id="rMes">'+MESES.map((m,i)=>'<option value="'+(i+1)+'"'+(i+1===ref.mes?' selected':'')+'>'+m+'</option>').join('')+'</select></label>'+
    '<label>Ano <select id="rAno">'+[anoAtual-1,anoAtual,anoAtual+1].map(y=>'<option'+(y===ref.ano?' selected':'')+'>'+y+'</option>').join('')+'</select></label>'+
    '<label title="Diferenças até este valor não contam como divergência">Tolerância R$ <input id="rTol" type="text" inputmode="decimal" value="'+esc(String(rf.tol||0).replace('.',','))+'" style="width:84px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 10px"></label>'+
    '<button class="btn primary" id="rCarregar" type="button">'+(rem?'Carregar de novo':'Carregar do Centi')+'</button>'+(rem?'<button class="btn" id="rCsv" type="button">Exportar CSV</button>':'')+'</div>'+
    '<div class="prog" id="rProg" hidden><b id="rProgTxt"></b><div class="barra"><i id="rProgBar" style="width:2%"></i></div></div>';
  if(!rem){
    $('#secao').innerHTML=h+'<div class="empty"><h2>Conferência de remuneração</h2><p>Escolha o mês e carregue. O sistema lê a <b>ficha financeira</b> (FP024) de cada servidor ativo no mês escolhido e no <b>mês anterior ('+MESES[a.mes-1]+'/'+a.ano+')</b>, compara proventos, descontos e líquido e <b>destaca quem divergiu</b>, com os eventos que explicam a diferença. Depois de conferir, marque o servidor como <b>conferido</b>.</p></div>';
    ligarRem();return;
  }
  const cont={bruto:0,desconto:0,novo:0,saiu:0,igual:0,pend:0};
  let tPa=0,tPb=0,tLa=0,tLb=0;
  rem.itens.forEach(x=>{if(x.c.status==='sem') return;cont[x.c.status]++;if(ehDiverg(x.c)&&!confDe(x).ok) cont.pend++;tPa+=x.c.a.prov;tPb+=x.c.b.prov;tLa+=x.c.a.liq;tLb+=x.c.b.liq;});
  const conferidos=rem.itens.filter(x=>x.c.status!=='sem'&&ehDiverg(x.c)&&confDe(x).ok).length,totalDiv=cont.bruto+cont.desconto+cont.novo+cont.saiu;
  const cards=[['pend','Divergentes a conferir'],['bruto','Bruto mudou'],['desconto','Só descontos mudaram'],['novo','Novos na folha'],['saiu','Saíram da folha'],['igual','Iguais']];
  h+='<div class="stats">'+cards.map(c=>'<button type="button" class="stat '+c[0]+(rf.st===c[0]?' on':'')+'" data-rst="'+c[0]+'"><b>'+cont[c[0]]+'</b><span>'+c[1]+'</span></button>').join('')+'</div>'+
    '<div class="tot"><div>Folha bruta '+MESES[rem.ref.mes-1]+'/'+rem.ref.ano+'<b>'+brl(tPa)+'</b>'+sgn(r2(tPa-tPb))+' sobre '+MESES[a.mes-1]+'</div><div>Líquido '+MESES[rem.ref.mes-1]+'/'+rem.ref.ano+'<b>'+brl(tLa)+'</b>'+sgn(r2(tLa-tLb))+' sobre '+MESES[a.mes-1]+'</div><div>Conferência<b>'+conferidos+' de '+totalDiv+'</b>divergências conferidas</div></div>';
  if(rem.falhas&&rem.falhas.length) h+='<div class="banner">O Centi não respondeu para '+rem.falhas.length+' servidor(es), mesmo depois de tentar de novo; eles ficaram de fora da comparação: '+esc(rem.falhas.slice(0,6).join(', '))+(rem.falhas.length>6?' e outros':'')+(rem.motivo?' ('+esc(rem.motivo)+')':'')+'. Clique em <b>Carregar de novo</b>.</div>';
  h+='<div class="bar"><label class="search"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="rQ" type="search" placeholder="Filtrar por servidor ou matrícula" value="'+esc(rf.q)+'" autocomplete="off"></label>'+
    '<label class="ck"><input type="checkbox" id="rOcultar"'+(rf.ocultar?' checked':'')+'> Ocultar conferidos</label></div>';
  const l=filtradosRem(),vis=l.slice(0,rLimite);
  h+='<div class="tblwrap"><table class="lst compacta" style="min-width:900px"><thead><tr><th>Servidor</th><th class="num">Bruto anterior</th><th class="num">Bruto atual</th><th class="num">Dif.</th><th class="num">Líquido anterior</th><th class="num">Líquido atual</th><th class="num">Dif.</th><th>O que mudou</th><th>Situação</th></tr></thead><tbody>'+
    (vis.length?vis.map(x=>{
      const i=rem.itens.indexOf(x),k=confDe(x),c=x.c,div=ehDiverg(c);
      const sit=k.ok?'<span class="tag conf" title="'+esc((k.rec.por||'')+' em '+new Date(k.rec.em).toLocaleDateString('pt-BR')+(k.rec.nota?' · '+k.rec.nota:''))+'">Conferido</span>':k.velha?'<span class="tag bruto">Mudou após conferir</span>':'<span class="tag '+c.status+'">'+({desconto:'Só descontos'}[c.status]||STATUS_REM[c.status])+'</span>';
      return '<tr data-rm="'+i+'" class="'+(div&&!k.ok?'pendente':'')+(k.ok?' conferido':'')+'"><td class="n"><b>'+esc(titulo(x.s.nome))+'</b><span>Mat. '+esc(x.s.mat)+(x.s.lot?' · '+esc(titulo(x.s.lot)):'')+'</span></td>'+
        '<td class="num">'+brl(c.b.prov)+'</td><td class="num">'+brl(c.a.prov)+'</td><td class="num '+clsDif(c.d.prov)+'">'+sgn(c.d.prov)+'</td>'+
        '<td class="num">'+brl(c.b.liq)+'</td><td class="num">'+brl(c.a.liq)+'</td><td class="num '+clsDif(c.d.liq)+'">'+sgn(c.d.liq)+'</td>'+
        '<td><div class="chips">'+chipsMud(c)+'</div></td><td>'+sit+'</td></tr>';
    }).join(''):'<tr><td colspan="9" style="padding:16px;color:var(--muted)">Nenhum servidor neste filtro.</td></tr>')+'</tbody></table>'+
    (l.length>vis.length?'<div class="more"><button class="btn" id="rMais" type="button">Mostrar mais ('+(l.length-vis.length)+' restantes)</button></div>':'')+'</div>'+
    '<p class="note">'+l.length+' servidor(es) listados · comparação de '+MESES[rem.ref.mes-1]+'/'+rem.ref.ano+' com '+MESES[a.mes-1]+'/'+a.ano+', somando todas as folhas de cada mês (mensal, 13º, complementar). Clique no servidor para ver o que mudou e marcar como conferido. A conferência deixa de valer se a ficha mudar depois.</p>';
  $('#secao').innerHTML=h;ligarRem();
}
function ligarRem(){
  const b=$('#rCarregar');if(b) b.addEventListener('click',carregarRem);
  const c=$('#rCsv');if(c) c.addEventListener('click',csvRem);
}
function dlgRem(i){
  const x=rem.itens[i];if(!x) return;
  const c=x.c,k=confDe(x),a=rem.ant,r=rem.ref;
  const cx=(t,b,at,d)=>'<div><small>'+t+'</small><b>'+brl(at)+'</b><span>'+MESES[a.mes-1].slice(0,3)+': '+brl(b)+' · <b class="'+clsDif(d)+'" style="font-size:inherit;font-family:inherit">'+sgn(d)+'</b></span></div>';
  const lin=m=>'<tr><td>'+esc(m.id+' · '+titulo(m.nome))+'</td><td><span class="tag '+(m.tipo==='novo'?'novo':m.tipo==='saiu'?'saiu':'desconto')+'">'+(m.tipo==='novo'?'Novo':m.tipo==='saiu'?'Saiu':'Mudou')+'</span></td>'+
    '<td class="num">'+(m.pb?'P '+brl(m.pb):'')+(m.db?(m.pb?'<br>':'')+'D '+brl(m.db):'')+(m.tb?'':'—')+'</td><td class="num">'+(m.pa?'P '+brl(m.pa):'')+(m.da?(m.pa?'<br>':'')+'D '+brl(m.da):'')+(m.ta?'':'—')+'</td><td class="num '+clsDif(m.efeito)+'">'+sgn(m.efeito)+'</td></tr>';
  $('#dlg').innerHTML='<div class="dbox"><h3>'+esc(titulo(x.s.nome))+'</h3><p>Matrícula '+esc(x.s.mat)+(x.s.cargo?' · '+esc(titulo(x.s.cargo)):'')+(x.s.lot?' · '+esc(titulo(x.s.lot)):'')+' · <span class="tag '+c.status+'">'+STATUS_REM[c.status]+'</span></p>'+
    '<div class="sum3">'+cx('Proventos (bruto)',c.b.prov,c.a.prov,c.d.prov)+cx('Descontos',c.b.desc,c.a.desc,c.d.desc)+cx('Líquido',c.b.liq,c.a.liq,c.d.liq)+'</div>'+
    (c.mudancas.length?'<div class="pw"><table class="per"><thead><tr><th>Evento</th><th></th><th class="num">'+MESES[a.mes-1]+'</th><th class="num">'+MESES[r.mes-1]+'</th><th class="num">Efeito no líquido</th></tr></thead><tbody>'+c.mudancas.map(lin).join('')+'</tbody></table></div><p class="sub" style="color:var(--muted);font-size:12.5px">P = provento, D = desconto.</p>':'<p>Nenhum evento mudou entre os dois meses.</p>')+
    (k.velha?'<div class="banner">Esta ficha já foi conferida por '+esc(k.rec.por||'—')+' em '+new Date(k.rec.em).toLocaleDateString('pt-BR')+', mas os valores mudaram depois (era '+brl(k.rec.prov)+' bruto e '+brl(k.rec.liq)+' líquido). Confira de novo.</div>':'')+
    '<label class="f">Observação da conferência (opcional)<input type="text" id="rNota" maxlength="300" placeholder="ex.: reajuste de março; penhora nova (processo X)" value="'+esc(k.rec?k.rec.nota||'':'')+'"></label>'+
    (k.ok?'<p class="sub" style="color:var(--muted);font-size:12.5px">Conferido por '+esc(k.rec.por||'—')+' em '+new Date(k.rec.em).toLocaleString('pt-BR')+'.</p>':'')+
    '<div class="row"><button class="btn" type="button" data-rfechar>Fechar</button>'+(k.rec?'<button class="btn" type="button" data-rdesm="'+i+'">Remover conferência</button>':'')+'<button class="btn primary" type="button" data-rconf="'+i+'">'+(k.ok?'Atualizar observação':'Marcar como conferido')+'</button></div></div>';
  $('#dlg').showModal();
}
async function marcarConf(i,desmarcar){
  const x=rem.itens[i];if(!x) return;
  const rec=desmarcar?null:{por:PB.centi.nome||PB.centi.user||'',em:new Date().toISOString(),nota:($('#rNota').value||'').trim(),prov:x.c.a.prov,liq:x.c.a.liq};
  try{rem.conf=await gravarConf(rem.ref,x.s.mat,rec);toast(desmarcar?'Conferência removida.':'Marcado como conferido.');}
  catch(e){toast(e.message||'Não foi possível salvar.');return;}
  $('#dlg').close();renderRemun();
}
function csvRem(){
  const cel=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"',n=v=>String(v).replace('.',',');
  const cab=['Servidor','Matrícula','Lotação','Bruto anterior','Bruto atual','Diferença bruto','Líquido anterior','Líquido atual','Diferença líquido','Situação','Conferido','Conferido por','Observação','Principais mudanças'];
  const lin=filtradosRem().map(x=>{const k=confDe(x),c=x.c;return [x.s.nome,x.s.mat,x.s.lot,n(c.b.prov),n(c.a.prov),n(c.d.prov),n(c.b.liq),n(c.a.liq),n(c.d.liq),STATUS_REM[c.status],k.ok?'Sim':k.velha?'Mudou após conferir':'Não',k.rec?k.rec.por:'',k.rec?k.rec.nota:'',c.mudancas.slice(0,5).map(m=>m.id+' '+m.nome+' '+n(m.efeito)).join(' | ')].map(cel).join(';');});
  const blob=new Blob(['﻿'+[cab.map(cel).join(';')].concat(lin).join('\r\n')],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='conferencia-remuneracao-'+String(rem.ref.mes).padStart(2,'0')+'-'+rem.ref.ano+'.csv';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}

/* ---------- eventos da página ---------- */
document.addEventListener('click',e=>{
  const rs=e.target.closest('[data-rst]');if(rs){rf.st=rf.st===rs.dataset.rst?'':rs.dataset.rst;rLimite=200;renderRemun();return;}
  const rm=e.target.closest('tr[data-rm]');if(rm){dlgRem(+rm.dataset.rm);return;}
  if(e.target.closest('[data-rfechar]')){$('#dlg').close();return;}
  const rc=e.target.closest('[data-rconf]');if(rc){marcarConf(+rc.dataset.rconf,false);return;}
  const rd=e.target.closest('[data-rdesm]');if(rd){marcarConf(+rd.dataset.rdesm,true);return;}
  if(e.target.closest('#rMais')){rLimite+=300;renderRemun();return;}
  const sec=e.target.closest('[data-sec]');if(sec){secao=sec.dataset.sec;renderAbas();renderSecao();return;}
  const st=e.target.closest('.stat[data-cat]');if(st){filtro.cat=filtro.cat===st.dataset.cat?'':st.dataset.cat;vista='lancamentos';limite=200;renderEventos();return;}
  const vi=e.target.closest('[data-vista]');if(vi){vista=vi.dataset.vista;renderEventos();return;}
  const ev=e.target.closest('tr[data-ev]');if(ev){filtro.ev=ev.dataset.ev;vista='lancamentos';limite=200;renderEventos();return;}
  if(e.target.closest('#btnMais')){limite+=300;renderEventos();}
});
document.addEventListener('input',e=>{
  if(e.target.id==='rQ'){rf.q=e.target.value;rLimite=200;const p=e.target.selectionStart;renderRemun();const q=$('#rQ');q.focus();q.setSelectionRange(p,p);return;}if(e.target.id==='q'){filtro.q=e.target.value;limite=200;const p=e.target.selectionStart;renderEventos();const q=$('#q');q.focus();q.setSelectionRange(p,p);}});
document.addEventListener('change',e=>{
  if(e.target.id==='rOcultar'){rf.ocultar=e.target.checked;rLimite=200;renderRemun();return;}
  if(e.target.id==='rTol'&&rem){rf.tol=Math.max(0,numBR(e.target.value));recalcRem();renderRemun();return;}
  if(e.target.id==='rMes'||e.target.id==='rAno'){ref={mes:+$('#rMes').value,ano:+$('#rAno').value};return;}
  if(e.target.id==='selEv'){filtro.ev=e.target.value;limite=200;renderEventos();}
  if(e.target.id==='selMes'||e.target.id==='selAno'){ref={mes:+$('#selMes').value,ano:+$('#selAno').value};}
});
observarTema();

  themeBtn();renderAbas();renderSecao();carga(true,'Conectando ao servidor…');
  (async()=>{
    try{
      if(window.claude&&window.claude.use) dbh=await window.claude.use('db');
      if(!dbh) dbh=await PB.connect();
    }catch(e){}
    finally{carga(false);}
  })();
})();
</script>
<script>
/* "Olá, Primeiro nome" — lê o nome do Centi guardado na sessão deste navegador */
(function(){
  function nome(){
    try{const a=JSON.parse(localStorage.getItem('rhcrv-pb-auth')||'null');const n=a&&a.centi&&(a.centi.nome||a.centi.user);
      if(!n) return '';const p=String(n).trim().split(/\s+/)[0];
      if(!p||/\d/.test(p)||/^[a-z]+\.[a-z]/i.test(p)) return '';
      return p.charAt(0).toLocaleUpperCase('pt-BR')+p.slice(1).toLocaleLowerCase('pt-BR');}catch(e){return '';}
  }
  function aplicar(){
    const n=nome();let el=document.getElementById('helloMod');
    if(!n){if(el) el.remove();return;}
    if(!el){
      const hero=document.querySelector('.hero h1'),top=document.querySelector('.side .brand');
      el=document.createElement(hero?'p':'div');el.id='helloMod';el.className='hello';
      el.innerHTML='<span class="wave" aria-hidden="true">👋</span><span></span>';
      if(hero) hero.parentNode.insertBefore(el,hero);
      else if(top) top.insertAdjacentElement('afterend',el);
      else return;
    }
    el.lastChild.textContent='Olá, '+n;
  }
  let i=0;aplicar();const t=setInterval(()=>{aplicar();if(++i>40)clearInterval(t);},500);
  window.addEventListener('storage',aplicar);
})();

</script>
