<style>
/*SHARED_CSS*/
:root{
  --ok:#17794a;
  --ok-bg:#e1f4ea;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ok:#6fd3a0;
  --ok-bg:#12382a;}}
:root[data-theme="dark"]{

  --ok-bg:#12382a;}
[hidden]{display:none!important}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.inner{max-width:1120px;margin:0 auto}
.hero{background:linear-gradient(135deg,var(--hero-a),var(--hero-b));color:#fff;padding-block:clamp(28px,6vw,56px) clamp(40px,7vw,72px);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-60px;top:-40px;width:340px;height:340px;border-radius:50%;border:1px solid rgba(255,255,255,.14);box-shadow:0 0 0 46px rgba(255,255,255,.04),0 0 0 92px rgba(255,255,255,.025)}
.themebtn{margin-left:auto;display:inline-flex;align-items:center;gap:8px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.12);color:#fff;border-radius:10px;padding:8px 12px;font-weight:600;font-size:13.5px;cursor:pointer}
.themebtn:hover{background:rgba(255,255,255,.22)}
.brandrow{display:flex;align-items:center;gap:14px;margin-bottom:clamp(22px,4vw,40px);position:relative;z-index:1}
.logo{width:46px;height:46px;border-radius:12px;background:rgba(255,255,255,.14);display:grid;place-items:center;border:1px solid rgba(255,255,255,.25);flex:none}
.brandrow small{display:block;letter-spacing:.14em;text-transform:uppercase;font-size:11.5px;opacity:.85}
.hero h1{font-size:clamp(1.7rem,4.6vw,2.7rem);line-height:1.12;max-width:20ch;position:relative;z-index:1}
.hero p{margin:14px 0 0;max-width:56ch;opacity:.88;font-size:1.02rem;position:relative;z-index:1}
.goldrule{width:56px;height:4px;background:var(--gold);border-radius:2px;margin:0 0 18px;position:relative;z-index:1}
main{padding-block:0 40px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:-26px;position:relative;z-index:2}
.search{flex:1 1 260px;display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 14px;box-shadow:var(--shadow);min-width:0}
.search input{border:0;background:transparent;outline:0;padding:13px 0;flex:1;min-width:0}
.search:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;cursor:pointer;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:8px;box-shadow:var(--shadow)}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.sm{padding:6px 10px;font-size:13px;box-shadow:none}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.45;cursor:default}
.sec{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:30px 0 14px}
.sec h2{font-size:1.15rem}.sec span{color:var(--muted);font-size:13.5px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:16px}
.tile{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:12px;min-width:0;box-shadow:var(--shadow);text-decoration:none;color:inherit;transition:transform .15s,border-color .15s}
a.tile:hover{transform:translateY(-3px);border-color:var(--accent)}
a.tile:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.tile[draggable=true]{cursor:grab}.tile.dragging{opacity:.45}.tile.over{outline:2px dashed var(--accent);outline-offset:2px}
.tile.skel{pointer-events:none;gap:12px}.tile.skel i{display:block;border-radius:8px;background:linear-gradient(90deg,var(--line) 0%,color-mix(in srgb,var(--line) 40%,transparent) 50%,var(--line) 100%);background-size:220% 100%;animation:sk 1.3s ease-in-out infinite}
@keyframes sk{0%{background-position:100% 0}100%{background-position:-100% 0}}@media (prefers-reduced-motion:reduce){.tile.skel i{animation:none}}
.tile.off{background:color-mix(in srgb,var(--surface) 70%,var(--bg))}
.ico{width:56px;height:56px;border-radius:15px;display:grid;place-items:center;background:var(--tint);color:var(--ink);flex:none}
.tile h3{font-size:1.05rem;line-height:1.25}
.tile p{margin:0;color:var(--muted);font-size:13.8px;flex:1}
.foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:2px}
.pill{font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:3px 9px;border-radius:99px;background:var(--soft);color:var(--muted)}
.pill.ok{background:var(--ok-bg);color:var(--ok)}.pill.warn{background:var(--warn-bg);color:var(--warn)}
.open{font-weight:600;color:var(--accent);font-size:13.5px;display:inline-flex;align-items:center;gap:4px}
.tools{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.add{border:2px dashed var(--line);background:transparent;box-shadow:none;align-items:center;justify-content:center;text-align:center;color:var(--muted);cursor:pointer;min-height:180px}
.add:hover{border-color:var(--accent);color:var(--accent)}
.empty{padding:40px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:14px}
.note{margin-top:34px;padding:14px 16px;border-left:4px solid var(--gold);background:var(--surface);border-radius:8px;font-size:12.8px;color:var(--muted);box-shadow:var(--shadow)}
footer{padding-block:0 28px;color:var(--muted);font-size:12.5px}
#modal{position:fixed;inset:0;background:rgba(5,15,30,.55);display:grid;place-items:center;padding:16px;z-index:50;overflow:auto}
.modal{background:var(--surface);border-radius:16px;padding:22px;width:min(520px,100%);display:grid;gap:12px;box-shadow:0 20px 60px rgba(0,0,0,.35);max-height:100%;overflow:auto}
.fld{display:grid;gap:5px;font-size:13px;font-weight:600;color:var(--muted)}
.fld input,.fld textarea,.fld select{border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:9px 11px;font-weight:400;color:var(--fg);min-width:0;width:100%}
.fld input:focus,.fld textarea:focus,.fld select:focus{outline:2px solid var(--accent);border-color:transparent}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:480px){.r2{grid-template-columns:1fr}}
.icons,.hues{display:flex;flex-wrap:wrap;gap:6px}
.icons button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--bg);display:grid;place-items:center;cursor:pointer;color:var(--fg)}
.icons button[aria-pressed="true"]{border-color:var(--accent);background:var(--soft);color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.hues button{width:28px;height:28px;border-radius:50%;border:2px solid var(--surface);outline:1px solid var(--line);background:hsl(var(--h) 55% 45%);cursor:pointer}
.hues button[aria-pressed="true"]{outline:2px solid var(--fg)}
.actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:4px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:max(18px,env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:60;max-width:90vw}
.asent{margin-top:22px;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--warn);border-radius:14px;box-shadow:var(--shadow);padding:14px 16px}
.asent.crit{border-left-color:var(--danger)}
.asent h2{font-size:1rem;display:flex;align-items:center;gap:8px;flex-wrap:wrap}.asent h2 a{margin-left:auto;font-family:var(--f-body);font-size:13px;font-weight:600;color:var(--accent);text-decoration:none}
.asent ul{list-style:none;margin:8px 0 0;padding:0}
.asent li{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:8px 0;border-top:1px solid var(--line);font-size:14px}.asent li:first-child{border-top:0}
.asent li b{font-weight:600}.asent li .qt{margin-left:auto;text-align:right;font-variant-numeric:tabular-nums}
.asent .tg{font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--soft);color:var(--muted);white-space:nowrap}
.asent .tg.final{background:var(--warn-bg);color:var(--warn)}.asent .tg.atencao{background:var(--danger-bg,#fbe3e0);color:var(--danger)}
.asent small{color:var(--muted);display:block;font-size:12.5px;margin-top:6px}
.edit-banner{margin-top:14px;background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:10px 14px;font-size:13.5px}
@media (pointer:coarse){input,select,textarea{font-size:16px}.btn{min-height:42px}.btn.sm{min-height:38px}}
/* ===== visual minimalista (feito para muitos sistemas) ===== */
body{background:var(--bg)}
.hero{border-radius:0;padding-block:18px 52px;background:linear-gradient(135deg,var(--hero-a),var(--hero-b))}

.brandrow{margin-bottom:22px}
.goldrule{display:none}
.hello{margin:0 0 2px;font-family:var(--f-display);font-weight:500;font-size:.95rem;opacity:.85;display:block;position:relative;z-index:1}
.hero h1{font-size:clamp(1.3rem,3vw,1.75rem);font-weight:700;letter-spacing:-.01em;max-width:none;margin:0}
.hero h1 em{font-style:normal}
.themebtn{border-radius:99px;padding:6px 12px;background:transparent}
.bar{margin-top:-24px}
.search{border-radius:12px;box-shadow:0 2px 10px rgba(6,61,39,.10)}
.btn{border-radius:10px;box-shadow:none;padding:9px 14px}
.sec{margin:26px 0 10px}
.sec h2{font-size:.78rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
.sec span{background:none;padding:0;font-size:12.5px}
.grid{grid-template-columns:repeat(auto-fill,minmax(min(100%,270px),1fr));gap:10px}
.tile{flex-direction:row;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;box-shadow:none;transition:border-color .15s,background .15s}
.tile::before,.tile::after{display:none}
a.tile:hover{transform:none;box-shadow:none;border-color:var(--accent);background:color-mix(in srgb,var(--surface) 92%,var(--accent))}
.ico{width:38px;height:38px;border-radius:10px;box-shadow:none}
.ico svg{width:20px;height:20px}
.tx{min-width:0;flex:1}
.tile h3{font-size:.95rem;font-weight:600;line-height:1.25}
.tile p{font-size:12.5px;line-height:1.35;margin:1px 0 0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.go{color:var(--muted);flex:none;opacity:.55;transition:transform .15s,opacity .15s}
a.tile:hover .go{opacity:1;transform:translateX(2px);color:var(--accent)}
.pill{font-size:10.5px;padding:2px 8px;flex:none}
.tile.off{opacity:.7}
.tile.edit{flex-wrap:wrap;align-items:flex-start}
.tile.edit .tools{width:100%}
.tile.add{flex-direction:column;justify-content:center;min-height:62px;padding:10px}
.asent{margin-top:16px;border:1px solid var(--line);border-left:3px solid var(--warn);border-radius:12px;box-shadow:none;padding:10px 14px}
.asent.crit{border-left-color:var(--danger)}
.asent h2{font-size:.9rem}
.sec h2,.asent h2{font-family:var(--f-display)}
.modal{border-radius:16px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

    {id:'t-tarefas',nome:'Tarefas do RH',desc:'Checklist em quadro (a fazer, em andamento, concluído) com tarefas da equipe ou privadas. As concluídas saem do quadro na virada do mês.',icone:'tasks',hue:212,status:'ok',url:TAREFAS_URL},
    {id:'t-carimbos',nome:'Espelhos de ponto',desc:'Carimbe os espelhos de ponto em PDF, organizados pela hierarquia, e acompanhe quais setores devolveram o espelho (devolvido ao RH, com pendências ou não devolvido).',icone:'file',hue:340,status:'ok',url:CARIMBOS_URL},
    {id:'t-documentos',nome:'Gerador de Documentos',desc:'Gera documentos oficiais no papel timbrado da Câmara, em Word e PDF. Começa pela declaração de abertura de conta; portarias e decretos virão depois.',icone:'file',hue:200,status:'ok',url:DOCUMENTOS_URL},
    {id:'t-freq',nome:'Frequência',desc:'Registro e conferência de frequência.',icone:'clock',hue:48,status:'plan',url:''},
  ]};
}
let st=defaults(),edit=false,dbh=null,filter='',saveT=null,carregando=false;

function load(){
  try{const d=JSON.parse(localStorage.getItem(LS)||'null');if(d&&Array.isArray(d.tiles)) return d;}catch(e){}
  return null;
}
/* só quem entrou como administrador edita o painel; sem sessão (modo local ou artefato) o painel é só de leitura */
const podeEditar=()=>PB.centi.admin;
function lerCache(){
  try{const d=JSON.parse(localStorage.getItem(CACHE)||'null');if(d&&Array.isArray(d.tiles)&&d.tiles.length) return d;}catch(e){}
  return null;
}
function guardarCache(){try{localStorage.setItem(CACHE,JSON.stringify(st));}catch(e){}}
function persist(){
  clearTimeout(saveT);
  saveT=setTimeout(async()=>{
    if(!podeEditar()) return;     // só administrador grava o painel (o PocketBase também barra)
    const json=JSON.stringify(st);
    if(!dbh){try{localStorage.setItem(LS,json);}catch(e){}}
    if(dbh){try{await dbh.doc('painel/tiles').set({json});guardarCache();}catch(e){toast('Não foi possível salvar no servidor. Verifique a conexão.');}}
  },300);
}
/* "Olá, Primeiro nome": o nome vem do cadastro do Centi (muitas vezes em MAIÚSCULAS) */
function primeiroNome(){
  let n='';try{n=(PB.centi.nome||'').trim();}catch(e){}
  if(!n||n==='undefined') return '';
  const p=n.split(/\s+/)[0];
  if(/^[a-z]+\.[a-z]/i.test(p)||/\d/.test(p)) return '';     // é só um login (ex.: ana.silva), não um nome
  return p.charAt(0).toLocaleUpperCase('pt-BR')+p.slice(1).toLocaleLowerCase('pt-BR');
}
function saudacao(){
  const n=primeiroNome(),h=$('#hello');if(!h) return;
  if(!n){h.hidden=true;return;}
  $('#helloTxt').textContent='Olá, '+n;h.hidden=false;
}

/* alerta das sentenças judiciais: usa o que o sistema de Sentenças já leu da ficha financeira (não consulta o Centi aqui) */
let sentencas=null;
function renderAlertaSent(){
  const box=$('#alertaSent');if(!box) return;
  if(!sentencas||!window.SP){box.innerHTML='';return;}
  const d=new Date(),hoje=window.SP.key(d.getFullYear(),d.getMonth()+1),brl=n=>'R$ '+Number(n||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
  const ord={atencao:0,final:1,andamento:2,livre:3};
  const l=sentencas.map(it=>({it,r:window.SP.calcular(it,hoje)})).filter(x=>!x.r.quitada&&x.r.modo!=='livre').sort((a,b)=>(ord[a.r.situacao]-ord[b.r.situacao])||String(a.r.termino||'9').localeCompare(String(b.r.termino||'9')));
  if(!l.length){box.innerHTML='';return;}
  const crit=l.some(x=>x.r.situacao==='atencao'),mostra=l.slice(0,6);
  const lido=sentencas.map(i=>i.lidoEm).filter(Boolean).sort().pop();
  box.innerHTML='<div class="asent'+(crit?' crit':'')+'" role="status"><h2>⚖️ Sentenças judiciais: quanto falta para acabar <span class="tg">'+l.length+' em andamento</span>'+(SENTENCAS_URL?'<a href="'+esc(SENTENCAS_URL)+'" target="_top">Ver todas ›</a>':'')+'</h2><ul>'+
    mostra.map(({it,r})=>{
      const falta=r.modo==='parcelas'?r.faltaParcelas+(r.faltaParcelas===1?' parcela':' parcelas'):brl(r.falta);
      const tg=r.situacao==='atencao'?'<span class="tg atencao">Atenção</span>':r.situacao==='final'?'<span class="tg final">Reta final</span>':'';
      return '<li><span><b>'+esc(it.nome)+'</b> · evento '+esc(window.SP.rotuloEventos(it))+'</span>'+tg+'<span class="qt">Falta <b>'+esc(falta)+'</b>'+(r.mesesRest!=null?' · '+r.mesesRest+(r.mesesRest===1?' mês':' meses')+' (até '+window.SP.fmtKey(r.termino)+')':'')+'</span></li>';
    }).join('')+'</ul>'+(l.length>mostra.length?'<small>Mais '+(l.length-mostra.length)+' em andamento no sistema de Sentenças.</small>':'')+
    (lido?'<small>Valores da última leitura da ficha financeira, em '+new Date(lido).toLocaleDateString('pt-BR')+'. Ela é atualizada pelo Centi quando alguém abre a sentença no sistema de Sentenças judiciais.</small>':'')+'</div>';
}
async function carregarSentencas(){
  try{const s=await dbh.doc('sentencas/lista').get();if(s.exists){const j=JSON.parse(s.data().json);sentencas=j&&Array.isArray(j.itens)?j.itens:null;}}catch(e){sentencas=null;}
  renderAlertaSent();
}
function render(){
  if(carregando){
    $('#count').textContent='';$('#editBtn').hidden=true;$('#editInfo').innerHTML='';
    $('#grid').innerHTML=Array.from({length:8},()=>'<div class="tile skel" aria-hidden="true"><i style="width:38px;height:38px;border-radius:10px;flex:none"></i><div class="tx" style="display:grid;gap:7px"><i style="width:60%;height:14px"></i><i style="height:11px"></i></div></div>').join('');
    $('#grid').setAttribute('aria-busy','true');return;
  }
  $('#grid').removeAttribute('aria-busy');
  const q=filter.trim().toLowerCase();
  const tiles=st.tiles.filter(t=>!q||(t.nome+' '+t.desc).toLowerCase().includes(q));
  $('#count').textContent=st.tiles.length+(st.tiles.length===1?' sistema':' sistemas');
  if(edit&&!podeEditar()) edit=false;
  $('#editBtn').hidden=!podeEditar();
  $('#editBtn').innerHTML=edit?'Concluir edição':'Editar painel';
  $('#editBtn').className='btn'+(edit?' primary':'');
  $('#editInfo').innerHTML=edit?'<div class="edit-banner">Modo de edição: arraste os cartões para reordenar (ou use as setas), altere nome e descrição, exclua ou adicione sistemas. Para abrir um sistema, conclua a edição.</div>':'';
  const cards=tiles.map(t=>{
    const i=st.tiles.indexOf(t);
    const on=t.status==='ok'&&t.url;
    const style=`--tint:hsl(${t.hue} 70% ${document.documentElement.dataset.theme==='dark'?'22%':'93%'});--ink:hsl(${t.hue} 60% 38%)`;
    const pill=t.status==='ok'?'':`<span class="pill ${t.status==='dev'?'warn':''}">${STATUS[t.status]||''}</span>`;
    const inner=`<div class="ico">${svg(t.icone,20)}</div><div class="tx"><h3>${esc(t.nome)}</h3><p title="${esc(t.desc)}">${esc(t.desc)}</p></div>`;
    if(edit) return `<div class="tile edit" data-id="${t.id}" draggable="true" style="${style}">${inner}${pill}
      <div class="tools"><button class="btn sm" data-a="edit" data-id="${t.id}">Editar</button><button class="btn sm" data-a="up" data-id="${t.id}"${i===0?' disabled':''} aria-label="Mover para antes">↑</button><button class="btn sm" data-a="down" data-id="${t.id}"${i===st.tiles.length-1?' disabled':''} aria-label="Mover para depois">↓</button><button class="btn sm danger" data-a="del" data-id="${t.id}">Excluir</button></div></div>`;
    const foot=`${pill}${on?'<svg class="go" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>':''}`;
    return on?`<a class="tile" style="${style}" href="${esc(t.url)}" target="_top">${inner}${foot}</a>`
             :`<div class="tile off" style="${style}">${inner}${foot}</div>`;
  });
  if(edit) cards.push(`<button class="tile add" data-a="add" type="button"><span style="font-size:30px;line-height:1">+</span><b>Adicionar sistema</b></button>`);
  $('#grid').innerHTML=cards.join('')||'<div class="empty" style="grid-column:1/-1">Nenhum sistema encontrado.</div>';
}

function openForm(t){
  const isNew=!t.id;
  const d=Object.assign({nome:'',desc:'',icone:'grid',hue:212,status:'dev',url:''},t);
  const m=$('#modal');
  m.innerHTML=`<form class="modal" autocomplete="off"><h3>${isNew?'Novo sistema':'Editar sistema'}</h3>
   <label class="fld">Nome<input name="nome" value="${esc(d.nome)}" required maxlength="70"></label>
   <label class="fld">Descrição<textarea name="desc" rows="3" maxlength="220">${esc(d.desc)}</textarea></label>
   <div class="r2"><label class="fld">Situação<select name="status">${Object.keys(STATUS).map(k=>`<option value="${k}"${k===d.status?' selected':''}>${STATUS[k]}</option>`).join('')}</select></label>
   <label class="fld">Endereço (link)<input name="url" value="${esc(d.url)}" placeholder="ex.: ferias/ ou https://…"></label></div>
   <div class="fld">Ícone<div class="icons">${Object.keys(ICONS).map(k=>`<button type="button" data-ic="${k}" aria-pressed="${k===d.icone}" aria-label="${k}">${svg(k,20)}</button>`).join('')}</div></div>
   <div class="fld">Cor<div class="hues">${HUES.map(h=>`<button type="button" data-h="${h}" style="--h:${h}" aria-pressed="${h===d.hue}" aria-label="Cor ${h}"></button>`).join('')}</div></div>
   <div class="actions"><button type="button" class="btn" data-a="close">Cancelar</button><button class="btn primary" type="submit">Salvar</button></div></form>`;
  m.hidden=false;
  const f=m.querySelector('form');
  f.addEventListener('click',ev=>{
    const ic=ev.target.closest('[data-ic]'),h=ev.target.closest('[data-h]');
    if(ic){d.icone=ic.dataset.ic;f.querySelectorAll('[data-ic]').forEach(b=>b.setAttribute('aria-pressed',b===ic));}
    if(h){d.hue=Number(h.dataset.h);f.querySelectorAll('[data-h]').forEach(b=>b.setAttribute('aria-pressed',b===h));}
  });
  f.addEventListener('submit',ev=>{
    ev.preventDefault();
    const E=f.elements;d.nome=E.nome.value.trim();d.desc=E.desc.value.trim();d.status=E.status.value;d.url=E.url.value.trim();
    if(!d.nome) return;
    if(isNew){d.id=uid();st.tiles.push(d);}else{const i=st.tiles.findIndex(x=>x.id===d.id);st.tiles[i]=d;}
    persist();closeModal();render();
  });
  f.elements.nome.focus();
}
function closeModal(){const m=$('#modal');m.hidden=true;m.innerHTML='';}

document.addEventListener('click',ev=>{
  if(ev.target.id==='modal'){closeModal();return;}
  const b=ev.target.closest('[data-a]');if(!b) return;
  const id=b.dataset.id,i=st.tiles.findIndex(t=>t.id===id);
  switch(b.dataset.a){
    case 'close':closeModal();break;
    case 'add':openForm({});break;
    case 'edit':openForm(Object.assign({},st.tiles[i]));break;
    case 'up':if(i>0){[st.tiles[i-1],st.tiles[i]]=[st.tiles[i],st.tiles[i-1]];persist();render();}break;
    case 'down':if(i<st.tiles.length-1){[st.tiles[i+1],st.tiles[i]]=[st.tiles[i],st.tiles[i+1]];persist();render();}break;
    case 'del':
      if(b.dataset.sure){st.tiles.splice(i,1);persist();render();toast('Sistema removido do painel.');}
      else{b.dataset.sure='1';b.textContent='Confirmar exclusão';setTimeout(()=>{if(b.isConnected){delete b.dataset.sure;b.textContent='Excluir';}},4000);}
      break;
  }
});
$('#editBtn').addEventListener('click',()=>{if(!podeEditar()) return;edit=!edit;render();});
/* arrastar e soltar para reordenar (no celular, as setas) */
let dragId=null;
function mover(de,para){
  const i=st.tiles.findIndex(x=>x.id===de),j=st.tiles.findIndex(x=>x.id===para);
  if(i<0||j<0||i===j) return;
  const [t]=st.tiles.splice(i,1);st.tiles.splice(j,0,t);persist();render();
}
(function arrastar(){
  const g=$('#grid');
  g.addEventListener('dragstart',ev=>{const t=ev.target.closest&&ev.target.closest('.tile[data-id]');if(!edit||!t||ev.target.closest('button')) return;dragId=t.dataset.id;ev.dataTransfer.effectAllowed='move';try{ev.dataTransfer.setData('text/plain',dragId);}catch(e){}t.classList.add('dragging');});
  g.addEventListener('dragover',ev=>{if(!edit||!dragId) return;const t=ev.target.closest('.tile[data-id]');if(!t) return;ev.preventDefault();g.querySelectorAll('.over').forEach(x=>{if(x!==t) x.classList.remove('over');});if(t.dataset.id!==dragId) t.classList.add('over');});
  g.addEventListener('drop',ev=>{if(!edit||!dragId) return;const t=ev.target.closest('.tile[data-id]');if(!t) return;ev.preventDefault();const de=dragId;dragId=null;mover(de,t.dataset.id);});
  g.addEventListener('dragend',()=>{dragId=null;render();});
})();
$('#q').addEventListener('input',e=>{filter=e.target.value;render();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#modal').hidden) closeModal();});
ligarTema();                                   // o clique troca o tema; o observador abaixo redesenha o painel
observarTema(()=>{render();themeBtn();});

function migrar(){
  if(!st.v||st.v<2){ // sistemas novos entram no painel salvo
    if(!st.tiles.some(t=>t.id==='t-pessoal')){const d=defaults().tiles.find(t=>t.id==='t-pessoal');st.tiles.splice(Math.min(1,st.tiles.length),0,d);}
    st.v=2;persist();
  }
  if(st.v<3){ // Ponto – Servidores Externos entra depois da Hierarquia de Pessoal
    if(!st.tiles.some(t=>t.id==='t-ponto')){const d=defaults().tiles.find(t=>t.id==='t-ponto');const i=st.tiles.findIndex(t=>t.id==='t-pessoal');st.tiles.splice(i>=0?i+1:st.tiles.length,0,d);}
    st.v=3;persist();
  }
  if(st.v<4){ // Férias entra no painel (ou deixa de ser "planejado") depois do Ponto
    const d=defaults().tiles.find(t=>t.id==='t-ferias'),t=st.tiles.find(x=>x.id==='t-ferias');
    if(t) Object.assign(t,{nome:d.nome,desc:d.desc,status:'ok',url:FERIAS_URL});
    else{const i=st.tiles.findIndex(x=>x.id==='t-ponto');st.tiles.splice(i>=0?i+1:st.tiles.length,0,d);}
    st.v=4;persist();
  }
  if(st.v<5){ // Tarefas do RH entra depois de Férias
    if(!st.tiles.some(x=>x.id==='t-tarefas')){const d=defaults().tiles.find(t=>t.id==='t-tarefas');const i=st.tiles.findIndex(x=>x.id==='t-ferias');st.tiles.splice(i>=0?i+1:st.tiles.length,0,d);}
    st.v=5;persist();
  }
  if(st.v<6){ // Carimbos em PDF entra depois de Tarefas
    if(!st.tiles.some(x=>x.id==='t-carimbos')){const d=defaults().tiles.find(t=>t.id==='t-carimbos');const i=st.tiles.findIndex(x=>x.id==='t-tarefas');st.tiles.splice(i>=0?i+1:st.tiles.length,0,d);}
    st.v=6;persist();
  }
  if(st.v<7){ // Licença-prêmio entra depois de Férias
    if(!st.tiles.some(x=>x.id==='t-licenca')){const d=defaults().tiles.find(t=>t.id==='t-licenca');const i=st.tiles.findIndex(x=>x.id==='t-ferias');st.tiles.splice(i>=0?i+1:st.tiles.length,0,d);}
    st.v=7;persist();
  }
  if(st.v<8){ // Gerador de Documentos entra depois de Carimbos
    if(!st.tiles.some(x=>x.id==='t-documentos')){const d=defaults().tiles.find(t=>t.id==='t-documentos');const i=st.tiles.findIndex(x=>x.id==='t-carimbos');st.tiles.splice(i>=0?i+1:st.tiles.length,0,d);}
    st.v=8;persist();
  }
  if(st.v<9){ // "Carimbos em PDF" passa a "Espelhos de ponto" (só se o nome ainda for o original)
    const t=st.tiles.find(x=>x.id==='t-carimbos'),d=defaults().tiles.find(x=>x.id==='t-carimbos');
    if(t&&t.nome==='Carimbos em PDF'){t.nome=d.nome;t.desc=d.desc;}
    st.v=9;persist();
  }
  if(st.v<10){ // painéis que já tinham o nome "Espelhos de Ponto - Carimbo" (editado à mão) também passam a "Espelhos de ponto"
    const t=st.tiles.find(x=>x.id==='t-carimbos'),d=defaults().tiles.find(x=>x.id==='t-carimbos');
    const nn=String((t&&t.nome)||'').toLowerCase().replace(/\s+/g,' ').trim();
    if(t&&(nn==='espelhos de ponto - carimbo'||nn==='espelhos de ponto – carimbo'||nn==='espelhos de ponto - carimbos')){t.nome=d.nome;t.desc=d.desc;}
    st.v=10;persist();
  }
  if(st.v<11){ // descrição do cartão: "entregue" passa a "devolvido ao RH" (só se ainda for a descrição anterior)
    const t=st.tiles.find(x=>x.id==='t-carimbos');
    if(t&&t.desc===ANTIGA_DESC_ESPELHOS) t.desc=defaults().tiles.find(x=>x.id==='t-carimbos').desc;
    st.v=11;persist();
  }
  if(st.v<12){ // a pasta de Espelhos de ponto passou de carimbos/ para espelho/ (quem já tinha o endereço antigo salvo no painel)
    const t=st.tiles.find(x=>x.id==='t-carimbos');
    if(t&&/^\/?carimbos\/?$/.test(String(t.url||''))) t.url='espelho/';
    st.v=12;persist();
  }
  if(st.v<13){ // Sentenças judiciais entra depois de Licença-prêmio
    if(!st.tiles.some(x=>x.id==='t-sentencas')){const d=defaults().tiles.find(t=>t.id==='t-sentencas');const i=st.tiles.findIndex(x=>x.id==='t-licenca');st.tiles.splice(i>=0?i+1:st.tiles.length,0,d);}
    st.v=13;persist();
  }
}
(function init(){
    const l=load(),c=lerCache();
  if(l) st=l;                        // modo local: dados deste navegador
  else if(c) st=c;                   // última cópia do servidor: aparece na hora, sem piscar os nomes originais
  else if(PB.url) carregando=true;   // sem cópia: espera o servidor em vez de mostrar os nomes originais do código
  if(!carregando) migrar();
  // mantém o endereço do sistema de fluxogramas atualizado
  const fl=st.tiles.find(t=>t.id==='t-fluxos'); if(fl&&!fl.url) fl.url=FLOW_URL;
  $('#storeNote').textContent=PB.url?'':'As alterações deste painel ficam salvas neste navegador.';
  render();themeBtn();saudacao();
  (async()=>{
    try{
      if(window.claude&&window.claude.use) dbh=await window.claude.use('db');
      if(!dbh) dbh=await PB.connect();
      saudacao();
      if(dbh){
        $('#storeNote').textContent=podeEditar()?'As alterações deste painel ficam salvas no servidor.':'O painel é editado pelos administradores.';
        render();
        carregarSentencas();
        const s=await dbh.doc('painel/tiles').get();
        if(s.exists){try{const d=JSON.parse(s.data().json);if(d&&Array.isArray(d.tiles)){st=d;carregando=false;migrar();guardarCache();render();}}catch(e){}}
        else if(load()&&podeEditar()){
          await dbh.doc('painel/tiles').set({json:JSON.stringify(st)});
          const v=await dbh.doc('painel/tiles').get();
          if(v.exists){try{localStorage.removeItem(LS);}catch(e){}toast('Dados deste navegador enviados ao servidor.');}
        }
      }
    }catch(e){dbh=null;}
    if(carregando){carregando=false;migrar();render();}      // servidor sem resposta ou sem painel salvo: mostra o que há
  })();
})();
</script>
