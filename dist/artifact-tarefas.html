<title>Tarefas do RH</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@500;600;700&family=Public+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#eef4f0;--surface:#fff;--fg:#12281d;--muted:#4f665a;--line:#d1ddd6;--accent:#0a6b3d;--accent-fg:#fff;--soft:#e3efe8;
  --hero-a:#063d27;--hero-b:#0b7a49;--gold:#d4aa4a;--shadow:0 1px 2px rgba(6,61,39,.09),0 6px 20px rgba(6,61,39,.07);
  --warn:#8a5a00;--warn-bg:#fdf0d5;--danger:#b3261e;--danger-bg:#fbe3e0;--blue:#2f6fb5;--blue-bg:#e2edf9;--ok:#0a6b3d;--ok-bg:#dff3e7;--violet:#6f4aa8;--violet-bg:#eee6f8;
  --col:#e6eee9;
  --f-display:"Libre Franklin",system-ui,sans-serif;--f-body:"Public Sans",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#08130e;--surface:#0f1e17;--fg:#e3f1ea;--muted:#90b0a0;--line:#234034;--accent:#52c98a;--accent-fg:#04210f;--soft:#15291f;
  --hero-a:#04150d;--hero-b:#0b4d31;--gold:#d8b45e;--shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.3);
  --warn:#f0c26a;--warn-bg:#3a2d10;--danger:#ff8a80;--danger-bg:#3d1a17;--blue:#7fb2ee;--blue-bg:#14273d;--ok:#52c98a;--ok-bg:#12382a;--violet:#b99be8;--violet-bg:#2a1f3d;--col:#0c1913;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#08130e;--surface:#0f1e17;--fg:#e3f1ea;--muted:#90b0a0;--line:#234034;--accent:#52c98a;--accent-fg:#04210f;--soft:#15291f;
  --hero-a:#04150d;--hero-b:#0b4d31;--gold:#d8b45e;--shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.3);
  --warn:#f0c26a;--warn-bg:#3a2d10;--danger:#ff8a80;--danger-bg:#3d1a17;--blue:#7fb2ee;--blue-bg:#14273d;--ok:#52c98a;--ok-bg:#12382a;--violet:#b99be8;--violet-bg:#2a1f3d;--col:#0c1913;color-scheme:dark}
[hidden]{display:none!important}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5}
h1,h2,h3,h4{font-family:var(--f-display);margin:0;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.inner{max-width:1280px;margin:0 auto}
.hero{background:linear-gradient(135deg,var(--hero-a),var(--hero-b));color:#fff;padding-block:22px 54px}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:22px}
.home{color:#fff;text-decoration:none;font-weight:600;font-size:13.5px;display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border-radius:10px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.28)}
.home:hover,.themebtn:hover{background:rgba(255,255,255,.22)}
.themebtn{margin-left:auto;display:inline-flex;align-items:center;gap:8px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.12);color:#fff;border-radius:10px;padding:8px 12px;font-weight:600;font-size:13.5px;cursor:pointer}
.goldrule{width:56px;height:4px;background:var(--gold);border-radius:2px;margin:0 0 14px}
.hero h1{font-size:clamp(1.6rem,4.4vw,2.4rem);line-height:1.12}
.hero p{margin:8px 0 0;opacity:.85}
main{padding-block:0 40px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:12px;margin-top:-30px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 16px;box-shadow:var(--shadow)}
.stat b{font-family:var(--f-display);font-size:1.6rem;display:block;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:13px}
.stat.late b{color:var(--danger)}.stat.priv b{color:var(--violet)}.stat.done b{color:var(--ok)}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:18px}
.search{flex:1 1 220px;display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 14px;box-shadow:var(--shadow);min-width:0}
.search input{border:0;background:transparent;outline:0;padding:11px 0;flex:1;min-width:0}
.search:focus-within{border-color:var(--accent)}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px;box-shadow:var(--shadow)}
.seg button{border:0;background:transparent;padding:7px 12px;border-radius:8px;font-weight:600;font-size:13.5px;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--accent);color:var(--accent-fg)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;cursor:pointer;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:8px;box-shadow:var(--shadow)}
.btn:hover{border-color:var(--accent)}.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}.btn.danger{color:var(--danger)}.btn.sm{padding:4px 9px;font-size:12.5px;box-shadow:none}.btn:disabled{opacity:.6;cursor:wait}
.chk{display:inline-flex;align-items:center;gap:8px;font-size:13.5px;color:var(--muted);cursor:pointer}
.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:16px;align-items:start}
@media (max-width:900px){.board{grid-template-columns:minmax(0,1fr)}}
.col{background:var(--col);border:1px solid var(--line);border-radius:16px;padding:12px;min-height:160px}
.col.over{outline:2px dashed var(--accent);outline-offset:2px;background:var(--soft)}
.col>h2{font-size:.98rem;display:flex;align-items:center;gap:8px;margin:2px 4px 10px}
.col>h2 i{width:10px;height:10px;border-radius:50%;display:inline-block;background:var(--cc)}
.col>h2 span.n{margin-left:auto;background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:0 9px;font-size:12.5px;font-weight:700;color:var(--muted)}
.col>h2 .add{border:0;background:transparent;color:var(--accent);font-weight:700;font-size:20px;line-height:1;cursor:pointer;padding:0 4px}
.card{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--pc,var(--line));border-radius:12px;padding:10px 12px;box-shadow:var(--shadow);margin-bottom:9px}
.card.dragging{opacity:.4}
.card h3{font-size:.98rem;line-height:1.3;overflow-wrap:anywhere}
.card.done h3{text-decoration:line-through;color:var(--muted)}
.card p{margin:4px 0 0;color:var(--muted);font-size:13.5px;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-line}
.meta{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px;align-items:center}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--soft);color:var(--muted);white-space:nowrap}
.tag.eq{background:var(--blue-bg);color:var(--blue)}.tag.pv{background:var(--violet-bg);color:var(--violet)}.tag.late{background:var(--danger-bg);color:var(--danger)}.tag.ok{background:var(--ok-bg);color:var(--ok)}
.tag.p-urgente{background:var(--danger-bg);color:var(--danger)}.tag.p-alta{background:var(--warn-bg);color:var(--warn)}
.who{font-size:12px;color:var(--muted)}
.acts{display:flex;gap:4px;margin-top:8px;flex-wrap:wrap;align-items:center}.acts .sp{flex:1}
.vazio{color:var(--muted);font-size:13.5px;text-align:center;padding:16px 6px}
.arq{margin-top:18px}
.arq h2{font-size:1rem;margin-bottom:8px}.arq .mes{font-weight:700;color:var(--muted);margin:10px 2px 4px;font-size:13px}
.banner{margin-top:14px;border-radius:12px;padding:12px 16px;font-size:13.5px;background:var(--warn-bg);color:var(--warn)}
.banner.err{background:var(--danger-bg);color:var(--danger)}
.note{margin-top:16px;font-size:12.8px;color:var(--muted)}
dialog{border:1px solid var(--line);border-radius:16px;padding:0;background:var(--surface);color:var(--fg);width:min(540px,96vw);box-shadow:0 20px 60px rgba(0,0,0,.4)}
dialog::backdrop{background:rgba(0,0,0,.5)}
dialog form{padding:20px;display:flex;flex-direction:column;gap:12px;max-height:90vh;overflow:auto}
dialog h3{font-size:1.15rem}dialog p{margin:0;font-size:14px}
dialog label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:600}
dialog input[type=text],dialog input[type=date],dialog select,dialog textarea{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--fg);font-weight:400;width:100%}
dialog textarea{min-height:84px;resize:vertical}
dialog .row{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
dialog .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
fieldset.rec{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:0}
fieldset.rec legend{font-weight:700;font-size:13px;padding:0 6px;color:var(--fg)}
.tag.rc{background:var(--soft);color:var(--accent)}
fieldset.vis{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:0}
fieldset.vis legend{font-weight:700;font-size:13px;padding:0 6px;color:var(--fg)}
.opt{display:flex;gap:10px;align-items:flex-start;padding:9px 10px;border:1px solid var(--line);border-radius:10px;margin:6px 0;cursor:pointer}
.opt:has(input:checked){border-color:var(--accent);background:var(--soft)}
.opt input{margin-top:4px}.opt b{display:block;font-size:14px}.opt span{font-size:12.8px;color:var(--muted)}
.opt.lock{opacity:.6;cursor:not-allowed}
.hint{font-size:12.8px;color:var(--muted)}
#load{position:fixed;inset:0;z-index:9000;display:grid;place-items:center;padding:24px;background:radial-gradient(1200px 700px at 50% 30%,var(--hero-b),var(--hero-a)) var(--hero-a);color:#fff;text-align:center}
#load .ld-box{display:flex;flex-direction:column;align-items:center;gap:10px;max-width:420px}
#load .ld-spin{width:56px;height:56px;border-radius:50%;border:5px solid rgba(255,255,255,.22);border-top-color:var(--gold);animation:ld-rot .9s linear infinite;margin-bottom:6px}
#load b{font-family:var(--f-display);font-size:1.35rem;line-height:1.2}
#load span{opacity:.88;font-size:14.5px;min-height:22px}
#load .ld-bar{width:min(260px,70vw);height:5px;border-radius:99px;background:rgba(255,255,255,.2);overflow:hidden;margin-top:8px}
#load .ld-bar i{display:block;height:100%;width:40%;border-radius:99px;background:var(--gold);animation:ld-bar 1.4s ease-in-out infinite}
@keyframes ld-rot{to{transform:rotate(360deg)}}@keyframes ld-bar{0%{margin-left:-40%}100%{margin-left:100%}}
@media (prefers-reduced-motion:reduce){#load .ld-spin,#load .ld-bar i{animation-duration:3s}}
body.carregando{overflow:hidden}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:max(18px,env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:60;max-width:90vw}
@media (pointer:coarse){input,select,textarea{font-size:16px}.btn{min-height:42px}.btn.sm{min-height:38px}}
</style>

  <div class="top"><a class="home" href="../" target="_top"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-8 9 8M5 10v10h5v-6h4v6h5V10"/></svg>Sistema Interno do RH</a>
  <button class="themebtn" id="themeBtn" type="button"></button></div>

  <div class="stats" id="stats"></div>

    <label class="search"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="q" type="search" placeholder="Buscar tarefa" aria-label="Buscar" autocomplete="off"></label>
    <div class="seg" id="seg" role="group" aria-label="Mostrar"><button type="button" data-v="" class="on">Todas</button><button type="button" data-v="eq">Da equipe</button><button type="button" data-v="pv">Só minhas (privadas)</button></div>

<div id="toast" hidden></div>

<script>
/* =====================================================================
   PocketBase: armazenamento no servidor (substitui o localStorage)
   Expõe PB.connect(), que devolve um objeto "dbh" com a mesma forma
   usada pelo restante do sistema: dbh.doc('a/b').get/set/delete e
   dbh.collection('versoes').orderBy('at','desc').limit(n).get()
   ===================================================================== */
const PB=(function(){
  const URL_BASE='https://pb.devgabriel.app.br'.replace(/\/+$/,'');
  const CENTI_BASE=''.replace(/\/+$/,'');   // vazio = mesmo endereço do site (funções em /api)
  const AUTH_KEY='rhcrv-pb-auth';
  let token='',email='',col='rhcmrv_users',loginP=null;
  let cs=null;   // sessão do Centi: {user,nome,token,refreshToken}

  /* só vale a sessão que tem o acesso do Centi junto; sessões antigas (login simples) pedem novo login */
  function readAuth(){try{const a=JSON.parse(localStorage.getItem(AUTH_KEY)||'null');if(a&&a.token&&a.centi&&a.centi.token){token=a.token;email=a.email||'';col=a.col||'rhcmrv_users';cs=a.centi;}}catch(e){}}
  function saveAuth(){try{localStorage.setItem(AUTH_KEY,JSON.stringify({token,email,col,centi:cs}));}catch(e){}}
  function clearAuth(){token='';email='';col='rhcmrv_users';cs=null;try{localStorage.removeItem(AUTH_KEY);}catch(e){}}

  async function raw(method,path,body){
    const h={};
    if(body!==undefined) h['Content-Type']='application/json';
    if(token) h.Authorization=token;
    const r=await fetch(URL_BASE+path,{method,headers:h,body:body===undefined?undefined:JSON.stringify(body)});
    if(r.status===204) return null;
    let j=null; try{j=await r.json();}catch(e){}
    if(!r.ok){const err=new Error((j&&j.message)||('HTTP '+r.status));err.status=r.status;throw err;}
    return j;
  }
  async function api(method,path,body){
    try{return await raw(method,path,body);}
    catch(e){
      if(e.status===401||e.status===403){
        clearAuth();
        if(await login()) return raw(method,path,body);
      }
      throw e;
    }
  }

  /* ---------- login ---------- */
  function login(msg){
    if(loginP) return loginP;
    loginP=new Promise(resolve=>{
      const wrap=document.createElement('div');
      wrap.style.cssText='position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(0,0,0,.45)';
      wrap.innerHTML=
        '<form style="width:100%;max-width:360px;background:var(--surface,#fff);color:var(--fg,#12281d);border:1px solid var(--line,#d1ddd6);border-radius:12px;padding:22px;box-shadow:0 10px 40px rgba(0,0,0,.3);font:15px/1.4 system-ui,sans-serif">'+
        '<h3 style="margin:0 0 4px;font-size:18px">Entrar com o acesso do Centi</h3>'+
        '<p style="margin:0 0 14px;color:var(--muted,#4f665a);font-size:13px">Use o mesmo usuário e senha do Centi. A senha é conferida no Centi e não fica guardada neste sistema.</p>'+
        '<label style="display:block;font-size:13px;margin-bottom:10px">Usuário do Centi<input name="e" type="text" required autocapitalize="none" spellcheck="false" autocomplete="username" style="display:block;width:100%;box-sizing:border-box;margin-top:4px;padding:9px;border:1px solid var(--line,#d1ddd6);border-radius:8px;background:transparent;color:inherit;font:inherit"></label>'+
        '<label style="display:block;font-size:13px;margin-bottom:10px">Senha<input name="p" type="password" required autocomplete="current-password" style="display:block;width:100%;box-sizing:border-box;margin-top:4px;padding:9px;border:1px solid var(--line,#d1ddd6);border-radius:8px;background:transparent;color:inherit;font:inherit"></label>'+
        '<div data-err style="min-height:18px;margin-bottom:8px;color:#c0392b;font-size:13px"></div>'+
        '<div style="display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap">'+
        '<button type="submit" style="padding:9px 16px;border:0;border-radius:8px;background:var(--accent,#0a6b3d);color:var(--accent-fg,#fff);font:inherit;font-weight:600;cursor:pointer">Entrar</button></div></form>';
      document.body.appendChild(wrap);
      const f=wrap.querySelector('form'),err=wrap.querySelector('[data-err]');
      if(msg) err.textContent=msg;
      const done=ok=>{wrap.remove();loginP=null;resolve(ok);};
      f.e.focus();
      f.addEventListener('submit',async ev=>{
        ev.preventDefault(); err.textContent='Entrando…';
        try{
          const r=await fetch(CENTI_BASE+'/api/centi-login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user:f.e.value.trim(),pass:f.p.value})});
          let j=null; try{j=await r.json();}catch(e){}
          if(!r.ok){err.textContent=(j&&j.message)||('Não foi possível entrar (HTTP '+r.status+').');return;}
          token=j.pb.token; col='rhcmrv_users'; email=j.centi.user; cs=j.centi; saveAuth(); done(true);
        }catch(e){err.textContent='Não foi possível entrar: '+e.message;}
      });
    });
    return loginP;
  }

  /* ---------- documentos ---------- */
  const ids={};   // cache de id de registro por caminho
  const esc=s=>String(s).replace(/\\/g,'\\\\').replace(/"/g,'\\"');
  const spec=path=>{
    const i=path.indexOf('/'),col=path.slice(0,i),id=path.slice(i+1);
    return col==='versoes'?{c:'rhcmrv_versoes',f:'vid',k:id}:{c:'rhcmrv_docs',f:'key',k:path};
  };
  async function find(path){
    const s=spec(path);
    const q='?perPage=1&filter='+encodeURIComponent(s.f+'="'+esc(s.k)+'"');
    const r=await api('GET','/api/collections/'+s.c+'/records'+q);
    const rec=r.items&&r.items[0];
    if(rec) ids[path]=rec.id; else delete ids[path];
    return rec||null;
  }
  const payload=(s,data)=>s.c==='rhcmrv_versoes'?Object.assign({vid:s.k},data):{key:s.k,data};
  const unwrap=(s,rec)=>s.c==='rhcmrv_versoes'?{at:rec.at,label:rec.label,json:rec.json}:rec.data;

  function doc(path){
    const s=spec(path);
    return {
      async get(){const rec=await find(path);return {exists:!!rec,id:s.k,data:()=>rec?unwrap(s,rec):undefined};},
      async set(data){
        if(!ids[path]) await find(path);
        if(ids[path]) await api('PATCH','/api/collections/'+s.c+'/records/'+ids[path],payload(s,data));
        else{const r=await api('POST','/api/collections/'+s.c+'/records',payload(s,data));ids[path]=r.id;}
      },
      async delete(){
        if(!ids[path]) await find(path);
        if(ids[path]){await api('DELETE','/api/collections/'+s.c+'/records/'+ids[path]);delete ids[path];}
      }
    };
  }
  function collection(name){
    const q={sort:'',n:30};
    const api_={
      orderBy(f,dir){q.sort=(dir==='desc'?'-':'')+f;return api_;},
      limit(n){q.n=n;return api_;},
      async get(){
        const r=await api('GET','/api/collections/rhcmrv_'+name+'/records?perPage='+q.n+(q.sort?'&sort='+encodeURIComponent(q.sort):''));
        return {docs:r.items.map(rec=>({id:rec.vid,data:()=>({at:rec.at,label:rec.label,json:rec.json})}))};
      }
    };
    return api_;
  }

  /* ---------- tarefas (coleção rhcmrv_tarefas; as regras do servidor mostram só as compartilhadas e as do próprio dono) ---------- */
  const TAREFAS='/api/collections/rhcmrv_tarefas/records';
  const userId=()=>{try{const b=token.split('.')[1].replace(/-/g,'+').replace(/_/g,'/');return JSON.parse(decodeURIComponent(escape(atob(b+'='.repeat((4-b.length%4)%4))))).id||'';}catch(e){return '';}};
  async function todas(filtro){
    let page=1,out=[];
    for(;;){
      const r=await api('GET',TAREFAS+'?perPage=200&page='+page+'&sort=-criada_em'+(filtro?'&filter='+encodeURIComponent(filtro):''));
      out=out.concat(r.items||[]);
      if(!r.totalPages||page>=r.totalPages) return out;
      page++;
    }
  }
  /* tempo real do PocketBase (SSE): cada evento só chega se as regras do servidor deixam esta conta ver a tarefa (privadas de outros não chegam) */
  function ouvirTarefas(cb){
    let es=null,parado=false;
    const abrir=()=>{
      if(parado||typeof EventSource==='undefined') return;
      es=new EventSource(URL_BASE+'/api/realtime');
      es.addEventListener('PB_CONNECT',async ev=>{
        try{
          const id=(JSON.parse(ev.data||'{}').clientId)||ev.lastEventId;
          await fetch(URL_BASE+'/api/realtime',{method:'POST',headers:{'Content-Type':'application/json',Authorization:token},body:JSON.stringify({clientId:id,subscriptions:['rhcmrv_tarefas']})});
        }catch(e){}
      });
      es.addEventListener('rhcmrv_tarefas',ev=>{try{cb(JSON.parse(ev.data));}catch(e){}});
      es.onerror=()=>{};   // o navegador reconecta sozinho e o PB_CONNECT assina de novo
    };
    abrir();
    return ()=>{parado=true;if(es) es.close();};
  }
  const tarefas={
    listen:ouvirTarefas,
    list:todas,
    create:d=>api('POST',TAREFAS,Object.assign({dono:userId()},d)),
    update:(id,d)=>api('PATCH',TAREFAS+'/'+id,d),
    remove:id=>api('DELETE',TAREFAS+'/'+id)
  };

  /* ---------- API do Centi (pelo servidor do sistema, com o acesso da própria pessoa) ---------- */
  async function centiCall(path,body){
    if(!cs) throw new Error('Sem sessão do Centi. Entre novamente.');
    const r=await fetch(CENTI_BASE+'/api/centi',{method:'POST',
      headers:{'Content-Type':'application/json','x-centi-user':cs.user,'x-centi-token':cs.token,'x-centi-refresh':cs.refreshToken||''},
      body:JSON.stringify({path,body})});
    const nt=r.headers.get('x-centi-token'),nr=r.headers.get('x-centi-refresh');
    if(nt){cs.token=nt;if(nr)cs.refreshToken=nr;saveAuth();}   // o Centi renova o token sozinho
    let j=null; try{j=await r.json();}catch(e){}
    if(!r.ok){
      if(r.status===401){clearAuth();}
      const err=new Error((j&&j.message)||('Centi: HTTP '+r.status));err.status=r.status;throw err;
    }
    return j;
  }
  /* PB.centi.search('SFuncionario',[{FieldName:'Nome',Operation:6,Value:'%ana%'}]) -> {Data:[...],Count}
     (Operation 6 = contém; a tela de consulta do Centi exige ao menos um filtro com valor) */
  const centi={
    get user(){return cs?cs.user:'';},
    get nome(){return cs?(cs.nome||cs.user):'';},
    /* Cubo funcionário (FP051) do Centi na referência mes/ano -> {Data:[{MATRICULA,NOMEFUNC,CARGO,HIERARQUIA,...}],Total}; só ativos */
    /* Ficha financeira (FP024) da matrícula no mês/ano -> {Fichas:[{Folha,Mes,Ano,TotalProventos,TotalDescontos,LiquidoReceber,Eventos:[...]}]}; não é guardada */
    ficha(matricula,mes,ano){return centiCall('ficha-financeira',{matricula,mes,ano});},
    /* Férias: ativos (FP051) + gozos de férias (FP273) -> {Pessoas:[...],Gozos:[{MATRICULA,DTAQUIINI,DTAQUIFIN,SALDO,GOZOINICIAL,GOZOFINAL,...}]} */
    ferias(mes,ano){return centiCall('ferias',{mes,ano});},
    cubo(mes,ano){return centiCall('cubo-funcionario',{mes,ano});},
    search(entity,filters,start,depth){
      return centiCall('restauth/searchentity',{Depth:depth||50,Entity:entity,Start:start==null?1:start,
        Filters:(filters||[]).map(f=>Object.assign({List:false,TypeFilter:0,between:''},f))});
    }
  };

  /* ---------- conexão ---------- */
  const sleep=ms=>new Promise(r=>setTimeout(r,ms));
  async function alive(){
    for(let i=0;i<3;i++){
      const ac=new AbortController(),t=setTimeout(()=>ac.abort(),6000);
      try{const r=await fetch(URL_BASE+'/api/health',{cache:'no-store',signal:ac.signal});clearTimeout(t);if(r.ok) return true;}catch(e){clearTimeout(t);}
      if(i<2) await sleep(1500);
    }
    return false;
  }
  const box='position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(0,0,0,.5)';
  const card='width:100%;max-width:380px;background:var(--surface,#fff);color:var(--fg,#12281d);border:1px solid var(--line,#d1ddd6);border-radius:12px;padding:22px;box-shadow:0 10px 40px rgba(0,0,0,.3);font:15px/1.45 system-ui,sans-serif';
  const bt='padding:9px 14px;border-radius:8px;font:inherit;font-weight:600;cursor:pointer;';
  /* servidor fora do ar: pergunta antes de seguir, para não trabalhar sem querer só neste navegador */
  function offlineDialog(){
    return new Promise(resolve=>{
      const w=document.createElement('div');w.style.cssText=box;
      w.innerHTML='<div role="alertdialog" aria-modal="true" style="'+card+'"><h3 style="margin:0 0 6px;font-size:18px">Sem conexão com o servidor</h3>'+
        '<p style="margin:0 0 14px;color:var(--muted,#4f665a);font-size:13.5px">Não foi possível falar com o servidor dos dados. Verifique a internet e tente de novo. Se continuar só neste navegador, o que você fizer <b>não será salvo no servidor</b> e não aparecerá em outros computadores.</p>'+
        '<div style="display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap"><button type="button" data-loc style="'+bt+'border:1px solid var(--line,#d1ddd6);background:transparent;color:inherit">Usar só neste navegador</button>'+
        '<button type="button" data-retry style="'+bt+'border:0;background:var(--accent,#0a6b3d);color:var(--accent-fg,#fff)">Tentar novamente</button></div></div>';
      document.body.appendChild(w);
      const done=v=>{w.remove();resolve(v);};
      w.querySelector('[data-retry]').addEventListener('click',()=>done(true));
      w.querySelector('[data-loc]').addEventListener('click',()=>done(false));
      w.querySelector('[data-retry]').focus();
    });
  }
  function markLocal(){
    if(document.getElementById('pb-local')) return;
    const b=document.createElement('div');b.id='pb-local';
    b.style.cssText='position:fixed;left:0;right:0;bottom:0;z-index:99998;background:#8a5a00;color:#fff;padding:8px 14px;font:13.5px/1.35 system-ui,sans-serif;display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;text-align:center';
    b.innerHTML='<span>Modo local: os dados ficam só neste navegador e <b>não são salvos no servidor</b>.</span><button type="button" style="border:1px solid #fff;background:transparent;color:#fff;border-radius:7px;padding:3px 10px;font:inherit;font-weight:600;cursor:pointer">Reconectar</button>';
    b.querySelector('button').addEventListener('click',()=>location.reload());
    document.body.appendChild(b);
  }
  async function connect(){
    if(!URL_BASE) return null;
    readAuth();
    for(;;){
      if(!(await alive())){if(await offlineDialog()) continue;markLocal();return null;}
      try{
        let ok=false;
        if(token){
          try{const r=await raw('POST','/api/collections/'+col+'/auth-refresh');token=r.token;email=(r.record&&(r.record.email||r.record.username))||email;saveAuth();ok=true;}
          catch(e){if(e.status!==401&&e.status!==403&&e.status!==404) throw e; clearAuth();}
        }
        if(!ok&&!(await login())){markLocal();return null;}
        return {doc,collection,centi,tarefas};
      }catch(e){
        if(await offlineDialog()) continue;
        markLocal();return null;
      }
    }
  }
  return {connect,centi,logout(){clearAuth();location.reload();},get email(){return email;},get nome(){return centi.nome;},get userId(){return userId();},url:URL_BASE};
})();

const mesNome=iso=>{const m=/^(\d{4})-(\d{2})/.exec(iso||'');if(!m) return '';const t=new Date(+m[1],+m[2]-1,1).toLocaleDateString('pt-BR',{month:'long',year:'numeric'});return t.charAt(0).toUpperCase()+t.slice(1);};

/* ---------- recorrência mensal ----------
   Uma tarefa recorrente tem um "modelo" (coluna "modelo", invisível) e uma ocorrência por mês (serie = id do modelo, ciclo = AAAA-MM).
   O id da ocorrência é calculado a partir do modelo e do mês: se duas pessoas abrirem ao mesmo tempo, o servidor aceita só uma. */
const cicloAtual=()=>hojeIso().slice(0,7);
function idAleatorio(){const a=new Uint8Array(15);(crypto&&crypto.getRandomValues?crypto.getRandomValues(a):a.forEach((_,i)=>a[i]=Math.random()*256));return Array.from(a,x=>'abcdefghijklmnopqrstuvwxyz0123456789'[x%36]).join('');}
function idCiclo(serie,ciclo){   // 15 caracteres a-z0-9, sempre o mesmo para o mesmo par
  const t=serie+'|'+ciclo;let h1=0x811c9dc5,h2=0x9747b28c;
  for(let i=0;i<t.length;i++){const c=t.charCodeAt(i);h1=Math.imul(h1^c,16777619)>>>0;h2=Math.imul(h2^c,0x5bd1e995)>>>0;h2^=h2>>>15;}
  return (h1.toString(36)+h2.toString(36)+serie).replace(/[^a-z0-9]/g,'').slice(0,15).padEnd(15,'0');
}
function prazoDoCiclo(dia,ciclo){   // dia vazio = sem data específica; dia 31 em mês curto vira o último dia
  const d=parseInt(dia,10);if(!d) return '';
  const [a,m]=ciclo.split('-').map(Number),ult=new Date(a,m,0).getDate();
  return ciclo+'-'+pad(Math.min(d,ult));
}
const novoModelo=(d,compartilhada,dia)=>{const id=idAleatorio();return {id,serie:id,titulo:d.titulo,descricao:d.descricao,coluna:'modelo',compartilhada,autor:PB.nome||PB.email||'',
  prioridade:d.prioridade,prazo:'',criada_em:new Date().toISOString(),concluido_em:'',recorrencia:'mensal',dia_prazo:dia,ciclo:''};};
const modeloDe=t=>t&&t.serie?modelos.find(m=>m.id===t.serie):null;
async function criarOcorrencia(m,ciclo,coluna){
  const dados={id:idCiclo(m.id,ciclo),titulo:m.titulo,descricao:m.descricao||'',coluna:coluna||'fazer',compartilhada:!!m.compartilhada,autor:m.autor||'',
    prioridade:m.prioridade||'normal',prazo:prazoDoCiclo(m.dia_prazo,ciclo),criada_em:new Date().toISOString(),concluido_em:coluna==='concluida'?hojeIso():'',
    recorrencia:'mensal',dia_prazo:m.dia_prazo||'',serie:m.id,ciclo};
  const c=await dbh.tarefas.create(dados);lista.unshift(c);return c;
}
/* garante a ocorrência do mês de cada modelo ativo (quando o mês vira, a nova nasce em "A fazer") */
async function gerarRecorrentes(){
  if(gerando||!dbh) return;gerando=true;let novo=false;const ciclo=cicloAtual();
  try{
    for(const m of modelos.slice()){
      if(m.recorrencia!=='mensal'||lista.some(t=>t.serie===m.id&&t.ciclo===ciclo)) continue;
      try{await criarOcorrencia(m,ciclo);novo=true;}catch(e){/* id repetido: outra pessoa já criou; a próxima conferência traz */}
    }
  }finally{gerando=false;}
  if(novo) render();
}

const porId=id=>lista.find(t=>t.id===id);
async function salvar(id,dados,msg){
  const t=porId(id),antes=Object.assign({},t);
  Object.assign(t,dados);render();
  try{const r=await dbh.tarefas.update(id,dados);Object.assign(t,r);render();if(msg) toast(msg);}
  catch(e){Object.assign(t,antes);render();toast(e.status===404?'Esta tarefa não existe mais. Atualize o quadro.':e.status===403||e.status===400?'Sem permissão para alterar esta tarefa.':'Não foi possível salvar: '+(e.message||e));}
}
function mover(id,col){
  const t=porId(id);if(!t||t.coluna===col) return;
  const d={coluna:col,concluido_em:col==='concluida'?hojeIso():''};
  salvar(id,d,col==='concluida'?'Tarefa concluída. Ela sai do quadro quando o mês virar.':'');
}
function fechar(){const d=$('#dlg');if(d.open) d.close();}
function abrirDlg(html){
  const d=$('#dlg');d.innerHTML='<form method="dialog" autocomplete="off">'+html+'</form>';
  d.querySelectorAll('[data-x]').forEach(b=>b.addEventListener('click',fechar));
  d.showModal();return d;
}
function dlgTarefa(id,col){
  const t=id?porId(id):null,novo=!t,m=modeloDe(t),recorrente=!!m;
  const dono=(novo||minha(t))&&!recorrente;   // a visibilidade de uma tarefa recorrente não muda (o modelo e as ocorrências seguem juntos)
  const cur=novo?'':(t.compartilhada?'eq':'pv');
  const r=(v,tit,desc)=>`<label class="opt${dono?'':' lock'}"><input type="radio" name="vis" value="${v}" required ${cur===v?'checked':''} ${dono?'':'disabled'}><div><b>${tit}</b><span>${desc}</span></div></label>`;
  const recAtual=recorrente&&m.recorrencia==='mensal'?'mensal':'',diaAtual=recorrente?(m.dia_prazo||''):'';
  const d=abrirDlg(`<h3>${novo?'Nova tarefa':'Editar tarefa'}</h3>
    <label class="f">Título<input type="text" name="titulo" required maxlength="200" value="${esc(t?t.titulo:'')}"></label>
    <label class="f">Detalhes (opcional)<textarea name="descricao" maxlength="4000">${esc(t?t.descricao:'')}</textarea></label>
    <div class="two"><label class="f">Prioridade<select name="prioridade">${Object.keys(PRI).map(k=>`<option value="${k}"${(t?t.prioridade:'normal')===k?' selected':''}>${PRI[k][0]}</option>`).join('')}</select></label>
    <label class="f" data-prazo>Prazo (opcional)<input type="date" name="prazo" value="${esc(t?t.prazo:'')}"></label></div>
    <label class="f">Coluna<select name="coluna">${COLS.map(c=>`<option value="${c.k}"${(t?t.coluna:col||'fazer')===c.k?' selected':''}>${esc(c.nome)}</option>`).join('')}</select></label>
    <fieldset class="rec"><legend>Repetição</legend>
      <div class="two"><label class="f">Repetir<select name="rec"><option value="">Não se repete</option><option value="mensal"${recAtual?' selected':''}>Todo mês</option></select></label>
      <label class="f" data-dia hidden>Até o dia<select name="dia"><option value="">Sem data específica</option>${Array.from({length:31},(_,i)=>`<option value="${i+1}"${String(i+1)===diaAtual?' selected':''}>Dia ${i+1}</option>`).join('')}</select></label></div>
      <div class="hint" data-rhint></div></fieldset>
    <fieldset class="vis"><legend>Quem vai ver esta tarefa? *</legend>
      ${r('eq','👥 Toda a equipe do RH','Todos os usuários poderão ver, mover, editar e excluir.')}
      ${r('pv','🔒 Somente eu (privada)','Só você vê. Ninguém mais, nem na lista.')}
      <div class="hint" data-hint>${novo?'Escolha uma das opções para continuar.':recorrente?'A visibilidade de uma tarefa recorrente não pode ser alterada.':dono?'Você pode mudar a visibilidade.':'Só quem criou pode mudar a visibilidade.'}</div></fieldset>
    <div class="row"><button type="button" class="btn" data-x>Cancelar</button><button class="btn primary" type="submit">${novo?'Criar tarefa':'Salvar'}</button></div>`);
  const f=d.querySelector('form'),hint=f.querySelector('[data-hint]'),rh=f.querySelector('[data-rhint]');
  const syncRec=()=>{
    const on=f.elements.rec.value==='mensal';
    f.querySelector('[data-dia]').hidden=!on;f.querySelector('[data-prazo]').hidden=on;
    rh.textContent=on?(f.elements.dia.value?`Todo mês uma nova tarefa nasce em "A fazer", com prazo até o dia ${f.elements.dia.value}. A concluída sai do quadro na virada do mês.`:'Todo mês uma nova tarefa nasce em "A fazer", sem data específica. A concluída sai do quadro na virada do mês.'):(recorrente?'Ao escolher "Não se repete", a repetição para: não nascem novas tarefas nos próximos meses.':'');
  };
  f.addEventListener('change',e=>{
    if(e.target.name==='vis') hint.textContent=e.target.value==='eq'?'Confirmado: esta tarefa será visível para toda a equipe do RH.':'Confirmado: esta tarefa será privada, só você vai vê-la.';
    if(e.target.name==='rec'||e.target.name==='dia') syncRec();
  });
  syncRec();
  f.addEventListener('submit',async ev=>{
    ev.preventDefault();
    const g=n=>f.elements[n].value,visSel=(f.querySelector('input[name=vis]:checked')||{}).value;
    if(!visSel&&dono){hint.textContent='Escolha quem vai ver esta tarefa.';return;}
    const rec=g('rec')==='mensal',dia=rec?g('dia'):'',ciclo=cicloAtual();
    const dados={titulo:g('titulo').trim(),descricao:g('descricao').trim(),prioridade:g('prioridade'),prazo:rec?prazoDoCiclo(dia,ciclo):g('prazo'),coluna:g('coluna')};
    if(!dados.titulo) return;
    if(dono) dados.compartilhada=visSel==='eq';
    const compartilhada=dono?dados.compartilhada:(t?t.compartilhada:false);
    fechar();
    try{
      if(novo&&!rec){
        dados.autor=PB.nome||PB.email||'';dados.criada_em=new Date().toISOString();dados.concluido_em=dados.coluna==='concluida'?hojeIso():'';
        const c=await dbh.tarefas.create(dados);lista.unshift(c);render();
        toast(dados.compartilhada?'Tarefa criada para toda a equipe.':'Tarefa privada criada, só você a vê.');
      }else if(novo&&rec){
        const mod=await dbh.tarefas.create(novoModelo(dados,compartilhada,dia));modelos.push(mod);
        await criarOcorrencia(mod,ciclo,dados.coluna);
        render();toast('Tarefa recorrente criada. Todo mês ela volta para "A fazer"'+(dia?' com prazo até o dia '+dia:' sem data específica')+'.');
      }else{
        if(dados.coluna!==t.coluna) dados.concluido_em=dados.coluna==='concluida'?hojeIso():'';
        if(recorrente&&rec){   // mantém a repetição: o modelo recebe as mudanças e vale a partir do próximo mês
          dados.dia_prazo=dia;
          const mu=await dbh.tarefas.update(m.id,{titulo:dados.titulo,descricao:dados.descricao,prioridade:dados.prioridade,dia_prazo:dia,recorrencia:'mensal'});Object.assign(m,mu);
        }else if(recorrente&&!rec){   // para a repetição: apaga o modelo e solta esta tarefa dele
          await dbh.tarefas.remove(m.id);modelos=modelos.filter(x=>x.id!==m.id);
          Object.assign(dados,{serie:'',ciclo:'',recorrencia:'',dia_prazo:''});
        }else if(!recorrente&&rec){   // tarefa comum que passa a repetir
          const mod=await dbh.tarefas.create(novoModelo(dados,compartilhada,dia));modelos.push(mod);
          Object.assign(dados,{serie:mod.id,ciclo,recorrencia:'mensal',dia_prazo:dia});
        }
        salvar(id,dados,rec&&!recorrente?'Tarefa atualizada. Ela passa a repetir todo mês.':!rec&&recorrente?'Repetição encerrada. Não nascem novas tarefas nos próximos meses.':'Tarefa atualizada.');
      }
    }catch(e){toast('Não foi possível salvar: '+(e.message||e));}
  });
}
function dlgExcluir(id){
  const t=porId(id);if(!t) return;
  const m=modeloDe(t);
  if(m){
    const d=abrirDlg(`<h3>Excluir tarefa recorrente?</h3><p><b>${esc(t.titulo)}</b></p>
      <p>Esta tarefa <b>se repete todo mês</b> (${t.compartilhada?'da equipe':'privada'}). O que você quer fazer?</p>
      <div class="row" style="flex-direction:column;align-items:stretch">
        <button class="btn" type="button" data-pular><b>Dispensar só este mês</b>&nbsp;· volta no próximo mês</button>
        <button class="btn danger" type="button" data-parar><b>Excluir e parar a repetição</b>&nbsp;· não volta mais</button>
        <button class="btn" type="button" data-x>Cancelar</button></div>`);
    d.querySelector('[data-pular]').addEventListener('click',()=>{fechar();salvar(id,{coluna:'dispensada',concluido_em:''},'Dispensada neste mês. Ela volta no próximo mês.');});
    d.querySelector('[data-parar]').addEventListener('click',async()=>{
      fechar();
      try{await dbh.tarefas.remove(m.id);modelos=modelos.filter(x=>x.id!==m.id);await dbh.tarefas.remove(id);lista=lista.filter(x=>x.id!==id);render();toast('Tarefa excluída e repetição encerrada.');}
      catch(e){toast('Não foi possível excluir: '+(e.message||e));}
    });
    return;
  }
  const d=abrirDlg(`<h3>Excluir tarefa?</h3><p><b>${esc(t.titulo)}</b></p><p>${t.compartilhada?'Esta tarefa é <b>da equipe</b>: será removida para todos.':'Esta tarefa é <b>privada</b>: será removida só para você.'} Não dá para desfazer.</p>
    <div class="row"><button type="button" class="btn" data-x>Cancelar</button><button class="btn danger" type="submit">Excluir</button></div>`);
  d.querySelector('form').addEventListener('submit',async ev=>{
    ev.preventDefault();fechar();
    try{await dbh.tarefas.remove(id);lista=lista.filter(x=>x.id!==id);render();toast('Tarefa excluída.');}
    catch(e){toast('Não foi possível excluir: '+(e.message||e));}
  });
}

/* ---------- eventos ---------- */
$('#novaBtn').addEventListener('click',()=>dlgTarefa(null,'fazer'));
$('#refBtn').addEventListener('click',()=>carregar(false));
$('#q').addEventListener('input',render);
$('#arqChk').addEventListener('change',()=>carregar(false));
$('#seg').addEventListener('click',e=>{const b=e.target.closest('button');if(!b) return;vis=b.dataset.v;document.querySelectorAll('#seg button').forEach(x=>x.classList.toggle('on',x===b));render();});
const bd=$('#board');
bd.addEventListener('click',e=>{
  const add=e.target.closest('[data-add]');if(add){dlgTarefa(null,add.dataset.add);return;}
  const card=e.target.closest('.card');if(!card) return;const id=card.dataset.id;
  const mv=e.target.closest('[data-mv]');
  if(mv){const t=porId(id),i=COLS.findIndex(c=>c.k===t.coluna)+(+mv.dataset.mv);if(COLS[i]) mover(id,COLS[i].k);return;}
  if(e.target.closest('[data-ed]')) dlgTarefa(id);
  else if(e.target.closest('[data-rm]')) dlgExcluir(id);
});
bd.addEventListener('dragstart',e=>{const c=e.target.closest('.card');if(!c) return;e.dataTransfer.setData('text/plain',c.dataset.id);e.dataTransfer.effectAllowed='move';c.classList.add('dragging');});
bd.addEventListener('dragend',()=>bd.querySelectorAll('.dragging,.over').forEach(x=>x.classList.remove('dragging','over')));
bd.addEventListener('dragover',e=>{const c=e.target.closest('.col');if(!c) return;e.preventDefault();bd.querySelectorAll('.over').forEach(x=>{if(x!==c) x.classList.remove('over');});c.classList.add('over');});
bd.addEventListener('drop',e=>{const c=e.target.closest('.col');if(!c) return;e.preventDefault();const id=e.dataTransfer.getData('text/plain');bd.querySelectorAll('.over,.dragging').forEach(x=>x.classList.remove('over','dragging'));if(id) mover(id,c.dataset.col);});
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',themeBtn);new MutationObserver(themeBtn).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});}catch(e){}
/* mantém o quadro em dia: colegas mexem nas tarefas da equipe, e a virada do mês tira as concluídas.
   Tempo real pelo servidor (aparece na hora) e, por garantia, uma conferência a cada 15 s (cobre queda de conexão e tarefa que virou privada). */
let ouvindo=false;
function aoVivo(ev){
  const r=ev&&ev.record;if(!r||!r.id) return;
  const arr=r.coluna==='modelo'?modelos:lista,outro=arr===lista?modelos:lista;
  const k=outro.findIndex(t=>t.id===r.id);if(k>=0) outro.splice(k,1);   // (não deve acontecer; mantém as listas coerentes)
  const i=arr.findIndex(t=>t.id===r.id);
  if(ev.action==='delete'){if(i>=0) arr.splice(i,1);}
  else if(i>=0) arr[i]=r;
  else arr.unshift(r);
  if(arr===modelos&&ev.action!=='delete') gerarRecorrentes();
  render();
}
function ligarTempoReal(){if(ouvindo||!dbh||!dbh.tarefas||!dbh.tarefas.listen) return;ouvindo=true;dbh.tarefas.listen(aoVivo);}
setInterval(()=>{if(document.hidden||$('#dlg').open||!dbh) return;carregar(true);},15000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&dbh&&!$('#dlg').open) carregar(true);});

(function init(){
  themeBtn();render();carga(true,'Conectando ao servidor…');
  carregar(false);
})();
</script>
