<script>
/* =====================================================================
   PocketBase: armazenamento no servidor (substitui o localStorage)
   Expõe PB.connect(), que devolve um objeto "dbh" com a mesma forma
   usada pelo restante do sistema: dbh.doc('a/b').get/set/delete e
   dbh.collection('versoes').orderBy('at','desc').limit(n).get()
   ===================================================================== */
const PB=(function(){
  const URL_BASE='https://pb.devgabriel.app.br'.replace(/\/+$/,'');
  const CENTI_BASE=''.replace(/\/+$/,'');   // vazio = mesmo endereço do site (funções em /api)
  const AUTH_KEY='rhcrv-pb-auth';
  let token='',email='',col='rhcmrv_users',loginP=null;
  let cs=null;   // sessão do Centi: {user,nome,token,refreshToken}

  /* só vale a sessão que tem o acesso do Centi junto e a marca de admin; sessões antigas (login simples ou sem a marca) pedem novo login */
  function readAuth(){try{const a=JSON.parse(localStorage.getItem(AUTH_KEY)||'null');if(a&&a.token&&a.centi&&a.centi.token&&typeof a.centi.admin==='boolean'){token=a.token;email=a.email||'';col=a.col||'rhcmrv_users';cs=a.centi;}}catch(e){}}
  function saveAuth(){try{localStorage.setItem(AUTH_KEY,JSON.stringify({token,email,col,centi:cs}));}catch(e){}}
  function clearAuth(){token='';email='';col='rhcmrv_users';cs=null;try{localStorage.removeItem(AUTH_KEY);}catch(e){}}

  async function raw(method,path,body){
    const h={};
    if(body!==undefined) h['Content-Type']='application/json';
    if(token) h.Authorization=token;
    const r=await fetch(URL_BASE+path,{method,headers:h,body:body===undefined?undefined:JSON.stringify(body)});
    if(r.status===204) return null;
    let j=null; try{j=await r.json();}catch(e){}
    if(!r.ok){const err=new Error((j&&j.message)||('HTTP '+r.status));err.status=r.status;throw err;}
    return j;
  }
  async function api(method,path,body){
    try{return await raw(method,path,body);}
    catch(e){
      if(e.status===401||e.status===403){
        clearAuth();
        if(await login('Sua sessão expirou. Entre novamente para continuar.')) return raw(method,path,body);
      }
      throw e;
    }
  }

  /* ---------- login ---------- */
  const IC={
    user:'<path d="M20 21a8 8 0 10-16 0"/><circle cx="12" cy="8" r="4"/>',
    lock:'<rect x="4" y="10" width="16" height="11" rx="2.5"/><path d="M8 10V7a4 4 0 018 0v3"/>',
    eye:'<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
    eyeoff:'<path d="M3 3l18 18M10.6 5.1A10.7 10.7 0 0112 5c6.4 0 10 7 10 7a17 17 0 01-3.2 4.2M6.6 6.6A17 17 0 002 12s3.6 7 10 7a10.4 10.4 0 004.4-1M9.9 9.9a3 3 0 004.2 4.2"/>',
    alert:'<circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16.5h.01"/>',
    out:'<path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/>',
    bank:'<path d="M3 10l9-6 9 6M5 10v8M9.5 10v8M14.5 10v8M19 10v8M3 20h18"/>'
  };
  const ico=(k,n)=>'<svg width="'+(n||18)+'" height="'+(n||18)+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+IC[k]+'</svg>';
  const LOGIN_CSS=
    '.pbl{position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;padding:20px;overflow:auto;'+
      'background:radial-gradient(1100px 600px at 50% -10%,#118a50 0%,rgba(17,138,80,0) 60%),linear-gradient(160deg,#0b5f38 0%,#073d25 60%,#052a1a 100%);font-family:var(--f-body,"Public Sans",system-ui,sans-serif)}'+
    '.pbl::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(255,255,255,.035) 0 2px,transparent 2px 26px);pointer-events:none}'+
    '.pbl-card{position:relative;width:100%;max-width:410px;background:#fff;color:#12281d;border-radius:22px;padding:38px 32px 26px;box-shadow:0 34px 90px rgba(0,0,0,.4),0 0 0 1px rgba(255,255,255,.08);animation:pblin .35s ease-out both}'+
    '@keyframes pblin{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}@media (prefers-reduced-motion:reduce){.pbl-card{animation:none}}'+
    '.pbl-card::before{content:"";position:absolute;left:32px;top:0;width:58px;height:5px;background:#e3a93a;border-radius:0 0 5px 5px}'+

    '@media (max-width:440px){.pbl{padding:14px;align-items:flex-start}.pbl-card{padding:32px 22px 22px;margin-top:6vh}.pbl-card::before{left:22px}}';
  function loginCss(){
    if(document.getElementById('pbl-css')) return;
    const st=document.createElement('style');st.id='pbl-css';st.textContent=LOGIN_CSS;document.head.appendChild(st);
  }
  function login(msg){
    if(loginP) return loginP;
    loginP=new Promise(resolve=>{
      loginCss();
      const wrap=document.createElement('div');wrap.className='pbl';
      wrap.innerHTML=
        '<form class="pbl-card" autocomplete="on" novalidate>'+
        '<div class="pbl-logo">'+ico('bank',28)+'</div>'+
        '<p class="pbl-org">Câmara Municipal de Rio Verde/GO</p>'+
        '<h2>Sistema Interno do RH</h2>'+
        '<p class="pbl-sub">Entre com o mesmo usuário e senha que você usa no Centi.</p>'+
        '<label class="pbl-f"><span>Usuário</span><div class="pbl-in">'+ico('user')+'<input name="e" type="text" required autocapitalize="none" autocorrect="off" spellcheck="false" autocomplete="username" placeholder="ex.: nome.sobrenome"></div></label>'+
        '<label class="pbl-f"><span>Senha</span><div class="pbl-in">'+ico('lock')+'<input name="p" type="password" required autocomplete="current-password" placeholder="Sua senha do Centi"><button type="button" class="pbl-eye" data-eye aria-label="Mostrar a senha" aria-pressed="false">'+ico('eye')+'</button></div></label>'+
        '<div class="pbl-err" data-err role="alert" aria-live="polite"></div>'+
        '<button type="submit" class="pbl-go"><span>Entrar</span></button>'+
        '<p class="pbl-foot">'+ico('lock',14)+'<span>A senha é conferida no Centi e não fica guardada neste sistema.</span></p></form>';
      document.body.appendChild(wrap);
      const f=wrap.querySelector('form'),err=wrap.querySelector('[data-err]'),go=wrap.querySelector('.pbl-go'),eye=wrap.querySelector('[data-eye]');
      const erro=(t,info)=>{err.className='pbl-err'+(info?' info':'');err.innerHTML=t?ico('alert',16)+'<span></span>':'';if(t) err.lastChild.textContent=t;};
      const ocupado=on=>{go.disabled=on;go.innerHTML=on?'<i class="pbl-sp"></i><span>Entrando…</span>':'<span>Entrar</span>';};
      if(msg) erro(msg,true);
      const done=ok=>{wrap.remove();loginP=null;resolve(ok);};
      f.e.focus();
      eye.addEventListener('click',()=>{const ver=f.p.type==='password';f.p.type=ver?'text':'password';eye.setAttribute('aria-pressed',ver);eye.setAttribute('aria-label',ver?'Ocultar a senha':'Mostrar a senha');eye.innerHTML=ico(ver?'eyeoff':'eye');f.p.focus();});
      f.addEventListener('submit',async ev=>{
        ev.preventDefault();
        if(!f.e.value.trim()||!f.p.value){erro('Informe o usuário e a senha do Centi.');(f.e.value.trim()?f.p:f.e).focus();return;}
        erro('');ocupado(true);
        try{
          const r=await fetch(CENTI_BASE+'/api/centi-login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user:f.e.value.trim(),pass:f.p.value})});
          let j=null; try{j=await r.json();}catch(e){}
          if(!r.ok){erro((j&&j.message)||('Não foi possível entrar (HTTP '+r.status+').'));ocupado(false);f.p.select();return;}
          token=j.pb.token; col='rhcmrv_users'; email=j.centi.user; cs=j.centi; saveAuth(); done(true);
        }catch(e){erro('Não foi possível entrar: '+e.message);ocupado(false);}
      });
    });
    return loginP;
  }

  /* ---------- sair ---------- */
  /* botão "Sair" ao lado do botão de tema (ou no rodapé do menu dos Fluxogramas); só existe com sessão do Centi aberta */
  function logout(){clearAuth();location.reload();}
  function mountLogout(){
    if(!cs||!document.body||document.getElementById('pb-logout')) return;
    const nome=(cs.nome||cs.user||'').split(' ')[0];
    const mk=(cls,html)=>{const b=document.createElement('button');b.type='button';b.id='pb-logout';b.className=cls;b.title='Sair ('+cs.user+')';b.setAttribute('aria-label','Sair do sistema ('+cs.user+')');b.innerHTML=html;b.addEventListener('click',logout);return b;};
    const t=document.getElementById('themeBtn'),h=document.querySelector('.side-foot .homelink');
    if(t&&t.parentNode){const b=mk(t.className,ico('out',16)+'Sair');b.style.marginLeft='0';t.insertAdjacentElement('afterend',b);t.style.marginLeft='auto';}
    else if(h&&h.parentNode){const b=mk(h.className,ico('out',14)+'Sair'+(nome?' ('+nome.charAt(0).toUpperCase()+nome.slice(1).toLowerCase()+')':''));b.style.cssText='border:0;cursor:pointer;font:inherit;font-weight:600;font-size:13px;width:calc(100% + 20px);text-align:left;color:inherit';h.insertAdjacentElement('afterend',b);}
  }
  /* as páginas montam o cabeçalho em momentos diferentes: tenta de novo quando o DOM muda */
  function vigiarLogout(){
    mountLogout();
    try{const ob=new MutationObserver(()=>{if(!cs){ob.disconnect();return;}if(!document.getElementById('pb-logout')) mountLogout();});ob.observe(document.body,{childList:true,subtree:true});}catch(e){}
  }

  /* ---------- documentos ---------- */
  const ids={};   // cache de id de registro por caminho
  const esc=s=>String(s).replace(/\\/g,'\\\\').replace(/"/g,'\\"');
  const spec=path=>{
    const i=path.indexOf('/'),col=path.slice(0,i),id=path.slice(i+1);
    return col==='versoes'?{c:'rhcmrv_versoes',f:'vid',k:id}:{c:'rhcmrv_docs',f:'key',k:path};
  };
  async function find(path){
    const s=spec(path);
    const q='?perPage=1&filter='+encodeURIComponent(s.f+'="'+esc(s.k)+'"');
    const r=await api('GET','/api/collections/'+s.c+'/records'+q);
    const rec=r.items&&r.items[0];
    if(rec) ids[path]=rec.id; else delete ids[path];
    return rec||null;
  }
  const payload=(s,data)=>s.c==='rhcmrv_versoes'?Object.assign({vid:s.k},data):{key:s.k,data};
  const unwrap=(s,rec)=>s.c==='rhcmrv_versoes'?{at:rec.at,label:rec.label,json:rec.json}:rec.data;

  function doc(path){
    const s=spec(path);
    return {
      async get(){const rec=await find(path);return {exists:!!rec,id:s.k,data:()=>rec?unwrap(s,rec):undefined};},
      async set(data){
        if(!ids[path]) await find(path);
        if(ids[path]) await api('PATCH','/api/collections/'+s.c+'/records/'+ids[path],payload(s,data));
        else{const r=await api('POST','/api/collections/'+s.c+'/records',payload(s,data));ids[path]=r.id;}
      },
      async delete(){
        if(!ids[path]) await find(path);
        if(ids[path]){await api('DELETE','/api/collections/'+s.c+'/records/'+ids[path]);delete ids[path];}
      }
    };
  }
  function collection(name){
    const q={sort:'',n:30};
    const api_={
      orderBy(f,dir){q.sort=(dir==='desc'?'-':'')+f;return api_;},
      limit(n){q.n=n;return api_;},
      async get(){
        const r=await api('GET','/api/collections/rhcmrv_'+name+'/records?perPage='+q.n+(q.sort?'&sort='+encodeURIComponent(q.sort):''));
        return {docs:r.items.map(rec=>({id:rec.vid,data:()=>({at:rec.at,label:rec.label,json:rec.json})}))};
      }
    };
    return api_;
  }

  /* ---------- tarefas (coleção rhcmrv_tarefas; as regras do servidor mostram só as compartilhadas e as do próprio dono) ---------- */
  const TAREFAS='/api/collections/rhcmrv_tarefas/records';
  const userId=()=>{try{const b=token.split('.')[1].replace(/-/g,'+').replace(/_/g,'/');return JSON.parse(decodeURIComponent(escape(atob(b+'='.repeat((4-b.length%4)%4))))).id||'';}catch(e){return '';}};
  async function todas(filtro){
    let page=1,out=[];
    for(;;){
      const r=await api('GET',TAREFAS+'?perPage=200&page='+page+'&sort=-criada_em'+(filtro?'&filter='+encodeURIComponent(filtro):''));
      out=out.concat(r.items||[]);
      if(!r.totalPages||page>=r.totalPages) return out;
      page++;
    }
  }
  /* tempo real do PocketBase (SSE): cada evento só chega se as regras do servidor deixam esta conta ver a tarefa (privadas de outros não chegam) */
  function ouvirTarefas(cb){
    let es=null,parado=false;
    const abrir=()=>{
      if(parado||typeof EventSource==='undefined') return;
      es=new EventSource(URL_BASE+'/api/realtime');
      es.addEventListener('PB_CONNECT',async ev=>{
        try{
          const id=(JSON.parse(ev.data||'{}').clientId)||ev.lastEventId;
          await fetch(URL_BASE+'/api/realtime',{method:'POST',headers:{'Content-Type':'application/json',Authorization:token},body:JSON.stringify({clientId:id,subscriptions:['rhcmrv_tarefas']})});
        }catch(e){}
      });
      es.addEventListener('rhcmrv_tarefas',ev=>{try{cb(JSON.parse(ev.data));}catch(e){}});
      es.onerror=()=>{};   // o navegador reconecta sozinho e o PB_CONNECT assina de novo
    };
    abrir();
    return ()=>{parado=true;if(es) es.close();};
  }
  const tarefas={
    listen:ouvirTarefas,
    list:todas,
    create:d=>api('POST',TAREFAS,Object.assign({dono:userId()},d)),
    update:(id,d)=>api('PATCH',TAREFAS+'/'+id,d),
    remove:id=>api('DELETE',TAREFAS+'/'+id)
  };

  /* ---------- API do Centi (pelo servidor do sistema, com o acesso da própria pessoa) ---------- */
  /* Sessão do Centi inválida (token vencido sem renovação, sessão apagada ou outro login): pede o login de novo, com aviso, e repete
     a consulta uma vez. O erro só chega à tela se o login for refeito e a consulta ainda assim falhar. */
  function erroSessao(){const e=new Error('Sem sessão do Centi. Entre novamente.');e.status=401;return e;}
  async function comSessao(fn){
    try{if(!cs) throw erroSessao();return await fn();}
    catch(e){
      if(e.status!==401) throw e;
      clearAuth();
      if(!(await login('Sua sessão do Centi expirou. Entre novamente para continuar.'))) throw e;
      const b=document.getElementById('pb-logout');if(b) b.remove();vigiarLogout();   // o botão Sair passa a mostrar o usuário novo
      return fn();
    }
  }
  const centiCall=(path,body)=>comSessao(()=>centiCallUma(path,body));
  const centiPdf=(path,mes,ano,funcionario)=>comSessao(()=>centiPdfUma(path,mes,ano,funcionario));
  async function centiCallUma(path,body){
    if(!cs) throw erroSessao();
    const r=await fetch(CENTI_BASE+'/api/centi',{method:'POST',
      headers:{'Content-Type':'application/json','x-centi-user':cs.user,'x-centi-token':cs.token,'x-centi-refresh':cs.refreshToken||''},
      body:JSON.stringify({path,body})});
    const nt=r.headers.get('x-centi-token'),nr=r.headers.get('x-centi-refresh');
    if(nt){cs.token=nt;if(nr)cs.refreshToken=nr;saveAuth();}   // o Centi renova o token sozinho
    let j=null; try{j=await r.json();}catch(e){}
    if(!r.ok){
      if(r.status===401){clearAuth();}
      const err=new Error((j&&j.message)||('Centi: HTTP '+r.status));err.status=r.status;throw err;
    }
    return j;
  }
  /* consulta que o Centi entrega em PDF: a função devolve o gzip dele e o navegador abre */
  async function centiPdfUma(path,mes,ano,funcionario){
    if(!cs) throw erroSessao();
    const r=await fetch(CENTI_BASE+'/api/centi',{method:'POST',
      headers:{'Content-Type':'application/json','x-centi-user':cs.user,'x-centi-token':cs.token,'x-centi-refresh':cs.refreshToken||''},
      body:JSON.stringify({path,body:{mes,ano,funcionario:funcionario||''}})});
    const nt=r.headers.get('x-centi-token'),nr=r.headers.get('x-centi-refresh');
    if(nt){cs.token=nt;if(nr)cs.refreshToken=nr;saveAuth();}
    if(!r.ok){
      let j=null; try{j=await r.json();}catch(e){}
      if(r.status===401){clearAuth();}
      const err=new Error((j&&j.message)||('Centi: HTTP '+r.status));err.status=r.status;throw err;
    }
    if(typeof DecompressionStream==='undefined') throw new Error('Este navegador não consegue abrir o arquivo do Centi. Use um navegador mais recente.');
    return new Uint8Array(await new Response(r.body.pipeThrough(new DecompressionStream('gzip'))).arrayBuffer());
  }
  /* PB.centi.search('SFuncionario',[{FieldName:'Nome',Operation:6,Value:'%ana%'}]) -> {Data:[...],Count}
     (Operation 6 = contém; a tela de consulta do Centi exige ao menos um filtro com valor) */
  const centi={
    get user(){return cs?cs.user:'';},
    get nome(){return cs?(cs.nome||cs.user):'';},
    get admin(){return !!(cs&&cs.admin);},   // administrador do sistema (edita o painel dos mini sistemas)
    /* Cubo funcionário (FP051) do Centi na referência mes/ano -> {Data:[{MATRICULA,NOMEFUNC,CARGO,HIERARQUIA,...}],Total}; só ativos */
    /* Ficha financeira (FP024) da matrícula no mês/ano -> {Fichas:[{Folha,Mes,Ano,TotalProventos,TotalDescontos,LiquidoReceber,Eventos:[...]}]}; não é guardada */
    ficha(matricula,mes,ano){return centiCall('ficha-financeira',{matricula,mes,ano});},
    /* Férias: ativos (FP051) + gozos de férias (FP273) -> {Pessoas:[...],Gozos:[{MATRICULA,DTAQUIINI,DTAQUIFIN,SALDO,GOZOINICIAL,GOZOFINAL,...}]} */
    ferias(mes,ano){return centiCall('ferias',{mes,ano});},
    cubo(mes,ano){return centiCall('cubo-funcionario',{mes,ano});},
    /* Licença-prêmio: quadro de ativos (Cubo funcionário reduzido, FP245) -> {Pessoas:[{MATRICULA,NOME,SITUACAO,TIPOADMISSAO,DATAADMISSAO,LOTACAO,CARGO,TIPOAFASTAMENTO,DATAAFASTAMENTO}]} */
    licencaQuadro(mes,ano){return centiCall('licenca-quadro',{mes,ano});},
    /* Espelho de ponto (FP170) do órgão inteiro na referência mes/ano -> Uint8Array com o PDF (o Centi leva de 25 s a 1 min) */
    espelho(mes,ano,funcionario){return centiPdf('espelho-ponto',mes,ano,funcionario);},
    /* Relação de afastamentos (FP071), de 1990 até o fim da referência -> Uint8Array com o PDF; com o Id do servidor traz só ele */
    afastamentosPdf(mes,ano,funcionario){return centiPdf('afastamentos-pdf',mes,ano,funcionario);},
    /* Busca de servidor por nome (3+ letras) ou matrícula -> {Data:[{Id,Matricula,Nome,DataAdmissao,Situacao,TipoAdm,Cargo,Lotacao}]} (até 50) */
    /* CPF, nascimento, identidade e endereço de UM servidor (FP001 + DM017), pelo Id da busca -> {Nome,Cpf,DataNascimento,Identidade,Endereco}; nada é guardado */
    servidorDados(id){return centiCall('servidor-dados',{id});},
    licencaBusca(termo){return centiCall('licenca-busca',{termo});},
    /* Converte um .docx (Blob) em PDF/A-2u no serviço pdfa -> Blob application/pdf */
    async pdfa(blob){
      if(!cs) throw erroSessao();
      const b=new Uint8Array(await blob.arrayBuffer());let bin='';
      for(let i=0;i<b.length;i+=8192) bin+=String.fromCharCode.apply(null,b.subarray(i,i+8192));
      const r=await fetch(CENTI_BASE+'/api/pdfa',{method:'POST',headers:{'Content-Type':'application/json','x-centi-user':cs.user,'x-centi-token':cs.token,'x-centi-refresh':cs.refreshToken||''},body:JSON.stringify({docx:btoa(bin)})});
      const nt=r.headers.get('x-centi-token'),nr=r.headers.get('x-centi-refresh');
      if(nt){cs.token=nt;if(nr)cs.refreshToken=nr;saveAuth();}
      if(!r.ok){let j=null;try{j=await r.json();}catch(e){}if(r.status===401) clearAuth();const err=new Error((j&&j.message)||('PDF/A: HTTP '+r.status));err.status=r.status;throw err;}
      return r.blob();
    },
    search(entity,filters,start,depth){
      return centiCall('restauth/searchentity',{Depth:depth||50,Entity:entity,Start:start==null?1:start,
        Filters:(filters||[]).map(f=>Object.assign({List:false,TypeFilter:0,between:''},f))});
    }
  };

  /* ---------- conexão ---------- */
  const sleep=ms=>new Promise(r=>setTimeout(r,ms));
  async function alive(){
    for(let i=0;i<3;i++){
      const ac=new AbortController(),t=setTimeout(()=>ac.abort(),6000);
      try{const r=await fetch(URL_BASE+'/api/health',{cache:'no-store',signal:ac.signal});clearTimeout(t);if(r.ok) return true;}catch(e){clearTimeout(t);}
      if(i<2) await sleep(1500);
    }
    return false;
  }
  const box='position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(0,0,0,.5)';
  const card='width:100%;max-width:380px;background:var(--surface,#fff);color:var(--fg,#12281d);border:1px solid var(--line,#d1ddd6);border-radius:12px;padding:22px;box-shadow:0 10px 40px rgba(0,0,0,.3);font:15px/1.45 system-ui,sans-serif';
  const bt='padding:9px 14px;border-radius:8px;font:inherit;font-weight:600;cursor:pointer;';
  /* servidor fora do ar: pergunta antes de seguir, para não trabalhar sem querer só neste navegador */
  function offlineDialog(){
    return new Promise(resolve=>{
      const w=document.createElement('div');w.style.cssText=box;
      w.innerHTML='<div role="alertdialog" aria-modal="true" style="'+card+'"><h3 style="margin:0 0 6px;font-size:18px">Sem conexão com o servidor</h3>'+
        '<p style="margin:0 0 14px;color:var(--muted,#4f665a);font-size:13.5px">Não foi possível falar com o servidor dos dados. Verifique a internet e tente de novo. Se continuar só neste navegador, o que você fizer <b>não será salvo no servidor</b> e não aparecerá em outros computadores.</p>'+
        '<div style="display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap"><button type="button" data-loc style="'+bt+'border:1px solid var(--line,#d1ddd6);background:transparent;color:inherit">Usar só neste navegador</button>'+
        '<button type="button" data-retry style="'+bt+'border:0;background:var(--accent,#0a6b3d);color:var(--accent-fg,#fff)">Tentar novamente</button></div></div>';
      document.body.appendChild(w);
      const done=v=>{w.remove();resolve(v);};
      w.querySelector('[data-retry]').addEventListener('click',()=>done(true));
      w.querySelector('[data-loc]').addEventListener('click',()=>done(false));
      w.querySelector('[data-retry]').focus();
    });
  }
  function markLocal(){
    if(document.getElementById('pb-local')) return;
    const b=document.createElement('div');b.id='pb-local';

  async function connect(){

        if(r.status===401||r.status===403) clearAuth();

    },

/* Motor de cálculo do acompanhamento de sentenças judiciais (penhora salarial, pensão, consignações por ordem judicial).
   Cada acompanhamento = um servidor + um evento da folha (ex.: 913 PENHORA SALARIAL) + o total devido (em R$ ou em parcelas).
   Todo mês o sistema lê a ficha financeira (FP024) e guarda quanto o evento descontou naquele mês; o saldo é
   "total - tudo que já foi descontado". Não depende de tela nem de rede: é inserido na página pelo build.py e carregado
   pelos testes (tests/sentencas.test.js). Competências são textos "AAAA-MM". */
(function(root){
const r2=n=>Math.round((Number(n)||0)*100)/100;
const key=(ano,mes)=>ano+'-'+String(mes).padStart(2,'0');
const parseKey=k=>{const m=/^(\d{4})-(\d{2})$/.exec(String(k||''));return m?{ano:+m[1],mes:+m[2]}:null;};
const somaMes=(k,n)=>{const p=parseKey(k);if(!p) return null;const t=p.ano*12+(p.mes-1)+n;return key(Math.floor(t/12),t%12+1);};
const fmtKey=k=>{const p=parseKey(k);return p?String(p.mes).padStart(2,'0')+'/'+p.ano:'';};
/* de..ate inclusive (limite de 600 meses por segurança) */
const meses=(de,ate)=>{const out=[];if(!parseKey(de)||!parseKey(ate)) return out;for(let k=de;k<=ate&&out.length<600;k=somaMes(k,1)) out.push(k);return out;};

/* quanto o evento descontou nas fichas do mês (pode haver mais de uma folha: mensal, 13º, complementar...).
   -> {valor, achou}; achou=false quando o evento nem aparece na ficha (o mês não teve desconto) */
function valorDoEvento(fichas,eventoId){
  let v=0,n=0;
  (fichas||[]).forEach(f=>(f.Eventos||[]).forEach(e=>{if(String(e.Id)===String(eventoId)){v+=Number(e.Desconto)||0;n++;}}));
  return {valor:r2(v),achou:n>0};
}

/* it: {modo:'valor'|'parcelas'|'livre', total, antes, parcelas, parcelasAntes, desde:'AAAA-MM', hist:{'AAAA-MM':{v}}}
   hoje: 'AAAA-MM' do mês corrente. */
function calcular(it,hoje){
  const hist=it.hist||{};
  const todos=Object.keys(hist).filter(k=>k>=(it.desde||'0000-00')&&k<=hoje).sort();
  const pagos=todos.filter(k=>Number(hist[k].v)>0);
  const pagoMeses=r2(pagos.reduce((s,k)=>s+Number(hist[k].v),0));
  const pago=r2((Number(it.antes)||0)+pagoMeses);
  const parcelasPagas=(Number(it.parcelasAntes)||0)+pagos.length;
  const ultimo=todos.length?todos[todos.length-1]:null;                 // último mês com ficha lida
  const ultimoPago=pagos.length?pagos[pagos.length-1]:null;
  const parcela=ultimoPago?r2(hist[ultimoPago].v):0;                    // valor do último desconto
  const pendentes=it.desde?meses(it.desde,hoje).filter(k=>!(k in hist)):[];
  const o={pago,parcelasPagas,ultimo,ultimoPago,parcela,pendentes,modo:it.modo||'livre',pct:null,falta:null,faltaParcelas:null,
    mesesRest:null,termino:null,quitada:false,quitadaEm:null,excedeu:0,semDesconto:false,situacao:'livre'};
  if(o.modo==='valor'&&Number(it.total)>0){
    const total=r2(it.total);
    o.falta=Math.max(0,r2(total-pago));o.pct=Math.min(100,pago/total*100);
    o.quitada=o.falta<0.005;o.excedeu=pago>total+0.005?r2(pago-total):0;
    if(o.quitada){   // em que mês o saldo chegou a zero
      let acc=Number(it.antes)||0;if(acc>=total-0.005) o.quitadaEm=it.desde;
      else for(const k of pagos){acc+=Number(hist[k].v);if(acc>=total-0.005){o.quitadaEm=k;break;}}
    }else if(parcela>0){o.mesesRest=Math.ceil(o.falta/parcela-1e-9);o.termino=ultimo?somaMes(ultimo,o.mesesRest):null;}
  }else if(o.modo==='parcelas'&&Number(it.parcelas)>0){
    const tot=Number(it.parcelas);
    o.faltaParcelas=Math.max(0,tot-parcelasPagas);o.pct=Math.min(100,parcelasPagas/tot*100);
    o.quitada=o.faltaParcelas===0;o.falta=parcela?r2(o.faltaParcelas*parcela):null;
    if(o.quitada){const need=tot-(Number(it.parcelasAntes)||0);o.quitadaEm=need<=0?it.desde:(pagos[need-1]||null);}
    else{o.mesesRest=o.faltaParcelas;o.termino=ultimo?somaMes(ultimo,o.faltaParcelas):null;}
  }else o.modo='livre';
  o.semDesconto=!o.quitada&&o.modo!=='livre'&&!!ultimo&&!(Number(hist[ultimo].v)>0);   // o evento parou de descontar antes de quitar
  o.situacao=o.modo==='livre'?'livre':o.quitada?(o.excedeu>0?'atencao':'quitada'):(o.semDesconto?'atencao':(o.mesesRest!=null&&o.mesesRest<=2?'final':'andamento'));
  return o;
}

const API={r2,key,parseKey,somaMes,fmtKey,meses,valorDoEvento,calcular};
if(typeof module!=='undefined'&&module.exports) module.exports=API;
else root.SP=API;
})(typeof window!=='undefined'?window:globalThis);

  if(!sentencas||!window.SP){box.innerHTML='';return;}
  const d=new Date(),hoje=window.SP.key(d.getFullYear(),d.getMonth()+1),brl=n=>'R$ '+Number(n||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
  const ord={atencao:0,final:1,andamento:2,livre:3};
  const l=sentencas.map(it=>({it,r:window.SP.calcular(it,hoje)})).filter(x=>!x.r.quitada&&x.r.modo!=='livre').sort((a,b)=>(ord[a.r.situacao]-ord[b.r.situacao])||String(a.r.termino||'9').localeCompare(String(b.r.termino||'9')));
  if(!l.length){box.innerHTML='';return;}
  const crit=l.some(x=>x.r.situacao==='atencao'),mostra=l.slice(0,6);
  const lido=sentencas.map(i=>i.lidoEm).filter(Boolean).sort().pop();
  box.innerHTML='<div class="asent'+(crit?' crit':'')+'" role="status"><h2>⚖️ Sentenças judiciais: quanto falta para acabar <span class="tg">'+l.length+' em andamento</span>'+(SENTENCAS_URL?'<a href="'+esc(SENTENCAS_URL)+'" target="_top">Ver todas ›</a>':'')+'</h2><ul>'+
    mostra.map(({it,r})=>{
      const falta=r.modo==='parcelas'?r.faltaParcelas+(r.faltaParcelas===1?' parcela':' parcelas'):brl(r.falta);
      const tg=r.situacao==='atencao'?'<span class="tg atencao">Atenção</span>':r.situacao==='final'?'<span class="tg final">Reta final</span>':'';
      return '<li><span><b>'+esc(it.nome)+'</b> · evento '+esc(it.evento.id)+'</span>'+tg+'<span class="qt">Falta <b>'+esc(falta)+'</b>'+(r.mesesRest!=null?' · '+r.mesesRest+(r.mesesRest===1?' mês':' meses')+' (até '+window.SP.fmtKey(r.termino)+')':'')+'</span></li>';
    }).join('')+'</ul>'+(l.length>mostra.length?'<small>Mais '+(l.length-mostra.length)+' em andamento no sistema de Sentenças.</small>':'')+
    (lido?'<small>Valores da última leitura da ficha financeira, em '+new Date(lido).toLocaleDateString('pt-BR')+'. Para atualizar, abra Sentenças judiciais e use "Atualizar todos".</small>':'')+'</div>';
}
async function carregarSentencas(){
  try{const s=await dbh.doc('sentencas/lista').get();if(s.exists){const j=JSON.parse(s.data().json);sentencas=j&&Array.isArray(j.itens)?j.itens:null;}}catch(e){sentencas=null;}
  renderAlertaSent();
}
function render(){
  if(carregando){
    $('#count').textContent='';$('#editBtn').hidden=true;$('#editInfo').innerHTML='';
    $('#grid').innerHTML=Array.from({length:6},()=>'<div class="tile skel" aria-hidden="true"><i style="width:44px;height:44px;border-radius:12px"></i><i style="width:70%;height:18px"></i><i style="height:12px"></i><i style="width:85%;height:12px"></i></div>').join('');
    $('#grid').setAttribute('aria-busy','true');return;
  }
  $('#grid').removeAttribute('aria-busy');
  const q=filter.trim().toLowerCase();
  const tiles=st.tiles.filter(t=>!q||(t.nome+' '+t.desc).toLowerCase().includes(q));
  $('#count').textContent=st.tiles.length+(st.tiles.length===1?' sistema':' sistemas');
  if(edit&&!podeEditar()) edit=false;
  $('#editBtn').hidden=!podeEditar();
  $('#editBtn').innerHTML=edit?'Concluir edição':'Editar painel';
  $('#editBtn').className='btn'+(edit?' primary':'');
  $('#editInfo').innerHTML=edit?'<div class="edit-banner">Modo de edição: arraste os cartões para reordenar (ou use as setas), altere nome e descrição, exclua ou adicione sistemas. Para abrir um sistema, conclua a edição.</div>':'';
  const cards=tiles.map(t=>{
    const i=st.tiles.indexOf(t);
    const on=t.status==='ok'&&t.url;
    const style=`--tint:hsl(${t.hue} 70% ${document.documentElement.dataset.theme==='dark'?'22%':'93%'});--ink:hsl(${t.hue} 60% 38%)`;
    const pill=`<span class="pill ${t.status==='ok'?'ok':t.status==='dev'?'warn':''}">${STATUS[t.status]||''}</span>`;
    const inner=`<div class="ico">${svg(t.icone)}</div><h3>${esc(t.nome)}</h3><p>${esc(t.desc)}</p>`;
    if(edit) return `<div class="tile" data-id="${t.id}" draggable="true" style="${style}">${inner}<div class="foot">${pill}</div>
      <div class="tools"><button class="btn sm" data-a="edit" data-id="${t.id}">Editar</button><button class="btn sm" data-a="up" data-id="${t.id}"${i===0?' disabled':''} aria-label="Mover para antes">↑</button><button class="btn sm" data-a="down" data-id="${t.id}"${i===st.tiles.length-1?' disabled':''} aria-label="Mover para depois">↓</button><button class="btn sm danger" data-a="del" data-id="${t.id}">Excluir</button></div></div>`;
    const foot=`<div class="foot">${pill}${on?'<span class="open">Abrir ›</span>':''}</div>`;
    return on?`<a class="tile" style="${style}" href="${esc(t.url)}" target="_top">${inner}${foot}</a>`
             :`<div class="tile off" style="${style}">${inner}${foot}</div>`;
  });
  if(edit) cards.push(`<button class="tile add" data-a="add" type="button"><span style="font-size:30px;line-height:1">+</span><b>Adicionar sistema</b></button>`);
  $('#grid').innerHTML=cards.join('')||'<div class="empty" style="grid-column:1/-1">Nenhum sistema encontrado.</div>';
}

function openForm(t){
  const isNew=!t.id;
  const d=Object.assign({nome:'',desc:'',icone:'grid',hue:212,status:'dev',url:''},t);
  const m=$('#modal');
  m.innerHTML=`<form class="modal" autocomplete="off"><h3>${isNew?'Novo sistema':'Editar sistema'}</h3>
   <label class="fld">Nome<input name="nome" value="${esc(d.nome)}" required maxlength="70"></label>
   <label class="fld">Descrição<textarea name="desc" rows="3" maxlength="220">${esc(d.desc)}</textarea></label>
   <div class="r2"><label class="fld">Situação<select name="status">${Object.keys(STATUS).map(k=>`<option value="${k}"${k===d.status?' selected':''}>${STATUS[k]}</option>`).join('')}</select></label>
   <label class="fld">Endereço (link)<input name="url" value="${esc(d.url)}" placeholder="ex.: ferias/ ou https://…"></label></div>
   <div class="fld">Ícone<div class="icons">${Object.keys(ICONS).map(k=>`<button type="button" data-ic="${k}" aria-pressed="${k===d.icone}" aria-label="${k}">${svg(k,20)}</button>`).join('')}</div></div>
   <div class="fld">Cor<div class="hues">${HUES.map(h=>`<button type="button" data-h="${h}" style="--h:${h}" aria-pressed="${h===d.hue}" aria-label="Cor ${h}"></button>`).join('')}</div></div>
   <div class="actions"><button type="button" class="btn" data-a="close">Cancelar</button><button class="btn primary" type="submit">Salvar</button></div></form>`;
  m.hidden=false;
  const f=m.querySelector('form');
  f.addEventListener('click',ev=>{
    const ic=ev.target.closest('[data-ic]'),h=ev.target.closest('[data-h]');
    if(ic){d.icone=ic.dataset.ic;f.querySelectorAll('[data-ic]').forEach(b=>b.setAttribute('aria-pressed',b===ic));}
    if(h){d.hue=Number(h.dataset.h);f.querySelectorAll('[data-h]').forEach(b=>b.setAttribute('aria-pressed',b===h));}
  });
  f.addEventListener('submit',ev=>{
    ev.preventDefault();
    const E=f.elements;d.nome=E.nome.value.trim();d.desc=E.desc.value.trim();d.status=E.status.value;d.url=E.url.value.trim();
    if(!d.nome) return;
    if(isNew){d.id=uid();st.tiles.push(d);}else{const i=st.tiles.findIndex(x=>x.id===d.id);st.tiles[i]=d;}
    persist();closeModal();render();
  });
  f.elements.nome.focus();
}
function closeModal(){const m=$('#modal');m.hidden=true;m.innerHTML='';}

document.addEventListener('click',ev=>{
  if(ev.target.id==='modal'){closeModal();return;}
  const b=ev.target.closest('[data-a]');if(!b) return;
  const id=b.dataset.id,i=st.tiles.findIndex(t=>t.id===id);
  switch(b.dataset.a){
    case 'close':closeModal();break;
    case 'add':openForm({});break;
    case 'edit':openForm(Object.assign({},st.tiles[i]));break;
    case 'up':if(i>0){[st.tiles[i-1],st.tiles[i]]=[st.tiles[i],st.tiles[i-1]];persist();render();}break;
    case 'down':if(i<st.tiles.length-1){[st.tiles[i+1],st.tiles[i]]=[st.tiles[i],st.tiles[i+1]];persist();render();}break;
    case 'del':
      if(b.dataset.sure){st.tiles.splice(i,1);persist();render();toast('Sistema removido do painel.');}
      else{b.dataset.sure='1';b.textContent='Confirmar exclusão';setTimeout(()=>{if(b.isConnected){delete b.dataset.sure;b.textContent='Excluir';}},4000);}
      break;
  }
});
$('#editBtn').addEventListener('click',()=>{if(!podeEditar()) return;edit=!edit;render();});
/* arrastar e soltar para reordenar (no celular, as setas) */
let dragId=null;
function mover(de,para){
  const i=st.tiles.findIndex(x=>x.id===de),j=st.tiles.findIndex(x=>x.id===para);
  if(i<0||j<0||i===j) return;
  const [t]=st.tiles.splice(i,1);st.tiles.splice(j,0,t);persist();render();
}
(function arrastar(){
  const g=$('#grid');
  g.addEventListener('dragstart',ev=>{const t=ev.target.closest&&ev.target.closest('.tile[data-id]');if(!edit||!t||ev.target.closest('button')) return;dragId=t.dataset.id;ev.dataTransfer.effectAllowed='move';try{ev.dataTransfer.setData('text/plain',dragId);}catch(e){}t.classList.add('dragging');});
  g.addEventListener('dragover',ev=>{if(!edit||!dragId) return;const t=ev.target.closest('.tile[data-id]');if(!t) return;ev.preventDefault();g.querySelectorAll('.over').forEach(x=>{if(x!==t) x.classList.remove('over');});if(t.dataset.id!==dragId) t.classList.add('over');});
  g.addEventListener('drop',ev=>{if(!edit||!dragId) return;const t=ev.target.closest('.tile[data-id]');if(!t) return;ev.preventDefault();const de=dragId;dragId=null;mover(de,t.dataset.id);});
  g.addEventListener('dragend',()=>{dragId=null;render();});
})();
$('#q').addEventListener('input',e=>{filter=e.target.value;render();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#modal').hidden) closeModal();});
ligarTema();                                   // o clique troca o tema; o observador abaixo redesenha o painel
observarTema(()=>{render();themeBtn();});

function migrar(){
  if(!st.v||st.v<2){ // sistemas novos entram no painel salvo
    if(!st.tiles.some(t=>t.id==='t-pessoal')){const d=defaults().tiles.find(t=>t.id==='t-pessoal');st.tiles.splice(Math.min(1,st.tiles.length),0,d);}
    st.v=2;persist();
  }
  if(st.v<3){ // Ponto – Servidores Externos entra depois da Hierarquia de Pessoal
    if(!st.tiles.some(t=>t.id==='t-ponto')){const d=defaults().tiles.find(t=>t.id==='t-ponto');const i=st.tiles.findIndex(t=>t.id==='t-pessoal');st.tiles.splice(i>=0?i+1:st.tiles.length,0,d);}
    st.v=3;persist();
  }
  if(st.v<4){ // Férias entra no painel (ou deixa de ser "planejado") depois do Ponto
    const d=defaults().tiles.find(t=>t.id==='t-ferias'),t=st.tiles.find(x=>x.id==='t-ferias');
    if(t) Object.assign(t,{nome:d.nome,desc:d.desc,status:'ok',url:FERIAS_URL});
    else{const i=st.tiles.findIndex(x=>x.id==='t-ponto');st.tiles.splice(i>=0?i+1:st.tiles.length,0,d);}
    st.v=4;persist();
  }
  if(st.v<5){ // Tarefas do RH entra depois de Férias
    if(!st.tiles.some(x=>x.id==='t-tarefas')){const d=defaults().tiles.find(t=>t.id==='t-tarefas');const i=st.tiles.findIndex(x=>x.id==='t-ferias');st.tiles.splice(i>=0?i+1:st.tiles.length,0,d);}
    st.v=5;persist();
  }
  if(st.v<6){ // Carimbos em PDF entra depois de Tarefas
    if(!st.tiles.some(x=>x.id==='t-carimbos')){const d=defaults().tiles.find(t=>t.id==='t-carimbos');const i=st.tiles.findIndex(x=>x.id==='t-tarefas');st.tiles.splice(i>=0?i+1:st.tiles.length,0,d);}
    st.v=6;persist();
  }
  if(st.v<7){ // Licença-prêmio entra depois de Férias
    if(!st.tiles.some(x=>x.id==='t-licenca')){const d=defaults().tiles.find(t=>t.id==='t-licenca');const i=st.tiles.findIndex(x=>x.id==='t-ferias');st.tiles.splice(i>=0?i+1:st.tiles.length,0,d);}
    st.v=7;persist();
  }
  if(st.v<8){ // Gerador de Documentos entra depois de Carimbos
    if(!st.tiles.some(x=>x.id==='t-documentos')){const d=defaults().tiles.find(t=>t.id==='t-documentos');const i=st.tiles.findIndex(x=>x.id==='t-carimbos');st.tiles.splice(i>=0?i+1:st.tiles.length,0,d);}
    st.v=8;persist();
  }
  if(st.v<9){ // "Carimbos em PDF" passa a "Espelhos de ponto" (só se o nome ainda for o original)
    const t=st.tiles.find(x=>x.id==='t-carimbos'),d=defaults().tiles.find(x=>x.id==='t-carimbos');
    if(t&&t.nome==='Carimbos em PDF'){t.nome=d.nome;t.desc=d.desc;}
    st.v=9;persist();
  }
  if(st.v<10){ // painéis que já tinham o nome "Espelhos de Ponto - Carimbo" (editado à mão) também passam a "Espelhos de ponto"
    const t=st.tiles.find(x=>x.id==='t-carimbos'),d=defaults().tiles.find(x=>x.id==='t-carimbos');
    const nn=String((t&&t.nome)||'').toLowerCase().replace(/\s+/g,' ').trim();
    if(t&&(nn==='espelhos de ponto - carimbo'||nn==='espelhos de ponto – carimbo'||nn==='espelhos de ponto - carimbos')){t.nome=d.nome;t.desc=d.desc;}
    st.v=10;persist();
  }
  if(st.v<11){ // descrição do cartão: "entregue" passa a "devolvido ao RH" (só se ainda for a descrição anterior)
    const t=st.tiles.find(x=>x.id==='t-carimbos');
    if(t&&t.desc===ANTIGA_DESC_ESPELHOS) t.desc=defaults().tiles.find(x=>x.id==='t-carimbos').desc;
    st.v=11;persist();
  }
  if(st.v<12){ // a pasta de Espelhos de ponto passou de carimbos/ para espelho/ (quem já tinha o endereço antigo salvo no painel)
    const t=st.tiles.find(x=>x.id==='t-carimbos');
    if(t&&/^\/?carimbos\/?$/.test(String(t.url||''))) t.url='espelho/';
    st.v=12;persist();
  }
  if(st.v<13){ // Sentenças judiciais entra depois de Licença-prêmio
    if(!st.tiles.some(x=>x.id==='t-sentencas')){const d=defaults().tiles.find(t=>t.id==='t-sentencas');const i=st.tiles.findIndex(x=>x.id==='t-licenca');st.tiles.splice(i>=0?i+1:st.tiles.length,0,d);}
    st.v=13;persist();
  }
}
(function init(){
    const l=load(),c=lerCache();
  if(l) st=l;                        // modo local: dados deste navegador
  else if(c) st=c;                   // última cópia do servidor: aparece na hora, sem piscar os nomes originais
  else if(PB.url) carregando=true;   // sem cópia: espera o servidor em vez de mostrar os nomes originais do código
  if(!carregando) migrar();
  // mantém o endereço do sistema de fluxogramas atualizado
  const fl=st.tiles.find(t=>t.id==='t-fluxos'); if(fl&&!fl.url) fl.url=FLOW_URL;
  $('#storeNote').textContent=PB.url?'':'As alterações deste painel ficam salvas neste navegador.';
  render();themeBtn();saudacao();
  (async()=>{
    try{
      if(window.claude&&window.claude.use) dbh=await window.claude.use('db');
      if(!dbh) dbh=await PB.connect();
      saudacao();
      if(dbh){
        $('#storeNote').textContent=podeEditar()?'As alterações deste painel ficam salvas no servidor.':'O painel é editado pelos administradores.';
        render();
        carregarSentencas();
        const s=await dbh.doc('painel/tiles').get();
        if(s.exists){try{const d=JSON.parse(s.data().json);if(d&&Array.isArray(d.tiles)){st=d;carregando=false;migrar();guardarCache();render();}}catch(e){}}
        else if(load()&&podeEditar()){
          await dbh.doc('painel/tiles').set({json:JSON.stringify(st)});
          const v=await dbh.doc('painel/tiles').get();
          if(v.exists){try{localStorage.removeItem(LS);}catch(e){}toast('Dados deste navegador enviados ao servidor.');}
        }
      }
    }catch(e){dbh=null;}
    if(carregando){carregando=false;migrar();render();}      // servidor sem resposta ou sem painel salvo: mostra o que há
  })();
})();
</script>
