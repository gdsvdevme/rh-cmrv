<title>RH Câmara Rio Verde</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Libre+Franklin:wght@500;600;700&family=Public+Sans:wght@400;500;600&display=swap">
<style>
/* RH Câmara Rio Verde — layout: menu lateral verde (cores da Câmara), barra superior, área de trabalho clara. */
:root{
  --bg:#eff5f1; --surface:#ffffff; --surface-2:#e6efe9; --line:#d0ddd5;
  --fg:#12281d; --muted:#4f665a;
  --accent:#0a6b3d; --accent-fg:#ffffff; --accent-soft:#d9efe2;
  --side-bg:#0a3b27; --side-fg:#e6f4ec; --side-muted:#9fc7b2; --side-active:#14684a; --side-line:#1d5a41;
  --warn:#8a5200; --warn-soft:#fbecd0; --danger:#b3261e; --danger-soft:#f9dedc; --ok:#1b7a3d; --ok-soft:#dcf2e3;
  --f-display:"Libre Franklin",system-ui,sans-serif;
  --f-body:"Public Sans",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#09140f; --surface:#101e18; --surface-2:#182a22; --line:#264236;
    --fg:#e3f1ea; --muted:#90b0a0;
    --accent:#52c98a; --accent-fg:#04210f; --accent-soft:#16372a;
    --side-bg:#07140e; --side-fg:#e3f1ea; --side-muted:#8db09d; --side-active:#134a35; --side-line:#183a2b;
    --warn:#f0b45a; --warn-soft:#3a2c12; --danger:#ff8f86; --danger-soft:#3b1a18; --ok:#6fd58f; --ok-soft:#14301f;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#09140f; --surface:#101e18; --surface-2:#182a22; --line:#264236;
  --fg:#e3f1ea; --muted:#90b0a0;
  --accent:#52c98a; --accent-fg:#04210f; --accent-soft:#16372a;
  --side-bg:#07140e; --side-fg:#e3f1ea; --side-muted:#8db09d; --side-active:#134a35; --side-line:#183a2b;
  --warn:#f0b45a; --warn-soft:#3a2c12; --danger:#ff8f86; --danger-soft:#3b1a18; --ok:#6fd58f; --ok-soft:#14301f;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14.5px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:70;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{font-family:var(--f-display);margin:0;text-wrap:balance}
p{margin:0}
.ic{flex:none;display:inline-block;vertical-align:middle}
.mono{font-family:var(--f-mono)}
.muted{color:var(--muted)}
.hint{color:var(--muted);font-size:13px}

/* estrutura */
.shell{display:grid;grid-template-columns:272px minmax(0,1fr);align-items:start}
.side{position:sticky;top:env(safe-area-inset-top,0px);height:calc(100vh - env(safe-area-inset-top,0px));overflow:auto;background:var(--side-bg);color:var(--side-fg);display:flex;flex-direction:column}
.brand{display:flex;gap:12px;align-items:center;padding:18px 16px 16px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--side-line)}
.logo{width:40px;height:40px;border-radius:9px;background:var(--surface);color:var(--accent);display:grid;place-items:center;flex:none}
.brand b{display:block;font-family:var(--f-display);font-size:15px;line-height:1.2}
.brand span{display:block;font-size:12px;color:var(--side-muted);line-height:1.3;margin-top:2px}
.nav{display:flex;flex-direction:column;padding:10px 10px 10px max(10px,env(safe-area-inset-left,0px));gap:2px}
.nav button{display:flex;gap:11px;align-items:center;width:100%;text-align:left;background:none;border:0;border-radius:7px;color:var(--side-fg);padding:9px 11px;cursor:pointer;font-weight:500;font-size:14px}
.nav button:hover{background:var(--side-active)}
.nav button[aria-current="page"]{background:var(--surface);color:var(--accent)}
.nav .sep{height:1px;background:var(--side-line);margin:8px 6px}
.side-foot{margin-top:auto;padding:12px 16px 16px max(16px,env(safe-area-inset-left,0px));font-size:12px;color:var(--side-muted);border-top:1px solid var(--side-line)}
.workspace{min-width:0;display:flex;flex-direction:column;min-height:100vh}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--surface);border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center;padding:10px max(20px,env(safe-area-inset-right,0px)) 10px 24px}
.topbar h1{font-size:1.15rem;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .menu-btn{display:none}
.main{padding:22px max(20px,env(safe-area-inset-right,0px)) 40px 24px;display:flex;flex-direction:column;gap:18px;min-width:0}
.legal{font-size:12.5px;color:var(--muted);border-top:1px solid var(--line);padding:14px max(20px,env(safe-area-inset-right,0px)) 22px 24px;margin-top:auto}
.legal b{color:var(--fg)}
.backdrop{display:none}
@media (max-width:940px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;left:0;top:0;bottom:0;height:auto;width:min(288px,86vw);z-index:60;transform:translateX(-102%);transition:transform .2s;padding-top:env(safe-area-inset-top,0px)}
  .shell.nav-open .side{transform:none}
  .shell.nav-open .backdrop{display:block;position:fixed;inset:0;background:rgba(5,15,30,.5);z-index:55}
  .topbar{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .topbar .menu-btn{display:grid}
  .main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .legal{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
}
@media (prefers-reduced-motion:reduce){.side{transition:none}}
/* telas muito estreitas: o indicador de salvamento vira só o ponto colorido (o texto fica no title) */
@media (max-width:420px){
  .topbar{gap:8px}
  .topbar #saveState{font-size:0;gap:0;padding:8px;flex:none}
  .topbar #saveState::before{width:10px;height:10px}
}
/* celular: campos com 16px (o iOS não dá zoom ao digitar) e áreas de toque maiores */
@media (pointer:coarse){
  input,select,textarea{font-size:16px}
  .btn,.ibtn,.chip{min-height:42px}
  .btn.sm{min-height:38px}
  .ibtn{min-width:42px}
}

/* componentes */
.card{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:16px;min-width:0}
.card>h2,.card>.ch>h2{font-size:1.05rem}
.ch{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-bottom:10px}
.ch h2{font-size:1.05rem}
.pagehead{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-start;justify-content:space-between}
.pagehead h2{font-size:1.35rem}
.pagehead p{max-width:70ch}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr))}
.stat{display:flex;flex-direction:column;gap:2px}
.stat b{font-family:var(--f-display);font-size:1.9rem;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:13px}
.btn{display:inline-flex;gap:6px;align-items:center;justify-content:center;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 12px;cursor:pointer;font-weight:500;line-height:1.2;color:var(--fg)}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn:disabled{opacity:.45;cursor:default}
.btn:disabled:hover{border-color:var(--line);color:var(--fg)}
.btn.sm{padding:4px 9px;font-size:13px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.primary:hover{color:var(--accent-fg);filter:brightness(1.1)}
.btn.danger{color:var(--danger)}
.btn.danger:hover{border-color:var(--danger);color:var(--danger)}
.btn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.ibtn{width:30px;height:30px;display:inline-grid;place-items:center;border:1px solid var(--line);background:var(--surface);border-radius:6px;cursor:pointer;padding:0;flex:none}
.ibtn:hover{border-color:var(--accent);color:var(--accent)}
.ibtn.danger:hover{border-color:var(--danger);color:var(--danger)}
.ibtn:disabled{opacity:.4;cursor:default}
:where(button,input,select,textarea,summary,[tabindex]):focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select,textarea{width:100%;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:5px;padding:6px 9px}
textarea{resize:vertical}
input[type=checkbox]{width:17px;height:17px;accent-color:var(--accent);padding:0}
input[type=number]{font-variant-numeric:tabular-nums}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld>span,.lbl{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.02em}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--muted);white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--muted)}
.pill.ok::before{background:var(--ok)}
.pill.dirty::before,.pill.saving::before{background:var(--warn)}
.pill.err{color:var(--danger)}
.pill.err::before{background:var(--danger)}
.tag{display:inline-block;font-size:11.5px;font-weight:600;padding:1px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.bad{background:var(--danger-soft);color:var(--danger)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:6px 12px;cursor:pointer;font-weight:500}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 12px;cursor:pointer;text-align:left;font-weight:500;max-width:100%}
.chip:hover{border-color:var(--accent)}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.chip.add{border-style:dashed;color:var(--muted)}
.banner{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;background:var(--warn-soft);color:var(--warn);border-radius:7px;padding:9px 12px;font-size:13.5px}
.banner.info{background:var(--accent-soft);color:var(--accent)}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
td input,td select{padding:5px 7px}
td.num,th.num{text-align:center;font-variant-numeric:tabular-nums}
tr.selrow td{background:var(--accent-soft)}
.list{display:flex;flex-direction:column;gap:6px}
.lrow{display:flex;gap:6px;align-items:center}
.uicon{width:38px;height:38px;border-radius:9px;display:grid;place-items:center;flex:none;background:hsl(var(--h,212) 60% 92%);color:hsl(var(--h,212) 55% 32%)}
:root[data-theme="dark"] .uicon{background:hsl(var(--h,212) 35% 22%);color:hsl(var(--h,212) 70% 78%)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .uicon{background:hsl(var(--h,212) 35% 22%);color:hsl(var(--h,212) 70% 78%)}}
.sw{width:20px;height:20px;border-radius:50%;border:0;padding:0;cursor:pointer;background:hsl(var(--h) 55% 50%);flex:none}
.sw.auto{background:var(--surface);border:1.5px dashed var(--muted)}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--fg)}
.swatches{display:flex;flex-wrap:wrap;gap:7px}
.dot{width:10px;height:10px;border-radius:50%;background:hsl(var(--h,0) 52% 48%);display:inline-block}

/* editor de diagramas */
.ed{display:flex;flex-direction:column;gap:10px}
.ed-bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.ed-bar .grp{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding-right:10px;margin-right:4px;border-right:1px solid var(--line)}
.ed-bar .grp:last-child{border-right:0}
.ed-main{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
@media (min-width:1150px){.ed-main{grid-template-columns:minmax(0,1fr) 330px}}
.ed-canvas{position:relative;border:1px solid var(--line);border-radius:8px;background:var(--surface);background-image:radial-gradient(var(--line) 1px,transparent 1px);background-size:20px 20px;height:clamp(420px,68vh,780px);overflow:hidden;min-width:0}
.ed-svg{width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none}
.ed-sheet-close{display:none}
@media (max-width:760px){
  .ed-bar{gap:8px}
  .ed-bar .grp{width:100%;flex-wrap:nowrap;overflow-x:auto;border-right:0;padding:0 0 4px;margin:0;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
  .ed-bar .grp>*{flex:none}
  .ed-panel.has-sel{position:fixed;left:0;right:0;bottom:0;z-index:45;max-height:56vh;border-radius:16px 16px 0 0;box-shadow:0 -10px 30px rgba(0,0,0,.28);padding-bottom:max(16px,env(safe-area-inset-bottom,0px));animation:sheetUp .18s ease-out}
  .ed-panel.has-sel .ed-sheet-close{display:inline-flex;align-self:flex-end;position:sticky;top:0;z-index:1}
  .ed-hint{font-size:11.5px}
}
@keyframes sheetUp{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.ed-panel.has-sel{animation:none}}
.ed-hint{position:absolute;left:10px;bottom:8px;font-size:12px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:5px;padding:2px 8px;pointer-events:none;max-width:calc(100% - 20px)}
.ed-panel{border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:14px;display:flex;flex-direction:column;gap:11px;min-width:0;align-self:start;max-height:78vh;overflow:auto}
.ed-panel h3{font-size:1rem}
.ed-svg .nd{cursor:grab}
.ed-svg .nd:active{cursor:grabbing}
.ed-svg .eh{cursor:pointer}
.ed-svg .hdl{cursor:crosshair}
.ed-table{margin-top:4px}
.edge-row{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) auto;gap:6px;align-items:center}

/* indicadores */
.kpi-card{border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:12px;display:flex;flex-direction:column;gap:6px;cursor:pointer;text-align:left;min-width:0}
.kpi-card:hover{border-color:var(--accent)}
.kpi-card.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.kpi-card .nm{font-size:13px;color:var(--muted);line-height:1.3}
.kpi-card .vl{font-family:var(--f-display);font-size:1.5rem;font-weight:700;font-variant-numeric:tabular-nums}
.chart{width:100%;height:auto;display:block}
.chart text{font-family:var(--f-body);font-size:11px;fill:var(--muted)}
.chart .ax{stroke:var(--line);stroke-width:1}
.chart .bar{fill:var(--accent)}
.chart .bar.bad{fill:var(--warn)}
.chart .meta{stroke:var(--danger);stroke-width:1.5;stroke-dasharray:5 4;fill:none}
.chart .val{fill:var(--fg);font-weight:600}

/* manual */
.manual{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
@media (min-width:980px){.manual{grid-template-columns:300px minmax(0,1fr)}}
.chap{display:flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:var(--surface);cursor:pointer}
.chap.on{border-color:var(--accent);background:var(--accent-soft)}
.chap span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13.5px}
.preview{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:14px 18px;min-height:240px}
.preview h4{margin:14px 0 6px;font-size:1rem}
.preview p{margin:0 0 8px}
.preview ul{margin:0 0 8px;padding-left:20px}
.preview ol{margin:0 0 8px;padding-left:22px}

/* modal e aviso */
#modal{position:fixed;inset:0;z-index:80;background:rgba(5,15,30,.55);display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:max(24px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
#modal[hidden]{display:none}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:10px;width:min(560px,100%);padding:18px;display:flex;flex-direction:column;gap:12px;margin-top:6vh}
.modal h3{font-size:1.1rem}
#toast{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;pointer-events:none;z-index:90;
  padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
#toast[hidden]{display:none}
.toast-in{pointer-events:auto;display:flex;gap:12px;align-items:center;background:var(--fg);color:var(--bg);border-radius:8px;padding:8px 8px 8px 14px;font-size:14px;max-width:100%}
.toast-in .btn{background:transparent;color:var(--bg);border-color:var(--bg)}

/* impressão */
#printSheet{display:none}
@media print{
  @page{size:landscape;margin:10mm}
  body.printing .shell,body.printing #toast,body.printing #modal,body.printing::before{display:none!important}
  body.printing #printSheet{display:block}
  #printSheet svg{width:100%;height:auto;max-height:190mm}
  #printSheet h2{font-family:var(--f-display);font-size:16pt;margin:0 0 6mm;color:#000}
  body.printing{background:#fff}
}

.homelink{display:flex;align-items:center;gap:8px;color:#fff;text-decoration:none;font-weight:600;font-size:13px;padding:8px 10px;margin:0 -10px 10px;border-radius:8px;background:rgba(255,255,255,.08)}
.homelink:hover{background:rgba(255,255,255,.16)}

.themebtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:9px;padding:6px 10px;font-weight:600;font-size:13px;cursor:pointer}
.themebtn:hover{border-color:var(--accent)}
@media (max-width:760px){.hide-sm{display:none!important}}

</style>
<div id="app"></div>
<div id="modal" hidden></div>
<div id="toast" hidden></div>
<div id="printSheet"></div>
<input type="file" id="fileIn" accept="application/json,.json" hidden>
<script>
/* =====================================================================
   PocketBase: armazenamento no servidor (substitui o localStorage)
   Expõe PB.connect(), que devolve um objeto "dbh" com a mesma forma
   usada pelo restante do sistema: dbh.doc('a/b').get/set/delete e
   dbh.collection('versoes').orderBy('at','desc').limit(n).get()
   ===================================================================== */
const PB=(function(){
  const URL_BASE='https://pb.devgabriel.app.br'.replace(/\/+$/,'');
  const CENTI_BASE=''.replace(/\/+$/,'');   // vazio = mesmo endereço do site (funções em /api)
  const AUTH_KEY='rhcrv-pb-auth';
  let token='',email='',col='rhcmrv_users',loginP=null;
  let cs=null;   // sessão do Centi: {user,nome,token,refreshToken}

  /* só vale a sessão que tem o acesso do Centi junto; sessões antigas (login simples) pedem novo login */
  function readAuth(){try{const a=JSON.parse(localStorage.getItem(AUTH_KEY)||'null');if(a&&a.token&&a.centi&&a.centi.token){token=a.token;email=a.email||'';col=a.col||'rhcmrv_users';cs=a.centi;}}catch(e){}}
  function saveAuth(){try{localStorage.setItem(AUTH_KEY,JSON.stringify({token,email,col,centi:cs}));}catch(e){}}
  function clearAuth(){token='';email='';col='rhcmrv_users';cs=null;try{localStorage.removeItem(AUTH_KEY);}catch(e){}}

  async function raw(method,path,body){
    const h={};
    if(body!==undefined) h['Content-Type']='application/json';
    if(token) h.Authorization=token;
    const r=await fetch(URL_BASE+path,{method,headers:h,body:body===undefined?undefined:JSON.stringify(body)});
    if(r.status===204) return null;
    let j=null; try{j=await r.json();}catch(e){}
    if(!r.ok){const err=new Error((j&&j.message)||('HTTP '+r.status));err.status=r.status;throw err;}
    return j;
  }
  async function api(method,path,body){
    try{return await raw(method,path,body);}
    catch(e){
      if(e.status===401||e.status===403){
        clearAuth();
        if(await login()) return raw(method,path,body);
      }
      throw e;
    }
  }

  /* ---------- login ---------- */
  function login(msg){
    if(loginP) return loginP;
    loginP=new Promise(resolve=>{
      const wrap=document.createElement('div');
      wrap.style.cssText='position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(0,0,0,.45)';

        '<h3 style="margin:0 0 4px;font-size:18px">Entrar com o acesso do Centi</h3>'+
        '<p style="margin:0 0 14px;color:var(--muted,#4f665a);font-size:13px">Use o mesmo usuário e senha do Centi. A senha é conferida no Centi e não fica guardada neste sistema.</p>'+
        '<label style="display:block;font-size:13px;margin-bottom:10px">Usuário do Centi<input name="e" type="text" required autocapitalize="none" spellcheck="false" autocomplete="username" style="display:block;width:100%;box-sizing:border-box;margin-top:4px;padding:9px;border:1px solid var(--line,#d1ddd6);border-radius:8px;background:transparent;color:inherit;font:inherit"></label>'+
        '<label style="display:block;font-size:13px;margin-bottom:10px">Senha<input name="p" type="password" required autocomplete="current-password" style="display:block;width:100%;box-sizing:border-box;margin-top:4px;padding:9px;border:1px solid var(--line,#d1ddd6);border-radius:8px;background:transparent;color:inherit;font:inherit"></label>'+
        '<div data-err style="min-height:18px;margin-bottom:8px;color:#c0392b;font-size:13px"></div>'+
        '<div style="display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap">'+
        '<button type="submit" style="padding:9px 16px;border:0;border-radius:8px;background:var(--accent,#0a6b3d);color:var(--accent-fg,#fff);font:inherit;font-weight:600;cursor:pointer">Entrar</button></div></form>';
      document.body.appendChild(wrap);
      const f=wrap.querySelector('form'),err=wrap.querySelector('[data-err]');
      if(msg) err.textContent=msg;
      const done=ok=>{wrap.remove();loginP=null;resolve(ok);};
      f.e.focus();
      f.addEventListener('submit',async ev=>{
        ev.preventDefault(); err.textContent='Entrando…';
        try{
          const r=await fetch(CENTI_BASE+'/api/centi-login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user:f.e.value.trim(),pass:f.p.value})});
          let j=null; try{j=await r.json();}catch(e){}
          if(!r.ok){err.textContent=(j&&j.message)||('Não foi possível entrar (HTTP '+r.status+').');return;}
          token=j.pb.token; col='rhcmrv_users'; email=j.centi.user; cs=j.centi; saveAuth(); done(true);
        }catch(e){err.textContent='Não foi possível entrar: '+e.message;}
      });
    });
    return loginP;
  }

  /* ---------- documentos ---------- */
  const ids={};   // cache de id de registro por caminho
  const esc=s=>String(s).replace(/\\/g,'\\\\').replace(/"/g,'\\"');
  const spec=path=>{
    const i=path.indexOf('/'),col=path.slice(0,i),id=path.slice(i+1);
    return col==='versoes'?{c:'rhcmrv_versoes',f:'vid',k:id}:{c:'rhcmrv_docs',f:'key',k:path};
  };
  async function find(path){
    const s=spec(path);
    const q='?perPage=1&filter='+encodeURIComponent(s.f+'="'+esc(s.k)+'"');
    const r=await api('GET','/api/collections/'+s.c+'/records'+q);
    const rec=r.items&&r.items[0];
    if(rec) ids[path]=rec.id; else delete ids[path];
    return rec||null;
  }
  const payload=(s,data)=>s.c==='rhcmrv_versoes'?Object.assign({vid:s.k},data):{key:s.k,data};
  const unwrap=(s,rec)=>s.c==='rhcmrv_versoes'?{at:rec.at,label:rec.label,json:rec.json}:rec.data;

  function doc(path){
    const s=spec(path);
    return {
      async get(){const rec=await find(path);return {exists:!!rec,id:s.k,data:()=>rec?unwrap(s,rec):undefined};},
      async set(data){
        if(!ids[path]) await find(path);
        if(ids[path]) await api('PATCH','/api/collections/'+s.c+'/records/'+ids[path],payload(s,data));
        else{const r=await api('POST','/api/collections/'+s.c+'/records',payload(s,data));ids[path]=r.id;}
      },
      async delete(){
        if(!ids[path]) await find(path);
        if(ids[path]){await api('DELETE','/api/collections/'+s.c+'/records/'+ids[path]);delete ids[path];}
      }
    };
  }
  function collection(name){
    const q={sort:'',n:30};
    const api_={
      orderBy(f,dir){q.sort=(dir==='desc'?'-':'')+f;return api_;},
      limit(n){q.n=n;return api_;},
      async get(){
        const r=await api('GET','/api/collections/rhcmrv_'+name+'/records?perPage='+q.n+(q.sort?'&sort='+encodeURIComponent(q.sort):''));
        return {docs:r.items.map(rec=>({id:rec.vid,data:()=>({at:rec.at,label:rec.label,json:rec.json})}))};
      }
    };
    return api_;
  }

  /* ---------- API do Centi (pelo servidor do sistema, com o acesso da própria pessoa) ---------- */
  async function centiCall(path,body){
    if(!cs) throw new Error('Sem sessão do Centi. Entre novamente.');
    const r=await fetch(CENTI_BASE+'/api/centi',{method:'POST',
      headers:{'Content-Type':'application/json','x-centi-user':cs.user,'x-centi-token':cs.token,'x-centi-refresh':cs.refreshToken||''},
      body:JSON.stringify({path,body})});
    const nt=r.headers.get('x-centi-token'),nr=r.headers.get('x-centi-refresh');
    if(nt){cs.token=nt;if(nr)cs.refreshToken=nr;saveAuth();}   // o Centi renova o token sozinho
    let j=null; try{j=await r.json();}catch(e){}
    if(!r.ok){
      if(r.status===401){clearAuth();}
      const err=new Error((j&&j.message)||('Centi: HTTP '+r.status));err.status=r.status;throw err;
    }
    return j;
  }
  /* PB.centi.search('SFuncionario',[{FieldName:'Nome',Operation:6,Value:'%ana%'}]) -> {Data:[...],Count}
     (Operation 6 = contém; a tela de consulta do Centi exige ao menos um filtro com valor) */
  const centi={
    get user(){return cs?cs.user:'';},
    get nome(){return cs?(cs.nome||cs.user):'';},
    /* Cubo funcionário (FP051) do Centi na referência mes/ano -> {Data:[{MATRICULA,NOMEFUNC,CARGO,HIERARQUIA,...}],Total}; só ativos */
    /* Ficha financeira (FP024) da matrícula no mês/ano -> {Fichas:[{Folha,Mes,Ano,TotalProventos,TotalDescontos,LiquidoReceber,Eventos:[...]}]}; não é guardada */
    ficha(matricula,mes,ano){return centiCall('ficha-financeira',{matricula,mes,ano});},
    /* Férias: ativos (FP051) + gozos de férias (FP273) -> {Pessoas:[...],Gozos:[{MATRICULA,DTAQUIINI,DTAQUIFIN,SALDO,GOZOINICIAL,GOZOFINAL,...}]} */
    ferias(mes,ano){return centiCall('ferias',{mes,ano});},
    cubo(mes,ano){return centiCall('cubo-funcionario',{mes,ano});},
    search(entity,filters,start,depth){
      return centiCall('restauth/searchentity',{Depth:depth||50,Entity:entity,Start:start==null?1:start,
        Filters:(filters||[]).map(f=>Object.assign({List:false,TypeFilter:0,between:''},f))});
    }
  };

  /* ---------- conexão ---------- */
  const sleep=ms=>new Promise(r=>setTimeout(r,ms));
  async function alive(){
    for(let i=0;i<3;i++){
      const ac=new AbortController(),t=setTimeout(()=>ac.abort(),6000);
      try{const r=await fetch(URL_BASE+'/api/health',{cache:'no-store',signal:ac.signal});clearTimeout(t);if(r.ok) return true;}catch(e){clearTimeout(t);}
      if(i<2) await sleep(1500);
    }
    return false;
  }
  const box='position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(0,0,0,.5)';
  const card='width:100%;max-width:380px;background:var(--surface,#fff);color:var(--fg,#12281d);border:1px solid var(--line,#d1ddd6);border-radius:12px;padding:22px;box-shadow:0 10px 40px rgba(0,0,0,.3);font:15px/1.45 system-ui,sans-serif';
  const bt='padding:9px 14px;border-radius:8px;font:inherit;font-weight:600;cursor:pointer;';
  /* servidor fora do ar: pergunta antes de seguir, para não trabalhar sem querer só neste navegador */
  function offlineDialog(){
    return new Promise(resolve=>{
      const w=document.createElement('div');w.style.cssText=box;
      w.innerHTML='<div role="alertdialog" aria-modal="true" style="'+card+'"><h3 style="margin:0 0 6px;font-size:18px">Sem conexão com o servidor</h3>'+
        '<p style="margin:0 0 14px;color:var(--muted,#4f665a);font-size:13.5px">Não foi possível falar com o servidor dos dados. Verifique a internet e tente de novo. Se continuar só neste navegador, o que você fizer <b>não será salvo no servidor</b> e não aparecerá em outros computadores.</p>'+
        '<div style="display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap"><button type="button" data-loc style="'+bt+'border:1px solid var(--line,#d1ddd6);background:transparent;color:inherit">Usar só neste navegador</button>'+
        '<button type="button" data-retry style="'+bt+'border:0;background:var(--accent,#0a6b3d);color:var(--accent-fg,#fff)">Tentar novamente</button></div></div>';
      document.body.appendChild(w);
      const done=v=>{w.remove();resolve(v);};
      w.querySelector('[data-retry]').addEventListener('click',()=>done(true));
      w.querySelector('[data-loc]').addEventListener('click',()=>done(false));
      w.querySelector('[data-retry]').focus();
    });
  }
  function markLocal(){
    if(document.getElementById('pb-local')) return;
    const b=document.createElement('div');b.id='pb-local';
    b.style.cssText='position:fixed;left:0;right:0;bottom:0;z-index:99998;background:#8a5a00;color:#fff;padding:8px 14px;font:13.5px/1.35 system-ui,sans-serif;display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;text-align:center';
    b.innerHTML='<span>Modo local: os dados ficam só neste navegador e <b>não são salvos no servidor</b>.</span><button type="button" style="border:1px solid #fff;background:transparent;color:#fff;border-radius:7px;padding:3px 10px;font:inherit;font-weight:600;cursor:pointer">Reconectar</button>';
    b.querySelector('button').addEventListener('click',()=>location.reload());
    document.body.appendChild(b);
  }
  async function connect(){
    if(!URL_BASE) return null;
    readAuth();
    for(;;){
      if(!(await alive())){if(await offlineDialog()) continue;markLocal();return null;}
      try{
        let ok=false;
        if(token){
          try{const r=await raw('POST','/api/collections/'+col+'/auth-refresh');token=r.token;email=(r.record&&(r.record.email||r.record.username))||email;saveAuth();ok=true;}
          catch(e){if(e.status!==401&&e.status!==403&&e.status!==404) throw e; clearAuth();}
        }
        if(!ok&&!(await login())){markLocal();return null;}
        return {doc,collection,centi};
      }catch(e){
        if(await offlineDialog()) continue;
        markLocal();return null;
      }
    }
  }
  return {connect,centi,logout(){clearAuth();location.reload();},get email(){return email;},get nome(){return centi.nome;},url:URL_BASE};
})();

   Estado, salvamento, cópias de segurança, avisos e janelas

let state=null;
let touched=false,dbh=null,saving=false,pendingSave=false,saveT=null,toastT=null,undoSnap=null,undoFn=null;
const LS_STATE='rhcrv-estado-v2',LS_VERS='rhcrv-versoes-v2';

function parseState(json){
  try{
    const d=typeof json==='string'?JSON.parse(json):json;
    if(!d||d.v!==2||!Array.isArray(d.units)||!Array.isArray(d.flows)||!d.org||!Array.isArray(d.org.nodes)) return null;
    d.meta=d.meta||{}; d.meta.atualizado=d.meta.atualizado||new Date().toISOString(); d.meta.copiaDia=d.meta.copiaDia||''; d.meta.demo=!!d.meta.demo;
    d.inst=Object.assign({nome:'RH Câmara Rio Verde',sub:'Gestão de Pessoas e Processos Administrativos',orgao:'Câmara Municipal de Rio Verde/GO',setor:'',obs:''},d.inst||{});
    d.units.forEach(u=>{u.nome=String(u.nome||'');u.desc=String(u.desc||'');u.obs=String(u.obs||'');u.hue=Number(u.hue)||0;u.comp=Array.isArray(u.comp)?u.comp.map(String):[];u.icone=u.icone||'file';u.sigla=String(u.sigla||'');u.page=u.page||'';});
    d.org.edges=Array.isArray(d.org.edges)?d.org.edges:[];
    d.org.nodes.forEach(n=>{n.t=String(n.t||'');n.desc=String(n.desc||'');n.obs=String(n.obs||'');n.unitId=n.unitId||'';n.tipo=TIPOS_ORG[n.tipo]?n.tipo:'unidade';});
    d.flows.forEach(f=>{
      f.nome=String(f.nome||'');f.desc=String(f.desc||'');f.page=PAGES_FLOW[f.page]?f.page:'geral';
      f.nodes=Array.isArray(f.nodes)?f.nodes:[];f.edges=Array.isArray(f.edges)?f.edges:[];
      f.nodes.forEach(n=>{n.t=String(n.t||'');n.tipo=TIPOS_FLUXO[n.tipo]?n.tipo:'proc';['desc','unit','resp','prazo','docs','obs','status'].forEach(k=>{n[k]=String(n[k]||'');});});
      f.edges.forEach(e=>{e.l=String(e.l||'');});
    });
    d.matriz=Array.isArray(d.matriz)?d.matriz:[];
    d.kpis=Array.isArray(d.kpis)?d.kpis:[];
    d.kpis.forEach(k=>{k.vals=k.vals&&typeof k.vals==='object'?k.vals:{};});
    d.params=Array.isArray(d.params)?d.params:[];
    d.manual=Array.isArray(d.manual)?d.manual:[];
    return d;
  }catch(e){return null;}
}

/* ---------- indicador de salvamento ---------- */
function setStatus(k){
  const el=$('#saveState'); if(!el) return;
  const map={ok:['Salvo','ok'],dirty:['Alterações pendentes','dirty'],saving:['Salvando…','saving'],local:['Salvo neste navegador','ok'],err:['Erro ao salvar','err'],load:['Carregando…','dirty']};
  const m=map[k]||map.ok;
  el.textContent=m[0]; el.className='pill '+m[1]; el.title=m[0];
}
function changed(){
  touched=true; state.meta.atualizado=new Date().toISOString();
  setStatus('dirty');
  const t=$('#lastChange'); if(t) t.textContent='Última alteração: '+fmtDT(state.meta.atualizado);
  clearTimeout(saveT); saveT=setTimeout(()=>doSave(false),700);
}
const todayKey=()=>new Date().toISOString().slice(0,10);
async function doSave(manual){
  if(saving){pendingSave=true;return;}
  saving=true; setStatus('saving');
  let snapNeeded=false;
  if(state.meta.copiaDia!==todayKey()){state.meta.copiaDia=todayKey();snapNeeded=true;}
  const json=JSON.stringify(state);
  let ok=true;
  if(!dbh){try{localStorage.setItem(LS_STATE,json);}catch(e){}}
  try{
    if(dbh){await dbh.doc('rh/estado').set({v:2,json});setStatus('ok');}
    else setStatus('local');
  }catch(e){ok=false;setStatus('err');}
  if(ok&&snapNeeded){try{await createVersion('Cópia automática do dia',true);}catch(e){}}
  saving=false;
  if(pendingSave){pendingSave=false;doSave(false);}
  else if(manual&&ok) toast(dbh?'Alterações salvas.':'Alterações salvas neste navegador.');
}

/* Envia ao servidor os dados que estavam só neste navegador e, depois de conferir, apaga a cópia local. */
async function migrateLocal(){
  try{
    const vs=localVersions();
    await doSave(false);
    const s=await dbh.doc('rh/estado').get();
    if(!s.exists||!parseState(s.data().json)) throw new Error('verificação');
    for(const v of vs){await dbh.doc('versoes/'+v.id).set({at:v.at,label:v.label,json:v.json});}
    try{localStorage.removeItem(LS_STATE);localStorage.removeItem(LS_VERS);}catch(e){}
    toast('Dados deste navegador enviados ao servidor.');
  }catch(e){toast('Não foi possível enviar os dados locais ao servidor. Eles continuam neste navegador.');}
}

/* ---------- versões (cópias de segurança) ---------- */
function localVersions(){try{return JSON.parse(localStorage.getItem(LS_VERS)||'[]');}catch(e){return [];}}
function putLocalVersions(a){try{localStorage.setItem(LS_VERS,JSON.stringify(a.slice(0,8)));}catch(e){}}
async function listVersions(){
  if(dbh){
    try{
      const q=await dbh.collection('versoes').orderBy('at','desc').limit(30).get();
      return q.docs.map(d=>{const x=d.data();return {id:d.id,at:x.at,label:x.label,json:x.json};});
    }catch(e){return [];}
  }
  return localVersions();
}
async function createVersion(label,silent){
  const rec={id:uid('v'),at:new Date().toISOString(),label:label||'Cópia manual',json:JSON.stringify(state)};
  if(dbh){
    await dbh.doc('versoes/'+rec.id).set({at:rec.at,label:rec.label,json:rec.json});
    const all=await listVersions();
    for(const v of all.slice(15)){try{await dbh.doc('versoes/'+v.id).delete();}catch(e){}}
  }else{
    putLocalVersions([rec].concat(localVersions()));
  }
  if(!silent) toast('Cópia de segurança criada.');
}
async function removeVersion(id){
  if(dbh){try{await dbh.doc('versoes/'+id).delete();}catch(e){}}
  else putLocalVersions(localVersions().filter(v=>v.id!==id));
}

/* ---------- avisos e janelas ---------- */
function toast(msg,snap){
  const t=$('#toast'); if(!t) return;
  undoSnap=snap||null;
  t.innerHTML=`<div class="toast-in"><span>${esc(msg)}</span>${snap?'<button class="btn sm" data-a="undo">Desfazer</button>':''}</div>`;
  t.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>{t.hidden=true;},9000);
}
/* Executa uma ação que apaga ou substitui dados, guardando uma cópia para "Desfazer". */
function destructive(msg,fn){
  const snap=JSON.stringify(state);
  fn(); changed(); toast(msg,snap);
}
function openModal(title,body,onSubmit,okLabel){
  const m=$('#modal');
  m.innerHTML=`<form class="modal" autocomplete="off"><h3>${esc(title)}</h3>${body}<div class="row" style="justify-content:flex-end"><button type="button" class="btn" data-a="modal-close">Cancelar</button><button type="submit" class="btn primary">${esc(okLabel||'Salvar')}</button></div></form>`;
  m.hidden=false;
  const f=$('form',m);
  f.addEventListener('submit',ev=>{ev.preventDefault();if(onSubmit(f)!==false) closeModal();});
  const first=$('input,textarea,select',f); if(first) first.focus();
}
function closeModal(){const m=$('#modal');m.hidden=true;m.innerHTML='';}
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&!$('#modal').hidden) closeModal();});
document.addEventListener('click',ev=>{
  if(ev.target.id==='modal'||ev.target.closest('[data-a="modal-close"]')) closeModal();
  const u=ev.target.closest('#toast [data-a="undo"]');
  if(u&&undoSnap){
    const d=parseState(undoSnap); if(!d) return;
    state=d; undoSnap=null; $('#toast').hidden=true; changed();
    if(typeof afterRestore==='function') afterRestore();
  }
});

function isDarkNow(){
  const m=/rgba?\((\d+),\s*(\d+),\s*(\d+)/.exec(getComputedStyle(document.body).backgroundColor);
  if(!m) return false;
  return (0.2126*m[1]+0.7152*m[2]+0.0722*m[3])/255<0.4;
}

   Exportações: arquivos, PDF (gerado aqui, sem bibliotecas), CSV, Excel, impressão
   ===================================================================== */
async function saveFile(name,data,mime){
  if(window.claude&&!window.__dl){toast('A exportação não está disponível nesta visualização.');return false;}
  if(window.__dl){
    try{await window.__dl.save({filename:name,data});return true;}
    catch(e){if(!e||e.code!=='declined') toast('Não foi possível salvar o arquivo.');return false;}
  }
  const blob=data instanceof Blob?data:new Blob([data],{type:mime||'application/octet-stream'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),4000);
  return true;
}

const HW=[278,278,355,556,556,889,667,191,333,333,389,584,278,333,278,278,556,556,556,556,556,556,556,556,556,556,278,278,584,584,584,556,1015,667,667,722,722,667,611,778,722,278,500,667,556,833,722,778,667,778,722,667,611,722,667,944,667,667,611,278,278,278,469,556,333,556,556,500,556,556,278,556,556,222,222,500,222,833,556,556,556,556,333,500,278,556,500,722,500,500,500,334,260,334,584];
const WIN={0x2026:0x85,0x2013:0x96,0x2014:0x97,0x2022:0x95,0x2018:0x91,0x2019:0x92,0x201C:0x93,0x201D:0x94,0x20AC:0x80,0x2192:0x2D,0x2190:0x2D,0x2191:0x5E,0x2193:0x76,0x2212:0x2D};
function tw(str,size,bold){
  let w=0;
  for(const ch of String(str)){
    let c=ch.codePointAt(0);
    if(c<32||c>126){const b=ch.normalize('NFD').codePointAt(0);c=(b>=32&&b<=126)?b:0;}
    w+=c?HW[c-32]:556;
  }
  return w*size/1000*(bold?1.06:1);
}
function wrapPdf(str,maxW,size,bold){
  const out=[];
  String(str==null?'':str).split(/\r?\n/).forEach(par=>{
    const words=par.split(/\s+/).filter(Boolean);
    if(!words.length){out.push('');return;}
    let cur='';
    words.forEach(w=>{
      while(tw(w,size,bold)>maxW&&w.length>1){
        let k=w.length-1; while(k>1&&tw(w.slice(0,k),size,bold)>maxW) k--;
        if(cur){out.push(cur);cur='';}
        out.push(w.slice(0,k)); w=w.slice(k);
      }
      const t=cur?cur+' '+w:w;
      if(!cur||tw(t,size,bold)<=maxW) cur=t; else {out.push(cur);cur=w;}
    });
    if(cur) out.push(cur);
  });
  return out.length?out:[''];
}
class PdfDoc{
  constructor(o){
    o=o||{};
    this.W=o.w||595; this.H=o.h||842; this.m=o.margin||48; this.footer=o.footer||'';
    this.pages=[]; this.images=[]; this.newPage();
  }
  newPage(w,h){
    const p={w:w||this.W,h:h||this.H,ops:[],imgs:[]};
    this.pages.push(p); this.cur=p; this.y=p.h-this.m; return p;
  }
  _enc(s){
    let o='';
    for(const ch of String(s)){
      let c=ch.codePointAt(0);
      if(WIN[c]!==undefined) c=WIN[c]; else if(c>255) c=63;
      o+=String.fromCharCode(c);
    }
    return o.replace(/[\\()]/g,'\\$&');
  }
  text(s,x,y,size,bold,gray){
    this.cur.ops.push(`BT /${bold?'F2':'F1'} ${size||10} Tf ${gray==null?0:gray} g ${x.toFixed(2)} ${y.toFixed(2)} Td (${this._enc(s)}) Tj ET`);
  }
  line(x1,y1,x2,y2,w,gray){
    this.cur.ops.push(`${gray==null?0.75:gray} G ${w||0.5} w ${x1.toFixed(2)} ${y1.toFixed(2)} m ${x2.toFixed(2)} ${y2.toFixed(2)} l S`);
  }
  fillRect(x,y,w,h,gray){
    this.cur.ops.push(`${gray} g ${x.toFixed(2)} ${y.toFixed(2)} ${w.toFixed(2)} ${h.toFixed(2)} re f`);
  }
  addImage(data,w,h){this.images.push({data,w,h});return this.images.length-1;}
  drawImage(i,x,y,w,h){
    if(this.cur.imgs.indexOf(i)<0) this.cur.imgs.push(i);
    this.cur.ops.push(`q ${w.toFixed(2)} 0 0 ${h.toFixed(2)} ${x.toFixed(2)} ${y.toFixed(2)} cm /Im${i} Do Q`);
  }
  ensure(h){if(this.y-h<this.m+10) this.newPage();}
  get width(){return this.cur.w-2*this.m;}
  h1(s){this.ensure(34);this.text(s,this.m,this.y-16,17,true,0.1);this.y-=30;}
  h2(s){this.ensure(30);this.y-=6;this.text(s,this.m,this.y-12,12.5,true,0.1);this.y-=22;}
  para(s,o){
    o=o||{}; const size=o.size||10.5,lh=size*1.38,ind=o.indent||0;
    wrapPdf(s,this.width-ind,size,false).forEach(l=>{this.ensure(lh);this.text(l,this.m+ind,this.y-size,size,false,o.gray);this.y-=lh;});
    this.y-=o.gap==null?4:o.gap;
  }
  bullet(s,o){
    o=o||{}; const size=10.5,lh=size*1.38,ind=14+(o.level||0)*14;
    const lines=wrapPdf(s,this.width-ind,size,false);
    lines.forEach((l,i)=>{this.ensure(lh);if(i===0) this.text(o.mark||'•',this.m+ind-11,this.y-size,size,false);this.text(l,this.m+ind,this.y-size,size,false);this.y-=lh;});
    this.y-=2;
  }
  gap(h){this.y-=h;}
  table(cols,rows,o){
    o=o||{}; const size=o.size||9,lh=size*1.3,pad=4,avail=this.width;
    const tot=cols.reduce((a,c)=>a+c.w,0); const xs=[];let acc=this.m;
    const ws=cols.map(c=>c.w/tot*avail); ws.forEach(w=>{xs.push(acc);acc+=w;});
    const head=()=>{
      this.ensure(lh+pad*2+4);
      this.fillRect(this.m,this.y-lh-pad*2,avail,lh+pad*2,0.9);
      cols.forEach((c,i)=>this.text(c.label,xs[i]+pad,this.y-pad-size,size,true,0.15));
      this.y-=lh+pad*2;
    };
    head();
    rows.forEach(r=>{
      const cells=r.map((v,i)=>wrapPdf(v,ws[i]-pad*2,size,false));
      const n=Math.max(1,...cells.map(c=>c.length)); const rh=n*lh+pad*2;
      if(this.y-rh<this.m+10){this.newPage();head();}
      cells.forEach((c,i)=>c.forEach((l,k)=>this.text(l,xs[i]+pad,this.y-pad-size-k*lh,size,false,0.1)));
      this.y-=rh; this.line(this.m,this.y,this.m+avail,this.y,0.5,0.8);
    });
    this.y-=8;
  }
  build(){
    const total=this.pages.length;
    this.pages.forEach((p,i)=>{
      this.cur=p;
      if(this.footer){this.text(this.footer,this.m,24,8,false,0.45);}
      const pg='Página '+(i+1)+' de '+total; this.text(pg,p.w-this.m-tw(pg,8,false),24,8,false,0.45);
    });
    const chunks=[];let off=0;const offs=[];
    const push=b=>{
      if(typeof b==='string'){const u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i)&255;b=u;}
      chunks.push(b);off+=b.length;
    };
    const nImg=this.images.length, firstPage=5+nImg, nObj=4+nImg+total*2;
    const begin=n=>{offs[n]=off;push(n+' 0 obj\n');}, end=()=>push('\nendobj\n');
    push('%PDF-1.4\n%\xE2\xE3\xCF\xD3\n');
    begin(1);push('<< /Type /Catalog /Pages 2 0 R >>');end();
    begin(2);push('<< /Type /Pages /Count '+total+' /Kids ['+this.pages.map((_,i)=>(firstPage+i*2)+' 0 R').join(' ')+'] >>');end();
    begin(3);push('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>');end();
    begin(4);push('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>');end();
    this.images.forEach((im,i)=>{
      begin(5+i);
      push('<< /Type /XObject /Subtype /Image /Width '+im.w+' /Height '+im.h+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+im.data.length+' >>\nstream\n');
      push(im.data);push('\nendstream');end();
    });
    this.pages.forEach((p,i)=>{
      const po=firstPage+i*2,co=po+1;
      const xo=p.imgs.map(k=>'/Im'+k+' '+(5+k)+' 0 R').join(' ');
      begin(po);
      push('<< /Type /Page /Parent 2 0 R /MediaBox [0 0 '+p.w+' '+p.h+'] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> /XObject << '+xo+' >> >> /Contents '+co+' 0 R >>');end();
      const content=p.ops.join('\n');
      begin(co);push('<< /Length '+content.length+' >>\nstream\n');push(content);push('\nendstream');end();
    });
    const xref=off;
    push('xref\n0 '+(nObj+1)+'\n0000000000 65535 f \n');
    for(let n=1;n<=nObj;n++) push(String(offs[n]).padStart(10,'0')+' 00000 n \n');
    push('trailer\n<< /Size '+(nObj+1)+' /Root 1 0 R >>\nstartxref\n'+xref+'\n%%EOF');
    const out=new Uint8Array(off);let p=0;chunks.forEach(c=>{out.set(c,p);p+=c.length;});
    return out;
  }
}
/* Escreve texto simples do manual (linhas com "# ", "- " e "1. ") no PDF. */
function pdfRichText(pdf,text){
  String(text||'').split(/\r?\n/).forEach(line=>{
    if(!line.trim()){pdf.gap(5);return;}
    let m;
    if((m=/^#\s+(.*)/.exec(line))) {pdf.gap(4);pdf.ensure(24);pdf.text(m[1],pdf.m,pdf.y-11,11,true,0.15);pdf.y-=20;}
    else if((m=/^(\s*)[-*]\s+(.*)/.exec(line))) pdf.bullet(m[2],{level:Math.floor(m[1].length/2)});
    else if((m=/^(\d+)\.\s+(.*)/.exec(line))) pdf.bullet(m[2],{mark:m[1]+'.'});
    else pdf.para(line);
  });
}

function svgToCanvas(svgStr,w,h,scale){
  return new Promise((res,rej)=>{
    const max=8000; scale=Math.min(scale,max/w,max/h);
    const img=new Image();
    img.onload=()=>{
      const c=document.createElement('canvas'); c.width=Math.max(1,Math.round(w*scale)); c.height=Math.max(1,Math.round(h*scale));
      const ctx=c.getContext('2d'); ctx.fillStyle='#ffffff'; ctx.fillRect(0,0,c.width,c.height);
      ctx.drawImage(img,0,0,c.width,c.height); res(c);
    };
    img.onerror=()=>rej(new Error('img'));
    img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svgStr);
  });
}
function canvasBytes(canvas,type,q){
  return new Promise((res,rej)=>canvas.toBlob(b=>{

/* =====================================================================
   Textos do manual gerados a partir dos dados do sistema
   ===================================================================== */
function orgDisp(n,units){
  const u=n.unitId&&units.find(x=>x.id===n.unitId);
  if(u) return {t:u.nome,desc:u.desc,hue:u.hue,icone:u.icone||n.icone||'file'};
  return {t:n.t,desc:n.desc,hue:n.hue,icone:n.icone||'building'};
}
function stepsOrdered(flow){
  const byId=new Map(flow.nodes.map(n=>[n.id,n]));
  const seen=new Set(),order=[];
  const starts=flow.nodes.filter(n=>n.tipo==='ini').map(n=>n.id).concat(flow.nodes.filter(n=>!flow.edges.some(e=>e.to===n.id)).map(n=>n.id));
  const q=[...new Set(starts)];
  while(q.length){
    const id=q.shift();
    if(seen.has(id)||!byId.has(id)) continue;
    seen.add(id); order.push(byId.get(id));
    flow.edges.filter(e=>e.from===id).forEach(e=>q.push(e.to));
  }
  flow.nodes.forEach(n=>{if(!seen.has(n.id)) order.push(n);});
  return order;
}
function genFlow(st,flow){
  const L=[];
  if(flow.desc) L.push(flow.desc,'');
  const ord=stepsOrdered(flow); const idx=new Map(ord.map((n,i)=>[n.id,i+1]));
  const byId=new Map(flow.nodes.map(n=>[n.id,n]));
  ord.forEach((n,i)=>{
    const u=st.units.find(x=>x.id===n.unit);
    const parts=[];
    if(u) parts.push('unidade: '+u.nome);
    if(n.resp) parts.push('responsável: '+n.resp);
    if(n.prazo) parts.push('prazo: '+n.prazo);
    if(n.docs) parts.push('documentos: '+oneLine(n.docs));
    if(n.status) parts.push('status: '+n.status);
    L.push((i+1)+'. '+oneLine(n.t)+(n.tipo==='dec'?' (decisão)':'')+(parts.length?' — '+parts.join('; '):''));
    const outs=flow.edges.filter(e=>e.from===n.id&&idx.has(e.to));
    if(n.tipo==='dec'||outs.length>1) outs.forEach(e=>L.push('  - '+(e.l||'Segue')+': etapa '+idx.get(e.to)+' ('+oneLine(byId.get(e.to).t)+')'));
    if(n.obs) L.push('  - Observações: '+oneLine(n.obs));
  });
  return L.join('\n');
}
function genOrg(st){
  const nodes=st.org.nodes,edges=st.org.edges,L=[];
  const roots=nodes.filter(n=>!edges.some(e=>e.to===n.id));
  const seen=new Set();
  const walk=(n,d)=>{
    if(seen.has(n.id)) return; seen.add(n.id);
    const x=orgDisp(n,st.units);
    L.push('  '.repeat(d)+'- '+oneLine(x.t)+(n.tipo==='nucleo'?' (divisão interna de trabalho)':'')+(x.desc?' — '+oneLine(x.desc):''));
    edges.filter(e=>e.from===n.id).forEach(e=>{const c=nodes.find(k=>k.id===e.to);if(c) walk(c,d+1);});
  };
  roots.forEach(r=>walk(r,0));
  return 'Estrutura do Departamento de Recursos Humanos, da autoridade superior às unidades subordinadas:\n\n'+L.join('\n')+'\n\nOs núcleos operacionais são divisões internas de trabalho e não criam cargos automaticamente.';
}
function genUnit(st,u){
  const L=[];
  if(u.desc) L.push(u.desc,'');
  if(u.obs) L.push(u.obs,'');
  L.push('# Competências');
  if(!u.comp.length) L.push('(nenhuma competência cadastrada)');
  u.comp.forEach(c=>L.push('- '+c));
  const fl=st.flows.filter(f=>f.page===u.page&&u.page);
  if(fl.length){L.push('','# Fluxogramas relacionados');fl.forEach(f=>L.push('- '+f.nome));}
  return L.join('\n');
}
function genComp(st){
  const L=[];
  st.units.filter(u=>!u.externa).forEach(u=>{
    L.push('# '+u.nome);
    if(u.divisao) L.push('(Divisão interna de trabalho, sem criação automática de novos cargos.)');
    if(!u.comp.length) L.push('(nenhuma competência cadastrada)');
    u.comp.forEach(c=>L.push('- '+c));
    L.push('');
  });
  return L.join('\n').trim();
}
function genMatriz(st){
  return st.matriz.map(m=>'- '+m.ativ+' — responsável principal: '+(m.resp||'—')+'; supervisão: '+(m.sup||'—')+(m.obs?'; observações: '+m.obs:'')).join('\n');
}
function genFluxos(st){
  return st.flows.map(f=>'- '+f.nome+' ('+PAGES_FLOW[f.page]+', '+f.nodes.length+' elementos)'+(f.desc?': '+f.desc:'')).join('\n');
}
function genKpis(st){
  return st.kpis.map(k=>'- '+k.nome+' — meta: '+(k.meta==null||k.meta===''?'não definida':k.meta+(k.tipo==='pct'?'%':''))+' ('+(k.dir==='maior'?'quanto maior, melhor':'quanto menor, melhor')+')').join('\n');
}
function genFerias(st){
  const L=[genFlow(st,st.flows.find(f=>f.id==='fl-ferias')||{desc:'',nodes:[],edges:[]}),'','# Parâmetros de férias (definir conforme a legislação municipal)'];
  if(!st.params.length) L.push('(nenhum parâmetro cadastrado)');
  st.params.forEach(p=>L.push('- '+p.nome+': '+(oneLine(p.valor)||'a definir')+(p.obs?' ('+oneLine(p.obs)+')':'')));
  return L.join('\n');
}
function genAuto(st,auto){
  if(auto==='org') return genOrg(st);
  if(auto==='comp') return genComp(st);
  if(auto==='matriz') return genMatriz(st);
  if(auto==='fluxos') return genFluxos(st);
  if(auto==='kpis') return genKpis(st);
  if(auto==='ferias') return genFerias(st);
  if(auto.indexOf('flow:')===0){
    const f=st.flows.find(x=>x.id===auto.slice(5));
    return f?genFlow(st,f):'(fluxograma não encontrado)';
  }
  if(auto.indexOf('unit:')===0){
    const u=st.units.find(x=>x.id===auto.slice(5));
    return u?genUnit(st,u):'(unidade não encontrada)';
  }
  return '';
}
function defaultManual(st){
  const defs=[
    ['Organização do RH','org'],
    ['Competências das unidades','comp'],
    ['Procedimentos de nomeação e exoneração','flow:fl-nomeacao'],
    ['Procedimentos de folha de pagamento','flow:fl-folha'],
    ['Procedimentos de férias e licenças','ferias'],
    ['Controle de frequência','unit:u-freq'],
    ['Gestão documental','unit:u-arq'],
    ['Desenvolvimento e capacitação','unit:u-desenv'],
    ['Matriz de responsabilidades','matriz'],
    ['Fluxogramas','fluxos'],
    ['Indicadores','kpis']
  ];
  return defs.map((d,i)=>({id:'mc'+(i+1),titulo:d[0],auto:d[1],texto:genAuto(st,d[1])}));
}

/* ---------- medidas e layout automático ---------- */
function wrapLines(text,maxChars){
  const out=[];
  String(text==null?'':text).split(/\r?\n/).forEach(par=>{
    const words=par.split(/\s+/).filter(Boolean);
    if(!words.length){out.push('');return;}
    let cur='';
    words.forEach(w=>{
      while(w.length>maxChars){ if(cur){out.push(cur);cur='';} out.push(w.slice(0,maxChars-1)+'-'); w=w.slice(maxChars-1); }
      if(!cur) cur=w; else if((cur+' '+w).length<=maxChars) cur+=' '+w; else {out.push(cur);cur=w;}
    });
    if(cur) out.push(cur);
  });
  return out.length?out:[''];
}
function nodeSize(n,kind,units){
  if(kind==='org'){
    const d=orgDisp(n,units);
    const tl=wrapLines(d.t||'',21), dl=wrapLines(d.desc||'',30);
    const dlc=dl.slice(0,3); if(dl.length>3) dlc[2]=dlc[2].slice(0,27)+'…';
    const tag=n.tipo==='nucleo'?1:0;
    return {w:250,h:Math.max(74,18+tl.length*18+(d.desc?dlc.length*15+6:0)+(tag?20:0)+12),tl,dl:d.desc?dlc:[],tag};
  }
  const t=n.tipo, w=t==='dec'?250:220;
  const chars=t==='dec'?19:t==='unid'?26:27;
  const lines=wrapLines(n.t,chars);
  let h;
  if(t==='ini'||t==='fim') h=Math.max(46,22+lines.length*17);
  else if(t==='dec') h=Math.max(100,52+lines.length*18);
  else if(t==='doc') h=Math.max(70,38+lines.length*17);
  else h=Math.max(62,28+lines.length*17);
  return {w,h,lines};
}
function autoLayout(doc,kind,units){
  const nodes=doc.nodes; if(!nodes.length) return;

    const s=snapDoc();
    if(s===E.hist.stack[E.hist.i]){updHist();return;}
    E.hist.stack.splice(E.hist.i+1); E.hist.stack.push(s);
    if(E.hist.stack.length>80) E.hist.stack.shift();
    E.hist.i=E.hist.stack.length-1; updHist();
  }
  let ct=0;
  const commitSoon=()=>{clearTimeout(ct);ct=setTimeout(commit,600);};
  function updHist(){
    const u=$('[data-a="undo"]',bar),r=$('[data-a="redo"]',bar);
    if(u) u.disabled=E.hist.i<=0; if(r) r.disabled=E.hist.i>=E.hist.stack.length-1;
  }
  function restore(i){
    clearTimeout(ct);
    const s=JSON.parse(E.hist.stack[i]);
    E.doc.nodes=s.nodes; E.doc.edges=s.edges; E.hist.i=i;
    if(E.sel&&E.sel.k==='n'&&!node(E.sel.id)) E.sel=null;
    if(E.sel&&E.sel.k==='e'&&!E.doc.edges.some(e=>e.id===E.sel.id)) E.sel=null;
    scene(); renderPanel(); renderTable(); updHist(); cfg.onChange();
  }
  const touch=()=>{cfg.onChange();};

  /* --- seleção --- */
  function select(k,id){
    E.sel=k?{k,id}:null;
    scene(); renderPanel(); markTable();
  }

  /* --- operações no diagrama --- */
  function defaultLabel(src){
    if(kind!=='flow'||src.tipo!=='dec') return '';
    const n=E.doc.edges.filter(e=>e.from===src.id).length;
    return n===0?'Sim':n===1?'Não':'';
  }
  function isDesc(a,b){ // b é descendente de a?
    const seen=new Set(),st=[a];
    while(st.length){const x=st.pop();if(x===b) return true;if(seen.has(x)) continue;seen.add(x);E.doc.edges.forEach(e=>{if(e.from===x) st.push(e.to);});}
    return false;
  }
  function connect(from,to,label){
    if(from===to) return false;
    if(E.doc.edges.some(e=>e.from===from&&e.to===to)){toast('Esses elementos já estão conectados.');return false;}
    if(kind==='org'){
      if(isDesc(to,from)){toast('Essa conexão criaria um ciclo na hierarquia.');return false;}
      E.doc.edges=E.doc.edges.filter(e=>e.to!==to);
    }
    const src=node(from);
    E.doc.edges.push({id:uid('e'),from,to,l:label!=null?label:defaultLabel(src)});
    return true;
  }
  const freeSpot=(n,sz)=>{
    let guard=0;
    while(guard++<40&&E.doc.nodes.some(o=>{if(o===n) return false;const s=sizeOf(o);return n.x<(o.x||0)+s.w+20&&n.x+sz.w+20>(o.x||0)&&n.y<(o.y||0)+s.h+20&&n.y+sz.h+20>(o.y||0);})) n.x+=60;
  };
  function addNode(tipo){
    const sel=E.sel&&E.sel.k==='n'?node(E.sel.id):null;
    let n;
    if(kind==='flow'){
      const names={ini:'INÍCIO',fim:'ENCERRAMENTO',proc:'Nova etapa',dec:'Nova decisão?',doc:'Documento',unid:'Unidade administrativa',aprov:'Aprovação',arq:'Arquivamento'};
      n=nd(uid('n'),tipo,names[tipo]||'Novo elemento','');
    }else{
      if(tipo==='orgao') n={id:uid('o'),tipo:'orgao',t:'Novo órgão',desc:'',unitId:'',hue:212,icone:'building',obs:'',x:0,y:0};
      else{
        const u={id:uid('u-'),nome:tipo==='nucleo'?'Nova divisão interna':'Nova unidade',sigla:'',icone:tipo==='nucleo'?'calendar':'users',hue:HUES[state.units.length%HUES.length],page:'',externa:false,divisao:tipo==='nucleo',desc:'',obs:tipo==='nucleo'?'Divisão interna de trabalho, sem criação automática de novos cargos.':'',comp:[]};
        state.units.push(u);
        n={id:uid('o'),tipo,t:'',desc:'',unitId:u.id,hue:null,icone:'',obs:'',x:0,y:0};
      }
    }
    const sz=sizeOf(n);
    if(sel&&!(kind==='flow'&&sel.tipo==='fim')){
      const ss=sizeOf(sel); n.x=snap((sel.x||0)+(ss.w-sz.w)/2); n.y=snap((sel.y||0)+ss.h+70);
    }else{
      const W=svg.clientWidth||800,H=svg.clientHeight||500;
      n.x=snap((W/2-E.view.x)/E.view.k-sz.w/2); n.y=snap((H/2-E.view.y)/E.view.k-sz.h/2);
    }
    freeSpot(n,sz);
    E.doc.nodes.push(n);
    if(sel&&!(kind==='flow'&&sel.tipo==='fim')) connect(sel.id,n.id);
    commit(); touch(); select('n',n.id); renderTable();
    const f=$('[data-f="t"]',panel); if(f){f.focus();f.select();}
  }
  function delSel(){
    if(!E.sel) return;
    if(E.sel.k==='n'){
      const id=E.sel.id;
      E.doc.nodes=E.doc.nodes.filter(n=>n.id!==id);
      E.doc.edges=E.doc.edges.filter(e=>e.from!==id&&e.to!==id);
      toast(kind==='org'?'Elemento removido do organograma. A unidade continua cadastrada em Competências. Use Desfazer (Ctrl+Z) para recuperar.':'Elemento excluído. Use Desfazer (Ctrl+Z) para recuperar.');
    }else{
      const id=E.sel.id; E.doc.edges=E.doc.edges.filter(e=>e.id!==id);
    }
    E.sel=null; commit(); touch(); scene(); renderPanel(); renderTable();
  }
  function relayout(){
    autoLayout(E.doc,kind,units()); commit(); touch(); fit(); scene();
  }

  /* --- ponteiro --- */
  function hitNode(p){
    for(let i=E.doc.nodes.length-1;i>=0;i--){const n=E.doc.nodes[i],s=sizeOf(n);if(p.x>=n.x&&p.x<=n.x+s.w&&p.y>=n.y&&p.y<=n.y+s.h) return n;}
    return null;
  }
  /* zoom e deslocamento com dois dedos */
  const ptrs=new Map();let pinch=null;
  const rel=()=>{const r=svg.getBoundingClientRect(),[a,b]=[...ptrs.values()];return {x:(a[0]+b[0])/2-r.left,y:(a[1]+b[1])/2-r.top,d:Math.hypot(a[0]-b[0],a[1]-b[1])||1};};
  function startPinch(){
    const d=E.drag; E.drag=null;
    if(d&&d.type==='move'&&d.moved){commit();touch();renderTable();}
    const m=rel(); pinch={x:m.x,y:m.y,d:m.d,vx:E.view.x,vy:E.view.y,k:E.view.k};
  }
  function movePinch(){
    const m=rel(),k=Math.max(0.15,Math.min(2.5,pinch.k*m.d/pinch.d)),r=k/pinch.k;
    E.view.k=k;E.view.x=m.x-(pinch.x-pinch.vx)*r;E.view.y=m.y-(pinch.y-pinch.vy)*r;E.touched=true;applyView();
  }
  svg.addEventListener('pointerdown',ev=>{
    if(ev.pointerType==='mouse'&&ev.button!==0) return;
    if(ev.pointerType==='touch'){
      ptrs.set(ev.pointerId,[ev.clientX,ev.clientY]);
      if(ptrs.size===2){startPinch();return;}
      if(ptrs.size>2) return;
    }
    activeEd=E; const w=toWorld(ev);
    const hd=ev.target.closest('[data-handle]');
    if(hd){E.drag={type:'connect',from:hd.dataset.handle,pos:w};svg.setPointerCapture(ev.pointerId);return;}
    const nn=ev.target.closest('[data-node]');
    if(nn){
      const n=node(nn.dataset.node); if(!n) return;
      if(!(E.sel&&E.sel.k==='n'&&E.sel.id===n.id)) select('n',n.id);
      E.drag={type:'move',id:n.id,dx:w.x-n.x,dy:w.y-n.y,moved:false,sx:ev.clientX,sy:ev.clientY};
      svg.setPointerCapture(ev.pointerId); return;
    }
    const eg=ev.target.closest('[data-edge]');
    if(eg){select('e',eg.dataset.edge);return;}
    if(E.sel) select(null);
    E.drag={type:'pan',sx:ev.clientX,sy:ev.clientY,vx:E.view.x,vy:E.view.y};
    svg.setPointerCapture(ev.pointerId);
  });
  svg.addEventListener('pointermove',ev=>{
    if(ptrs.has(ev.pointerId)){ptrs.set(ev.pointerId,[ev.clientX,ev.clientY]);if(pinch){movePinch();return;}}
    const d=E.drag; if(!d) return;
    if(d.type==='pan'){E.view.x=d.vx+ev.clientX-d.sx;E.view.y=d.vy+ev.clientY-d.sy;E.touched=true;applyView();}
    else if(d.type==='move'){
      if(!d.moved&&Math.hypot(ev.clientX-d.sx,ev.clientY-d.sy)<4) return;
      d.moved=true; const w=toWorld(ev),n=node(d.id); if(!n) return;
      n.x=snap(w.x-d.dx); n.y=snap(w.y-d.dy); sched();
    }else if(d.type==='connect'){d.pos=toWorld(ev);sched();}
  });
  const endDrag=ev=>{
    ptrs.delete(ev.pointerId);
    if(pinch){if(ptrs.size<2) pinch=null;E.drag=null;return;}
    const d=E.drag; if(!d) return; E.drag=null;
    try{svg.releasePointerCapture(ev.pointerId);}catch(e){}
    if(d.type==='move'&&d.moved){commit();touch();renderTable();}
    else if(d.type==='connect'){
      const t=hitNode(d.pos);
      if(t&&t.id!==d.from&&connect(d.from,t.id)){commit();touch();renderPanel();renderTable();}
      scene();
    }
  };
  svg.addEventListener('pointerup',endDrag);
  svg.addEventListener('pointercancel',endDrag);
  svg.addEventListener('wheel',ev=>{
    if(!(ev.ctrlKey||ev.metaKey)) return;
    ev.preventDefault();
    const r=svg.getBoundingClientRect();
    zoomAt(ev.clientX-r.left,ev.clientY-r.top,ev.deltaY<0?1.12:1/1.12);
  },{passive:false});
  svg.addEventListener('dblclick',ev=>{
    const nn=ev.target.closest('[data-node]'); if(!nn) return;
    const f=$('[data-f="t"]',panel); if(f){f.focus();f.select();}
  });

  /* --- painel de propriedades --- */
  const optNodes=(sel,except)=>E.doc.nodes.filter(n=>n.id!==except).map(n=>`<option value="${esc(n.id)}"${n.id===sel?' selected':''}>${esc(nodeName(n).slice(0,60))}</option>`).join('');
  const unitOpts=sel=>'<option value="">— nenhuma —</option>'+units().filter(u=>true).map(u=>`<option value="${esc(u.id)}"${u.id===sel?' selected':''}>${esc(u.nome||'(sem nome)')}</option>`).join('');
  const swatches=(cur,withAuto)=>`<div class="swatches">${withAuto?`<button class="sw auto" data-a="hue" data-h="" aria-pressed="${cur==null}" aria-label="Cor automática" title="Automática"></button>`:''}${HUES.map(h=>`<button class="sw" style="--h:${h}" data-a="hue" data-h="${h}" aria-pressed="${cur===h}" aria-label="Cor ${h}"></button>`).join('')}</div>`;
  function getField(n,f){
    if(kind==='org'){
      const d=orgDisp(n,units());
      if(f==='t') return d.t; if(f==='desc') return d.desc; if(f==='icone') return d.icone; if(f==='obs') return n.obs||''; if(f==='tipo') return n.tipo; if(f==='unitId') return n.unitId||'';
    }
    return n[f]==null?'':n[f];
  }
  function panelNodeFlow(n){
    const outs=E.doc.edges.filter(e=>e.from===n.id);
    const rows=outs.map(e=>`<div class="edge-row" data-eid="${esc(e.id)}"><select data-f="eto" aria-label="Segue para"><option value="">Escolha…</option>${optNodes(e.to,n.id)}</select><input data-f="el" placeholder="Rótulo (ex.: Sim)" aria-label="Rótulo da saída" value="${esc(e.l)}"><button class="ibtn danger" data-a="edge-del" aria-label="Remover saída">${icon('x',14)}</button></div>`).join('');
    const hasSim=outs.some(e=>/^sim/i.test(e.l)),hasNao=outs.some(e=>/^n[ãa]o/i.test(e.l));
    return `<h3>Elemento</h3>
      <label class="fld"><span>Tipo</span><select data-f="tipo">${Object.keys(TIPOS_FLUXO).map(k=>`<option value="${k}"${k===n.tipo?' selected':''}>${esc(TIPOS_FLUXO[k])}</option>`).join('')}</select></label>
      <label class="fld"><span>Título</span><textarea rows="2" data-f="t">${esc(n.t)}</textarea></label>
      <label class="fld"><span>Descrição</span><textarea rows="2" data-f="desc">${esc(n.desc)}</textarea></label>
      <div class="r2"><label class="fld"><span>Unidade</span><select data-f="unit">${unitOpts(n.unit)}</select></label>
      <label class="fld"><span>Responsável pela etapa</span><input data-f="resp" value="${esc(n.resp)}" placeholder="Cargo ou função"></label></div>
      <div class="r2"><label class="fld"><span>Prazo</span><input data-f="prazo" value="${esc(n.prazo)}" placeholder="A definir"></label>
      <label class="fld"><span>Status</span><select data-f="status">${STATUS.map(s=>`<option value="${esc(s)}"${s===n.status?' selected':''}>${esc(s||'— não definido —')}</option>`).join('')}</select></label></div>
      <label class="fld"><span>Documentos necessários</span><textarea rows="2" data-f="docs">${esc(n.docs)}</textarea></label>
      <label class="fld"><span>Observações</span><textarea rows="2" data-f="obs">${esc(n.obs)}</textarea></label>
      <div class="fld"><span>Cor</span>${swatches(n.hue==null?null:n.hue,true)}</div>
      <div class="fld"><span>Saídas (para onde o fluxo segue)</span><div class="list">${rows||'<p class="hint">Nenhuma saída. Arraste a seta do elemento até outro ou use os botões abaixo.</p>'}</div>
        <div class="row" style="margin-top:6px"><button class="btn sm" data-a="edge-add" data-l="">+ Saída</button>${n.tipo==='dec'?`<button class="btn sm" data-a="edge-add" data-l="Sim"${hasSim?' disabled':''}>+ SIM</button><button class="btn sm" data-a="edge-add" data-l="Não"${hasNao?' disabled':''}>+ NÃO</button>`:''}</div></div>
      <details><summary class="hint" style="cursor:pointer">Ramificações em paralelo</summary>
        <p class="hint" style="margin:6px 0">Cria uma etapa por linha, saindo deste elemento e seguindo para o mesmo destino. Reorganiza o diagrama.</p>
        <textarea rows="5" data-f="branches">${esc(E.branchText)}</textarea><button class="btn sm" data-a="branch" style="margin-top:6px">Criar ramificações</button></details>
      <div class="row"><button class="btn sm" data-a="dup">Duplicar</button><button class="btn sm danger" data-a="del">Excluir elemento</button></div>`;
  }
  function panelNodeOrg(n){
    const d=orgDisp(n,units());
    const parent=E.doc.edges.find(e=>e.to===n.id);
    return `<h3>Unidade no organograma</h3>
      <label class="fld"><span>Tipo</span><select data-f="tipo">${Object.keys(TIPOS_ORG).map(k=>`<option value="${k}"${k===n.tipo?' selected':''}>${esc(TIPOS_ORG[k])}</option>`).join('')}</select></label>
      <label class="fld"><span>Nome</span><textarea rows="2" data-f="t">${esc(d.t)}</textarea></label>
      <label class="fld"><span>Descrição</span><textarea rows="3" data-f="desc">${esc(d.desc)}</textarea></label>
      <label class="fld"><span>Cadastro de competências vinculado</span><select data-f="unitId">${unitOpts(n.unitId)}</select></label>
      <label class="fld"><span>Subordinada a</span><select data-f="parent"><option value="">— nenhuma (topo) —</option>${optNodes(parent?parent.from:'',n.id)}</select></label>
      <label class="fld"><span>Ícone</span><select data-f="icone">${Object.keys(UNIT_ICONS).map(k=>`<option value="${k}"${k===d.icone?' selected':''}>${esc(UNIT_ICONS[k])}</option>`).join('')}</select></label>
      <div class="fld"><span>Cor</span>${swatches(d.hue,false)}</div>
      <label class="fld"><span>Observações</span><textarea rows="3" data-f="obs">${esc(n.obs||'')}</textarea></label>
      ${n.tipo==='nucleo'?'<p class="hint">Divisão interna de trabalho: não cria cargos automaticamente.</p>':''}
      <div class="row"><button class="btn sm" data-a="child">+ Subordinada</button><button class="btn sm" data-a="dup">Duplicar</button><button class="btn sm danger" data-a="del">Remover do organograma</button></div>`;
  }
  function panelEdge(e){
    const a=node(e.from),b=node(e.to);

      <p class="hint">${esc(a?nodeName(a):'?')} → ${esc(b?nodeName(b):'?')}</p>
      ${kind==='flow'?`<label class="fld"><span>Rótulo</span><input data-f="elabel" value="${esc(e.l)}" placeholder="Ex.: Sim, Não"></label>
      <div class="row"><button class="btn sm" data-a="elabel-set" data-l="Sim">SIM</button><button class="btn sm" data-a="elabel-set" data-l="Não">NÃO</button><button class="btn sm" data-a="elabel-set" data-l="">Sem rótulo</button></div>`:''}
      <label class="fld"><span>Origem</span><select data-f="efrom">${optNodes(e.from,'')}</select></label>
      <label class="fld"><span>Destino</span><select data-f="eto2">${optNodes(e.to,'')}</select></label>
      <div class="row"><button class="btn sm" data-a="erev">Inverter direção</button><button class="btn sm danger" data-a="del">${kind==='org'?'Desconectar':'Excluir conexão'}</button></div>`;
  }
  function renderPanel(){
    renderPanelBody();

  }
  function renderPanelBody(){

    if(s&&s.k==='e'){const e=E.doc.edges.find(x=>x.id===s.id);if(e){panel.innerHTML=panelEdge(e);return;}}
    panel.innerHTML=`<h3>${kind==='org'?'Organograma':'Fluxograma'}</h3>
      <p class="hint">${kind==='org'?'Clique numa unidade para editar nome, descrição, cor, observações e hierarquia.':'Clique num elemento do diagrama para editar texto, unidade, responsável, prazo, documentos, status e saídas.'}</p>
      <ul class="hint" style="margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px">
        <li>Arraste um elemento para mover.</li>
        <li>Com um elemento selecionado, use a seta azul para ligar a outro.</li>
        <li>${kind==='org'?'Um botão "Adicionar" cria a unidade já subordinada à selecionada.':'Um botão "Adicionar" cria o elemento já ligado ao selecionado.'}</li>
        <li>Delete exclui; Ctrl+Z desfaz; Ctrl+Y refaz.</li>
      </ul>`;
  }

  /* --- tabela de etapas (fluxos) --- */
  function renderTable(){
    if(kind!=='flow') return;
    const rows=E.doc.nodes.map((n,i)=>`<tr data-nid="${esc(n.id)}"${E.sel&&E.sel.k==='n'&&E.sel.id===n.id?' class="selrow"':''}>
      <td class="num">${i+1}</td>
      <td style="min-width:200px"><input data-f="t" data-nid="${esc(n.id)}" value="${esc(oneLine(n.t))}" aria-label="Título"></td>
      <td><select data-f="tipo" data-nid="${esc(n.id)}" aria-label="Tipo">${Object.keys(TIPOS_FLUXO).map(k=>`<option value="${k}"${k===n.tipo?' selected':''}>${esc(TIPOS_FLUXO[k])}</option>`).join('')}</select></td>
      <td style="min-width:170px"><select data-f="unit" data-nid="${esc(n.id)}" aria-label="Unidade">${unitOpts(n.unit)}</select></td>
      <td><input data-f="resp" data-nid="${esc(n.id)}" value="${esc(n.resp)}" aria-label="Responsável"></td>

    tableEl.innerHTML=`<div class="ch"><h2>Etapas do fluxo</h2><span class="hint">Edite responsável, prazo, unidade e status diretamente aqui. Clique na linha para selecionar no diagrama.</span></div>

  }
  function markTable(){
    if(kind!=='flow') return;
    $$('tr[data-nid]',tableEl).forEach(r=>r.classList.toggle('selrow',!!(E.sel&&E.sel.k==='n'&&E.sel.id===r.dataset.nid)));
  }

  /* --- alterar campos --- */
  function setField(n,f,v,src){
    if(kind==='org'){
      const u=n.unitId&&units().find(x=>x.id===n.unitId);
      if(f==='t'){if(u) u.nome=v; else n.t=v;}
      else if(f==='desc'){if(u) u.desc=v; else n.desc=v;}
      else if(f==='icone'){if(u) u.icone=v; else n.icone=v;}
      else if(f==='obs') n.obs=v;
      else if(f==='tipo'){n.tipo=v;if(u) u.divisao=(v==='nucleo');}
      else if(f==='unitId'){
        if(!v&&u){n.t=u.nome;n.desc=u.desc;n.hue=u.hue;n.icone=u.icone;}
        n.unitId=v;
      }
    }else n[f]=v;
    scene();
    if(f==='tipo'||f==='unit'||f==='unitId'||f==='unit'){renderPanel();renderTable();}
    else{
      if(src!=='panel'&&E.sel&&E.sel.id===n.id){$$('[data-f]',panel).forEach(el=>{if(el!==document.activeElement&&el.dataset.f===f&&el.tagName!=='SELECT') el.value=getField(n,f);});}
      if(src!=='table'&&kind==='flow'){const inp=$(`input[data-nid="${n.id}"][data-f="${f}"]`,tableEl);if(inp&&inp!==document.activeElement) inp.value=f==='t'?oneLine(n[f]):n[f];}
    }
    commitSoon(); touch();
  }
  function setParent(n,pid){
    if(pid){
      if(isDesc(n.id,pid)){toast('Essa mudança criaria um ciclo na hierarquia.');renderPanel();return;}
    }
    E.doc.edges=E.doc.edges.filter(e=>e.to!==n.id);
    if(pid) E.doc.edges.push({id:uid('e'),from:pid,to:n.id,l:''});
    commit(); touch(); scene();
  }
  function branch(n){
    const names=E.branchText.split(/\r?\n/).map(oneLine).filter(Boolean);
    if(!names.length){toast('Informe pelo menos um nome por linha.');return;}
    const outs=E.doc.edges.filter(e=>e.from===n.id);
    E.doc.edges=E.doc.edges.filter(e=>e.from!==n.id);
    names.forEach(nm=>{
      const b=nd(uid('n'),'proc',nm,n.unit||'');
      E.doc.nodes.push(b);
      E.doc.edges.push({id:uid('e'),from:n.id,to:b.id,l:''});
      outs.forEach(o=>E.doc.edges.push({id:uid('e'),from:b.id,to:o.to,l:''}));
    });
    autoLayout(E.doc,kind,units()); commit(); touch(); fit(); scene(); renderPanel(); renderTable();
    toast(names.length+' ramificações criadas. Use Desfazer (Ctrl+Z) para voltar.');
  }

  /* --- eventos do painel, tabela e barra --- */
  host.addEventListener('pointerdown',()=>{activeEd=E;},true);
  host.addEventListener('click',ev=>{
    const row=ev.target.closest('tr[data-nid]');
    if(row&&!ev.target.closest('input,select,button')){select('n',row.dataset.nid);return;}
    if(row&&ev.target.closest('input,select')&&!(E.sel&&E.sel.id===row.dataset.nid)){select('n',row.dataset.nid);}
    const b=ev.target.closest('[data-a]'); if(!b||!host.contains(b)) return;
    const a=b.dataset.a,n=E.sel&&E.sel.k==='n'?node(E.sel.id):null;
    switch(a){
      case 'add': addNode(b.dataset.t); break;
      case 'undo': if(E.hist.i>0) restore(E.hist.i-1); break;
      case 'redo': if(E.hist.i<E.hist.stack.length-1) restore(E.hist.i+1); break;
      case 'layout': relayout(); break;
      case 'zin': zoomAt((svg.clientWidth||800)/2,(svg.clientHeight||500)/2,1.2); break;
      case 'zout': zoomAt((svg.clientWidth||800)/2,(svg.clientHeight||500)/2,1/1.2); break;
      case 'fit': E.touched=false; fit(); break;
      case 'png': case 'svg': case 'pdf': doExport(a); break;
      case 'print': doPrint(); break;
      case 'deselect': select(null); break;
      case 'del': delSel(); break;
      case 'dup': if(n){
          const c=clone(n); c.id=uid(kind==='org'?'o':'n'); c.x=(n.x||0)+30; c.y=(n.y||0)+30;
          if(kind==='org'){const d=orgDisp(n,units());c.unitId='';c.t=d.t+' (cópia)';c.desc=d.desc;c.hue=d.hue;c.icone=d.icone;}
          E.doc.nodes.push(c); commit(); touch(); select('n',c.id); renderTable();
        } break;
      case 'child': if(n){
          const u={id:uid('u-'),nome:'Nova unidade',sigla:'',icone:'users',hue:HUES[state.units.length%HUES.length],page:'',externa:false,divisao:false,desc:'',obs:'',comp:[]};
          state.units.push(u);
          const c={id:uid('o'),tipo:'unidade',t:'',desc:'',unitId:u.id,hue:null,icone:'',obs:'',x:0,y:0};
          const sz=sizeOf(c),ss=sizeOf(n); c.x=snap((n.x||0)+(ss.w-sz.w)/2); c.y=snap((n.y||0)+ss.h+70);
          freeSpot(c,sz); E.doc.nodes.push(c); E.doc.edges.push({id:uid('e'),from:n.id,to:c.id,l:''});
          commit(); touch(); select('n',c.id);
          const f=$('[data-f="t"]',panel); if(f){f.focus();f.select();}
        } break;
      case 'hue': if(n){
          const h=b.dataset.h===''?null:Number(b.dataset.h);
          if(kind==='org'){const u=n.unitId&&units().find(x=>x.id===n.unitId);if(u) u.hue=h==null?u.hue:h;else n.hue=h;}
          else n.hue=h;
          commit(); touch(); scene(); renderPanel();
        } break;
      case 'edge-add': if(n){
          const l=b.dataset.l||defaultLabel(n);
          E.doc.edges.push({id:uid('e'),from:n.id,to:'',l});
          renderPanel(); touch();
        } break;
      case 'edge-del': {
          const id=b.closest('[data-eid]').dataset.eid;
          E.doc.edges=E.doc.edges.filter(e=>e.id!==id); commit(); touch(); scene(); renderPanel();
        } break;
      case 'elabel-set': { const e=E.doc.edges.find(x=>x.id===E.sel.id); if(e){e.l=b.dataset.l;commit();touch();scene();renderPanel();} } break;
      case 'erev': { const e=E.doc.edges.find(x=>x.id===E.sel.id); if(e){const t=e.from;e.from=e.to;e.to=t;commit();touch();scene();renderPanel();} } break;
      case 'branch': if(n) branch(n); break;
    }
  });
  const onField=(ev,final)=>{
    const t=ev.target,f=t.dataset&&t.dataset.f; if(!f) return;
    const inTable=!!t.closest('.ed-table');
    if(inTable){
      const n=node(t.dataset.nid); if(!n) return;
      if(!(E.sel&&E.sel.id===n.id)){E.sel={k:'n',id:n.id};renderPanel();markTable();}
      setField(n,f,t.value,'table'); return;
    }
    const eRow=t.closest('[data-eid]');
    if(eRow&&(f==='eto'||f==='el')){
      const e=E.doc.edges.find(x=>x.id===eRow.dataset.eid); if(!e) return;
      if(f==='eto'){e.to=t.value;if(final){commit();}} else e.l=t.value;
      scene(); commitSoon(); touch(); return;
    }
    if(f==='branches'){E.branchText=t.value;return;}
    if(E.sel&&E.sel.k==='e'){
      const e=E.doc.edges.find(x=>x.id===E.sel.id); if(!e) return;
      if(f==='elabel') e.l=t.value; else if(f==='efrom') e.from=t.value; else if(f==='eto2') e.to=t.value; else return;
      if(e.from===e.to){toast('Origem e destino devem ser diferentes.');return;}
      scene(); commitSoon(); touch(); return;
    }
    const n=E.sel&&E.sel.k==='n'?node(E.sel.id):null; if(!n) return;
    if(f==='parent'){setParent(n,t.value);return;}
    setField(n,f,t.value,'panel');
  };
  host.addEventListener('input',ev=>{if(ev.target.tagName==='SELECT') return; onField(ev,false);});
  host.addEventListener('change',ev=>{if(ev.target.tagName==='SELECT') onField(ev,true);});

  /* --- exportação --- */
  const title=()=>cfg.title();
  async function doExport(fmt){
    const sc=sceneStandalone(E.doc,kind,SP.light,{units:units(),title:title(),mid:'xp'});
    const base=slug(title());
    if(fmt==='svg') return saveFile(base+'.svg','<?xml version="1.0" encoding="UTF-8"?>\n'+sc.svg,'image/svg+xml');
    try{
      const canvas=await svgToCanvas(sc.svg,sc.w,sc.h,2);
      if(fmt==='png') return saveFile(base+'.png',await canvasBytes(canvas,'image/png'),'image/png');
      const jpg=await canvasBytes(canvas,'image/jpeg',0.92);
      const land=sc.w>=sc.h,W=land?842:595,H=land?595:842,m=28;
      const pdf=new PdfDoc({w:W,h:H,margin:m,footer:state.inst.nome+' · '+title()});
      const i=pdf.addImage(jpg,canvas.width,canvas.height);
      const s=Math.min((W-2*m)/sc.w,(H-2*m-14)/sc.h),dw=sc.w*s,dh=sc.h*s;
      pdf.drawImage(i,(W-dw)/2,H-m-dh,dw,dh);
      return saveFile(base+'.pdf',pdf.build(),'application/pdf');
    }catch(e){toast('Não foi possível gerar o arquivo. Tente exportar em SVG.');}
  }
  function doPrint(){
    const sc=sceneStandalone(E.doc,kind,SP.light,{units:units(),title:'',mid:'pp'});
    printHtml(title(),sc.svg);
  }

  /* --- inicialização --- */
  if(E.doc.nodes.some(n=>n.x==null||n.y==null)) autoLayout(E.doc,kind,units());
  commit(); renderPanel(); renderTable(); scene(); fit();
  E.api={
    del:delSel,select,
    undo(){if(E.hist.i>0) restore(E.hist.i-1);},
    redo(){if(E.hist.i<E.hist.stack.length-1) restore(E.hist.i+1);},
    resize(){if(!E.touched) fit();},
    theme(){scene();},
    rerender(){scene();renderPanel();renderTable();},
    destroy(){if(activeEd===E) activeEd=null;}
  };
  E.select=select;
  return E;
}
