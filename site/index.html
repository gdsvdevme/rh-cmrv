<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body style="margin:0">
<title>Sistema Interno RH</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@500;600;700&family=Public+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#eef4f0;--surface:#fff;--fg:#12281d;--muted:#4f665a;--line:#d1ddd6;--accent:#0a6b3d;--accent-fg:#fff;
  --hero-a:#063d27;--hero-b:#0b7a49;--gold:#d4aa4a;--shadow:0 1px 2px rgba(6,61,39,.09),0 6px 20px rgba(6,61,39,.07);
  --ok:#17794a;--ok-bg:#e1f4ea;--warn:#8a5a00;--warn-bg:#fdf0d5;--soft:#e3efe8;--danger:#b3261e;
  --f-display:"Libre Franklin",system-ui,sans-serif;--f-body:"Public Sans",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#08130e;--surface:#0f1e17;--fg:#e3f1ea;--muted:#90b0a0;--line:#234034;--accent:#52c98a;--accent-fg:#04210f;
  --hero-a:#04150d;--hero-b:#0b4d31;--gold:#d8b45e;--shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.3);
  --ok:#6fd3a0;--ok-bg:#12382a;--warn:#f0c26a;--warn-bg:#3a2d10;--soft:#15291f;--danger:#ff8a80;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#08130e;--surface:#0f1e17;--fg:#e3f1ea;--muted:#90b0a0;--line:#234034;--accent:#52c98a;--accent-fg:#04210f;
  --hero-a:#04150d;--hero-b:#0b4d31;--gold:#d8b45e;--shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.3);
  --ok:#6fd3a0;--ok-bg:#12382a;--warn:#f0c26a;--warn-bg:#3a2d10;--soft:#15291f;--danger:#ff8a80;color-scheme:dark}
[hidden]{display:none!important}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.inner{max-width:1120px;margin:0 auto}
.hero{background:linear-gradient(135deg,var(--hero-a),var(--hero-b));color:#fff;padding-block:clamp(28px,6vw,56px) clamp(40px,7vw,72px);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-60px;top:-40px;width:340px;height:340px;border-radius:50%;border:1px solid rgba(255,255,255,.14);box-shadow:0 0 0 46px rgba(255,255,255,.04),0 0 0 92px rgba(255,255,255,.025)}
.themebtn{margin-left:auto;display:inline-flex;align-items:center;gap:8px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.12);color:#fff;border-radius:10px;padding:8px 12px;font-weight:600;font-size:13.5px;cursor:pointer}
.themebtn:hover{background:rgba(255,255,255,.22)}
.brandrow{display:flex;align-items:center;gap:14px;margin-bottom:clamp(22px,4vw,40px);position:relative;z-index:1}
.logo{width:46px;height:46px;border-radius:12px;background:rgba(255,255,255,.14);display:grid;place-items:center;border:1px solid rgba(255,255,255,.25);flex:none}
.brandrow small{display:block;letter-spacing:.14em;text-transform:uppercase;font-size:11.5px;opacity:.85}
.hero h1{font-size:clamp(1.7rem,4.6vw,2.7rem);line-height:1.12;max-width:20ch;position:relative;z-index:1}
.hero p{margin:14px 0 0;max-width:56ch;opacity:.88;font-size:1.02rem;position:relative;z-index:1}
.goldrule{width:56px;height:4px;background:var(--gold);border-radius:2px;margin:0 0 18px;position:relative;z-index:1}
main{padding-block:0 40px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:-26px;position:relative;z-index:2}
.search{flex:1 1 260px;display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 14px;box-shadow:var(--shadow);min-width:0}
.search input{border:0;background:transparent;outline:0;padding:13px 0;flex:1;min-width:0}
.search:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;cursor:pointer;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:8px;box-shadow:var(--shadow)}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.sm{padding:6px 10px;font-size:13px;box-shadow:none}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.45;cursor:default}
.sec{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:30px 0 14px}
.sec h2{font-size:1.15rem}.sec span{color:var(--muted);font-size:13.5px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:16px}
.tile{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:12px;min-width:0;box-shadow:var(--shadow);text-decoration:none;color:inherit;transition:transform .15s,border-color .15s}
a.tile:hover{transform:translateY(-3px);border-color:var(--accent)}
a.tile:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.tile.off{background:color-mix(in srgb,var(--surface) 70%,var(--bg))}
.ico{width:56px;height:56px;border-radius:15px;display:grid;place-items:center;background:var(--tint);color:var(--ink);flex:none}
.tile h3{font-size:1.05rem;line-height:1.25}
.tile p{margin:0;color:var(--muted);font-size:13.8px;flex:1}
.foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:2px}
.pill{font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:3px 9px;border-radius:99px;background:var(--soft);color:var(--muted)}
.pill.ok{background:var(--ok-bg);color:var(--ok)}.pill.warn{background:var(--warn-bg);color:var(--warn)}
.open{font-weight:600;color:var(--accent);font-size:13.5px;display:inline-flex;align-items:center;gap:4px}
.tools{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.add{border:2px dashed var(--line);background:transparent;box-shadow:none;align-items:center;justify-content:center;text-align:center;color:var(--muted);cursor:pointer;min-height:180px}
.add:hover{border-color:var(--accent);color:var(--accent)}
.empty{padding:40px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:14px}
.note{margin-top:34px;padding:14px 16px;border-left:4px solid var(--gold);background:var(--surface);border-radius:8px;font-size:12.8px;color:var(--muted);box-shadow:var(--shadow)}
footer{padding-block:0 28px;color:var(--muted);font-size:12.5px}
#modal{position:fixed;inset:0;background:rgba(5,15,30,.55);display:grid;place-items:center;padding:16px;z-index:50;overflow:auto}
.modal{background:var(--surface);border-radius:16px;padding:22px;width:min(520px,100%);display:grid;gap:12px;box-shadow:0 20px 60px rgba(0,0,0,.35);max-height:100%;overflow:auto}
.fld{display:grid;gap:5px;font-size:13px;font-weight:600;color:var(--muted)}
.fld input,.fld textarea,.fld select{border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:9px 11px;font-weight:400;color:var(--fg);min-width:0;width:100%}
.fld input:focus,.fld textarea:focus,.fld select:focus{outline:2px solid var(--accent);border-color:transparent}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:480px){.r2{grid-template-columns:1fr}}
.icons,.hues{display:flex;flex-wrap:wrap;gap:6px}
.icons button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--bg);display:grid;place-items:center;cursor:pointer;color:var(--fg)}
.icons button[aria-pressed="true"]{border-color:var(--accent);background:var(--soft);color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.hues button{width:28px;height:28px;border-radius:50%;border:2px solid var(--surface);outline:1px solid var(--line);background:hsl(var(--h) 55% 45%);cursor:pointer}
.hues button[aria-pressed="true"]{outline:2px solid var(--fg)}
.actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:4px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:max(18px,env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:60;max-width:90vw}
.edit-banner{margin-top:14px;background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:10px 14px;font-size:13.5px}
@media (pointer:coarse){input,select,textarea{font-size:16px}.btn{min-height:42px}.btn.sm{min-height:38px}}
</style>

<header class="hero wrap"><div class="inner">
  <div class="brandrow"><div class="logo" aria-hidden="true"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18M5 21V8l7-4 7 4v13M9 21v-5h6v5M9 11h.01M12 11h.01M15 11h.01"/></svg></div>
    <div><small>Câmara Municipal de Rio Verde/GO</small><b style="font-family:var(--f-display)">Departamento de Recursos Humanos</b></div>
    <button class="themebtn" id="themeBtn" type="button"></button></div>
  <div class="goldrule"></div>
  <h1>Sistema Interno – RH Câmara Municipal de Rio Verde</h1>
</div></header>

<main class="wrap"><div class="inner">
  <div class="bar">
    <label class="search"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="q" type="search" placeholder="Buscar sistema" aria-label="Buscar sistema" autocomplete="off"></label>
    <button class="btn" id="editBtn" type="button"></button>
  </div>
  <div id="editInfo"></div>
  <div class="sec"><h2>Sistemas</h2><span id="count"></span></div>
  <div class="grid" id="grid"></div>
</div></main>
<footer class="wrap"><div class="inner"><span id="storeNote"></span></div></footer>
<div id="modal" hidden></div>
<div id="toast" hidden></div>

<script>
/* =====================================================================
   PocketBase: armazenamento no servidor (substitui o localStorage)
   Expõe PB.connect(), que devolve um objeto "dbh" com a mesma forma
   usada pelo restante do sistema: dbh.doc('a/b').get/set/delete e
   dbh.collection('versoes').orderBy('at','desc').limit(n).get()
   ===================================================================== */
const PB=(function(){
  const URL_BASE='https://pb.devgabriel.app.br'.replace(/\/+$/,'');
  const CENTI_BASE=''.replace(/\/+$/,'');   // vazio = mesmo endereço do site (funções em /api)
  const AUTH_KEY='rhcrv-pb-auth';
  let token='',email='',col='rhcmrv_users',loginP=null;
  let cs=null;   // sessão do Centi: {user,nome,token,refreshToken}

  /* só vale a sessão que tem o acesso do Centi junto; sessões antigas (login simples) pedem novo login */
  function readAuth(){try{const a=JSON.parse(localStorage.getItem(AUTH_KEY)||'null');if(a&&a.token&&a.centi&&a.centi.token){token=a.token;email=a.email||'';col=a.col||'rhcmrv_users';cs=a.centi;}}catch(e){}}
  function saveAuth(){try{localStorage.setItem(AUTH_KEY,JSON.stringify({token,email,col,centi:cs}));}catch(e){}}
  function clearAuth(){token='';email='';col='rhcmrv_users';cs=null;try{localStorage.removeItem(AUTH_KEY);}catch(e){}}

  async function raw(method,path,body){
    const h={};
    if(body!==undefined) h['Content-Type']='application/json';
    if(token) h.Authorization=token;
    const r=await fetch(URL_BASE+path,{method,headers:h,body:body===undefined?undefined:JSON.stringify(body)});
    if(r.status===204) return null;
    let j=null; try{j=await r.json();}catch(e){}
    if(!r.ok){const err=new Error((j&&j.message)||('HTTP '+r.status));err.status=r.status;throw err;}
    return j;
  }
  async function api(method,path,body){
    try{return await raw(method,path,body);}
    catch(e){
      if(e.status===401||e.status===403){
        clearAuth();
        if(await login()) return raw(method,path,body);
      }
      throw e;
    }
  }

  /* ---------- login ---------- */
  function login(msg){
    if(loginP) return loginP;
    loginP=new Promise(resolve=>{
      const wrap=document.createElement('div');
      wrap.style.cssText='position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(0,0,0,.45)';
      wrap.innerHTML=
        '<form style="width:100%;max-width:360px;background:var(--surface,#fff);color:var(--fg,#12281d);border:1px solid var(--line,#d1ddd6);border-radius:12px;padding:22px;box-shadow:0 10px 40px rgba(0,0,0,.3);font:15px/1.4 system-ui,sans-serif">'+
        '<h3 style="margin:0 0 4px;font-size:18px">Entrar com o acesso do Centi</h3>'+
        '<p style="margin:0 0 14px;color:var(--muted,#4f665a);font-size:13px">Use o mesmo usuário e senha do Centi. A senha é conferida no Centi e não fica guardada neste sistema.</p>'+
        '<label style="display:block;font-size:13px;margin-bottom:10px">Usuário do Centi<input name="e" type="text" required autocapitalize="none" spellcheck="false" autocomplete="username" style="display:block;width:100%;box-sizing:border-box;margin-top:4px;padding:9px;border:1px solid var(--line,#d1ddd6);border-radius:8px;background:transparent;color:inherit;font:inherit"></label>'+
        '<label style="display:block;font-size:13px;margin-bottom:10px">Senha<input name="p" type="password" required autocomplete="current-password" style="display:block;width:100%;box-sizing:border-box;margin-top:4px;padding:9px;border:1px solid var(--line,#d1ddd6);border-radius:8px;background:transparent;color:inherit;font:inherit"></label>'+
        '<div data-err style="min-height:18px;margin-bottom:8px;color:#c0392b;font-size:13px"></div>'+
        '<div style="display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap">'+
        '<button type="submit" style="padding:9px 16px;border:0;border-radius:8px;background:var(--accent,#0a6b3d);color:var(--accent-fg,#fff);font:inherit;font-weight:600;cursor:pointer">Entrar</button></div></form>';
      document.body.appendChild(wrap);
      const f=wrap.querySelector('form'),err=wrap.querySelector('[data-err]');
      if(msg) err.textContent=msg;
      const done=ok=>{wrap.remove();loginP=null;resolve(ok);};
      f.e.focus();
      f.addEventListener('submit',async ev=>{
        ev.preventDefault(); err.textContent='Entrando…';
        try{
          const r=await fetch(CENTI_BASE+'/api/centi-login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user:f.e.value.trim(),pass:f.p.value})});
          let j=null; try{j=await r.json();}catch(e){}
          if(!r.ok){err.textContent=(j&&j.message)||('Não foi possível entrar (HTTP '+r.status+').');return;}
          token=j.pb.token; col='rhcmrv_users'; email=j.centi.user; cs=j.centi; saveAuth(); done(true);
        }catch(e){err.textContent='Não foi possível entrar: '+e.message;}
      });
    });
    return loginP;
  }

  /* ---------- documentos ---------- */
  const ids={};   // cache de id de registro por caminho
  const esc=s=>String(s).replace(/\\/g,'\\\\').replace(/"/g,'\\"');
  const spec=path=>{
    const i=path.indexOf('/'),col=path.slice(0,i),id=path.slice(i+1);
    return col==='versoes'?{c:'rhcmrv_versoes',f:'vid',k:id}:{c:'rhcmrv_docs',f:'key',k:path};
  };
  async function find(path){
    const s=spec(path);
    const q='?perPage=1&filter='+encodeURIComponent(s.f+'="'+esc(s.k)+'"');
    const r=await api('GET','/api/collections/'+s.c+'/records'+q);
    const rec=r.items&&r.items[0];
    if(rec) ids[path]=rec.id; else delete ids[path];
    return rec||null;
  }
  const payload=(s,data)=>s.c==='rhcmrv_versoes'?Object.assign({vid:s.k},data):{key:s.k,data};
  const unwrap=(s,rec)=>s.c==='rhcmrv_versoes'?{at:rec.at,label:rec.label,json:rec.json}:rec.data;

  function doc(path){
    const s=spec(path);
    return {
      async get(){const rec=await find(path);return {exists:!!rec,id:s.k,data:()=>rec?unwrap(s,rec):undefined};},
      async set(data){
        if(!ids[path]) await find(path);
        if(ids[path]) await api('PATCH','/api/collections/'+s.c+'/records/'+ids[path],payload(s,data));
        else{const r=await api('POST','/api/collections/'+s.c+'/records',payload(s,data));ids[path]=r.id;}
      },
      async delete(){
        if(!ids[path]) await find(path);
        if(ids[path]){await api('DELETE','/api/collections/'+s.c+'/records/'+ids[path]);delete ids[path];}
      }
    };
  }
  function collection(name){
    const q={sort:'',n:30};
    const api_={
      orderBy(f,dir){q.sort=(dir==='desc'?'-':'')+f;return api_;},
      limit(n){q.n=n;return api_;},
      async get(){
        const r=await api('GET','/api/collections/rhcmrv_'+name+'/records?perPage='+q.n+(q.sort?'&sort='+encodeURIComponent(q.sort):''));
        return {docs:r.items.map(rec=>({id:rec.vid,data:()=>({at:rec.at,label:rec.label,json:rec.json})}))};
      }
    };
    return api_;
  }

  /* ---------- tarefas (coleção rhcmrv_tarefas; as regras do servidor mostram só as compartilhadas e as do próprio dono) ---------- */
  const TAREFAS='/api/collections/rhcmrv_tarefas/records';
  const userId=()=>{try{const b=token.split('.')[1].replace(/-/g,'+').replace(/_/g,'/');return JSON.parse(decodeURIComponent(escape(atob(b+'='.repeat((4-b.length%4)%4))))).id||'';}catch(e){return '';}};
  async function todas(filtro){
    let page=1,out=[];
    for(;;){
      const r=await api('GET',TAREFAS+'?perPage=200&page='+page+'&sort=-criada_em'+(filtro?'&filter='+encodeURIComponent(filtro):''));
      out=out.concat(r.items||[]);
      if(!r.totalPages||page>=r.totalPages) return out;
      page++;
    }
  }
  const tarefas={
    list:todas,
    create:d=>api('POST',TAREFAS,Object.assign({dono:userId()},d)),
    update:(id,d)=>api('PATCH',TAREFAS+'/'+id,d),
    remove:id=>api('DELETE',TAREFAS+'/'+id)
  };

  /* ---------- API do Centi (pelo servidor do sistema, com o acesso da própria pessoa) ---------- */
  async function centiCall(path,body){
    if(!cs) throw new Error('Sem sessão do Centi. Entre novamente.');
    const r=await fetch(CENTI_BASE+'/api/centi',{method:'POST',
      headers:{'Content-Type':'application/json','x-centi-user':cs.user,'x-centi-token':cs.token,'x-centi-refresh':cs.refreshToken||''},
      body:JSON.stringify({path,body})});
    const nt=r.headers.get('x-centi-token'),nr=r.headers.get('x-centi-refresh');
    if(nt){cs.token=nt;if(nr)cs.refreshToken=nr;saveAuth();}   // o Centi renova o token sozinho
    let j=null; try{j=await r.json();}catch(e){}
    if(!r.ok){
      if(r.status===401){clearAuth();}
      const err=new Error((j&&j.message)||('Centi: HTTP '+r.status));err.status=r.status;throw err;
    }
    return j;
  }
  /* PB.centi.search('SFuncionario',[{FieldName:'Nome',Operation:6,Value:'%ana%'}]) -> {Data:[...],Count}
     (Operation 6 = contém; a tela de consulta do Centi exige ao menos um filtro com valor) */
  const centi={
    get user(){return cs?cs.user:'';},
    get nome(){return cs?(cs.nome||cs.user):'';},
    /* Cubo funcionário (FP051) do Centi na referência mes/ano -> {Data:[{MATRICULA,NOMEFUNC,CARGO,HIERARQUIA,...}],Total}; só ativos */
    /* Ficha financeira (FP024) da matrícula no mês/ano -> {Fichas:[{Folha,Mes,Ano,TotalProventos,TotalDescontos,LiquidoReceber,Eventos:[...]}]}; não é guardada */
    ficha(matricula,mes,ano){return centiCall('ficha-financeira',{matricula,mes,ano});},
    /* Férias: ativos (FP051) + gozos de férias (FP273) -> {Pessoas:[...],Gozos:[{MATRICULA,DTAQUIINI,DTAQUIFIN,SALDO,GOZOINICIAL,GOZOFINAL,...}]} */
    ferias(mes,ano){return centiCall('ferias',{mes,ano});},
    cubo(mes,ano){return centiCall('cubo-funcionario',{mes,ano});},
    search(entity,filters,start,depth){
      return centiCall('restauth/searchentity',{Depth:depth||50,Entity:entity,Start:start==null?1:start,
        Filters:(filters||[]).map(f=>Object.assign({List:false,TypeFilter:0,between:''},f))});
    }
  };

  /* ---------- conexão ---------- */
  const sleep=ms=>new Promise(r=>setTimeout(r,ms));
  async function alive(){
    for(let i=0;i<3;i++){
      const ac=new AbortController(),t=setTimeout(()=>ac.abort(),6000);
      try{const r=await fetch(URL_BASE+'/api/health',{cache:'no-store',signal:ac.signal});clearTimeout(t);if(r.ok) return true;}catch(e){clearTimeout(t);}
      if(i<2) await sleep(1500);
    }
    return false;
  }
  const box='position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(0,0,0,.5)';
  const card='width:100%;max-width:380px;background:var(--surface,#fff);color:var(--fg,#12281d);border:1px solid var(--line,#d1ddd6);border-radius:12px;padding:22px;box-shadow:0 10px 40px rgba(0,0,0,.3);font:15px/1.45 system-ui,sans-serif';
  const bt='padding:9px 14px;border-radius:8px;font:inherit;font-weight:600;cursor:pointer;';
  /* servidor fora do ar: pergunta antes de seguir, para não trabalhar sem querer só neste navegador */
  function offlineDialog(){
    return new Promise(resolve=>{
      const w=document.createElement('div');w.style.cssText=box;
      w.innerHTML='<div role="alertdialog" aria-modal="true" style="'+card+'"><h3 style="margin:0 0 6px;font-size:18px">Sem conexão com o servidor</h3>'+
        '<p style="margin:0 0 14px;color:var(--muted,#4f665a);font-size:13.5px">Não foi possível falar com o servidor dos dados. Verifique a internet e tente de novo. Se continuar só neste navegador, o que você fizer <b>não será salvo no servidor</b> e não aparecerá em outros computadores.</p>'+
        '<div style="display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap"><button type="button" data-loc style="'+bt+'border:1px solid var(--line,#d1ddd6);background:transparent;color:inherit">Usar só neste navegador</button>'+
        '<button type="button" data-retry style="'+bt+'border:0;background:var(--accent,#0a6b3d);color:var(--accent-fg,#fff)">Tentar novamente</button></div></div>';
      document.body.appendChild(w);
      const done=v=>{w.remove();resolve(v);};
      w.querySelector('[data-retry]').addEventListener('click',()=>done(true));
      w.querySelector('[data-loc]').addEventListener('click',()=>done(false));
      w.querySelector('[data-retry]').focus();
    });
  }
  function markLocal(){
    if(document.getElementById('pb-local')) return;
    const b=document.createElement('div');b.id='pb-local';
    b.style.cssText='position:fixed;left:0;right:0;bottom:0;z-index:99998;background:#8a5a00;color:#fff;padding:8px 14px;font:13.5px/1.35 system-ui,sans-serif;display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;text-align:center';
    b.innerHTML='<span>Modo local: os dados ficam só neste navegador e <b>não são salvos no servidor</b>.</span><button type="button" style="border:1px solid #fff;background:transparent;color:#fff;border-radius:7px;padding:3px 10px;font:inherit;font-weight:600;cursor:pointer">Reconectar</button>';
    b.querySelector('button').addEventListener('click',()=>location.reload());
    document.body.appendChild(b);
  }
  async function connect(){
    if(!URL_BASE) return null;
    readAuth();
    for(;;){
      if(!(await alive())){if(await offlineDialog()) continue;markLocal();return null;}
      try{
        let ok=false;
        if(token){
          try{const r=await raw('POST','/api/collections/'+col+'/auth-refresh');token=r.token;email=(r.record&&(r.record.email||r.record.username))||email;saveAuth();ok=true;}
          catch(e){if(e.status!==401&&e.status!==403&&e.status!==404) throw e; clearAuth();}
        }
        if(!ok&&!(await login())){markLocal();return null;}
        return {doc,collection,centi,tarefas};
      }catch(e){
        if(await offlineDialog()) continue;
        markLocal();return null;
      }
    }
  }
  return {connect,centi,logout(){clearAuth();location.reload();},get email(){return email;},get nome(){return centi.nome;},get userId(){return userId();},url:URL_BASE};
})();

const FLOW_URL="fluxogramas/";

  grid:'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>',
  gear:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/>'
};
const ICO2={sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',moon:'<path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/>'};
const TEMA_KEY='rhcrv-tema';
function isDark(){const m=/rgba?\((\d+),\s*(\d+),\s*(\d+)/.exec(getComputedStyle(document.body).backgroundColor);return m?(0.2126*m[1]+0.7152*m[2]+0.0722*m[3])/255<0.4:false;}
function themeBtn(){const b=document.querySelector('#themeBtn');if(!b) return;const d=isDark();
  b.innerHTML=`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICO2[d?'sun':'moon']}</svg>${d?'Modo claro':'Modo escuro'}`;
  b.setAttribute('aria-label',d?'Mudar para o modo claro':'Mudar para o modo escuro');}
const STATUS={ok:'Disponível',dev:'Em desenvolvimento',plan:'Planejado'};
const HUES=[212,168,28,282,48,186,350,140];
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const svg=(k,n)=>`<svg width="${n||28}" height="${n||28}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[k]||ICONS.grid}</svg>`;
const uid=()=>'t'+Math.random().toString(36).slice(2,9);

function defaults(){
  return {v:5,tiles:[
    {id:'t-fluxos',nome:'Fluxogramas e Manual do RH',desc:'Organograma, fluxogramas editáveis, competências, matriz de responsabilidades, manual de procedimentos e indicadores.',icone:'flow',hue:152,status:'ok',url:FLOW_URL},
    {id:'t-pessoal',nome:'Hierarquia de Pessoal',desc:'Quadro de pessoal organizado por hierarquia: setor administrativo e gabinetes dos vereadores.',icone:'org',hue:262,status:'ok',url:PESSOAL_URL},
    {id:'t-ponto',nome:'Ponto – Servidores Externos',desc:'Registro de ponto pelo celular com localização, assinatura digital e foto, e acompanhamento em tempo real pelo RH (simulação).',icone:'pin',hue:200,status:'ok',url:PONTO_URL},
    {id:'t-ferias',nome:'Férias',desc:'Quem está de férias, quem tem direito a gozar e quem está com férias vencidas, pelo período aquisitivo (dados do Centi).',icone:'calendar',hue:28,status:'ok',url:FERIAS_URL},
    {id:'t-tarefas',nome:'Tarefas do RH',desc:'Checklist em quadro (a fazer, em andamento, concluído) com tarefas da equipe ou privadas. As concluídas saem do quadro na virada do mês.',icone:'tasks',hue:212,status:'ok',url:TAREFAS_URL},
    {id:'t-freq',nome:'Frequência',desc:'Registro e conferência de frequência.',icone:'clock',hue:48,status:'plan',url:''},
  ]};
}
let st=defaults(),edit=false,dbh=null,filter='',saveT=null;

function load(){
  try{const d=JSON.parse(localStorage.getItem(LS)||'null');if(d&&Array.isArray(d.tiles)) return d;}catch(e){}
  return null;
}
function persist(){
  clearTimeout(saveT);
  saveT=setTimeout(async()=>{
    const json=JSON.stringify(st);
    if(!dbh){try{localStorage.setItem(LS,json);}catch(e){}}
    if(dbh){try{await dbh.doc('painel/tiles').set({json});}catch(e){toast('Não foi possível salvar no servidor. Verifique a conexão.');}}
  },300);
}
function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,3500);}

function render(){
  const q=filter.trim().toLowerCase();
  const tiles=st.tiles.filter(t=>!q||(t.nome+' '+t.desc).toLowerCase().includes(q));
  $('#count').textContent=st.tiles.length+(st.tiles.length===1?' sistema':' sistemas');
  $('#editBtn').innerHTML=edit?'Concluir edição':'Editar painel';
  $('#editBtn').className='btn'+(edit?' primary':'');
  $('#editInfo').innerHTML=edit?'<div class="edit-banner">Modo de edição: altere, reordene, exclua ou adicione sistemas. Para abrir um sistema, conclua a edição.</div>':'';
  const cards=tiles.map(t=>{
    const i=st.tiles.indexOf(t);
    const on=t.status==='ok'&&t.url;
    const style=`--tint:hsl(${t.hue} 70% ${document.documentElement.dataset.theme==='dark'?'22%':'93%'});--ink:hsl(${t.hue} 60% 38%)`;
    const pill=`<span class="pill ${t.status==='ok'?'ok':t.status==='dev'?'warn':''}">${STATUS[t.status]||''}</span>`;
    const inner=`<div class="ico">${svg(t.icone)}</div><h3>${esc(t.nome)}</h3><p>${esc(t.desc)}</p>`;
    if(edit) return `<div class="tile" style="${style}">${inner}<div class="foot">${pill}</div>
      <div class="tools"><button class="btn sm" data-a="edit" data-id="${t.id}">Editar</button><button class="btn sm" data-a="up" data-id="${t.id}"${i===0?' disabled':''} aria-label="Mover para antes">↑</button><button class="btn sm" data-a="down" data-id="${t.id}"${i===st.tiles.length-1?' disabled':''} aria-label="Mover para depois">↓</button><button class="btn sm danger" data-a="del" data-id="${t.id}">Excluir</button></div></div>`;
    const foot=`<div class="foot">${pill}${on?'<span class="open">Abrir ›</span>':''}</div>`;
    return on?`<a class="tile" style="${style}" href="${esc(t.url)}" target="_top">${inner}${foot}</a>`
             :`<div class="tile off" style="${style}">${inner}${foot}</div>`;
  });
  if(edit) cards.push(`<button class="tile add" data-a="add" type="button"><span style="font-size:30px;line-height:1">+</span><b>Adicionar sistema</b></button>`);
  $('#grid').innerHTML=cards.join('')||'<div class="empty" style="grid-column:1/-1">Nenhum sistema encontrado.</div>';
}

function openForm(t){
  const isNew=!t.id;
  const d=Object.assign({nome:'',desc:'',icone:'grid',hue:212,status:'dev',url:''},t);
  const m=$('#modal');
  m.innerHTML=`<form class="modal" autocomplete="off"><h3>${isNew?'Novo sistema':'Editar sistema'}</h3>
   <label class="fld">Nome<input name="nome" value="${esc(d.nome)}" required maxlength="70"></label>
   <label class="fld">Descrição<textarea name="desc" rows="3" maxlength="220">${esc(d.desc)}</textarea></label>
   <div class="r2"><label class="fld">Situação<select name="status">${Object.keys(STATUS).map(k=>`<option value="${k}"${k===d.status?' selected':''}>${STATUS[k]}</option>`).join('')}</select></label>
   <label class="fld">Endereço (link)<input name="url" value="${esc(d.url)}" placeholder="ex.: ferias/ ou https://…"></label></div>
   <div class="fld">Ícone<div class="icons">${Object.keys(ICONS).map(k=>`<button type="button" data-ic="${k}" aria-pressed="${k===d.icone}" aria-label="${k}">${svg(k,20)}</button>`).join('')}</div></div>
   <div class="fld">Cor<div class="hues">${HUES.map(h=>`<button type="button" data-h="${h}" style="--h:${h}" aria-pressed="${h===d.hue}" aria-label="Cor ${h}"></button>`).join('')}</div></div>
   <div class="actions"><button type="button" class="btn" data-a="close">Cancelar</button><button class="btn primary" type="submit">Salvar</button></div></form>`;
  m.hidden=false;
  const f=m.querySelector('form');
  f.addEventListener('click',ev=>{
    const ic=ev.target.closest('[data-ic]'),h=ev.target.closest('[data-h]');
    if(ic){d.icone=ic.dataset.ic;f.querySelectorAll('[data-ic]').forEach(b=>b.setAttribute('aria-pressed',b===ic));}
    if(h){d.hue=Number(h.dataset.h);f.querySelectorAll('[data-h]').forEach(b=>b.setAttribute('aria-pressed',b===h));}
  });
  f.addEventListener('submit',ev=>{
    ev.preventDefault();
    const E=f.elements;d.nome=E.nome.value.trim();d.desc=E.desc.value.trim();d.status=E.status.value;d.url=E.url.value.trim();
    if(!d.nome) return;
    if(isNew){d.id=uid();st.tiles.push(d);}else{const i=st.tiles.findIndex(x=>x.id===d.id);st.tiles[i]=d;}
    persist();closeModal();render();
  });
  f.elements.nome.focus();
}
function closeModal(){const m=$('#modal');m.hidden=true;m.innerHTML='';}

document.addEventListener('click',ev=>{
  if(ev.target.id==='modal'){closeModal();return;}
  const b=ev.target.closest('[data-a]');if(!b) return;
  const id=b.dataset.id,i=st.tiles.findIndex(t=>t.id===id);
  switch(b.dataset.a){
    case 'close':closeModal();break;
    case 'add':openForm({});break;
    case 'edit':openForm(Object.assign({},st.tiles[i]));break;
    case 'up':if(i>0){[st.tiles[i-1],st.tiles[i]]=[st.tiles[i],st.tiles[i-1]];persist();render();}break;
    case 'down':if(i<st.tiles.length-1){[st.tiles[i+1],st.tiles[i]]=[st.tiles[i],st.tiles[i+1]];persist();render();}break;
    case 'del':
      if(b.dataset.sure){st.tiles.splice(i,1);persist();render();toast('Sistema removido do painel.');}
      else{b.dataset.sure='1';b.textContent='Confirmar exclusão';setTimeout(()=>{if(b.isConnected){delete b.dataset.sure;b.textContent='Excluir';}},4000);}
      break;
  }
});
$('#editBtn').addEventListener('click',()=>{edit=!edit;render();});
$('#q').addEventListener('input',e=>{filter=e.target.value;render();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#modal').hidden) closeModal();});
document.querySelector('#themeBtn').addEventListener('click',()=>{const n=isDark()?'light':'dark';document.documentElement.setAttribute('data-theme',n);try{localStorage.setItem(TEMA_KEY,n);}catch(e){}});
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{render();themeBtn();});new MutationObserver(()=>{render();themeBtn();}).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});}catch(e){}

function migrar(){
  if(!st.v||st.v<2){ // sistemas novos entram no painel salvo
    if(!st.tiles.some(t=>t.id==='t-pessoal')){const d=defaults().tiles.find(t=>t.id==='t-pessoal');st.tiles.splice(Math.min(1,st.tiles.length),0,d);}
    st.v=2;persist();
  }
  if(st.v<3){ // Ponto – Servidores Externos entra depois da Hierarquia de Pessoal
    if(!st.tiles.some(t=>t.id==='t-ponto')){const d=defaults().tiles.find(t=>t.id==='t-ponto');const i=st.tiles.findIndex(t=>t.id==='t-pessoal');st.tiles.splice(i>=0?i+1:st.tiles.length,0,d);}
    st.v=3;persist();
  }
  if(st.v<4){ // Férias entra no painel (ou deixa de ser "planejado") depois do Ponto
    const d=defaults().tiles.find(t=>t.id==='t-ferias'),t=st.tiles.find(x=>x.id==='t-ferias');
    if(t) Object.assign(t,{nome:d.nome,desc:d.desc,status:'ok',url:FERIAS_URL});
    else{const i=st.tiles.findIndex(x=>x.id==='t-ponto');st.tiles.splice(i>=0?i+1:st.tiles.length,0,d);}
    st.v=4;persist();
  }
  if(st.v<5){ // Tarefas do RH entra depois de Férias
    if(!st.tiles.some(x=>x.id==='t-tarefas')){const d=defaults().tiles.find(t=>t.id==='t-tarefas');const i=st.tiles.findIndex(x=>x.id==='t-ferias');st.tiles.splice(i>=0?i+1:st.tiles.length,0,d);}
    st.v=5;persist();
  }
}
(function init(){
  try{const s=localStorage.getItem(TEMA_KEY);document.documentElement.setAttribute('data-theme',s==='dark'?'dark':'light');}catch(e){document.documentElement.setAttribute('data-theme','light');}
  const l=load(); if(l) st=l;
  migrar();
  // mantém o endereço do sistema de fluxogramas atualizado
  const fl=st.tiles.find(t=>t.id==='t-fluxos'); if(fl&&!fl.url) fl.url=FLOW_URL;
  $('#storeNote').textContent='As alterações deste painel ficam salvas neste navegador.';
  render();themeBtn();
  (async()=>{
    try{
      if(window.claude&&window.claude.use) dbh=await window.claude.use('db');
      if(!dbh) dbh=await PB.connect();
      if(dbh){
        $('#storeNote').textContent='As alterações deste painel ficam salvas no servidor.';
        const s=await dbh.doc('painel/tiles').get();
        if(s.exists){try{const d=JSON.parse(s.data().json);if(d&&Array.isArray(d.tiles)){st=d;migrar();render();}}catch(e){}}
        else if(load()){
          await dbh.doc('painel/tiles').set({json:JSON.stringify(st)});
          const v=await dbh.doc('painel/tiles').get();
          if(v.exists){try{localStorage.removeItem(LS);}catch(e){}toast('Dados deste navegador enviados ao servidor.');}
        }
      }
    }catch(e){dbh=null;}
  })();
})();
</script>
